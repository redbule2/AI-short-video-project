<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案头 · 写稿（试用版）</title>
<style>
/* 写稿 · 试用版：人写提示词、AI 批注。读写真文件，走 annotate-live 的本机服务（另开一个端口）。
   样式照 项目管理.html：纸、墨、朱、黛、赭。定下来以后再并进 项目管理.html 当第五项菜单。 */
:root {
  --paper: #f4efe6; --paper-2: #ece5d8; --paper-3: #e4dbca; --sheet: #fffdf9;
  --ink: #2a2622; --ink-2: #554d45; --ink-3: #887e74; --ink-4: #b2a89b;
  --line: #e5dccd; --line-2: #d6cab6;
  --zhu: #a83a2c; --zhu-soft: rgba(168, 58, 44, .065); --zhu-line: rgba(168, 58, 44, .26);
  --dai: #3e5c5e; --dai-soft: rgba(62, 92, 94, .075); --dai-line: rgba(62, 92, 94, .28);
  --zhe: #8d6a3c; --zhe-soft: rgba(141, 106, 60, .085); --zhe-line: rgba(141, 106, 60, .3);
  --jin: #b39256;
  --tc: var(--zhe); --tc-soft: var(--zhe-soft); --tc-line: var(--zhe-line);
  --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --kai: 'KaiTi', 'STKaiti', 'Kaiti SC', 'BiauKai', 'Noto Serif SC', serif;
  --shadow: 0 1px 2px rgba(60, 45, 30, .05), 0 10px 32px -14px rgba(60, 45, 30, .2);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); font: 14px/1.7 var(--sans); background: var(--paper); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
p { margin: 0; }
[hidden] { display: none !important; }
::selection { background: rgba(168, 58, 44, .18); }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: rgba(140, 118, 92, .22); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
.faint { color: var(--ink-3); }
.small { font-size: 12.5px; }
kbd { display: inline-block; padding: 0 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--sheet); font: 12px/1.5 var(--sans); color: var(--ink-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  font: 13.5px/1.2 var(--sans); letter-spacing: .08em; color: var(--ink); background: var(--sheet); border: 1px solid var(--line-2); transition: background .15s, border-color .15s;
}
.btn:hover { background: #fff; border-color: var(--ink-4); }
.btn.dai { background: var(--dai); border-color: var(--dai); color: #f3fbfa; }
.btn.dai:hover { background: #33504f; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(80, 60, 40, .06); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.linkb { padding: 0 4px; border: 0; background: none; cursor: pointer; color: var(--dai); font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 顶栏、三步 ---------- */
#main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.top { flex: none; min-height: 56px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 6px 18px 6px 24px; border-bottom: 1px solid var(--line); background: rgba(250, 246, 239, .6); }
.crumb { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
.ptitle { font: 600 18px/1.3 var(--serif); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-seg { min-width: 0; font: 14.5px var(--kai); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-seg::before { content: '／'; margin-right: 10px; color: var(--ink-4); }
.tag-try { flex: none; align-self: center; padding: 0 8px; border-radius: 999px; background: var(--zhu); color: #fff8f2; font: 11px/1.7 var(--sans); letter-spacing: .1em; }
.top-right { flex: none; display: flex; align-items: center; gap: 8px; }
.status { display: flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.status.err { color: var(--zhu); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.steps { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 18px 7px 22px; border-bottom: 1px solid var(--line); background: rgba(250, 246, 239, .45); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 7px; padding: 2px 12px 2px 4px; border-radius: 999px; border: 1px solid transparent; }
.step i { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-2); background: var(--sheet); font: normal 11.5px/1 var(--sans); }
.step small { font-size: 11.5px; color: var(--ink-4); }
.step.me i { border-color: var(--zhe-line); color: var(--zhe); }
.step.ai i { border-color: var(--dai-line); color: var(--dai); }
.step.done { color: var(--ink-2); }
.step.now { background: var(--sheet); border-color: var(--line-2); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(60, 45, 30, .08); }
.step.now small { font-weight: 400; color: var(--ink-3); }
.step.now.me i { background: var(--zhe); border-color: var(--zhe); color: #fff9f1; }
.step.now.ai i { background: var(--dai); border-color: var(--dai); color: #f3fbfa; }
.step-arrow { color: var(--ink-4); }

/* ---------- 工作区 ---------- */
.stage { flex: 1; min-height: 0; display: flex; }
.col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.canvas { flex: 1; min-height: 0; overflow: auto; padding: 22px 34px 80px; }
.tip { position: relative; max-width: 800px; margin: 0 auto 18px; padding: 12px 40px 12px 18px; border-radius: 8px; background: rgba(62, 92, 94, .07); border: 1px solid var(--dai-line); font-size: 13px; line-height: 1.9; color: var(--ink-2); }
.tip b { color: var(--dai); }
.tip ol { margin: 4px 0 0; padding-left: 20px; }
.tip .x { position: absolute; right: 8px; top: 4px; border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; }
.fail { max-width: 640px; margin: 80px auto; padding: 24px 28px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--zhu-line); color: var(--ink-2); line-height: 1.9; }
.fail b { color: var(--zhu); }

.sheet { position: relative; max-width: 800px; margin: 0 auto; padding: 46px 60px 36px; border-radius: 3px; background: var(--sheet); border: 1px solid rgba(214, 202, 182, .7); box-shadow: var(--shadow); }
.sheet::after { content: ''; position: absolute; inset: 11px; border: 1px solid var(--tc-line); border-radius: 2px; pointer-events: none; opacity: .55; }
.doc-title { position: relative; z-index: 1; text-align: center; margin-bottom: 20px; }
.doc-kicker { font: 13px var(--kai); color: var(--tc); letter-spacing: .4em; margin-right: -.4em; margin-bottom: 10px; }
.doc-seg { font: 600 28px/1.3 var(--serif); letter-spacing: .12em; margin-right: -.12em; }
.doc-name { margin-top: 6px; font: 15px/1.5 var(--serif); color: var(--ink-3); letter-spacing: .06em; }
.ornament { width: 180px; height: 9px; margin: 16px auto 0; display: flex; align-items: center; }
.ornament::before, .ornament::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--line-2)); }
.ornament::after { background: linear-gradient(to left, transparent, var(--line-2)); }
.ornament span { width: 6px; height: 6px; margin: 0 10px; border: 1px solid var(--tc); transform: rotate(45deg); opacity: .75; }
.laid { position: relative; z-index: 1; padding: 6px 14px; border-radius: 8px; border: 1px dashed var(--dai-line); background: rgba(62, 92, 94, .05); font-size: 12.5px; line-height: 1.8; color: var(--ink-2); text-align: center; }
.laid b { color: var(--dai); font-weight: 600; }
.sheet-foot { position: relative; z-index: 1; margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--ink-4); letter-spacing: .03em; word-break: break-all; }

.sec { position: relative; z-index: 1; margin-top: 26px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.sec-no { width: 23px; height: 23px; flex: none; display: grid; place-items: center; border: 1px solid var(--tc-line); border-radius: 50%; font: 12px/1 var(--serif); color: var(--tc); }
.sec-name { font: 15px var(--kai); color: var(--tc); letter-spacing: .3em; white-space: nowrap; }
.sec-line { flex: 1; min-width: 12px; height: 1px; background: linear-gradient(to right, var(--line-2), transparent); }
.who { flex: none; padding: 0 9px; border-radius: 999px; font: 11.5px/1.75 var(--sans); letter-spacing: .06em; white-space: nowrap; }
.who.me { background: var(--zhe-soft); color: var(--zhe); border: 1px solid var(--zhe-line); }
.who.ai { background: var(--dai-soft); color: var(--dai); border: 1px solid var(--dai-line); }
/* AI 写好的几区：平时收成一行，点开看全文 */
.sum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 12px; border-radius: 7px; background: rgba(62, 92, 94, .045); box-shadow: inset 2px 0 0 rgba(62, 92, 94, .26); font: 13.5px/1.9 var(--sans); color: var(--ink-2); cursor: pointer; }
.sum:hover { background: rgba(62, 92, 94, .085); }
.sec.fold .blist, .sec.fold .rw { display: none; }
.sec:not(.fold) .sum { display: none; }
.rw { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; }
.rw input { flex: 1; min-width: 0; }
.blist { display: flex; flex-direction: column; }
.blk { position: relative; display: flex; align-items: baseline; gap: 10px; margin: 0 -12px; padding: 3px 12px; border-radius: 6px; font: 15px/1.9 var(--serif); transition: background .15s, box-shadow .15s; }
.blk:hover { background: rgba(120, 98, 70, .035); }
.blk:focus-within { background: rgba(141, 106, 60, .055); box-shadow: inset 2px 0 0 var(--zhe); }
.blk.ai { box-shadow: inset 2px 0 0 rgba(62, 92, 94, .26); }
.blk.ai.mine { box-shadow: inset 2px 0 0 var(--zhe-line); }
.blk.ai:focus-within { background: rgba(62, 92, 94, .05); box-shadow: inset 2px 0 0 var(--dai); }
.lab { flex: none; font: 14px/2 var(--kai); color: var(--tc); letter-spacing: .1em; }
.geo { flex: none; align-self: baseline; margin-left: -4px; padding: 0 6px; border-radius: 4px; background: var(--dai); color: #f3fbfa; font: 600 10px/1.7 var(--sans); letter-spacing: .08em; cursor: help; }
.ed { flex: 1; min-width: 0; min-height: 1.9em; outline: none; white-space: pre-wrap; word-break: break-word; cursor: text; }
.ed.ro { cursor: pointer; }
.blk.nt { cursor: pointer; }
.blk.nt:hover { background: rgba(168, 58, 44, .04); }
.blk.noted { box-shadow: inset 2px 0 0 var(--zhu); }
.blk.red { box-shadow: inset 2px 0 0 var(--zhu); background: rgba(168, 58, 44, .035); }
/* 你写给 AI 的批注：朱笔，跟在那一行下面（AI 写给你的批注是黛色） */
.hnote { position: relative; margin: 2px 0 6px; padding: 5px 12px 6px 34px; border-radius: 4px; background: rgba(168, 58, 44, .05); color: var(--zhu); font: 14.5px/1.8 var(--kai); white-space: pre-wrap; word-break: break-word; cursor: pointer; }
.hnote::before { content: '批'; position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px; background: var(--zhu); color: #fff8f2; font: 11px/1 var(--kai); }
.hnote.edit { cursor: default; padding-right: 10px; }
.hn-ta { display: block; width: 100%; min-height: 58px; padding: 6px 10px; border: 1px solid var(--zhu-line); border-radius: 6px; background: #fffefc; color: var(--ink); outline: none; resize: none; overflow: hidden; font: 15px/1.8 var(--kai); }
.hn-ta:focus { box-shadow: 0 0 0 3px var(--zhu-soft); }
.hn-acts { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; font-family: var(--sans); }
.hn-acts .faint { margin-right: auto; }
.btn.zhu { background: var(--zhu); border-color: var(--zhu); color: #fff8f2; }
.btn.zhu:hover { background: #95301f; }
#gnote:empty { display: none; }
#gnote { position: relative; z-index: 1; margin-top: 6px; }
/* 你写好的可以收起来：只留开头两行 */
.peek { display: none; }
.fold > .peek { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 6px 14px; border-radius: 8px; background: var(--zhe-soft); box-shadow: inset 2px 0 0 var(--zhe-line); font: 14.5px/1.8 var(--serif); color: var(--ink-2); cursor: pointer; }
.fold > .peek:hover { background: rgba(141, 106, 60, .14); }
section.sec.fold > .wr, .p-shot.fold > .wr, .p-shot.fold > .kw { display: none; }
.p-shot.fold > .shot-h { margin-bottom: 6px; padding-bottom: 6px; }
.ed:empty::before { content: attr(data-ph); color: var(--ink-4); }
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 35% { background: rgba(179, 146, 86, .28); } 100% { background: transparent; } }

/* 你写的地方：真的文字框，底下垫一层只画标记的影子（字是透明的，只留底色和下划线） */
.wr { position: relative; flex: 1; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; background: #fffefc; transition: border-color .15s, box-shadow .15s; }
.wr:focus-within { border-color: var(--zhe); box-shadow: 0 0 0 3px var(--zhe-soft); }
.wr-bg, .wr-ta { margin: 0; padding: 10px 14px; border: 0; font: 16px/1.95 var(--serif); letter-spacing: normal; text-align: left; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 4; }
.wr-bg { position: absolute; inset: 0; overflow: hidden; color: transparent; pointer-events: none; user-select: none; }
.wr-ta { position: relative; display: block; width: 100%; resize: none; overflow: hidden; background: transparent; color: var(--ink); outline: none; caret-color: var(--zhu); }
.wr-ta::placeholder { color: var(--ink-4); }
.m-say { background: rgba(168, 58, 44, .1); border-radius: 3px; }
.m-sfx { background: rgba(62, 92, 94, .12); border-radius: 3px; }
.m-nm { border-bottom: 1px dotted #8d6a3c; }
.m-ref { background: var(--zhe-soft); border-bottom: 1px solid var(--zhe-line); }
.m-lint { text-decoration: underline wavy #a83a2c; text-underline-offset: 4px; }
.m-ai { background: rgba(62, 92, 94, .18); }

/* AI 写的几区里的资产名牌：文件里还是 @图片N，这里带上小图和名字 */
.ref {
  display: inline-flex; align-items: center; gap: 5px; margin: 0 2px; padding: 0 8px 0 2px; border-radius: 999px; vertical-align: 1px; cursor: zoom-in; white-space: nowrap;
  border: 1px solid var(--zhe-line); background: var(--zhe-soft); color: var(--zhe); font: 600 12px/1.75 var(--sans); letter-spacing: .02em;
}
.ref::before { content: ''; width: 17px; height: 17px; flex: none; border-radius: 50%; background: var(--paper-3) var(--th) top center / cover no-repeat; }
.ref.av::before { content: '♪'; display: grid; place-items: center; font-size: 11px; color: var(--ink-3); }
.ref.vid::before { content: '▶'; display: grid; place-items: center; font-size: 9px; color: var(--ink-3); }
.ref::after { content: attr(data-name); font-weight: 400; color: var(--ink-2); max-width: 12em; overflow: hidden; text-overflow: ellipsis; }
[data-sec="refs"] .blist .ref::after { content: none; }
.ref:hover { border-color: var(--zhe); }
::highlight(say) { color: #8a3324; background-color: rgba(168, 58, 44, .07); }
::highlight(sfx) { color: #3e5c5e; background-color: rgba(62, 92, 94, .09); }
::highlight(ph) { color: #7a5b2b; background-color: rgba(179, 146, 86, .2); }
::highlight(lint) { text-decoration: underline wavy #a83a2c; text-underline-offset: 4px; }

/* 分镜、关键词 */
.pshots { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
.p-shot { position: relative; padding: 12px 18px 16px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(to bottom, rgba(244, 239, 230, .6), rgba(255, 253, 249, 0) 80px); }
.shot-h { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; padding: 0 0 9px; border-bottom: 1px solid var(--line); }
.shot-no { flex: none; padding: 1px 10px; border-radius: 4px; background: var(--tc); color: #fff9f1; font: 13.5px/1.6 var(--kai); letter-spacing: .15em; }
.shot-title { flex: 1; min-width: 40px; padding: 0; border: 0; background: transparent; outline: none; font: 600 16px/1.5 var(--serif); letter-spacing: .05em; }
.shot-title::placeholder { color: var(--ink-4); font-weight: 400; }
.shot-meta { flex: none; font-size: 11.5px; color: var(--ink-4); white-space: nowrap; }
.shot-meta.over { color: var(--zhu); }
.shot-x { flex: none; padding: 0 6px; border: 0; background: none; cursor: pointer; color: var(--ink-4); font-size: 12px; }
.shot-x:hover { color: var(--zhu); }
.kw { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; margin: 0 0 10px; padding: 0 0 0 34px; }
.kw::before { content: 'AI'; position: absolute; left: 2px; top: 3px; width: 22px; height: 17px; display: grid; place-items: center; border-radius: 3px; background: var(--dai); color: #f3fbfa; font: 600 10.5px/1 var(--sans); }
.kw-g { margin-left: 6px; font: 12.5px var(--kai); color: var(--dai); letter-spacing: .14em; }
.kw-g:first-child { margin-left: 0; }
.k { max-width: 100%; padding: 0 10px; border: 1px dashed var(--dai-line); border-radius: 999px; background: rgba(62, 92, 94, .04); color: var(--dai); cursor: pointer; font: 12.5px/1.8 var(--sans); text-align: left; }
.k:hover { background: rgba(62, 92, 94, .12); border-style: solid; }
.k.hit { border-color: var(--line); background: none; color: var(--ink-4); }
.k.hit::before { content: '✓ '; }
.kw-more { margin-left: auto; padding: 0 4px; border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.kw-tip { font-size: 12px; color: var(--ink-4); }
.add-shot { display: block; width: 100%; margin-top: 14px; padding: 9px; border: 1px dashed var(--line-2); border-radius: 9px; background: none; cursor: pointer; color: var(--ink-3); font-size: 13px; letter-spacing: .1em; }
.add-shot:hover { color: var(--ink); border-color: var(--ink-4); }

/* AI 批注：黛色（人写的批注是朱色） */
.ainote { position: relative; margin: 10px 0 0; padding: 9px 12px 10px 42px; border-radius: 6px; background: rgba(62, 92, 94, .06); border: 1px solid var(--dai-line); font: 13px/1.7 var(--sans); color: var(--ink-2); cursor: pointer; }
.ainote::before { content: 'AI'; position: absolute; left: 10px; top: 11px; width: 22px; height: 17px; display: grid; place-items: center; border-radius: 3px; background: var(--dai); color: #f3fbfa; font: 600 10.5px/1 var(--sans); }
.ainote.soft { background: rgba(62, 92, 94, .03); border-style: dashed; }
.an-tag { font: 12px var(--kai); color: var(--dai); letter-spacing: .14em; }
.an-say { font: 15px/1.7 var(--kai); color: var(--dai); }
.an-why { font-size: 12.5px; color: var(--ink-3); }
.an-diff { margin-top: 7px; padding: 6px 10px; border-radius: 5px; background: var(--sheet); border: 1px dashed var(--dai-line); font: 14px/1.8 var(--serif); }
.an-diff del { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--dai); }
.an-diff ins { margin-left: 4px; color: var(--dai); text-decoration: none; font-family: var(--kai); font-size: 1.04em; }
.an-acts { display: flex; gap: 6px; margin-top: 8px; }
.ainote.done { padding-top: 5px; padding-bottom: 5px; background: none; border-style: dashed; color: var(--ink-3); cursor: default; }
.ainote.done::before { top: 8px; opacity: .45; }

/* 底部引导条 */
.guide { flex: none; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 6px 18px 6px 24px; border-top: 1px solid var(--line); background: rgba(250, 246, 239, .9); font-size: 12.5px; color: var(--ink-2); }
.guide b { flex: none; font: 14px var(--kai); color: var(--zhe); letter-spacing: .12em; white-space: nowrap; }
.g-list { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.g { padding: 0 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); white-space: nowrap; }
.g-keys { flex: none; color: var(--ink-3); white-space: nowrap; }

/* ---------- 右栏 ---------- */
.rail { flex: none; width: 340px; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: rgba(246, 241, 233, .6); }
body.norail .rail { display: none; }

.rail-tab:hover { color: var(--ink); }

@keyframes jobspin { to { transform: rotate(360deg); } }

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = c => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.append(c.nodeType ? c : document.createTextNode(String(c))); };
  kids.forEach(add);
  return el;
}
const ZW = String.fromCharCode(8203);   // 零宽空格：资产名牌排在一行最后时，垫在后面好落光标
const BOM = String.fromCharCode(0xFEFF);   // 有的文件开头带的记号
const plain = el => el.textContent.split(ZW).join('').trim();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const btn = (label, fn, cls) => h('button', { class: 'btn sm ' + (cls || ''), type: 'button', tabindex: '-1', onclick: fn }, label);
const keep = e => e.preventDefault();   // 点按钮时不抢走正文里的光标
let TT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(TT); TT = setTimeout(() => t.classList.remove('on'), 3800); }
function flash(n) { if (!n) return; n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); }
const two = n => String(n).padStart(2, '0');
const stampNow = () => { const d = new Date(); return d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + '-' + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds()); };

/* ---------- 读写真文件：走 annotate-live 的本机服务，和 项目管理.html 用的是同一套接口 ---------- */
const HOME = '项目', HDR = { 'X-Antou': '1' };
const api = (parts, q) => '/api/fs/' + parts.map(encodeURIComponent).join('/') + (q || '');
const FS = {
  async read(parts) { const r = await fetch(api(parts), { headers: HDR }); if (!r.ok) throw new Error((await r.text()) || String(r.status)); return { buf: await r.arrayBuffer(), mtime: +r.headers.get('X-Mtime') }; },
  async text(parts) { const r = await this.read(parts); return { text: new TextDecoder('utf-8', { ignoreBOM: true }).decode(r.buf), mtime: r.mtime }; },
  async stat(parts) { const r = await fetch(api(parts, '?stat'), { headers: HDR }); return r.ok ? r.json() : null; },
  async list(parts) { const r = await fetch(api(parts, '?list'), { headers: HDR }); return r.ok ? r.json() : []; },
  async write(parts, body) { const r = await fetch(api(parts), { method: 'PUT', headers: HDR, body }); if (!r.ok) throw new Error((await r.text()) || String(r.status)); return r.json(); },
  async remove(parts) { const r = await fetch(api(parts), { method: 'DELETE', headers: HDR }); if (!r.ok) throw new Error((await r.text()) || String(r.status)); },
  async move(parts, to) { const r = await fetch(api(parts, '?move=' + encodeURIComponent(to.join('/'))), { method: 'POST', headers: HDR }); if (!r.ok) throw new Error((await r.text()) || String(r.status)); },
};
const has = async parts => (await FS.list(parts.slice(0, -1))).some(x => x.name === parts[parts.length - 1]);   // 先看在不在，再去读：不在的文件不去碰
/* 交给 AI。本机服务第 5 版起：直接开一个 AI 任务（服务去调本机的 Claude、Codex、DeepSeek；用哪个，看流水线顶栏「AI 用」选的那个），
   左下角转圈显示它做到哪了、用了多久，做完文件一变页面自己换上。
   老版本的服务：一行一件事，排进队里等对话里的 AI 来取（node server.js wait 提示词） */
let SVC = null, CHS = null;   // 本机服务是第几版；哪几条 AI 通道能用
const JOBS = { live: [], timer: 0, n: 0 };
async function channelNow() {
  if (!CHS) { try { CHS = (await (await fetch('/api/job?channels', { headers: HDR })).json()).channels.filter(c => c.ok); } catch (e) { CHS = []; } }
  let v = ''; try { v = localStorage.getItem('antou:flow:channel') || ''; } catch (e) { /* 读不了就用第一条 */ }
  return CHS.some(c => c.id === v) ? v : (CHS[0] || { id: 'claude' }).id;
}
function jobBody(line, ch) {
  const base = { 渠道: ch, 项目: PJ, 段: SEGDIR.replace(/^第|段$/g, ''), 名: STEM + '.txt' };
  let m;
  if ((m = /^请批注 [^｜]+(?:｜只批镜头 (\S+))?$/.exec(line))) return { ...base, 事: '批注提示词', ...(m[1] ? { 只批: m[1] } : {}) };
  if ((m = /^要关键词 [^｜]+｜镜头 (\S+)$/.exec(line))) { const s = DOC.shots.find(s => s.no === m[1]); return { ...base, 事: '要关键词', 镜头号: m[1] === '自由' ? '自由' : String(parseInt(m[1], 10)), ...(s ? { 镜头ID: s.id } : {}) }; }
  if ((m = /^按批注修改 (.+)$/.exec(line))) return { 渠道: ch, 项目: PJ, 事: '按批注改提示词', 批注: m[1] };
  if (/^重新铺底 /.test(line)) return { ...base, 事: '铺底' };
  return null;
}
async function tellAI(line) {
  if (SVC == null) { try { SVC = (await (await fetch('/api/ping', { headers: HDR })).json()).v || 0; } catch (e) { SVC = 0; } }
  const body = SVC >= 5 ? jobBody(line, await channelNow()) : null;
  if (!body) return (await fetch('/api/ai', { method: 'POST', headers: HDR, body: line })).json();
  const r = await fetch('/api/job', { method: 'POST', headers: { ...HDR, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.text()) || String(r.status));
  watchJob(await r.json());

  ai('refs'); ai('basic'); ai('seg');

  for (const el of $$('.p-shot')) {
    out.push({ text: '镜头 ' + el.dataset.no + '｜' + $('.shot-title', el).value.trim(), where: '分镜' });
    $('.wr-ta', el).value.split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(t => out.push({ text: t, where: '分镜 · 镜头' + el.dataset.no }));
  }

}
function hnMd() {

  const out = ['# 批注｜' + SEGDIR + ' 提示词 ' + STEM.replace(/_?视频提示词$/, ''), '', '文件：' + PROMPT.join('/'), '',
    'AI 照 AGENTS.md 的「按批注修改」来改：只改批注说到的地方，别的一字不动；改版前原文件移进 历史记录，改完这份批注也移进去。', ''];
  if (HN.general) out.push('## 整体', '批注：' + HN.general, '');
  [...items, ...HN.lost].forEach((x, i) => out.push(`## ${i + 1}｜${x.where}`, `原文${x.n > 1 ? `（第${x.n}处）` : ''}：${x.text}`, '批注：' + x.note, ''));

function hnParse(md) {
  const all = [];

  for (const line of String(md).replace(BOM, '').split(/\r?\n/)) {
    const hd = /^##\s*(整体|\d+)\s*(?:[｜|]\s*(.*))?$/.exec(line);
    if (hd) { all.push(cur = { where: hd[1] === '整体' ? null : (hd[2] || '').trim(), text: null, n: 1, note: null }); continue; }
    if (!cur) continue;
    if (cur.note !== null) { cur.note += '\n' + line; continue; }
    const m = /^批注：(.*)$/.exec(line), o = cur.text === null && /^原文(?:（第(\d+)处）)?：(.*)$/.exec(line);
    if (m) cur.note = m[1];
    else if (o) { cur.text = o[2]; cur.n = +o[1] || 1; }
    else if (cur.text !== null) cur.text += '\n' + line;

  const done = all.filter(x => x.note !== null && x.note.trim()).map(x => ({ ...x, note: x.note.trim() }));

}

      h('span', { class: 'av-ic', title: a.type === '音频' ? '点开听' : '点开看', onclick: () => lightbox(a) }, a.type === '音频' ? '♪' : '▶'), h('span', { class: 'av-n' }, a.name), refOf(a) ? h('b', null, refOf(a)) : null, h('button', { class: 'mini-b', onmousedown: keep, onclick: () => insertFromRail(a) }, '插入'))));
  }
  if (!out.length) out.push(h('p', { class: 'faint small', style: 'padding:20px 0' }, '没找到。'));
  $('#as-list').replaceChildren(...out);
}

/* ---------- 悬停看图、大图 ---------- */
const hov = h('div', { class: 'hov', hidden: true });
document.body.append(hov);
let HOV = '', MM = 0;
function showHov(a, rect) {
  const key = a.path + '|' + Math.round(rect.left) + '|' + Math.round(rect.top);
  if (HOV === key) return;
  HOV = key;
  let pic;
  if (a.type === '图片') { pic = h('img', { alt: a.name, style: a.w ? `aspect-ratio:${a.w}/${a.h}` : null }); thumbUrl(a).then(u => { pic.src = u; }, () => {}); }
  else pic = h('div', { class: 'hov-av' }, a.type === '音频' ? '♪ 音频，点开听' : '▶ 视频，点开看');
  hov.replaceChildren(pic, h('div', { class: 'hov-n' }, refOf(a) ? h('b', null, refOf(a) + '　') : null, nameOf(a)), h('div', { class: 'hov-p' }, a.path));
  hov.hidden = false;
  const hh = Math.max(hov.offsetHeight, 220), x = Math.max(8, Math.min(rect.left, innerWidth - 270));
  hov.style.left = x + 'px'; hov.style.top = (rect.bottom + 8 + hh > innerHeight - 8 ? Math.max(8, rect.top - hh - 8) : rect.bottom + 8) + 'px';
}
function hideHov() { HOV = ''; hov.hidden = true; }
/* 文字框里鼠标底下是不是一个挂了图的名字：到影子里对位置 */
function markAt(ta, x, y) {
  for (const sp of $$('[data-aid]', ta.previousElementSibling)) for (const b of sp.getClientRects()) if (x >= b.left - 1 && x <= b.right + 1 && y >= b.top - 1 && y <= b.bottom + 1) return { a: A[sp.dataset.aid], rect: b };
  return null;
}
document.addEventListener('mousemove', e => {
  if (MM) return;
  MM = requestAnimationFrame(() => {
    MM = 0;
    if (AT || !e.target.closest) return hideHov();
    const c = e.target.closest('.ref');
    if (c && A[c.dataset.aid]) return showHov(A[c.dataset.aid], c.getBoundingClientRect());
    const ta = e.target.closest('.wr-ta'), nm = ta ? markAt(ta, e.clientX, e.clientY) : null;
    if (nm && nm.a) showHov(nm.a, nm.rect); else hideHov();
  });
});
/* 看原图、听音频、看视频：这时才去读原文件 */
async function lightbox(a) {
  hideHov();
  const box = h('div', { class: 'lb' }, h('div', { class: 'lb-cap' }, '正在打开 ' + a.file + ' …'));
  let url = '';
  const close = () => { box.remove(); if (url) URL.revokeObjectURL(url); };
  box.addEventListener('click', e => { if (!e.target.closest('audio, video')) close(); });
  document.body.append(box);
  try {
    url = URL.createObjectURL(await blobOf(a));
    if (!box.isConnected) return URL.revokeObjectURL(url);
    const el = a.type === '图片' ? h('img', { src: url }) : a.type === '音频' ? h('audio', { src: url, controls: true, autoplay: true }) : h('video', { src: url, controls: true, autoplay: true, loop: true });
    box.replaceChildren(el, h('div', { class: 'lb-cap' }, (refOf(a) ? refOf(a) + '　' : '') + nameOf(a) + '　·　' + a.path));
  } catch (e) { close(); toast('打不开：' + e.message); }
}

/* ---------- 接上事件 ---------- */
const sheet = $('#sheet');
sheet.addEventListener('input', e => {
  const box = e.target.closest('.wr-ta, .shot-title, .shot-purpose'), ed = e.target.closest('.ed');
  if (!box && !ed) return;

    const ai = ed.closest('.blk.ai'); if (ai) ai.classList.add('mine');   // AI 写的这一行你改过了
  }
  if (MODE === '自由') $('#freeCount').textContent = $('#freeText').value.length + ' 字';
  touch(); paintMarks(); checkAt();
  if (ed || box?.dataset.kind === 'event') paintCommonContent();
  if (box?.classList.contains('shot-title')) paintOutline();
  clearTimeout(AT_T); AT_T = setTimeout(paintAssets, 600);
});
sheet.addEventListener('keydown', onKey);
sheet.addEventListener('keyup', e => { if (/^(ArrowLeft|ArrowRight|Home|End)$/.test(e.key)) checkAt(); });
sheet.addEventListener('mouseup', e => setTimeout(() => { if (e.target.closest('.ed')) selectPhAtCaret(); checkAt(); }, 0));
sheet.addEventListener('focusin', e => {
  const box = e.target.closest('.wr-ta, .shot-title, .shot-purpose'), ed = e.target.closest('.ed');
  if (!box && !ed) return;
  const sec = e.target.closest('section[data-sec]'); setGuide(sec ? sec.dataset.sec : null);
  const sh = e.target.closest('.p-shot'); if (sh) selectShot(sh.dataset.id); else if (MODE === '自由') LAST_SHOT = '';

});
sheet.addEventListener('focusout', () => closeAt());
sheet.addEventListener('paste', e => { if (!e.target.closest('.ed')) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s*\r?\n+\s*/g, ' ')); });
sheet.addEventListener('click', e => {
  const c = e.target.closest('.ref');
  if (c && A[c.dataset.aid]) return lightbox(A[c.dataset.aid]);
  const nt = e.target.closest('.blk.nt');   // AI 写的一行：点一下写批注（正选着字要复制的不算）
  if (nt && !String(getSelection())) { setGuide(nt.dataset.sec); editHNote(nt); }
});
let draggedShot = '';
sheet.addEventListener('dragstart', e => {
  const handle = e.target.closest('.shot-handle');
  if (!handle) return;
  const card = handle.closest('.p-shot'); draggedShot = card.dataset.id;
  e.dataTransfer.setData('text/x-shot', draggedShot); e.dataTransfer.effectAllowed = 'move'; card.classList.add('dragging');
});
sheet.addEventListener('dragover', e => {
  const card = e.target.closest('.p-shot');
  if (!draggedShot || !card) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.drag-over').forEach(el => el.classList.remove('drag-over')); card.classList.add('drag-over');
});
sheet.addEventListener('drop', e => {
  const card = e.target.closest('.p-shot');
  if (!draggedShot || !card || e.dataTransfer.getData('text/x-shot') !== draggedShot) return;
  e.preventDefault(); DOC = collect();
  const from = DOC.shots.findIndex(s => s.id === draggedShot), to = DOC.shots.findIndex(s => s.id === card.dataset.id);
  if (from >= 0 && to >= 0 && from !== to) { const id = draggedShot; DOC.shots.splice(to, 0, DOC.shots.splice(from, 1)[0]); refreshShotList(id); }
  draggedShot = ''; $$('.dragging, .drag-over').forEach(el => el.classList.remove('dragging', 'drag-over'));
});
sheet.addEventListener('dragend', () => { draggedShot = ''; $$('.dragging, .drag-over').forEach(el => el.classList.remove('dragging', 'drag-over')); });
sheet.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('text/x-asset')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
sheet.addEventListener('drop', e => {
  const a = A[e.dataTransfer.getData('text/x-asset')];
  if (!a) return;
  e.preventDefault();
  const ta = e.target.closest('.wr-ta');
  if (ta) { const i = indexAt(ta, e.clientX, e.clientY); return insertAsset(a, { ta, s: i, e: i }); }
  const r = document.caretRangeFromPoint(e.clientX, e.clientY);
  if (r) insertAsset(a, r);
});
document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if (!s.rangeCount) return;
  const n = s.anchorNode, el = n && (n.nodeType === 3 ? n.parentElement : n), ed = el && el.closest && el.closest('#sheet .ed');
  if (ed && ed.isContentEditable) LAST = s.getRangeAt(0).cloneRange();
});
document.addEventListener('mousedown', e => { if (AT && !pop.contains(e.target)) closeAt(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = $('.lb'); if (lb) lb.click(); } });
addEventListener('pagehide', () => { if (READY && dirty()) rememberDraft(); });
addEventListener('beforeunload', e => { if (READY && (dirty() || SAVING || CONFLICT)) { rememberDraft(); e.preventDefault(); e.returnValue = ''; } });
$('#as-q').addEventListener('input', paintAssets);
$('#askAll').onclick = () => askAI('');
$('#askOne').onclick = () => { if (!LAST_SHOT) return toast('先点一下要批的那一镜'); askAI(LAST_SHOT); };
$('#railBtn').onclick = () => { document.body.classList.toggle('norail'); $('#railBtn').textContent = document.body.classList.contains('norail') ? '展开侧栏' : '收起侧栏'; $$('.wr-ta').forEach(grow); };
$('#previewBtn').onclick = previewDraft;
$('#saveBtn').onclick = () => { if (READY) { touch(); save(); } };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (READY) { touch(); save(); } } });

$('#tipX').onclick = () => { $('#tip').hidden = true; try { localStorage.setItem('xiegao:tip', '1'); } catch (e) { /* 记不住就下回再提示 */ } };

/* ---------- 打开 ---------- */
function fail(msg) { setStatus('没打开', true); $('#canvas').replaceChildren(h('div', { class: 'fail' }, h('b', null, '打不开。'), h('p', null, msg), h('p', { class: 'faint small', style: 'margin-top:10px' }, '这一页要经本机服务打开：http://localhost:8767/'))); }
/* AI 铺好底的稿：旁边有一份「…视频提示词_写稿.json」的就是 */
async function findDrafts() {
  const out = [];
  for (const pj of await FS.list([HOME])) {
    if (pj.kind !== 'directory' || !(await FS.list([HOME, pj.name])).some(x => x.kind === 'directory' && x.name === '提示词')) continue;
    for (const seg of await FS.list([HOME, pj.name, '提示词'])) {
      if (seg.kind !== 'directory' || !/^第.+段$/.test(seg.name)) continue;
      const files = await FS.list([HOME, pj.name, '提示词', seg.name]), names = new Set(files.map(f => f.name));
      for (const f of files) if (/视频提示词\.txt$/i.test(f.name)) out.push([pj.name, '提示词', seg.name, f.name]);
    }
  }
  return out;
}
function chooser(list) {
  setStatus(list.length ? '选一份稿' : '还没有稿');
  $('#canvas').replaceChildren(h('div', { class: 'fail', style: 'border-color:var(--dai-line)' }, h('b', { style: 'color:var(--dai)' }, list.length ? '写哪一份？' : '还没有提示词稿。'),
    h('p', null, list.length ? '点一份继续写：' : '到流水线的「提示词」页面，选择一种写法开始。'),
    h('div', { style: 'display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:12px' }, list.map(p => h('button', { class: 'btn', onclick: () => { location.hash = 'open=' + p.map(encodeURIComponent).join('/'); } }, p[0] + ' ／ ' + p[2] + ' ／ ' + p[3].replace(/_?视频提示词\.txt$/i, '').replace(/_/g, ' · '))))));
}
async function boot() {
  let draftConflict = false;
  if (innerWidth && innerWidth < 1040) document.body.classList.add('norail');   // 窗格窄：先把右栏收起来，写的地方宽一点
  paintSteps(); setGuide(null); paintTabs();
  let open = [];
  try { open = decodeURIComponent((/[#&]open=([^&]*)/.exec(location.hash) || [])[1] || '').split('/').filter(Boolean); } catch (e) { /* 网址不对 */ }
  if (open.length < 3 || !/视频提示词\.txt$/i.test(open[open.length - 1])) {   // 网址里没写开哪一份：自己去找铺好底的稿，只有一份就直接开
    let list;
    try { list = await findDrafts(); } catch (e) { return fail('本机服务连不上：' + e.message); }
    if (list.length === 1) { location.hash = 'open=' + list[0].map(encodeURIComponent).join('/'); return; }   // 网址一变，页面自己重开
    return chooser(list);
  }
  PJ = open[0]; OPENPATH = open.join('/'); PROMPT = [HOME, ...open]; DIR = PROMPT.slice(0, -1); STEM = open[open.length - 1].replace(/\.txt$/i, ''); SEGDIR = DIR[DIR.length - 1]; KEY = open.slice(1).join('/');
  SIDEF = [...DIR, STEM + '_写稿.json']; NOTESF = [...DIR, STEM + '_AI批注.md']; HNF = [...DIR, STEM + '_批注.md']; HIST = [HOME, PJ, '历史记录', ...open.slice(1, -1)];
  $('#pj').textContent = PJ; $('#crumb').textContent = SEGDIR + ' · ' + STEM.replace(/_?视频提示词$/, '').replace(/_/g, ' · ') + ' · 写稿';
  document.title = SEGDIR + ' ' + STEM + ' · 写稿';
  try {
    const r = await FS.text(PROMPT);
    MTIME = r.mtime; DOC = parsePrompt(r.text); LASTTEXT = r.text;
    await loadSide();
    BASE_EDITOR = structuredClone(editorPart(SIDE));
    const draft = readEditorDraft(r.text, SIDE);
    MODE = draft.mode; FREE = draft.free; DOC = draft.doc; draftConflict = draft.conflict;
    ASSETS = await scanAssets(); A = Object.fromEntries(ASSETS.map(a => [a.path, a]));
    await loadRefs();
    await loadFlow();
    DOC = hydrateShots(DOC, SIDE.镜头信息, !SIDE.写法);
  } catch (e) { return fail(e.message); }
  render(); READY = true;
  setStatus(savedText()); setAsk(); paintMarks(); showRail('suggest'); paintCmp();
  $('#tip').hidden = true;
  $('#railBtn').textContent = document.body.classList.contains('norail') ? '展开侧栏' : '收起侧栏';
  await offerRecovery();
  if (draftConflict) reportConflict('文件和分镜草稿有不同的修改，请核对后保存');
  await loadNotes();
  await loadHNotes();
  setInterval(poll, 2500);
  resumeJobs();
}

boot();
