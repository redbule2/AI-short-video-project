<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案头 · 写稿（试用版）</title>
<link rel="stylesheet" href="公用/提示条.css">
<style>
/* 写稿 · 试用版：你来写的稿在这里写（2026-11-19 他要回人写；11-21 起你只写事件脚本，新稿用自由模式写一大段，点「交给 AI 写完」，AI 拆成分镜、写好其余几块，公用/写稿写完.js）；
   AI 写的稿在这里「进去改」：自己改字，也能请 AI 批、写批注让 AI 改（11-15 到 11-19 提示词一律 AI 写，那几天只有这一种）。读写真文件，走 annotate-live 的本机服务（另开一个端口）。
   样式照 项目管理.html 起家。2026-11-13 换配色：暖白底、白卡片、字加深；青＝你写的和选中，靛＝AI 写的和 AI 批注，朱＝你的批注和警告。
   现在由「流水线」提示词那一步整页盖上来用（流水线.js 的 openWrite），不再并进 项目管理.html。
   2026-11-13 晚：@ 白模视频（名字里有「白模」的视频）时，素材里补的是 sd25-pe 白模那两句。 */
:root {
  --paper: #f5f3ef; --paper-2: #ebe8e2; --paper-3: #e0ddd5; --sheet: #ffffff;
  --ink: #1f1c19; --ink-2: #4d4842; --ink-3: #736c64; --ink-4: #a39d95;
  --line: #e6e2db; --line-2: #d4cfc6;
  --zhu: #b8382b; --zhu-soft: rgba(184, 56, 43, .07); --zhu-line: rgba(184, 56, 43, .3);
  --qing: #1f6b69; --qing-soft: rgba(31, 107, 105, .08); --qing-line: rgba(31, 107, 105, .32);
  --dian: #4a53a6; --dian-soft: rgba(74, 83, 166, .075); --dian-line: rgba(74, 83, 166, .3);
  --jin: #b8892f;
  --tc: var(--qing); --tc-soft: var(--qing-soft); --tc-line: var(--qing-line);
  --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --kai: 'KaiTi', 'STKaiti', 'Kaiti SC', 'BiauKai', 'Noto Serif SC', serif;
  --shadow: 0 1px 2px rgba(30, 28, 24, .05), 0 10px 32px -14px rgba(30, 28, 24, .2);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); font: 14px/1.7 var(--sans); background: var(--paper); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
p { margin: 0; }
[hidden] { display: none !important; }
::selection { background: rgba(31, 107, 105, .18); }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: rgba(60, 55, 48, .22); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
.faint { color: var(--ink-3); }
.small { font-size: 12.5px; }
kbd { display: inline-block; padding: 0 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--sheet); font: 12px/1.5 var(--sans); color: var(--ink-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  font: 13.5px/1.2 var(--sans); letter-spacing: .08em; color: var(--ink); background: var(--sheet); border: 1px solid var(--line-2); transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--paper); border-color: var(--ink-4); }
.btn.dian { background: var(--dian); border-color: var(--dian); color: #fff; }
.btn.dian:hover { background: #3c4590; border-color: #3c4590; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(40, 36, 30, .06); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.linkb { padding: 0 4px; border: 0; background: none; cursor: pointer; color: var(--qing); font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 顶栏、三步 ---------- */
#main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.top { flex: none; min-height: 56px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 6px 18px 6px 24px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.crumb { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
.ptitle { font: 600 18px/1.3 var(--serif); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-seg { min-width: 0; font: 14.5px var(--kai); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-seg::before { content: '／'; margin-right: 10px; color: var(--ink-4); }
.tag-try { flex: none; align-self: center; padding: 0 8px; border-radius: 999px; background: var(--zhu); color: #fff; font: 11px/1.7 var(--sans); letter-spacing: .1em; }
.top-right { flex: none; display: flex; align-items: center; gap: 8px; }
.status { display: flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.status.err { color: var(--zhu); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.steps { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 18px 7px 22px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .6); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 7px; padding: 2px 12px 2px 4px; border-radius: 999px; border: 1px solid transparent; }
.step i { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-2); background: var(--sheet); font: normal 11.5px/1 var(--sans); }
.step small { font-size: 11.5px; color: var(--ink-4); }
.step.me i { border-color: var(--qing-line); color: var(--qing); }
.step.ai i { border-color: var(--dian-line); color: var(--dian); }
.step.done { color: var(--ink-2); }
.step.now { background: var(--sheet); border-color: var(--line-2); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(30, 28, 24, .08); }
.step.now small { font-weight: 400; color: var(--ink-3); }
.step.now.me i { background: var(--qing); border-color: var(--qing); color: #fff; }
.step.now.ai i { background: var(--dian); border-color: var(--dian); color: #fff; }
.step-arrow { color: var(--ink-4); }

/* ---------- 工作区 ---------- */
.stage { flex: 1; min-height: 0; display: flex; }
.col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.canvas { flex: 1; min-height: 0; overflow: auto; padding: 22px 34px 80px; }
.tip { position: relative; max-width: 800px; margin: 0 auto 18px; padding: 12px 40px 12px 18px; border-radius: 8px; background: var(--qing-soft); border: 1px solid var(--qing-line); font-size: 13px; line-height: 1.9; color: var(--ink-2); }
.tip b { color: var(--qing); }
.tip ol { margin: 4px 0 0; padding-left: 20px; }
.tip .x { position: absolute; right: 8px; top: 4px; border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; }
.fail { max-width: 640px; margin: 80px auto; padding: 24px 28px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--zhu-line); color: var(--ink-2); line-height: 1.9; }
.fail b { color: var(--zhu); }

.sheet { position: relative; max-width: 800px; margin: 0 auto; padding: 46px 60px 36px; border-radius: 3px; background: var(--sheet); border: 1px solid rgba(212, 207, 198, .7); box-shadow: var(--shadow); }
.sheet::after { content: ''; position: absolute; inset: 11px; border: 1px solid var(--tc-line); border-radius: 2px; pointer-events: none; opacity: .55; }
.doc-title { position: relative; z-index: 1; text-align: center; margin-bottom: 20px; }
.doc-kicker { font: 13px var(--kai); color: var(--tc); letter-spacing: .4em; margin-right: -.4em; margin-bottom: 10px; }
.doc-seg { font: 600 28px/1.3 var(--serif); letter-spacing: .12em; margin-right: -.12em; }
.doc-name { margin-top: 6px; font: 15px/1.5 var(--serif); color: var(--ink-3); letter-spacing: .06em; }
.ornament { width: 180px; height: 9px; margin: 16px auto 0; display: flex; align-items: center; }
.ornament::before, .ornament::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--line-2)); }
.ornament::after { background: linear-gradient(to left, transparent, var(--line-2)); }
.ornament span { width: 6px; height: 6px; margin: 0 10px; border: 1px solid var(--tc); transform: rotate(45deg); opacity: .75; }
.laid { position: relative; z-index: 1; padding: 6px 14px; border-radius: 8px; border: 1px dashed var(--dian-line); background: rgba(74, 83, 166, .05); font-size: 12.5px; line-height: 1.8; color: var(--ink-2); text-align: center; }
.laid b { color: var(--dian); font-weight: 600; }
.sheet-foot { position: relative; z-index: 1; margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--ink-4); letter-spacing: .03em; word-break: break-all; }

.sec { position: relative; z-index: 1; margin-top: 26px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.sec-no { width: 23px; height: 23px; flex: none; display: grid; place-items: center; border: 1px solid var(--tc-line); border-radius: 50%; font: 12px/1 var(--serif); color: var(--tc); }
.sec-name { font: 15px var(--kai); color: var(--tc); letter-spacing: .3em; white-space: nowrap; }
.sec-line { flex: 1; min-width: 12px; height: 1px; background: linear-gradient(to right, var(--line-2), transparent); }
.who { flex: none; padding: 0 9px; border-radius: 999px; font: 11.5px/1.75 var(--sans); letter-spacing: .06em; white-space: nowrap; }
.who.me { background: var(--qing-soft); color: var(--qing); border: 1px solid var(--qing-line); }
.who.ai { background: var(--dian-soft); color: var(--dian); border: 1px solid var(--dian-line); }
/* AI 写好的几区：平时收成一行，点开看全文 */
.sum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 12px; border-radius: 7px; background: rgba(74, 83, 166, .045); box-shadow: inset 2px 0 0 rgba(74, 83, 166, .26); font: 13.5px/1.9 var(--sans); color: var(--ink-2); cursor: pointer; }
.sum:hover { background: rgba(74, 83, 166, .085); }
.sec.fold .blist, .sec.fold .rw { display: none; }
.sec:not(.fold) .sum { display: none; }
.rw { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; }
.rw input { flex: 1; min-width: 0; }
.blist { display: flex; flex-direction: column; }
.blk { position: relative; display: flex; align-items: baseline; gap: 10px; margin: 0 -12px; padding: 3px 12px; border-radius: 6px; font: 15px/1.9 var(--serif); transition: background .15s, box-shadow .15s; }
.blk:hover { background: rgba(40, 36, 30, .03); }
.blk:focus-within { background: rgba(31, 107, 105, .055); box-shadow: inset 2px 0 0 var(--qing); }
.blk.ai { box-shadow: inset 2px 0 0 rgba(74, 83, 166, .26); }
.blk.ai.mine { box-shadow: inset 2px 0 0 var(--qing-line); }
.blk.ai:focus-within { background: rgba(74, 83, 166, .05); box-shadow: inset 2px 0 0 var(--dian); }
.lab { flex: none; font: 14px/2 var(--kai); color: var(--tc); letter-spacing: .1em; }
.geo { flex: none; align-self: baseline; margin-left: -4px; padding: 0 6px; border-radius: 4px; background: var(--dian); color: #fff; font: 600 10px/1.7 var(--sans); letter-spacing: .08em; cursor: help; }
.ed { flex: 1; min-width: 0; min-height: 1.9em; outline: none; white-space: pre-wrap; word-break: break-word; cursor: text; }
/* AI 写的一行右边的「批注」小钮（11-16 起 AI 写的也能直接改，批注从这里写）：鼠标停着、正在改的那一行才露出来 */
.hn-b { flex: none; align-self: center; visibility: hidden; padding: 0 8px; border: 1px solid var(--zhu-line); border-radius: 999px; background: var(--sheet); cursor: pointer; font: 11.5px/1.6 var(--sans); color: var(--zhu); white-space: nowrap; user-select: none; }
.blk:hover .hn-b, .blk:focus-within .hn-b { visibility: visible; }
.hn-b:hover { background: var(--zhu-soft); }
.hn-b::before { content: '批注'; }   /* 字用样式画：不算进这一行的文字，复制几行时也不带上 */
.blk.noted { box-shadow: inset 2px 0 0 var(--zhu); }
.blk.red { box-shadow: inset 2px 0 0 var(--zhu); background: rgba(184, 56, 43, .035); }
/* 你写给 AI 的批注：朱笔，跟在那一行下面（AI 写给你的批注是靛色） */
.hnote { position: relative; margin: 2px 0 6px; padding: 5px 12px 6px 34px; border-radius: 4px; background: rgba(184, 56, 43, .05); color: var(--zhu); font: 14.5px/1.8 var(--kai); white-space: pre-wrap; word-break: break-word; cursor: pointer; }
.hnote::before { content: '批'; position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px; background: var(--zhu); color: #fff; font: 11px/1 var(--kai); }
.hnote.edit { cursor: default; padding-right: 10px; }
.hn-ta { display: block; width: 100%; min-height: 58px; padding: 6px 10px; border: 1px solid var(--zhu-line); border-radius: 6px; background: #fff; color: var(--ink); outline: none; resize: none; overflow: hidden; font: 15px/1.8 var(--kai); }
.hn-ta:focus { box-shadow: 0 0 0 3px var(--zhu-soft); }
.hn-acts { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; font-family: var(--sans); }
.hn-acts .faint { margin-right: auto; }
.btn.zhu { background: var(--zhu); border-color: var(--zhu); color: #fff; }
.btn.zhu:hover { background: #9c2d22; border-color: #9c2d22; }
#gnote:empty { display: none; }
#gnote { position: relative; z-index: 1; margin-top: 6px; }
/* 你写好的可以收起来：只留开头两行 */
.peek { display: none; }
.fold > .peek { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 6px 14px; border-radius: 8px; background: var(--qing-soft); box-shadow: inset 2px 0 0 var(--qing-line); font: 14.5px/1.8 var(--serif); color: var(--ink-2); cursor: pointer; }
.fold > .peek:hover { background: rgba(31, 107, 105, .14); }
section.sec.fold > .wr, .p-shot.fold > .wr { display: none; }
.p-shot.fold > .shot-h { margin-bottom: 6px; padding-bottom: 6px; }
.ed:empty::before { content: attr(data-ph); color: var(--ink-4); }
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 35% { background: rgba(214, 160, 50, .26); } 100% { background: transparent; } }

/* 你写的地方：真的文字框，底下垫一层只画标记的影子（字是透明的，只留底色和下划线） */
.wr { position: relative; flex: 1; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; transition: border-color .15s, box-shadow .15s; }
.wr:focus-within { border-color: var(--qing); box-shadow: 0 0 0 3px var(--qing-soft); }
.wr-bg, .wr-ta { margin: 0; padding: 10px 14px; border: 0; font: 16px/1.95 var(--serif); letter-spacing: normal; text-align: left; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 4; }
.wr-bg { position: absolute; inset: 0; overflow: hidden; color: transparent; pointer-events: none; user-select: none; }
.wr-ta { position: relative; display: block; width: 100%; resize: none; overflow: hidden; background: transparent; color: var(--ink); outline: none; caret-color: var(--qing); }
.wr-ta::placeholder { color: var(--ink-4); }
.m-say { background: rgba(44, 122, 76, .12); border-radius: 3px; }
.m-sfx { background: rgba(176, 116, 32, .14); border-radius: 3px; }
.m-nm { border-bottom: 1px dotted var(--qing); }
.m-ref { background: var(--qing-soft); border-bottom: 1px solid var(--qing-line); }
.m-lint { text-decoration: underline wavy #b8382b; text-underline-offset: 4px; }
.m-ai { background: rgba(74, 83, 166, .18); }

/* AI 写的几区里的资产名牌：文件里还是 @图片N，这里带上小图和名字 */
.ref {
  display: inline-flex; align-items: center; gap: 5px; margin: 0 2px; padding: 0 8px 0 2px; border-radius: 999px; vertical-align: 1px; cursor: zoom-in; white-space: nowrap;
  border: 1px solid var(--qing-line); background: var(--qing-soft); color: var(--qing); font: 600 12px/1.75 var(--sans); letter-spacing: .02em;
}
.ref::before { content: ''; width: 17px; height: 17px; flex: none; border-radius: 50%; background: var(--paper-3) var(--th) top center / cover no-repeat; }
.ref.av::before { content: '♪'; display: grid; place-items: center; font-size: 11px; color: var(--ink-3); }
.ref.vid::before { content: '▶'; display: grid; place-items: center; font-size: 9px; color: var(--ink-3); }
.ref::after { content: attr(data-name); font-weight: 400; color: var(--ink-2); max-width: 12em; overflow: hidden; text-overflow: ellipsis; }
[data-sec="refs"] .blist .ref::after { content: none; }
.ref:hover { border-color: var(--qing); }
::highlight(say) { color: #23663f; background-color: rgba(44, 122, 76, .09); }
::highlight(sfx) { color: #8a5714; background-color: rgba(176, 116, 32, .11); }
::highlight(ph) { color: #6b4d0c; background-color: rgba(232, 184, 60, .32); }
::highlight(lint) { text-decoration: underline wavy #b8382b; text-underline-offset: 4px; }
::highlight(ainote) { background-color: rgba(74, 83, 166, .18); }

/* 分镜 */
.pshots { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
.p-shot { position: relative; padding: 12px 18px 16px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(to bottom, rgba(245, 243, 239, .6), rgba(255, 255, 255, 0) 80px); }
.shot-h { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; padding: 0 0 9px; border-bottom: 1px solid var(--line); }
.shot-no { flex: none; padding: 1px 10px; border-radius: 4px; background: var(--tc); color: #fff; font: 13.5px/1.6 var(--kai); letter-spacing: .15em; }
.shot-title { flex: 1; min-width: 40px; padding: 0; border: 0; background: transparent; outline: none; font: 600 16px/1.5 var(--serif); letter-spacing: .05em; }
.shot-title::placeholder { color: var(--ink-4); font-weight: 400; }
.shot-meta { flex: none; font-size: 11.5px; color: var(--ink-4); white-space: nowrap; }
.shot-meta.over { color: var(--zhu); }
.shot-x { flex: none; padding: 0 6px; border: 0; background: none; cursor: pointer; color: var(--ink-4); font-size: 12px; }
.shot-x:hover { color: var(--zhu); }
.add-shot { display: block; width: 100%; margin-top: 14px; padding: 9px; border: 1px dashed var(--line-2); border-radius: 9px; background: none; cursor: pointer; color: var(--ink-3); font-size: 13px; letter-spacing: .1em; }
.add-shot:hover { color: var(--ink); border-color: var(--ink-4); }

/* AI 批注：靛色（人写的批注是朱色） */
.ainote { position: relative; margin: 10px 0 0; padding: 9px 12px 10px 42px; border-radius: 6px; background: rgba(74, 83, 166, .06); border: 1px solid var(--dian-line); font: 13px/1.7 var(--sans); color: var(--ink-2); cursor: pointer; }
.ainote::before { content: 'AI'; position: absolute; left: 10px; top: 11px; width: 22px; height: 17px; display: grid; place-items: center; border-radius: 3px; background: var(--dian); color: #fff; font: 600 10.5px/1 var(--sans); }
.ainote.soft { background: rgba(74, 83, 166, .03); border-style: dashed; }
.an-tag { font: 12px var(--kai); color: var(--dian); letter-spacing: .14em; }
.an-say { font: 15px/1.7 var(--kai); color: var(--dian); }
.an-why { font-size: 12.5px; color: var(--ink-3); }
.an-diff { margin-top: 7px; padding: 6px 10px; border-radius: 5px; background: var(--sheet); border: 1px dashed var(--dian-line); font: 14px/1.8 var(--serif); }
.an-diff del { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--dian); }
.an-diff ins { margin-left: 4px; color: var(--dian); text-decoration: none; font-family: var(--kai); font-size: 1.04em; }
.an-acts { display: flex; gap: 6px; margin-top: 8px; }
.ainote.done { padding-top: 5px; padding-bottom: 5px; background: none; border-style: dashed; color: var(--ink-3); cursor: default; }
.ainote.done::before { top: 8px; opacity: .45; }

/* 底部引导条 */
.guide { flex: none; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 6px 18px 6px 24px; border-top: 1px solid var(--line); background: var(--sheet); font-size: 12.5px; color: var(--ink-2); }
.guide b { flex: none; font: 14px var(--kai); color: var(--qing); letter-spacing: .12em; white-space: nowrap; }
.g-list { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.g { padding: 0 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); white-space: nowrap; }
.g-keys { flex: none; color: var(--ink-3); white-space: nowrap; }

/* ---------- 右栏 ---------- */
.rail { flex: none; width: 340px; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--sheet); }
body.norail .rail { display: none; }
.rail-tabs { flex: none; display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.rail-tab { flex: 1; margin-bottom: -1px; padding: 8px 0 9px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; }
.rail-tab:hover { color: var(--ink); }
.rail-tab.on { color: var(--ink); border-bottom-color: var(--tc); }
.rail-tab.has { color: var(--zhu); }
.rail-tab.has-ai { color: var(--dian); font-weight: 600; }
.pin { flex: none; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.pin img { display: block; width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px; background: var(--paper-2); cursor: zoom-in; }
.pin video { display: block; width: 100%; max-height: 240px; border-radius: 6px; background: #000; }
.pin-n.vid { flex-wrap: wrap; row-gap: 5px; }
.pin-n.vid > span { flex: 1 1 100%; }   /* 名字单占一行，按钮在下面一行 */
.pin-n .push { margin-left: auto; }
.rail-body img:not([src]), .at-pop img:not([src]) { visibility: hidden; }   /* 图还没做好时别露出替代文字 */
.pin-wait { padding: 26px 0; text-align: center; font-size: 12.5px; color: var(--ink-3); }
.pin-n { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; }
.pin-n b { color: var(--qing); }
.pin-n span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 14px 40px; }
.as-q { width: 100%; padding: 7px 11px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--sheet); outline: none; font-size: 13px; }
.as-q:focus { border-color: var(--qing-line); box-shadow: 0 0 0 3px var(--qing-soft); }
.as-h { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 8px; font: 13px var(--kai); color: var(--ink-2); letter-spacing: .26em; }
.as-h em { font: normal 11px var(--sans); color: var(--ink-4); letter-spacing: 0; }
.used-list { display: flex; flex-direction: column; gap: 2px; }
.used-row, .av-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: grab; }
.used-row:hover, .av-row:hover { background: rgba(40, 36, 30, .045); }
.u-th { width: 36px; height: 36px; flex: none; border-radius: 6px; object-fit: cover; object-position: top; border: 1px solid var(--line); background: var(--paper-2); cursor: zoom-in; }
.ph { display: grid; place-items: center; background: var(--paper-3); color: var(--ink-3); font-size: 14px; }
.u-n { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-n b { color: var(--qing); font: 600 12px var(--sans); }
.u-n span { display: block; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.u-n span.warn { color: var(--zhu); }
.mini-b { flex: none; padding: 1px 9px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--sheet); cursor: pointer; font: 11.5px/1.6 var(--sans); color: var(--ink-2); white-space: nowrap; }
.mini-b:hover { border-color: var(--ink-4); color: var(--ink); }
.used-row .mini-b, .av-row .mini-b { display: none; }
.used-row:hover .mini-b, .av-row:hover .mini-b { display: inline-block; }
.as-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px 8px; }
.as-t { position: relative; min-width: 0; cursor: grab; }
.as-t img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid var(--line); background: var(--paper-2); cursor: zoom-in; }
.as-t:hover img { border-color: var(--ink-4); }
.as-t .no { position: absolute; left: 4px; top: 4px; padding: 0 6px; border-radius: 999px; background: var(--qing); color: #fff; font: 600 10.5px/1.6 var(--sans); }
.as-acts { position: absolute; left: 0; right: 0; top: calc(100% - 46px); display: none; justify-content: center; gap: 4px; }
.as-t:hover .as-acts { display: flex; }
.as-acts button { padding: 0 8px; border: 0; border-radius: 999px; background: rgba(31, 28, 25, .82); color: #fff; cursor: pointer; font-size: 11px; line-height: 1.8; }
.as-acts button:hover { background: var(--qing); }
.as-n { margin-top: 3px; font-size: 11.5px; line-height: 1.4; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.av-row { cursor: pointer; }
.av-ic { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--paper-3); color: var(--ink-3); font-size: 12px; cursor: pointer; }
/* 视频一张卡：左边封面，右边名字、时长、按钮 */
.vc { display: flex; gap: 10px; margin-bottom: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: grab; }
.vc:hover { border-color: var(--line-2); }
.vc-pic { position: relative; flex: none; width: 128px; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; border-radius: 6px; background: #2b2924; cursor: pointer; }
.vc-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vc-play { position: relative; z-index: 1; width: 30px; height: 30px; display: grid; place-items: center; padding-left: 2px; border-radius: 50%; background: rgba(31, 28, 25, .62); color: #fff; font-size: 12px; }
.vc-pic:hover .vc-play { background: var(--qing); }
.vc-dur { position: absolute; z-index: 1; right: 4px; bottom: 3px; padding: 0 5px; border-radius: 3px; background: rgba(31, 28, 25, .75); color: #fff; font: 11px/1.6 var(--sans); }
.vc-dur:empty { display: none; }
.vc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.vc-n { font: 600 13px/1.5 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc-n b { margin-right: 6px; color: var(--qing); font-weight: 600; }
.vc-m { font-size: 11.5px; line-height: 1.5; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.vc-m.warn { color: var(--zhu); }
.vc-acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }
.mini-b.on { border-color: var(--qing); color: var(--qing); }
.av-n { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av-row b { color: var(--qing); font: 600 11.5px var(--sans); }

.ai-empty { padding: 8px 2px; font-size: 13px; line-height: 1.9; color: var(--ink-2); }
.ai-empty ol { margin: 6px 0 14px; padding-left: 20px; }
.ai-wait { padding: 30px 6px; text-align: center; color: var(--ink-2); line-height: 2; }
.ai-wait .wt-ring { --wt-w: 2.5px; display: block; margin: 0 auto 12px; font-size: 24px; color: var(--dian); }
.ai-sum { margin-bottom: 10px; padding: 9px 12px; border-radius: 7px; background: rgba(74, 83, 166, .08); font: 14.5px/1.75 var(--kai); color: var(--dian); }
.ai-sum small { display: block; font: 12px var(--sans); color: var(--ink-3); }
.nlist { display: flex; flex-direction: column; gap: 8px; }
.nl-i { width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; cursor: pointer; text-align: left; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); font-size: 12.5px; color: var(--ink-2); }
.nl-i:hover { border-color: var(--dian-line); }
.nl-w { font: 12px var(--kai); color: var(--ink-3); letter-spacing: .08em; }
.nl-n { font: 14px/1.7 var(--kai); color: var(--dian); }
.nl-i.done { opacity: .55; }
.nl-i.done .nl-n { text-decoration: line-through; }
.lint { display: flex; flex-direction: column; gap: 6px; }
.issue { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; cursor: pointer; text-align: left; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.issue:hover { border-color: var(--line-2); color: var(--ink); }
.issue em { display: block; font-style: normal; color: var(--ink-3); }
.lv { flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--zhu); }
.issue.info .lv { background: var(--jin); }
/* 校对、批注、剧本这几页顶上的一句话：这一页是干什么的 */
.tab-intro { margin: 0 0 12px; padding: 8px 12px; border-radius: 7px; background: var(--paper-2); font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }
.tab-intro b { color: var(--ink); font-weight: 600; }
.tab-intro small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
/* 剧本页：每一块可以折起来 */
.cmp-fold { margin-bottom: 8px; }
.cmp-fold > summary { cursor: pointer; list-style: none; padding: 6px 0; font: 13px var(--kai); color: var(--ink-2); letter-spacing: .3em; }
.cmp-fold > summary::-webkit-details-marker { display: none; }
.cmp-fold > summary::before { content: '▸'; margin-right: 6px; font: 11px var(--sans); color: var(--ink-4); letter-spacing: 0; }
.cmp-fold[open] > summary::before { content: '▾'; }
.cmp-fold > summary em { margin-left: 8px; font: normal 11px var(--sans); color: var(--ink-4); letter-spacing: 0; }
.cmp-box { padding: 10px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); font: 13.5px/1.9 var(--serif); word-break: break-word; }
.cmp-box p + p { margin-top: 2px; }
.cmp-box b { font-family: var(--kai); font-weight: 400; color: var(--qing); }
.cmp-box .say { padding-left: 1em; color: #23663f; }
.cmp-box .on { color: var(--ink); font-weight: 600; }
.cmp-box .off { color: var(--ink-4); }
.cmp-box .sc-title { font: 600 15px/1.7 var(--serif); color: var(--ink); }
.cmp-box .sc-meta { font-size: 13px; line-height: 1.8; color: var(--ink-2); }
.cmp-box .sc-h { margin-top: 8px; font: 12.5px var(--kai); letter-spacing: .3em; color: var(--ink-3); }
.cmp-box.long { max-height: 320px; overflow: auto; font: 12.5px/1.8 var(--sans); white-space: pre-wrap; }

/* @ 选资产 */
.at-pop { position: fixed; z-index: 50; width: 320px; max-height: 330px; overflow: auto; padding: 5px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--line-2); box-shadow: 0 18px 50px -12px rgba(30, 28, 24, .38); }
.at-h { padding: 4px 8px 2px; font: 11.5px var(--kai); color: var(--ink-3); letter-spacing: .25em; }
.at-i { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
.at-i.on { background: var(--qing-soft); box-shadow: inset 0 0 0 1px var(--qing-line); }
.at-i img, .at-i .ph { width: 40px; height: 40px; flex: none; border-radius: 6px; object-fit: cover; object-position: top; border: 1px solid var(--line); background: var(--paper-2); }
.at-n { flex: 1; min-width: 0; line-height: 1.4; }
.at-n b { display: block; font: 600 13.5px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.at-n span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.at-r { flex: none; font: 600 11.5px var(--sans); color: var(--qing); }
.at-r.new { color: #8f6420; }
.at-f { margin-top: 4px; padding: 5px 8px 3px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-4); }

/* 悬停看图、大图、提示 */
.hov { position: fixed; z-index: 60; width: 260px; padding: 8px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--line-2); box-shadow: 0 18px 50px -12px rgba(30, 28, 24, .38); pointer-events: none; }
.hov img { display: block; width: 100%; max-height: 300px; min-height: 60px; object-fit: contain; border-radius: 6px; background: var(--paper-2); }
.hov-av { padding: 18px 0; text-align: center; border-radius: 6px; background: var(--paper-2); color: var(--ink-3); }
.hov-n { margin-top: 6px; font: 600 13px var(--sans); }
.hov-n b { color: var(--qing); }
.hov-p { font-size: 11.5px; color: var(--ink-3); word-break: break-all; line-height: 1.5; }
.hov-tip { margin-top: 4px; color: var(--qing); }
#toasts { bottom: 64px; }   /* 提示条（公用/提示条.css）抬到底下那条写稿提示栏上面 */
/* 左下角：AI 正在做的任务 */
#jobs { position: fixed; left: 16px; bottom: 16px; z-index: 80; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.jobrow { pointer-events: auto; display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px 6px 11px; border: 1px solid var(--line-2, #d9cfbd); border-radius: 999px; background: var(--sheet, #fffdf8); box-shadow: 0 4px 14px rgba(30, 28, 24, .12); font-size: 12.5px; color: var(--ink-2, #4a4238); }
.jobrow b { font: 600 12.5px ui-monospace, Consolas, monospace; min-width: 2.6em; }
.jobrow .wt-ring { font-size: 13px; color: var(--dian); }
.jobacts { display: contents; }
@media (max-width: 1040px) {
  .rail { width: 286px; }
  .canvas { padding: 14px 14px 60px; }
  .sheet { padding: 34px 24px 28px; }
  .p-shot { padding: 10px 12px 14px; }
  .as-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-keys, .step small { display: none; }
}
/* >>> 流水线 · 作用 */
.shot-why { margin: 0 0 8px; padding: 4px 12px; border-radius: 0 6px 6px 0; border-left: 2px solid var(--line-2); background: var(--paper); font-size: 12.5px; line-height: 1.75; color: var(--ink-2); white-space: pre-wrap; }
.shot-why b { margin-right: 10px; font: 400 12px var(--kai); color: var(--ink-3); letter-spacing: .24em; }
.p-shot.fold > .shot-why { display: none; }
/* <<< 流水线 · 作用 */

'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const { h, toast, thumbOf, thumbSize, whenSeen } = window.UI;   // 造元素、提示条、缩小图用 公用/界面.js 的，这页不另抄
const ZW = String.fromCharCode(8203);   // 零宽空格：资产名牌排在一行最后时，垫在后面好落光标
const BOM = String.fromCharCode(0xFEFF);   // 有的文件开头带的记号
const plain = el => el.textContent.split(ZW).join('').trim();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const btn = (label, fn, cls) => h('button', { class: 'btn sm ' + (cls || ''), type: 'button', tabindex: '-1', onclick: fn }, label);
const keep = e => e.preventDefault();   // 点按钮时不抢走正文里的光标
function flash(n) { if (!n) return; n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); }
const { two, stampNow, timeOf } = window.Base;   // 时间小工具用 公用/底座.js 的，这页不另抄

/* ---------- 读写真文件：用 公用/底座.js 的（和 项目管理.html、流水线同一套）。这页另要两样：文件夹不在就当空的；读文字原样留着开头的 BOM ---------- */
const { HOME, LINK, CH } = window.Base, HDR = { 'X-Antou': '1' };   // CH：哪几条 AI 通道能用、流水线顶栏「AI 用」选的哪个
const api = (parts, q) => LINK.url(parts) + (q || '');   // 写稿交互.js 存草稿用
const FS = {
  ...window.Base.FS,
  list: parts => window.Base.FS.list(parts).catch(() => []),
  async text(parts) { const r = await window.Base.FS.read(parts); return { text: (Core.hasBom(r.buf) ? BOM : '') + Core.decodeText(r.buf).text, mtime: r.mtime }; },   // 核心.js 的解码（不是 UTF-8 的照 GB18030 读）

  paintSteps(); setGuide(null); paintTabs();
  let open = [];
  try { open = decodeURIComponent((/[#&]open=([^&]*)/.exec(location.hash) || [])[1] || '').split('/').filter(Boolean); } catch (e) { /* 网址不对 */ }
  if (open.length < 3 || !(Core.RE_VP.test(open[open.length - 1]) || open[open.length - 1] === Core.PF_FILE)) {   // 网址里没写开哪一份：自己去找铺好底的稿，只有一份就直接开
    let list;
    try { list = await findDrafts(); } catch (e) { return fail('本机服务连不上：' + e.message); }
    if (list.length === 1) { location.hash = 'open=' + list[0].map(encodeURIComponent).join('/'); return; }   // 网址一变，页面自己重开
    return chooser(list);
  }
  setOpen(open);
  if (FreeDraft.is()) FreeDraft.init();   // 先写提示词的段的自由稿（公用/写稿自由稿.js）
  try {
    const r = await FS.text(PROMPT);
    MTIME = r.mtime; DOC = parsePrompt(r.text); LASTTEXT = r.text;
    await loadSide();
    BASE_EDITOR = structuredClone(editorPart(SIDE));
    const draft = readEditorDraft(r.text, SIDE);
    MODE = draft.mode; FREE = draft.free; WHOLE = !!draft.whole; DOC = draft.doc; draftConflict = draft.conflict;
    ASSETS = await scanAssets(); A = Object.fromEntries(ASSETS.map(a => [a.path, a]));
    await loadRefs();
    await loadFlow();
    for (const a of ASSETS) if (a.cat === AssetPath.CP && a.type === '图片' && AssetPath.rowKind(FLOW_ALL, a.path) === '人物') a.kind = 'person';   // 人物和道具放一起：人物表挂着的是人物
    for (const f of FLOW && Array.isArray(FLOW.关键帧) ? FLOW.关键帧 : []) if (A[f] && A[f].type === '图片') A[f].kind = 'frame';   // 流水线资产那一步「关键帧」一块里挑的（名字不带首帧尾帧的也算）
    DOC = hydrateShots(DOC, SIDE.镜头信息, !SIDE.写法);
  } catch (e) { return fail(e.message); }
  render(); READY = true;
  setStatus(savedText()); setAsk(); paintMarks(); showRail('assets'); paintScript(); Finish.init();
  $('#tip').hidden = true;
  $('#railBtn').textContent = document.body.classList.contains('norail') ? '展开侧栏' : '收起侧栏';
  if (!await Filmed.init()) await offerRecovery();   // 出过片的整页锁着、不恢复草稿（公用/写稿出过片.js）：另存成新的一版以后在那边恢复
  if (draftConflict) reportConflict('文件和分镜草稿有不同的修改，请核对后保存');
  await loadNotes();
  await loadHNotes();
  setInterval(poll, 2500);
  resumeJobs();
  if (window.RefPic) RefPic.watch(ref => { const a = assetOfRef(ref); return a && a.type === '图片' ? { tip: ref + ' · ' + a.name + '　点开看大图', open: () => viewAsset(a, NUM.图片.map(p => A[p]).filter(Boolean)) } : null; }, '.wr, .at-pop');   // 侧栏、批注里的 @图片N 也能点开看大图（公用/点图.js，摆在稿子旁边）；文字框里照旧
}
addEventListener('hashchange', () => location.reload());
boot();
</script>
<script src="公用/找旧版.js"></script>
<script src="公用/历史记录.js"></script>
<script src="公用/写稿参考.js"></script>
</body>
</html>
