appId: online.video8.liushuixian.desktop
productName: AI短视频流水线
# 程序文件用英文名：命令行、杀毒、日志里都好认
executableName: Liushuixian
directories:
  output: release
files:
  - main.js
  - preload.js
  - lib/**/*
  - 外框/**/*
  - package.json
extraResources:
  # 流水线的工具文件（scripts/pack.mjs 照 git 登记的挑出来）：启动时同步进工作文件夹
  - from: build/tools
    to: tools
    filter:
      - "**/*"
  # 跑本机服务用的 Node：换的电脑没装 Node 也能开
  - from: build/node
    to: node
    filter:
      - node.exe
asar: true
win:
  target:
    - nsis
  # 带版本号、不带空格：和 new-video8-8 一样，更新源上每个包都不可变
  artifactName: Liushuixian-${version}-${arch}.${ext}
nsis:
  # 安装、升级时的窗口固定用中文：不写的话跟着系统语言走，系统是英文界面的电脑上是一屏英文（11-24 试升级时看到）
  installerLanguages:
    - zh_CN
  language: "2052"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AI短视频流水线
publish:
  provider: generic
  # 直接连服务器的 IP、不加密（2026-11-26 用户定，和 main.js 的 API 一个道理）：所以升级包都签名，软件验过才装（lib/updater.js）
  # 服务器上是 /home/video8deploy/public/desktop-updates/liushuixian/win（网站根目录里的 desktop-updates 链到 public 下面），发版：pack.mjs publish
  url: http://43.143.83.166/desktop-updates/liushuixian/win
  # 写进 app-update.yml：有它 electron-updater 才验下好的升级包（怎么验在 lib/updater.js：验我们自己的签名，不是 Windows 证书，exe 本身不签）
  publisherName:
    - AI短视频流水线
