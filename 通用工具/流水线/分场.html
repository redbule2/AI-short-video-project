<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 段落</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
<style>
/* 段落的批注（朱笔）、AI 照批注改过的地方（红批）：只这一页用，样式就放在这里 */
.pz-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; }
.pz-bar .sp { flex: 1; }
.pz-exp { margin: 0 0 4px; font: 15px/1.8 var(--serif); white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
.pz-all { margin: 0 0 14px; }
.pz-all .fl-ta { min-height: 54px; }
.wf-fab .btn[hidden] { display: none; }
.wf-fab .btn.ghost { background: rgba(255, 253, 249, .97); }
.pz-all .fl-ta, .fq-note .fq-in { border-color: var(--zhu-line); background: #fffaf7; color: var(--zhu); font-family: var(--kai); }
.fq-note > span { color: var(--zhu); }
.fq-note[hidden] { display: none; }
.fq.chg { border-left: 3px solid var(--zhu-line); }
.fq-was { margin: 6px 0 0 92px; font-size: 12.5px; line-height: 1.7; color: var(--zhu); }
.fq-was del { color: var(--ink-3); text-decoration-color: var(--zhu); }
.pz-warn { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--zhu-line); border-radius: 9px; background: var(--zhu-soft); font-size: 13.5px; line-height: 1.8; }
.pz-warn .btn { margin: 8px 8px 0 0; }
</style>
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="流水线.js"></script>
<script>
/* ============================================================
   流水线 · 段落（一场的第二步：工序二的后一半。页面文件还叫 分场.html）
   2026-11-16 他定：剧本在段落前面。剧本定稿以后，AI 照定稿的剧本把这一场分成几个段落（每段写什么、起什么作用）；
   分好你可以直接改，也可以在段落下面写批注、点「交给 AI 照批注改」。改好点「定下来」，下一步是资产。
   AI 分好、改好的写在 定稿的剧本/第N段/第N段_段落.json（页面只读），流水线.js 看到新的一版就搬进这一场的「段落」；
   批注交给 AI 时存成旁边的 第N段_段落_批注.md，AI 改完收进历史记录。
   这一场的名字、出场的、表达什么在「剧本」那一步写。共用的东西（读写流水线.json、顶栏、步骤条、小部件）在 流水线.js。
   ============================================================ */
'use strict';
const swapCard = () => rerender();
const OPEN = new WeakSet();   // 这一回点开了「批注」的段落（写了字的一直开着）
const notesOf = s => s.段落.map((x, i) => ({ i, t: str(x.批注).trim() })).filter(x => x.t);
const noteCount = s => notesOf(s).length + (str(s.段落总批).trim() ? 1 : 0);
const busyJob = s => { const p = paraState(s); return p.st === 'ai' ? p.job : null; };

/* ---------- 交给 AI：照定稿的剧本分段落；照你的批注改 ---------- */
async function split(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能让 AI 分段落', 'err'); return; }
  if (hasParas(s) && !(await confirmDlg({ title: '让 AI 重新分段', body: 'AI 照定稿的剧本重新分。现在这几段' + (noteCount(s) ? '和写的批注' : '') + '都换成 AI 新分的（换之前流水线留一版在历史记录）。', ok: '重新分' }))) return;
  if (s.定稿) { s.定稿 = ''; touch(); }
  await startJob({ 事: '分段落', 段: s.段 });
  rerender();
}
/* 批注写成一份（哪一段、原文、批注），存在 第N段_段落.json 旁边，AI 照着改 */
function notesMd(s) {
  const out = ['# ' + segName(s.段) + ' 段落批注', '', '文件：定稿的剧本/' + segName(s.段) + '/' + segName(s.段) + '_段落.json（流水线第' + s.段 + '场的段落，以流水线里现在这一版为准）', '时间：' + nowText()];
  const all = str(s.段落总批).trim();
  if (all) out.push('', '## 整体', all);
  for (const { i, t } of notesOf(s)) { const x = s.段落[i]; out.push('', '## 段落' + (i + 1), '原文：写什么：' + (x.写什么.trim() || '（空）') + '　作用：' + (x.作用.trim() || '（空）'), '批注：' + t); }
  return out.join('\n') + '\n';
}
async function fixByNotes(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能交给 AI 改', 'err'); return; }
  if (!noteCount(s)) { toast('还没写批注：在一段的右上角点笔，写这一段要怎么改', 'err'); return; }
  await flush();
  if (F.err) return;
  try { await FS.write(at([F.name, '定稿的剧本', segName(s.段), segName(s.段) + '_段落_批注.md']), C.encodeText(notesMd(s))); }
  catch (e) { toast('批注没存上：' + e.message, 'err'); return; }
  await startJob({ 事: '段落按批注改', 段: s.段 });
  rerender();
}

/* ---------- 还没定下来：能改、能写批注 ---------- */
function editCard(s) {
  const seg = s.段, job = busyJob(s), has = hasParas(s);
  const rows = h('div', { class: 'fq-list' }), miss = h('div', { class: 'wf-fab-note' }), cnt = h('em');
  const doneBtn = h('button', { class: 'btn ink', type: 'button', title: '段落改好了就点。下一步是资产', onclick: () => finalize(s) }, icon('check'), '定下来');
  const fixBtn = h('button', { class: 'btn ink', type: 'button', title: '把写的批注交给 AI：只改批注说到的地方', onclick: () => fixByNotes(s) });   // 写了批注才露出来，和「定下来」摆在一起
  const foot = () => {
    const m = missing(s), n = noteCount(s);
    miss.textContent = m.length ? '还差：' + m.map(shortNos).join('；') : n ? '还有 ' + n + ' 条批注没交给 AI' : '都写了，可以定下来。';
    miss.classList.toggle('todo', m.length > 0 || n > 0);
    cnt.textContent = s.段落.length ? s.段落.length + ' 段' : '';
    fixBtn.textContent = '交给 AI 照批注改（' + n + ' 条）';
    fixBtn.hidden = !n;
    doneBtn.classList.toggle('ghost', n > 0);   // 有批注：先交给 AI，定下来退成次要的
  };
  const bad = jobFailed('分段落', seg) || jobFailed('段落按批注改', seg);
  const bar = h('div', { class: 'pz-bar' }, ...(job ? [jobLine(job), h('span', { class: 'fn-note' }, job.事 === '分段落' ? 'AI 照定稿的剧本在分，分好这里自动出现。' : 'AI 照你的批注在改，改好这里自动换上，改过的那几段标红。')]
    : !has ? [bad, h('span', { class: 'fn-note' }, '剧本定稿了。让 AI 照剧本把这一场分成几个段落：每段写什么、起什么作用。分好以后你可以直接改，也可以写批注交给 AI 改。'), h('span', { class: 'sp' }),
      h('button', { class: 'btn sm ink', type: 'button', onclick: () => split(s) }, '让 AI 分段落')]
    : [bad, h('span', { class: 'fn-note' }, '直接在下面改；或者点一段右上角的笔写批注，写完交给 AI 照批注改。'), h('span', { class: 'sp' }),
      h('button', { class: 'btn sm ghost', type: 'button', title: 'AI 照定稿的剧本重新分，现在的段落换掉', onclick: () => split(s) }, '让 AI 重新分段')]).filter(Boolean));
  /* 整体批注：对这几段整体的意见 */
  const all = h('textarea', { class: 'fl-ta sm', spellcheck: 'false', 'data-f': '总批', placeholder: '对这几段整体的意见，写给 AI（比如：分得太碎，第3段和第4段该并成一段）。没有就空着' });
  all.value = str(s.段落总批);
  all.addEventListener('input', () => { s.段落总批 = all.value; fit(all); touch(); foot(); });
  const focusAt = (i, key) => { const x = rows.querySelector(`.fq[data-i="${i}"] [data-f="${key}"]`); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } };
  const paint = () => { rows.replaceChildren(...s.段落.map((_, i) => shotRow(i))); foot(); fitAll(); };
  const unfoldShots = () => { for (const k of [...FOLD.set]) if (k.startsWith(seg + '/段落')) setFold(k, false); };   // 段数、顺序一变，哪段收着就对不上了：都展开
  const addShot = (i = s.段落.length) => { s.段落.splice(i, 0, { 写什么: '', 作用: '' }); unfoldShots(); touch(); paint(); focusAt(i, '写什么'); };
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= s.段落.length) return; [s.段落[i], s.段落[j]] = [s.段落[j], s.段落[i]]; unfoldShots(); touch(); paint(); };
  const del = async i => {
    const x = s.段落[i];
    if ((x.写什么.trim() || x.作用.trim()) && !(await confirmDlg({ title: '删掉段落 ' + (i + 1), body: '「' + (x.写什么.trim() || x.作用.trim()) + '」这一段删掉，后面的往前排。', ok: '删掉', danger: true }))) return;
    s.段落.splice(s.段落.indexOf(x), 1); unfoldShots(); touch(); paint();
  };
  /* 一个段落：写什么、起什么作用，下面可以写批注；AI 照批注改过的，标出原来是什么。写好了可以收成一行 */
  function shotRow(i) {
    const sh = s.段落[i];
    const mk = (key, ph) => {
      const what = key === '写什么';
      const ta = h('textarea', { class: 'fq-in ' + (what ? 'what' : 'why'), rows: what ? '1' : '3', spellcheck: 'false', placeholder: ph, 'data-f': key });
      ta.value = str(sh[key]);
      ta.addEventListener('input', () => {
        if (what && /[\r\n]/.test(ta.value)) ta.value = ta.value.replace(/\s*[\r\n]+\s*/g, '');   // 写什么只有一行
        sh[key] = ta.value; fit(ta); touch(); foot();
      });
      ta.addEventListener('keydown', e => {   // 写什么里回车：到下面的作用。作用里回车照常换行，Ctrl+回车到下一段（最后一段就加一段）
        if (e.key !== 'Enter' || isComposing(e) || key === '批注') return;
        const idx = s.段落.indexOf(sh);
        if (what) { e.preventDefault(); focusAt(idx, '作用'); }
        else if (e.ctrlKey || e.metaKey) { e.preventDefault(); if (idx < s.段落.length - 1) focusAt(idx + 1, '写什么'); else addShot(); }
      });
      return ta;
    };
    const note = h('label', { class: 'fq-f fq-note' }, h('span', null, '批注'), mk('批注', '这一段要怎么改，写给 AI。比如：作用没写到点上，这一段是让观众知道他已经没钱了'));
    note.hidden = !(str(sh.批注).trim() || OPEN.has(sh));
    const body = h('div', null,
      h('label', { class: 'fq-f' }, h('span', null, '写什么'), mk('写什么', '这一段写什么，一句话')),
      sh.AI改 ? h('p', { class: 'fq-was', title: 'AI 照批注改过这一段，定下来以后不再标' }, ...(sh.AI改 === '（新加的一段）' ? ['AI 新加的一段'] : ['AI 改过，原来是：', h('del', null, sh.AI改)])) : null,
      h('label', { class: 'fq-f' }, h('span', null, '起什么作用'), mk('作用', '为什么要有这一段：它让观众看到什么、明白什么。')),
      note);
    const tog = folder(seg + '/段落' + i, body, () => (sh.写什么.trim() || '还空着') + (sh.作用.trim() ? ' —— ' + sh.作用 : '') + (str(sh.批注).trim() ? '　〔批注〕' + sh.批注 : ''), () => focusAt(i, '写什么'));
    const pen = ibtn('pen', '写批注：这一段要怎么改，交给 AI', () => { OPEN.add(sh); if (body.classList.contains('fold')) { setFold(seg + '/段落' + i, false); paint(); } const n = rows.querySelector(`.fq[data-i="${s.段落.indexOf(sh)}"] .fq-note`); if (n) { n.hidden = false; n.querySelector('textarea').focus(); } });
    return h('div', { class: 'fq' + (sh.AI改 ? ' chg' : ''), 'data-i': i },
      h('div', { class: 'fq-h' }, h('span', { class: 'fq-no' }, '段落 ' + (i + 1)), h('span', { class: 'ln' }), tog,
        h('div', { class: 'fq-acts' }, pen, ibtn('up', '往前挪', () => move(i, -1), i === 0), ibtn('down', '往后挪', () => move(i, 1), i === s.段落.length - 1), ibtn('x', '删掉这一段', () => del(i)))),
      body);
  }
  const foldAll = on => { s.段落.forEach((_, i) => setFold(seg + '/段落' + i, on)); paint(); };
  const el = h('section', { class: 'fl-scene', 'data-seg': seg },
    h('div', { class: 'fs-h' }, h('span', { class: 'fs-no' }, '第' + seg + '场'), h('div', { class: 'fs-title' }, s.名.trim() || h('span', { class: 'faint' }, '没起名')),
      h('span', { class: 'fs-state' }, job ? 'AI 在做' : has ? '还在改' : '还没分')),
    s.表达.trim() ? [h('div', { class: 'fs-lab' }, '这一场主要表达', h('em', null, '在剧本那一步改')), h('p', { class: 'pz-exp' }, s.表达.trim())] : null,
    h('div', { class: 'fs-lab' }, '段落', cnt, h('em', null, '照定稿的剧本分：一段一件事，写什么、起什么作用。镜头到写提示词的时候再设计'), h('span', { class: 'sp' }),
      has && !job ? [h('button', { class: 'fl-fold', type: 'button', tabindex: '-1', title: '几段都收成一行', onclick: () => foldAll(true) }, '都收起'),
        h('button', { class: 'fl-fold', type: 'button', tabindex: '-1', onclick: () => foldAll(false) }, '都展开')] : null),
    bar,
    job ? paraList(s) : [
      has ? h('div', { class: 'pz-all' }, h('div', { class: 'fs-lab', style: 'margin-top:0' }, '整体批注', h('em', null, '可以不写')), all) : null,
      rows,
      h('button', { class: 'fl-add', type: 'button', onclick: () => addShot() }, has ? '＋ 加一段' : '＋ 自己写一段')],
    /* 「定下来」悬在右下角，页面多长都看得见（2026-11-13 他要的）；上面一行小字说还差什么 */
    !job && has ? h('div', { class: 'wf-fab' }, miss, fixBtn, doneBtn) : null);
  if (!job) paint();
  return el;
}

async function finalize(s) {
  const before = s.段落.length;
  s.段落 = s.段落.filter(x => x.写什么.trim() || x.作用.trim() || str(x.批注).trim());   // 整条空着的不算
  if (s.段落.length !== before) touch();
  if (!s.段落.some(x => x.写什么.trim())) { swapCard(s); toast('至少要有一段写了「写什么」，才能定下来', 'err'); return; }
  const n = noteCount(s);
  if (n && !(await confirmDlg({ title: '批注还没交给 AI', body: '还有 ' + n + ' 条批注没交给 AI 改。就这样定下来，这些批注清掉。', ok: '就这样定', cancel: '回去' }))) { swapCard(s); return; }
  const m = missing(s);
  if (m.length && !(await confirmDlg({ title: '就这样定下来？', body: '还差：' + m.map(shortNos).join('；') + '。', ok: '就这样定', cancel: '回去补' }))) { swapCard(s); return; }
  for (const x of s.段落) { delete x.AI改; delete x.批注; }   // 红批、批注到这里为止
  s.段落总批 = '';
  s.定稿 = nowText(); touch();
  await flush();
  if (!F.err) FS.write(at([F.name, '历史记录', '定稿的剧本', '流水线__' + stampNow() + '.json']), C.encodeText(F.text)).catch(() => {});   // 每定一场留一版
  await loadSides();
  rerender(0);
  toast('第' + s.段 + '场的段落定下来了。下一步：资产');
}

/* ---------- 定下来以后：只看不改；剧本后来重新定稿了，要你看一眼（待核对） ---------- */
function doneView(s) {
  const seg = s.段, stale = paraStale(s);
  return h('section', { class: 'fl-scene done', 'data-seg': seg },
    h('div', { class: 'fs-h' }, h('span', { class: 'fs-no' }, '第' + seg + '场'), h('div', { class: 'fs-title' }, s.名.trim() || h('span', { class: 'faint' }, '没起名')),
      h('span', { class: 'fs-state ok', title: '定下来的时间：' + s.定稿 }, icon('check'), '定了 ' + s.定稿.slice(5, 16)),
      h('button', { class: 'btn ghost sm', title: '回到能改、能写批注的样子', onclick: () => { s.定稿 = ''; touch(); swapCard(s); } }, '再改')),
    stale ? h('div', { class: 'pz-warn' }, '剧本后来重新定稿了，这几段是照以前的剧本分的。看一眼：还对得上，点「照旧」；对不上，让 AI 照新剧本重新分。',
      h('div', null, h('button', { class: 'btn sm', type: 'button', title: '段落不用改，照旧定下来', onclick: () => { s.定稿 = nowText(); touch(); swapCard(s); } }, '照旧'),
        h('button', { class: 'btn sm ink', type: 'button', onclick: () => split(s) }, '让 AI 照新剧本重新分'))) : null,
    s.表达.trim() ? h('dl', { class: 'fs-info' }, h('dt', null, '表达'), h('dd', null, s.表达.trim())) : null,
    paraList(s),
    h('div', { class: 'wf-foot' }, h('span', { class: 'fn-note' }, '段落定下来了。下一步：资产。')),
    h('div', { class: 'wf-fab' }, h('button', { class: 'btn ink', type: 'button', onclick: () => go('资产', { s: seg }) }, '下一步：资产 →')));   // 和「定下来」在同一个地方
}
/* 剧本还没定稿：先去写剧本。以前就有段落的（老项目、剧本定稿以后又改过），照旧摆出来看 */
function lockView(s) {
  return [h('div', { class: 'wf-lock' }, '剧本定稿以后，AI 照剧本分段落。先到「剧本」那一步写好剧本、点「剧本定稿」。', h('button', { class: 'btn ink', onclick: () => go('剧本', { s: s.段 }) }, '← 去写剧本')),
    hasParas(s) ? h('section', { class: 'fl-scene done' }, h('div', { class: 'fs-lab', style: 'margin-top:0' }, '现在的段落', h('em', null, '剧本定稿以后再看要不要重新分')), paraList(s)) : null];
}
/* 「段落 1、2、3、4、7 没写作用」缩成「段落 1～4、7 没写作用」：十几段都没写时，悬着的那行小字别太长 */
function shortNos(t) {
  return t.replace(/[0-9]+(?:、[0-9]+)+/g, list => {
    const n = list.split('、').map(Number), out = [];
    for (let i = 0; i < n.length; i++) { let j = i; while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++; out.push(j - i >= 2 ? n[i] + '～' + n[j] : n.slice(i, j + 1).join('、')); i = j; }
    return out.join('、');
  });
}

start({
  name: '分场', title: '段落', scene: true,
  render() {
    const s = sceneNow(), p = paraState(s);
    if (p.st === 'lock') return lockView(s);
    return s.定稿 && p.st !== 'ai' ? doneView(s) : editCard(s);
  },
  sides(changed) { const s = sceneNow(); if (s && changed.has(s.段) && !typing()) rerender(); },   // AI 分好、改好的段落搬进来了：整页重画
  jobDone() { if (!typing()) rerender(); },
});
</script>
</body>
</html>
