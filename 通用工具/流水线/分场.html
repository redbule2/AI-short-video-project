<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 提炼</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
<style>
/* 提炼页（11-16 改版，照 提炼页改版_设计稿.html）：顶上一条钉住（段名、要按的、三个页签），下面一次只摆一页：镜头表 / 出场的 / 梗概。只这一页用，样式就放在这里 */
.pz-head { position: sticky; top: 117px; z-index: 18; margin: -18px -22px 14px; padding: 12px 22px 0; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; background: var(--sheet); }
.fl-scene.done .pz-head { background: #fcf9f3; }
.pz-head.stuck { border-radius: 0; box-shadow: 0 12px 18px -16px rgba(40, 28, 16, .4); }
.pz-head .fs-h { flex-wrap: wrap; row-gap: 6px; margin-bottom: 2px; }
.pz-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.pz-all { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.pz-all.on { color: var(--zhu); text-decoration-color: var(--zhu-line); font-family: var(--kai); font-size: 13.5px; }
.pz-note { align-self: center; padding-bottom: 4px; font-size: 12.5px; color: var(--dai); }
.pz-note.todo { color: var(--zhu); }
.pz-hint { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-3); }
.pz-under { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; }
.pz-warn { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--zhu-line); border-radius: 9px; background: var(--zhu-soft); font-size: 13.5px; line-height: 1.8; }
.pz-warn .btn { margin: 8px 8px 0 0; }
.miss { color: var(--zhu); }
.pz-nt { display: block; margin-top: 2px; font: 13.5px/1.7 var(--kai); color: var(--zhu); white-space: pre-wrap; word-break: break-word; }
.pz-ct .fq-was { margin: 4px 0 0; }
.fq-was { font-size: 12.5px; line-height: 1.7; color: var(--zhu); }
.fq-was del { color: var(--ink-3); text-decoration-color: var(--zhu); }
/* 改的格子：写什么一行，作用、描写几行，批注朱笔 */
.pz-f { display: block; margin: 0 0 8px; cursor: text; }
.pz-f > span { display: block; margin: 0 0 2px; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .1em; }
.pz-f .fq-in { padding: 6px 12px; font-size: 15.5px; line-height: 1.85; }
.pz-f .fq-in.what { min-height: 0; }
.pz-f .fq-in.why { min-height: 76px; }
.pz-f .fq-in.nt { min-height: 0; }
.pz-f.z > span { color: var(--zhu); }
.pz-f.z .fq-in { border-color: var(--zhu-line); background: #fffaf7; color: var(--zhu); font-family: var(--kai); }
.pz-ops { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 2px; }
.pz-ops .sp { flex: 1; }
.fl-link.danger { color: var(--zhu); text-decoration-color: var(--zhu-line); }
/* 镜头表：一镜一格，一屏摆下（11-16 他定：宽的一镜一行像表格，窄的两行的格子；几栏、哪种由 shotGrid 量了定，公用/镜头作用.js 的 grid）；点一格，改的那一块浮在上面 */
.pz-tbw { position: relative; }
.pz-tb { display: grid; grid-auto-columns: minmax(0, 1fr); gap: 6px 12px; }   /* 没量之前一栏往下排；量完 shotGrid 改成竖着排几栏、定行距栏距 */
.pz-r { position: relative; display: grid; grid-template-columns: 16px 38px minmax(0, 1fr) auto 26px; gap: 2px; align-items: center; min-width: 0; padding: 0 2px 0 0; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; outline: 0; transition: border-color .12s; }
.pz-r:hover { border-color: var(--ink-4); }
.pz-r:focus-visible { border-color: var(--dai-line); box-shadow: 0 0 0 3px var(--dai-soft); }
.pz-g { color: var(--ink-4); letter-spacing: -2px; text-align: center; cursor: grab; touch-action: none; user-select: none; opacity: .5; }
.pz-r:hover .pz-g { opacity: 1; }
.pz-no { font: 15.5px/1.4 var(--kai); color: var(--dai); white-space: nowrap; }
.pz-tx { display: flex; flex-direction: column; min-width: 0; }
.pz-tx > b, .pz-tx > small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pz-tx > b { font: 600 15.5px/1.5 var(--serif); letter-spacing: .02em; color: var(--ink); }
.pz-tx > small { font-size: 13.5px; line-height: 1.5; color: var(--ink-3); }
.pz-tb.t .pz-r { grid-template-columns: 16px 38px minmax(0, max-content) auto minmax(26px, 1fr); }   /* 一镜一行：写什么、作用、秒数挨着排成三列，上下对齐；「…」靠右 */
.pz-tb.t.ro .pz-r { grid-template-columns: 36px minmax(0, max-content) auto 1fr; }
.pz-tb.t .pz-tx { display: grid; grid-template-columns: minmax(0, var(--pzw, 14em)) minmax(0, var(--pzy, 20em)); column-gap: 18px; align-items: baseline; }   /* 两列的宽照这一段最长的那句 */
.pz-tb.t .pz-more { justify-self: end; }
.pz-r .pz-more { width: 24px; height: 24px; opacity: .35; }
.pz-r:hover .pz-more { opacity: 1; }
.pz-r.note::after, .pz-c.note::after { content: ''; position: absolute; right: -1px; top: -1px; border: 6px solid transparent; border-top-color: var(--zhu); border-right-color: var(--zhu); border-top-right-radius: 7px; }
.pz-r.chg { box-shadow: inset 3px 0 0 var(--zhu-line); }
.pz-r.on { border-color: var(--dai); box-shadow: 0 0 0 3px var(--dai-soft); }
.pz-tb.dragging, .pz-tb.dragging * { cursor: grabbing !important; user-select: none; }
.pz-r.drag { z-index: 2; border-color: var(--dai); background: #fff; box-shadow: 0 10px 24px -10px rgba(40, 28, 16, .45); }
.pz-tb.ro .pz-r { grid-template-columns: 36px minmax(0, 1fr) auto; padding-left: 8px; }
/* 每镜的秒数；鼠标停着（或点开）的那一镜是选中的，只它一个；作用里接镜N、为镜N 连着的那几镜虚线框，色带上画箭头（11-16 他说点镜1 像同时选中了 1 和 4，不能有歧义） */
.pz-sec { padding: 0 4px 0 8px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.pz-sec.miss { color: var(--ink-4); }
.pz-sec.mine { color: var(--dai); }
.pz-r.hot { border-color: var(--ink-3); background: #fff8e4; }
.pz-r.hot .pz-no { color: var(--zhu); }
.pz-r.lnk { border-style: dashed; border-color: var(--dai); }
/* 镜头表顶上的色带：一块一镜，宽窄照秒数、颜色照标签；每 15 秒一道红虚线（一条视频一般 15 秒） */
.sw-sum { margin: 0 0 4px; font-size: 12.5px; color: var(--ink-3); }
.sw-say { float: right; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-4); }
.sw-say.on { color: var(--zhu); }
.sw-sum b { font-weight: 600; color: var(--ink-2); }
.sw-bar { position: relative; display: flex; height: 28px; margin: 20px 0 18px; }   /* 上面空出一条画箭头 */
.sw-b { display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 0; overflow: hidden; border-right: 2px solid var(--paper); background: var(--paper-2); color: var(--ink-3); font-size: 12px; white-space: nowrap; cursor: pointer; }
.sw-b:first-child { border-radius: 5px 0 0 5px; }
.sw-b:last-of-type { border-right: 0; border-radius: 0 5px 5px 0; }
.sw-b em { font-style: normal; opacity: .75; }
.sw-b.hot { box-shadow: inset 0 0 0 2px var(--ink); font-weight: 600; color: var(--ink); }
.sw-arcs { position: absolute; left: 0; top: -20px; width: 100%; height: 20px; overflow: visible; pointer-events: none; }
.sw-arcs path { fill: none; stroke: var(--zhu); stroke-width: 1.5; }
.sw-arcs marker path { fill: var(--zhu); stroke: none; }
.sw-m { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--zhu); pointer-events: none; }
.sw-m span { position: absolute; top: 100%; left: -2px; padding-top: 1px; font-size: 11px; line-height: 1.4; color: var(--zhu); white-space: nowrap; }
/* 改的那一块：作用前面的六个标签点一下换上；作用数着字；秒数 */
.pz-f > span .pz-cnt { float: right; letter-spacing: 0; font: 12px var(--sans); color: var(--ink-4); }
.pz-f > span .pz-cnt.over { color: var(--zhu); }
.pz-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 5px; }
.pz-tags button { border: 0; cursor: pointer; opacity: .4; filter: saturate(.3); }
.pz-tags button:hover { opacity: .8; filter: none; }
.pz-tags button.on { opacity: 1; filter: none; outline: 2px solid var(--ink-3); outline-offset: 1px; }
.pz-secf { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
.pz-secf > span { font: 13px var(--kai); color: var(--ink-3); letter-spacing: .1em; }
.pz-secf input { width: 72px; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 7px; background: #fff; font: 15px var(--sans); color: var(--ink); }
.pz-secf input:focus { outline: 0; border-color: var(--dai-line); box-shadow: 0 0 0 3px var(--dai-soft); }
.pz-secf small { font-size: 12.5px; color: var(--ink-3); }
.pz-secf small.mine { color: var(--dai); }
.pz-add { border: 1px dashed var(--line-2); border-radius: 7px; background: none; cursor: pointer; font-size: 13.5px; letter-spacing: .08em; color: var(--ink-3); }
.pz-add:hover { border-color: var(--ink-4); color: var(--ink); background: rgba(255, 253, 249, .7); }
.pz-ed { position: absolute; z-index: 6; padding: 10px 16px 12px; border: 1px solid var(--dai-line); border-radius: 10px; background: #fffefa; box-shadow: 0 22px 48px -16px rgba(40, 28, 16, .5); }
.pz-ed.chg { box-shadow: inset 3px 0 0 var(--zhu-line), 0 22px 48px -16px rgba(40, 28, 16, .5); }
.pz-ed-h { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.pz-ed-h .sp { flex: 1; }
.pz-ed .fq-was { margin: -4px 0 8px; }
.pz-ed.ro > b { display: block; font: 600 15.5px/1.7 var(--serif); }
.pz-ed.ro > p { margin: 4px 0 0; font-size: 14px; line-height: 1.85; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.wf-main { padding-bottom: 24px; }   /* 这一页没有悬在右下角的按钮：底下不用留那么高 */
.pz-menu { display: flex; flex-direction: column; padding: 6px; }
.pz-menu button { padding: 7px 14px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; font: 14px var(--sans); color: var(--ink); white-space: nowrap; }
.pz-menu button:hover { background: var(--paper-2); }
.pz-menu button.danger { color: var(--zhu); }
.fl-pop:has(.pz-menu) { width: auto; }
/* 出场的：人物、场景、道具三组，一样一张小卡，点卡在原地改 */
.pz-grp { margin: 0 0 18px; }
.pz-gh { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; padding-left: 9px; border-left: 4px solid var(--k); font: 600 15px var(--serif); letter-spacing: .14em; color: var(--k); }
.pz-gh em { font: normal 12px var(--sans); letter-spacing: 0; color: var(--ink-3); }
.pz-gh em.miss { color: var(--zhu); }
.pz-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.pz-c { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; min-width: 0; padding: 9px 26px 9px 9px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--sheet); cursor: pointer; text-align: left; font: inherit; color: inherit; outline: 0; scroll-margin: 230px 0 40px; }
.pz-c:hover { border-color: var(--k-line, var(--ink-4)); }
.pz-c:focus-visible { box-shadow: 0 0 0 3px var(--dai-soft); border-color: var(--dai-line); }
.pz-im { width: 46px; height: 46px; display: grid; place-items: center; overflow: hidden; border-radius: 7px; background: var(--k-soft, var(--paper-2)); font: 18px var(--kai); color: var(--k, var(--ink-3)); }
.pz-im img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.pz-ct { display: block; min-width: 0; }
.pz-ct > b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 600 14.5px/1.5 var(--sans); color: var(--ink); word-break: break-word; }
.pz-ct .ds { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); word-break: break-word; }
.pz-ct small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink-4); }
.pz-ct small.zhu { color: var(--zhu); }
.pz-ct .pz-nt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12.5px; }
.pz-x { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-4); cursor: pointer; opacity: .6; }
.pz-c:hover .pz-x { opacity: 1; }
.pz-x:hover { background: var(--paper-2); color: var(--zhu); }
.pz-x .ic { width: 11px; height: 11px; stroke-width: 2; }
.pz-c.chg { box-shadow: inset 3px 0 0 var(--zhu-line); }
.pz-c.lost { border-style: dashed; }
.pz-c.sug { border-style: dashed; border-color: var(--k-line, var(--line-2)); background: var(--k-soft, transparent); padding-right: 9px; }
.pz-c.sug .ds { color: var(--dai); }
.pz-c.plus { display: grid; place-items: center; grid-template-columns: 1fr; min-height: 66px; padding: 9px; border-style: dashed; background: none; color: var(--ink-3); font-size: 13.5px; letter-spacing: .06em; }
.pz-c.plus:hover { color: var(--ink); background: rgba(255, 253, 249, .7); }
.pz-c.open { grid-column: 1 / -1; grid-template-columns: 64px minmax(0, 1fr); padding: 12px 14px; cursor: default; border-color: var(--dai-line); background: #fffefa; box-shadow: inset 3px 0 0 var(--dai); }
.pz-c.open .pz-im { width: 64px; height: 64px; }
.pz-c.open .pz-ct > b { display: block; margin-bottom: 6px; }
.pz-c.open .pz-ct > b small { display: inline; margin-left: 10px; font-weight: 400; }
.pz-c.ro { cursor: default; padding-right: 9px; }
.pz-c.ro.pic { cursor: pointer; }
.pz-c.ro .ds { -webkit-line-clamp: 4; }
/* 全局、只这一段用（11-17）：一组里分两块，卡上名字后面写用在哪几镜；点开的卡里点镜头号改、点全局改 */
.pz-bin { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 6px; font: 13.5px var(--kai); letter-spacing: .1em; color: var(--ink-2); }
.pz-gh + .pz-bin { margin-top: 0; }
.pz-bin.gl { color: var(--k); }
.pz-bin small { font: 12px var(--sans); letter-spacing: 0; color: var(--ink-3); }
.pz-bin em { font: normal 12px var(--sans); letter-spacing: 0; color: var(--ink-4); }
.pz-sc { margin-left: 7px; font: normal 12px var(--sans); color: var(--k, var(--dai)); white-space: nowrap; }
.pz-sc.none { color: var(--zhu); }
.pz-glb { display: flex; flex-wrap: wrap; gap: 5px; }   /* 用在哪几镜的小牌子是 .fl-shots（流水线.css，和资产页共用） */
.pz-glb button { min-width: 32px; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; cursor: pointer; font: 13px/1.5 var(--sans); color: var(--ink-3); }
.pz-glb button:hover { border-color: var(--ink-4); color: var(--ink); }
.pz-glb button.on { border-color: var(--k, var(--dai)); background: var(--k-soft, var(--dai-soft)); color: var(--k, var(--dai)); font-weight: 600; }
.pz-glb-say { margin: 0; font-size: 13px; color: var(--ink-2); }
.pz-tagai { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; padding: 9px 14px; border: 1px dashed var(--line-2); border-radius: 9px; font-size: 13.5px; color: var(--ink-2); }
/* 梗概 */
.pz-syn { padding: 12px 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--sheet); font: 16px/1.95 var(--serif); white-space: pre-wrap; word-break: break-word; }
.pz-syned.chg { padding-left: 12px; box-shadow: inset 3px 0 0 var(--zhu-line); }
.pz-syned .fq-in.why { min-height: 130px; }
.pz-syn, .pz-syned { max-width: 880px; }   /* 页面放宽了，梗概一行别太长 */
@media (max-width: 1240px) { .pz-head { margin: -16px -16px 12px; padding: 10px 16px 0; } }
</style>
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="../公用/关键帧绑定.js"></script>
<script src="../公用/镜头作用.js"></script>
<script src="../公用/音色.js"></script>
<script src="../公用/文字描写.js"></script>
<script src="../公用/资产改过.js"></script>
<script src="../公用/资产归类.js"></script>
<script src="流水线.js"></script>
<script>
/* ============================================================
   流水线 · 提炼（一场的第二步。页面文件还叫 分场.html）
   2026-11-16 他定：第一步直接写剧本，梗概、人物、场景、道具不先写。剧本定稿以后，AI 照定稿的剧本一次提炼出：
   全片的梗概、这一场出场的人物道具场景（连描写，并进全片设定）、这一场的镜头表（每个镜头写什么、起什么作用）。
   提炼好你可以直接改，也可以写批注、点「交给 AI 照批注改」。改好点「定下来」，下一步是资产。
   AI 提炼的写在 定稿的剧本/第N段/第N段_提炼.json（页面只读），流水线.js 看到新的一版就并进全片设定和这一场；
   批注交给 AI 时存成旁边的 第N段_提炼_批注.md，AI 改完收进历史记录。
   人物、道具的描写和场景那一句是全片通用的：在这里改了，全片设定和别的场跟着变。
   11-16 改版（他看了 提炼页改版_设计稿.html 定的）：镜头表、出场的、梗概分三个页签，一次只看一样，回到上回看的那一页；
   段名、页签、「交给 AI 照批注改」「定下来」钉在顶上；镜头表一镜一行，点开在原地改，按住左边拖着换顺序；
   出场的分人物、场景、道具三组，一样一张小卡，点卡在原地改描写、写批注。数据、AI 那边都没变。
   11-16 晚（他看了 镜头表秒数和作用_设计稿.html 说照推荐的做）：作用写成「标签｜目的，关系」，二十个字以内，标签画成色块；每镜一个预估秒数，
   你改过的 AI 照批注改时不动；镜头表顶上一条色带（宽窄照秒数、每 15 秒一道线）；鼠标停在一镜上，它连着的那几镜亮起来。规矩在 公用/镜头作用.js。
   共用的东西（读写流水线.json、顶栏、步骤条、小部件、并进来的规矩 takeDistill）在 流水线.js。
   ============================================================ */
'use strict';
const swapCard = () => rerender();
const notesOf = s => s.段落.map((x, i) => ({ i, t: str(x.批注).trim() })).filter(x => x.t);
const batOf = s => (s.提炼批 && typeof s.提炼批 === 'object' && !Array.isArray(s.提炼批) ? s.提炼批 : (s.提炼批 = {}));
const markOf = s => (s.提炼改 && typeof s.提炼改 === 'object' && !Array.isArray(s.提炼改) ? s.提炼改 : {});
/* 这一场出场的、能写描写的几样：人物、道具是全片表里的一行，场景是全片场景里的一句（只用文字写的） */
const castItems = s => [...s.人物.map(n => ['人物', n]), ...uniq(s.场景文字).map(t => ['场景', t]), ...s.道具.map(n => ['道具', n])];
const itemKey = (k, id) => k === '梗概' ? '梗概' : distillKey(k, k === '场景' ? sceneLabel(id) : id);
const itemNotes = s => { const b = batOf(s), live = new Set(['梗概', ...castItems(s).map(([k, id]) => itemKey(k, id))]); return Object.entries(b).filter(([k, v]) => live.has(k) && str(v).trim()); };
const noteCount = s => notesOf(s).length + itemNotes(s).length + (str(s.提炼总批).trim() ? 1 : 0);
const busyJob = s => { const p = paraState(s); return p.st === 'ai' ? p.job : null; };
const wasP = (was, what) => h('p', { class: 'fq-was', title: 'AI 改过，定下来以后不再标' }, ...(/^（新加的/.test(was) ? ['AI 新加的' + what] : ['AI 改过，原来是：', h('del', null, was)]));

/* ---------- 这一页记着的：看哪一页（回到上回看的那一页，头一回是镜头表）、点开了哪一镜、哪一样 ---------- */
const TABS = ['镜头表', '出场的', '梗概'];
const OPEN = { shot: null, cast: '' };   // shot：点开的那一镜（镜头表里那一行）；cast：点开的那一样（itemKey）
const tabKey = () => 'antou:flow:pz-tab:' + LINK.root + '/' + F.name;
const tabNow = () => { try { const t = localStorage.getItem(tabKey()); return TABS.includes(t) ? t : TABS[0]; } catch (e) { return TABS[0]; } };
const setTab = t => { try { localStorage.setItem(tabKey(), t); } catch (e) { /* 记不下：下回从镜头表开始 */ } };
const pzPin = () => window.UI.pinUnder(document.querySelector('.pz-head'), document.getElementById('wf-steps'));
window.addEventListener('scroll', pzPin, { passive: true });
window.addEventListener('resize', pzPin);

/* ---------- 交给 AI：照定稿的剧本提炼；照你的批注改 ---------- */
async function distill(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能让 AI 提炼', 'err'); return; }
  if (hasParas(s) && !(await confirmDlg({ title: '让 AI 重新提炼', body: 'AI 照定稿的剧本重新提炼。这一段出场的、镜头表' + (noteCount(s) ? '和写的批注' : '') + '都换成 AI 新提炼的；梗概和人物、道具、场景的描写，AI 会照着现在的改（换之前流水线留一版在历史记录）。', ok: '重新提炼' }))) return;
  if (s.定稿) { s.定稿 = ''; touch(); }
  await flush();   // AI 照流水线里现在的全片设定提炼，先存上
  if (F.err) return;
  await startJob({ 事: '提炼', 段: s.段 });
  rerender();
}
/* 批注写成一份（哪一样、原文、批注），存在 第N段_提炼.json 旁边，AI 照着改 */
function notesMd(s) {
  const out = ['# ' + segName(s.段) + ' 提炼批注', '', '文件：定稿的剧本/' + segName(s.段) + '/' + segName(s.段) + '_提炼.json（流水线第' + s.段 + '段的提炼，以流水线里现在这一版为准）', '时间：' + nowText()];
  const all = str(s.提炼总批).trim(), b = batOf(s);
  if (all) out.push('', '## 整体', all);
  if (str(b.梗概).trim()) out.push('', '## 梗概', '原文：' + (F.doc.梗概.trim() || '（空）'), '批注：' + b.梗概.trim());
  for (const [k, id] of castItems(s)) {
    const t = str(b[itemKey(k, id)]).trim();
    if (!t) continue;
    const e = k === '场景' ? null : entryOf(k, id);
    out.push('', '## ' + k + '「' + (k === '场景' ? sceneLabel(id) : id) + '」', '原文：' + (k === '场景' ? id : (e && e.描写.trim()) || '（没写描写）'), '批注：' + t);
  }
  const nos = shotNos(s);
  for (const { i, t } of notesOf(s)) { const x = s.段落[i]; out.push('', '## 镜头' + nos[i], '原文：写什么：' + (x.写什么.trim() || '（空）') + '　作用：' + (x.作用.trim() || '（空）') + (Why.secOf(x) ? '　秒数：' + Why.secOf(x) + (x.秒数人定 ? '（人定）' : '') : ''), '批注：' + t); }
  return out.join('\n') + '\n';
}
async function fixByNotes(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能交给 AI 改', 'err'); return; }
  if (!noteCount(s)) { toast('还没写批注：点开一镜或一样，在「批注」里写要怎么改', 'err'); return; }
  await flush();
  if (F.err) return;
  try { await FS.write(at([F.name, '定稿的剧本', segName(s.段), segName(s.段) + '_提炼_批注.md']), C.encodeText(notesMd(s))); }
  catch (e) { toast('批注没存上：' + e.message, 'err'); return; }
  await startJob({ 事: '提炼按批注改', 段: s.段 });
  rerender();
}

/* ---------- 梗概、人物、道具、场景的格子：描写（直接改，全片通用）和批注（写给 AI）；AI 改过的标出原来是什么。
   ref.id：场景那一句改着改着就变了，记着现在是哪一句（点开的卡、「这一段不用它」跟着认） ---------- */
function itemFields(s, k, ref, foot) {
  const e = k === '人物' || k === '道具' ? entryOf(k, ref.id) : null;
  const nk = () => itemKey(k, ref.id);
  const ta = h('textarea', { class: 'fq-in why', rows: k === '梗概' ? '4' : '2', spellcheck: 'false', 'data-f': '文',
    placeholder: k === '梗概' ? '全片讲什么，三五句话' : k === '场景' ? '地方名：一句话写在哪、什么样' : k === '人物' ? '只写看得见的：年纪、长相、身材、穿着、一两处特征' : '样子、结构、材质、颜色、新旧' });
  ta.value = k === '梗概' ? F.doc.梗概 : e ? e.描写 : ref.id;
  ta.addEventListener('input', () => {
    if (k === '梗概') F.doc.梗概 = ta.value;
    else if (e) e.描写 = ta.value;
    else {   // 场景：全片场景里的这一句换掉，各场选了它的跟着换
      const next = ta.value.replace(/\s*[\r\n]+\s*/g, ' ').trim();
      if (next && next !== ref.id && !sceneLines().includes(next)) {
        const was = nk(), b = batOf(s);
        setScene(sceneLinesIn(F.doc.场景).map(x => x === ref.id ? next : x).join('\n'));
        ref.id = next;
        if (was !== nk()) { if (b[was] !== undefined) { b[nk()] = b[was]; delete b[was]; } if (OPEN.cast === was) OPEN.cast = nk(); }
      }
    }
    fit(ta); touch(); foot();
  });
  const nt = h('textarea', { class: 'fq-in nt', rows: '1', spellcheck: 'false', 'data-f': '批注', placeholder: '要怎么改，写给 AI；不用改就空着。比如：' + (k === '梗概' ? '少了结尾他把钱还回去' : k === '场景' ? '是夜里，路灯昏黄' : '他五十多岁，不是三十') });
  nt.value = str(batOf(s)[nk()]);
  nt.addEventListener('input', () => { batOf(s)[nk()] = nt.value; fit(nt); touch(); foot(); });
  const was = markOf(s)[nk()];
  return [h('label', { class: 'pz-f' }, h('span', null, k === '梗概' ? '全片讲什么' : k === '场景' ? '在哪、什么样' : '描写'), ta),
    was ? wasP(was, '这一' + (k === '人物' ? '个' : k === '场景' ? '处' : k === '梗概' ? '段' : '样')) : null,
    h('label', { class: 'pz-f z' }, h('span', null, '批注'), nt)];
}

/* ---------- 镜头表：一镜一格，一屏摆下不用滚（11-16 他要的）。先试两行（写什么，下面一行灰字是作用）、一栏；摆不下就分几栏；还摆不下就一格一行。
   格子竖着排：先排满左边一栏再排右边。点一格，改的那一块浮在它上面（不把别的格子挤走）；按住左边 ⋮⋮ 拖着换顺序，号跟着镜头走。ro：只看 ---------- */
const FIT = { fn: null };   // 现在摆着的那个镜头表怎么量：改窗口大小时重量
window.addEventListener('resize', () => { if (FIT.fn) FIT.fn(); });
function shotGrid(s, foot, ro) {
  OPEN.shot = null;
  const wrap = h('div', { class: 'pz-tbw' }), box = h('div', { class: 'pz-tb' + (ro ? ' ro' : '') });
  const add = ro ? null : h('button', { class: 'pz-add', type: 'button', title: '号接着往下排', onclick: () => addShot() }, '＋ 加一镜');
  const cells = new Map();   // 镜头 → 它那一格
  let ed = null, lit = null; // ed：浮着的那一块 { sh, el }；lit：鼠标停着的那一镜
  const band = h('div', { class: 'sw-band' });   // 顶上的色带和合计
  wrap.append(band, box);
  const noOf = sh => shotNos(s)[s.段落.indexOf(sh)];
  const changed = () => { if (foot) foot(); layout(); if (ed) place(); };   // layout 末了重画色带
  const secTip = sh => Why.secOf(sh) ? '约 ' + Why.secOf(sh) + ' 秒' + (sh.秒数人定 ? '（你定的，AI 照批注改时不动）' : '（AI 估的）') : '还没估秒数';

  /* 一格：号、写什么、作用（标签是色块）、秒数；批注是右上角红角，AI 改过的是左边一道红；全文在悬停提示里 */
  function fill(el, sh) {
    const t = str(sh.批注).trim(), what = sh.写什么.trim(), why = sh.作用.trim(), sec = Why.secOf(sh);
    el.classList.toggle('note', !!t);
    el.classList.toggle('chg', !!sh.AI改);
    el.title = [what || '还空着', why ? '作用：' + why : '没写作用', secTip(sh), Scope.castSay(sh), t ? '批注：' + t : '', sh.AI改 ? (/^（新加的/.test(sh.AI改) ? 'AI 新加的' : 'AI 改过，原来是：' + sh.AI改) : '', ro ? '点一下看全文' : '点一下改'].filter(Boolean).join('\n');
    el.replaceChildren(...[ro ? null : grip(), h('span', { class: 'pz-no' }, noOf(sh)),
      h('span', { class: 'pz-tx' }, h('b', null, what || h('span', { class: 'miss' }, '还空着')), why ? h('small', null, ...Why.bits(why, h)) : h('small', { class: ro ? 'faint' : 'miss' }, '没写作用')),
      h('span', { class: 'pz-sec' + (sec ? sh.秒数人定 ? ' mine' : '' : ' miss') }, sec ? sec + ' 秒' : '—'),
      ro ? null : h('button', { class: 'fl-ib pz-more', type: 'button', tabindex: '-1', title: '在下面插一镜、写批注、删掉', onclick: e => menu(e.currentTarget, sh) }, icon('more'))].filter(Boolean));
  }
  function cell(sh) {
    const el = h('div', { class: 'pz-r', tabindex: '0',
      onclick: e => { if (!e.target.closest('.pz-g, .pz-more')) open(sh); },
      onkeydown: e => { if (e.key === 'Enter' && e.target === e.currentTarget) { e.preventDefault(); open(sh); } },
      onmouseenter: () => light(sh), onmouseleave: () => light(null) });
    cells.set(sh, el); fill(el, sh);
    return el;
  }
  function paint() {
    shut(true); cells.clear();
    box.replaceChildren(...s.段落.map(cell), ...(add ? [add] : []));
    paintBand();
    if (foot) foot();
    setTimeout(layout, 0);   // 摆上页面以后再量（窗格藏着时 requestAnimationFrame 不走，用定时）
  }
  /* 色带：一块一镜，宽窄照秒数、颜色照标签，每 15 秒一道线；上面一行写合计、大概分几条。点一块打开那一镜 */
  function paintBand() {
    const rows = s.段落, st = Why.strip(rows), sum = Why.sum(rows), nos = shotNos(s);
    if (!rows.length) { band.replaceChildren(); return; }
    const parts = Math.ceil(st.total / Why.ONE), BW = band.clientWidth, roomy = b => BW ? BW * b.w >= 76 : rows.length <= 8;   // 块够宽才写标签、秒数
    band.replaceChildren(
      h('p', { class: 'sw-sum' }, h('b', null, rows.length + ' 镜'), '　', sum.total ? h('b', null, sum.say) : '还没估秒数',
        parts > 1 ? '　一条视频一般 ' + Why.ONE + ' 秒，这一段大概要分 ' + parts + ' 条' : '', sum.total ? '　红线是每 ' + Why.ONE + ' 秒' : '', h('span', { class: 'sw-say' })),
      h('div', { class: 'sw-bar' }, ...st.blocks.map(b => {
        const sh = rows[b.i], tag = b.tag;
        return h('div', { class: 'sw-b' + (tag ? ' ' + Why.TAGS[tag] : ''), 'data-i': String(b.i), 'data-no': nos[b.i], style: 'flex:' + b.w.toFixed(4) + ' 1 0',
          title: '镜头' + nos[b.i] + '　' + (sh.写什么.trim() || '还空着') + '\n' + (sh.作用.trim() || '没写作用') + '\n' + secTip(sh),
          onclick: () => open(sh), onmouseenter: () => light(sh), onmouseleave: () => light(null) },
          '镜' + nos[b.i] + (roomy(b) && tag ? ' ' + tag : ''), roomy(b) && b.sec ? h('em', null, b.sec + '秒') : null);   // 写「镜1」别只写 1（11-16 他说光数字看不明白）；块窄：只写镜号，别的看颜色和悬停提示
      }), ...st.marks.map((m, k) => h('i', { class: 'sw-m', style: 'left:' + (m * 100).toFixed(2) + '%' }, h('span', null, (k + 1) * Why.ONE + ' 秒')))));
    light(lit);
  }
  /* 选中的一镜：鼠标停着的，没停就是点开的那一镜，只它一个。作用里接镜N、为镜N 连着的：格子虚线框，色带上画箭头（为：这一镜 → 镜N；接：镜N → 这一镜），上面一行写原话 */
  function light(sh) {
    const pick = x => x && s.段落.includes(x) ? x : null;
    lit = pick(sh) || pick(ed && ed.sh);
    const nos = shotNos(s), me = lit ? nos[s.段落.indexOf(lit)] : '', ties = lit ? Why.links(s.段落, nos).filter(l => l.from === me || l.to === me) : [];
    const near = new Set(ties.map(l => l.from === me ? l.to : l.from));
    s.段落.forEach((x, i) => {
      const c = cells.get(x), b = band.querySelector('.sw-b[data-i="' + i + '"]'), on = !!lit && x === lit;
      if (c) { c.classList.toggle('hot', on); c.classList.toggle('lnk', near.has(nos[i])); }
      if (b) b.classList.toggle('hot', on);
    });
    const say = band.querySelector('.sw-say');
    if (say) {
      say.textContent = !lit ? '鼠标放在一镜上：箭头指着跟它连着的镜头' : ties.length ? ties.map(l => l.say).join('；') : '镜' + me + ' 没写跟哪一镜连着';
      say.classList.toggle('on', ties.length > 0);
    }
    arcs(ties);
  }
  /* 色带上方的箭头：从一块的正中弯到另一块的正中，箭头朝 to */
  function arcs(ties) {
    const bar = band.querySelector('.sw-bar');
    if (!bar) return;
    const old = bar.querySelector('.sw-arcs');
    if (old) old.remove();
    const mid = no => { const b = bar.querySelector('.sw-b[data-no="' + no + '"]'); return b ? b.offsetLeft + b.offsetWidth / 2 : null; };
    const ds = bar.isConnected ? ties.map(l => [mid(l.from), mid(l.to)]).filter(([a, b]) => a != null && b != null) : [];
    if (!ds.length) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'sw-arcs');
    svg.innerHTML = '<defs><marker id="sw-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z"/></marker></defs>'
      + ds.map(([a, b]) => { const up = Math.min(17, 7 + Math.abs(b - a) / 30); return '<path marker-end="url(#sw-ah)" d="M' + a.toFixed(1) + ' 20 Q' + ((a + b) / 2).toFixed(1) + ' ' + (20 - 2 * up).toFixed(1) + ' ' + b.toFixed(1) + ' 20"/>'; }).join('');
    bar.prepend(svg);
  }

  /* 量这一段最长的写什么、作用要多宽，这一页还剩多高，照 Why.grid 挑：宽的一镜一行（写什么、作用两列对齐），窄的两行的格子；字不截、一屏放下 */
  const textW = el => { if (!el) return 0; const rg = document.createRange(); rg.selectNodeContents(el); return rg.getBoundingClientRect().width; };
  function needOf() {
    let b = 0, w = 0, fix = 0;
    for (const c of cells.values()) {
      const tx = c.querySelector('.pz-tx');
      if (!tx) continue;
      b = Math.max(b, textW(tx.children[0])); w = Math.max(w, textW(tx.children[1]));
      fix = Math.max(fix, c.offsetWidth - tx.offsetWidth);
    }
    return { b, w, t: fix + b + 18 + w + 6, c: fix + Math.max(b, w) + 6 };   // 18：一行里写什么和作用中间空的
  }
  function layout() {
    if (!box.isConnected) return;
    const n = box.children.length, W = box.clientWidth, r = box.getBoundingClientRect(), root = document.getElementById('wf');
    const avail = innerHeight - (r.top + window.scrollY) - (root.getBoundingClientRect().bottom - r.bottom) - 2;
    const need = needOf(), o = Why.grid(n, W, avail, need);
    box.classList.toggle('t', o.m === 't');
    box.style.setProperty('--pzw', Math.ceil(need.b) + 'px');
    box.style.setProperty('--pzy', Math.ceil(need.w) + 'px');
    box.style.gap = o.gap[0] + 'px ' + o.gap[1] + 'px';
    box.style.gridTemplateRows = 'repeat(' + o.rows + ', ' + o.hh + 'px)';
    box.style.gridAutoFlow = 'column';
    paintBand();   // 色带上块里写几个字照它多宽
  }
  FIT.fn = layout;

  /* ---- 浮着改的那一块 ---- */
  const focusIn = key => { const x = ed && ed.el.querySelector(`[data-f="${key}"]`); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } };
  function open(sh, key = '写什么') {
    if (ed && ed.sh === sh) { focusIn(key); return; }
    shut(true);
    const c = cells.get(sh);
    if (!c) return;
    OPEN.shot = sh;
    c.classList.add('on');
    ed = { sh, el: ro ? viewOf(sh) : editorOf(sh) };
    wrap.append(ed.el);
    light(null);
    fitAll(); place();
    if (!ro) focusIn(key);
    document.addEventListener('pointerdown', outside, true);
  }
  function shut(quiet) {
    if (!ed) return;
    const { sh, el } = ed;
    ed = null; OPEN.shot = null;
    el.remove();
    light(null);
    document.removeEventListener('pointerdown', outside, true);
    const c = cells.get(sh);
    if (c) { c.classList.remove('on'); if (!quiet) c.focus({ preventScroll: true }); }
  }
  const outside = e => { if (ed && !ed.el.contains(e.target) && !e.target.closest('.pz-r, .fl-pop, .dlg')) shut(true); };   // 点别的格子：那一格自己会接着浮出来
  /* 浮在那一格上面：至少 560 宽，别出右边；别出窗口下沿，也别钻到钉住的那一条底下 */
  function place() {
    if (!ed) return;
    const c = cells.get(ed.sh), p = ed.el;
    if (!c) return;
    const W = wrap.clientWidth, w = Math.min(W, Math.max(c.offsetWidth, 560));
    p.style.width = w + 'px';
    p.style.left = Math.max(0, Math.min(c.offsetLeft, W - w)) + 'px';
    p.style.top = c.offsetTop + 'px';
    const r = p.getBoundingClientRect(), hd = document.querySelector('.pz-head'), min = hd ? hd.getBoundingClientRect().bottom + 6 : 6;
    let dy = Math.min(0, innerHeight - 8 - r.bottom);
    if (r.top + dy < min) dy = min - r.top;
    if (dy) p.style.top = c.offsetTop + dy + 'px';
  }
  function editorOf(sh) {
    const next = () => { const j = s.段落.indexOf(sh); if (j < s.段落.length - 1) open(s.段落[j + 1]); else addShot(); };   // 到下一镜（最后一镜就加一镜）
    const redo = () => { const c = cells.get(sh); if (c) fill(c, sh); changed(); };
    const cnt = h('em', { class: 'pz-cnt' }), tags = h('div', { class: 'pz-tags' });
    const paintWhy = () => {   // 作用数着字（二十个字以内）、标签哪个点着
      const n = Why.len(sh.作用), tag = Why.split(sh.作用).tag;
      cnt.textContent = n + ' / ' + Why.MAX;
      cnt.classList.toggle('over', n > Why.MAX);
      for (const b of tags.children) b.classList.toggle('on', b.dataset.t === tag);
    };

      h('button', { class: 'pz-x', type: 'button', tabindex: '-1', title: dropTip, onclick: () => drop(key, ref) }, icon('x')));
  }
  const sugCard = x => h('button', { class: 'pz-c sug ' + kindCls(x.key), type: 'button', title: '这一段的字里提到了，点一下选上', onclick: () => { s[x.key].push(x.id); orderCast(s); touch(); paint(); } },
    picBox({ file: x.file && !F.gone.has(x.file) ? x.file : '', name: x.name, k: kindOf(x.key) }), h('span', { class: 'pz-ct' }, h('b', null, x.name), h('span', { class: 'ds' }, (x.only ? '用它？' : '剧本里提到了，') + '点一下加上')));
  function groupOf(k) {
    const list = castOf(s, k), sug = mentioned(s).filter(x => kindOf(x.key) === k);
    const blank = list.filter(([key, id]) => KIND[key] && entryOf(key, id) && !entryOf(key, id).描写.trim()).length;
    const tail = [...sug.map(sugCard), h('button', { class: 'pz-c plus', type: 'button', title: '从全片设定里选，或者新加一个' + k, onclick: e => openPickPop(e.currentTarget, s, paint, k) }, '＋ 加' + k)];
    const bins = scoped(s) ? binsOf(s, list) : [];   // 分过了：全局、只这一段用两块；加的、提到的跟在最后一块后面
    return h('div', { class: 'pz-grp ' + kindCls(k) },
      h('div', { class: 'pz-gh' }, k, h('em', null, String(list.length)), blank ? h('em', { class: 'miss' }, blank + ' 样没写描写') : null),
      ...(bins.length ? bins.flatMap((b, i) => [binHead(b), h('div', { class: 'pz-cards' }, ...b[2].map(([key, id]) => card(key, id)), ...(i === bins.length - 1 ? tail : []))])
        : [h('div', { class: 'pz-cards' }, ...list.map(([key, id]) => card(key, id)), ...tail)]));
  }
  paint();
  return [h('p', { class: 'pz-hint' }, '描写是全片通用的，在这里改了，别的段跟着变。点一张卡在原地改，用在哪几镜也在里面改；卡上 × 是删掉。'), wrap];
}

/* ---------- 梗概：全片的，各段共用 ---------- */
const synTab = (s, foot) => [h('p', { class: 'pz-hint' }, '全片的，各段共用。在这里改了，总览和别的段跟着变。'),
  h('div', { class: 'pz-syned' + (markOf(s).梗概 ? ' chg' : '') }, ...itemFields(s, '梗概', { id: '' }, foot))];

/* ---------- 只看（AI 在做、定下来了、剧本没定稿）：还是这三页。MODE：这一页现在是哪种（定下来了的，「让 AI 标上」照样能点） ---------- */
const MODE = { now: '' };
const roCard = (s, key, id) => { const x = cardInfo(s, key, id);
  return h('div', { class: 'pz-c ro ' + kindCls(key) + (x.pic ? ' pic' : '') + (x.lost ? ' lost' : ''), onclick: x.pic ? () => openImage(x.file) : null }, picBox(x),
    h('span', { class: 'pz-ct' }, h('b', null, x.name, scTag(s, key, id)), x.lost ? h('span', { class: 'ds miss' }, x.lost) : h('span', { class: 'ds', title: x.desc || null }, x.desc || h('span', { class: 'faint' }, '没写描写')))); };
const SHOW = {
  镜头表: s => shotGrid(s, null, true),
  出场的: s => [tagHint(s, MODE.now === 'done'), ...KINDS.map(k => {
    const list = castOf(s, k), bins = scoped(s) ? binsOf(s, list) : [], cards = l => h('div', { class: 'pz-cards' }, l.map(([key, id]) => roCard(s, key, id)));
    return h('div', { class: 'pz-grp ' + kindCls(k) }, h('div', { class: 'pz-gh' }, k, h('em', null, String(list.length))),
      ...(!list.length ? [h('p', { class: 'faint' }, '没选')] : bins.length ? bins.flatMap(b => [binHead(b), cards(b[2])]) : [cards(list)]));
  })],
  梗概: () => h('div', { class: 'pz-syn' }, F.doc.梗概.trim() || h('span', { class: 'faint' }, '没写')),
};
const EDIT = { 镜头表: shotGrid, 出场的: castTab, 梗概: synTab };

/* 页签上的红点：这一页还有没写完的、写了批注的 */
function dotsOf(s) {
  const out = {}, m = missing(s), sn = notesOf(s).length, b = batOf(s);
  if (m.length || sn) out.镜头表 = [...m.map(shortNos), sn ? sn + ' 条批注' : ''].filter(Boolean).join('；');
  const blank = castItems(s).filter(([k, id]) => k !== '场景' && entryOf(k, id) && !entryOf(k, id).描写.trim()).length, cn = itemNotes(s).filter(([k]) => k !== '梗概').length;
  if (blank || cn) out.出场的 = [blank ? blank + ' 样没写描写' : '', cn ? cn + ' 条批注' : ''].filter(Boolean).join('；');
  if (!F.doc.梗概.trim() || str(b.梗概).trim()) out.梗概 = F.doc.梗概.trim() ? '有批注' : '还没写';
  return out;
}

/* ---------- 一页：顶上钉住的一条（段名、要按的、三个页签），下面摆点着的那一页。
   mode：edit 能改；ai AI 在做；done 定下来了；lock 剧本还没定稿（以前就有的照旧摆出来看） ---------- */
function pzPage(s, mode) {
  const seg = s.段, edit = mode === 'edit', has = hasParas(s), job = busyJob(s);
  const tabs = h('div', { class: 'pz-tabs', role: 'tablist' }), note = h('span', { class: 'pz-note' }), body = h('div', { class: 'pz-body' });
  const fixBtn = h('button', { class: 'btn sm ink', type: 'button', title: '把写的批注交给 AI：只改批注说到的地方', onclick: () => fixByNotes(s) });   // 写了批注才露出来
  const doneBtn = h('button', { class: 'btn sm ink', type: 'button', title: '都改好了就点。下一步是资产', onclick: () => finalize(s) }, icon('check'), '定下来');
  const allBtn = h('button', { class: 'fl-link pz-all', type: 'button', onclick: e => allPop(e.currentTarget) });
  const allPop = anchor => popover(anchor, close => {
    const ta = h('textarea', { class: 'fl-ta sm', spellcheck: 'false', 'data-focus': '', placeholder: '对这一段提炼的整体意见，写给 AI（比如：漏了卖菜大妈；镜头分得太碎）。没有就空着' });
    ta.value = str(s.提炼总批);
    ta.addEventListener('input', () => { s.提炼总批 = ta.value; touch(); paintHead(); });
    setTimeout(() => ta.focus(), 0);
    return [h('div', { class: 'fl-pop-h' }, '整体批注 · 第' + seg + '段'), h('div', { style: 'padding:0 14px 6px' }, ta), h('div', { class: 'fl-pop-f' }, h('button', { class: 'btn sm ink', type: 'button', onclick: close }, '写好了'))];
  });
  const acts = edit && has ? [allBtn, h('button', { class: 'btn sm ghost', type: 'button', title: 'AI 照定稿的剧本重新提炼，出场的、镜头表换掉', onclick: () => distill(s) }, 'AI 重新提炼'), fixBtn, doneBtn]
    : edit ? [h('button', { class: 'btn sm ink', type: 'button', onclick: () => distill(s) }, '让 AI 提炼')]
    : mode === 'done' ? [h('button', { class: 'btn sm ghost', type: 'button', title: '回到能改、能写批注的样子', onclick: () => { s.定稿 = ''; touch(); swapCard(s); } }, '再改'),
      h('button', { class: 'btn sm ink', type: 'button', onclick: () => go('资产', { s: seg }) }, '下一步：资产 →')] : [];
  const state = mode === 'ai' ? h('span', { class: 'fs-state' }, 'AI 在做') : mode === 'done' ? h('span', { class: 'fs-state ok', title: '定下来的时间：' + s.定稿 }, icon('check'), '定了 ' + s.定稿.slice(5, 16))
    : mode === 'lock' ? h('span', { class: 'fs-state' }, '剧本定稿以后再看要不要重新提炼') : h('span', { class: 'fs-state' }, has ? '还在改' : '还没提炼');
  const head = h('div', { class: 'pz-head' }, h('div', { class: 'fs-h' }, h('span', { class: 'fs-no' }, mode === 'lock' ? '现在的' : '第' + seg + '段'),
    h('div', { class: 'fs-title' }, mode === 'lock' ? '' : s.名.trim() || h('span', { class: 'faint' }, '没起名')), state, acts.length ? h('div', { class: 'pz-acts' }, acts) : null), tabs);
  function paintHead() {
    const cur = tabNow(), dots = edit ? dotsOf(s) : {};
    tabs.replaceChildren(...TABS.map(t => h('button', { class: 'pz-tab' + (t === cur ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': String(t === cur), onclick: () => switchTo(t) },
      t, t === '镜头表' ? h('em', null, String(s.段落.length)) : t === '出场的' ? h('em', null, String(pickCount(s))) : h('small', null, '全片'),
      dots[t] ? h('i', { class: 'dot', title: dots[t] }) : null)), h('span', { class: 'sp' }), ...(edit && has ? [note] : []));
    if (!edit || !has) return;
    const m = missing(s), n = noteCount(s), all = str(s.提炼总批).trim();
    note.textContent = m.length ? '还差：' + m.map(shortNos).join('；') : n ? '还有 ' + n + ' 条批注没交给 AI' : '都写了，可以定下来';
    note.classList.toggle('todo', m.length > 0 || n > 0);
    fixBtn.textContent = '交给 AI 照批注改（' + n + ' 条）';
    fixBtn.style.display = n ? '' : 'none';   // .btn 是 inline-flex，hidden 盖不住
    doneBtn.classList.toggle('ghost', n > 0);   // 有批注：先交给 AI，定下来退成次要的
    allBtn.textContent = all ? '整体批注：' + oneLine(all) : '写整体批注';
    allBtn.title = all || '对这一段提炼的整体意见，写给 AI';
    allBtn.classList.toggle('on', !!all);
  }
  const paintBody = () => { const t = tabNow(); MODE.now = mode; body.replaceChildren(...[(edit ? EDIT : SHOW)[t](s, paintHead)].flat(Infinity).filter(Boolean)); fitAll(); };
  function switchTo(t) {
    if (t === tabNow()) return;
    setTab(t); paintHead(); paintBody();
    const pin = parseFloat(head.style.top) || 0, top = el.getBoundingClientRect().top;
    if (top < pin) window.scrollTo(0, top + window.scrollY - pin);   // 滚下去了：换页回到这一页的开头
    pzPin();
  }
  const bad = edit ? (jobFailed('提炼', seg) || jobFailed('提炼按批注改', seg)) : null;
  const under = mode === 'ai' && job ? h('div', { class: 'pz-under' }, jobLine(job), h('span', { class: 'fn-note' }, job.事 === '提炼' ? 'AI 照定稿的剧本在提炼，好了这里自动出现。' : 'AI 照你的批注在改，改好这里自动换上，改过的地方标红。'))
    : edit && (bad || !has) ? h('div', { class: 'pz-under' }, bad, has ? null : h('span', { class: 'fn-note' }, '剧本定稿了。让 AI 照剧本提炼：全片梗概、这一段出场的人物场景道具（连描写）、这一段的镜头表。提炼好以后你可以直接改，也可以写批注交给 AI 改。'))
    : mode === 'done' && paraStale(s) ? h('div', { class: 'pz-warn' }, '剧本后来重新定稿了，这些是照以前的剧本提炼的。看一眼：还对得上，点「照旧」；对不上，让 AI 照新剧本重新提炼。',
      h('div', null, h('button', { class: 'btn sm', type: 'button', title: '不用改，照旧定下来', onclick: () => { s.定稿 = nowText(); touch(); swapCard(s); } }, '照旧'),
        h('button', { class: 'btn sm ink', type: 'button', onclick: () => distill(s) }, '让 AI 照新剧本重新提炼'))) : null;
  const el = h('section', { class: 'fl-scene pz' + (edit ? '' : ' done'), 'data-seg': seg }, head, under, body);
  paintHead(); paintBody();
  setTimeout(pzPin, 0);   // 画上去以后再量钉在哪
  return el;
}

async function finalize(s) {
  const before = s.段落.length;
  s.段落 = s.段落.filter(x => x.写什么.trim() || x.作用.trim() || str(x.批注).trim());   // 整条空着的不算
  if (s.段落.length !== before) touch();
  if (!s.段落.some(x => x.写什么.trim())) { swapCard(s); toast('至少要有一个镜头写了「写什么」，才能定下来', 'err'); return; }
  const n = noteCount(s);
  if (n && !(await confirmDlg({ title: '批注还没交给 AI', body: '还有 ' + n + ' 条批注没交给 AI 改。就这样定下来，这些批注清掉。', ok: '就这样定', cancel: '回去' }))) { swapCard(s); return; }
  const m = missing(s);
  if (m.length && !(await confirmDlg({ title: '就这样定下来？', body: '还差：' + m.map(shortNos).join('；') + '。', ok: '就这样定', cancel: '回去补' }))) { swapCard(s); return; }
  if (!pickCount(s) && !(await confirmDlg({ title: '没选出场的', body: '这一段没有出场的人物、场景、道具，资产那一步就没东西可出。就这样定下来？', ok: '就这样定', cancel: '回去选' }))) { swapCard(s); return; }
  for (const x of s.段落) { delete x.AI改; delete x.批注; }   // 红批、批注到这里为止
  s.提炼改 = {}; s.提炼批 = {}; s.提炼总批 = '';
  s.定稿 = nowText(); touch();
  OPEN.shot = null; OPEN.cast = '';
  await flush();
  if (!F.err) FS.write(at([F.name, '历史记录', '定稿的剧本', '流水线__' + stampNow() + '.json']), C.encodeText(F.text)).catch(() => {});   // 每定一场留一版
  await loadSides();
  rerender(0);
  toast('第' + s.段 + '段的提炼定下来了。下一步：资产');
}

/* 剧本还没定稿：先去写剧本。以前就有镜头表的（老项目、剧本定稿以后又改过），照旧摆出来看 */
function lockView(s) {
  return [h('div', { class: 'wf-lock' }, '剧本定稿以后，AI 照剧本提炼梗概、出场的人物场景道具和镜头表。先到「剧本」那一步写好剧本、点「剧本定稿」。', h('button', { class: 'btn ink', onclick: () => go('剧本', { s: s.段 }) }, '← 去写剧本')),
    hasParas(s) || pickCount(s) ? pzPage(s, 'lock') : null];
}
/* 「镜头 1、2、3、4、7 没写作用」缩成「镜头 1～4、7 没写作用」：十几段都没写时，那行小字别太长 */
function shortNos(t) {
  return t.replace(/[0-9]+(?:、[0-9]+)+/g, list => {
    const n = list.split('、').map(Number), out = [];
    for (let i = 0; i < n.length; i++) { let j = i; while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++; out.push(j - i >= 2 ? n[i] + '～' + n[j] : n.slice(i, j + 1).join('、')); i = j; }
    return out.join('、');
  });
}

start({
  name: '分场', title: '提炼', scene: true, wide: true,   // 11-16 他嫌两边留白多、中间挤：和剧本、资产页一样宽
  render() {
    const s = sceneNow(), p = paraState(s);
    if (p.st === 'lock') return lockView(s);
    return pzPage(s, p.st === 'ai' ? 'ai' : s.定稿 ? 'done' : 'edit');
  },
  sides(changed) { const s = sceneNow(); if (s && changed.has(s.段) && !typing() && !window.UI.popOpen) rerender(); },   // AI 提炼好、改好的并进来了：整页重画
  jobDone() { if (!typing()) rerender(); },
});
</script>
</body>
</html>
