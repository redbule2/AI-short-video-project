<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 提炼</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
<style>
/* 提炼的批注（朱笔）、AI 照批注改过的地方（红批）：只这一页用，样式就放在这里 */
.pz-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; }
.pz-bar .sp { flex: 1; }
.pz-exp { margin: 0 0 4px; font: 15px/1.8 var(--serif); white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
.pz-all { margin: 0 0 14px; }
.pz-all .fl-ta { min-height: 54px; }
.wf-fab .btn[hidden] { display: none; }
.wf-fab .btn.ghost { background: rgba(255, 253, 249, .97); }
.pz-all .fl-ta, .fq-note .fq-in { border-color: var(--zhu-line); background: #fffaf7; color: var(--zhu); font-family: var(--kai); }
.fq-note > span { color: var(--zhu); }
.fq-note[hidden] { display: none; }
.fq.chg { border-left: 3px solid var(--zhu-line); }
.fq-was { margin: 6px 0 0 92px; font-size: 12.5px; line-height: 1.7; color: var(--zhu); }
.fq-was del { color: var(--ink-3); text-decoration-color: var(--zhu); }
.pz-warn { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--zhu-line); border-radius: 9px; background: var(--zhu-soft); font-size: 13.5px; line-height: 1.8; }
.pz-warn .btn { margin: 8px 8px 0 0; }
.pz-name { font: 16px var(--serif); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-items { display: grid; gap: 10px; margin: 10px 0 0; }
.pz-sel { margin: 0 0 4px; }
.pz-sec { margin-top: 22px; }
</style>
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="流水线.js"></script>
<script>
/* ============================================================
   流水线 · 提炼（一场的第二步。页面文件还叫 分场.html）
   2026-11-16 他定：第一步直接写剧本，梗概、人物、场景、道具不先写。剧本定稿以后，AI 照定稿的剧本一次提炼出：
   全片的梗概、这一场出场的人物道具场景（连描写，并进全片设定）、这一场的镜头表（每个镜头写什么、起什么作用）。
   提炼好你可以直接改，也可以在每一样上点笔写批注、点「交给 AI 照批注改」。改好点「定下来」，下一步是资产。
   AI 提炼的写在 定稿的剧本/第N段/第N段_提炼.json（页面只读），流水线.js 看到新的一版就并进全片设定和这一场；
   批注交给 AI 时存成旁边的 第N段_提炼_批注.md，AI 改完收进历史记录。
   人物、道具的描写和场景那一句是全片通用的：在这里改了，全片设定和别的场跟着变。
   共用的东西（读写流水线.json、顶栏、步骤条、小部件、并进来的规矩 takeDistill）在 流水线.js。
   ============================================================ */
'use strict';
const swapCard = () => rerender();
const OPEN = new WeakSet();   // 这一回点开了「批注」的镜头（写了字的一直开着）
const OPENK = new Set();   // 这一回点开了「批注」的梗概、人物、道具、场景
const notesOf = s => s.段落.map((x, i) => ({ i, t: str(x.批注).trim() })).filter(x => x.t);
const batOf = s => (s.提炼批 && typeof s.提炼批 === 'object' && !Array.isArray(s.提炼批) ? s.提炼批 : (s.提炼批 = {}));
const markOf = s => (s.提炼改 && typeof s.提炼改 === 'object' && !Array.isArray(s.提炼改) ? s.提炼改 : {});
/* 这一场出场的、能写描写的几样：人物、道具是全片表里的一行，场景是全片场景里的一句（只用文字写的） */
const castItems = s => [...s.人物.map(n => ['人物', n]), ...uniq(s.场景文字).map(t => ['场景', t]), ...s.道具.map(n => ['道具', n])];
const itemKey = (k, id) => k === '梗概' ? '梗概' : distillKey(k, k === '场景' ? sceneLabel(id) : id);
const itemNotes = s => { const b = batOf(s), live = new Set(['梗概', ...castItems(s).map(([k, id]) => itemKey(k, id))]); return Object.entries(b).filter(([k, v]) => live.has(k) && str(v).trim()); };
const noteCount = s => notesOf(s).length + itemNotes(s).length + (str(s.提炼总批).trim() ? 1 : 0);
const busyJob = s => { const p = paraState(s); return p.st === 'ai' ? p.job : null; };
const wasP = (was, what) => h('p', { class: 'fq-was', title: 'AI 改过，定下来以后不再标' }, ...(/^（新加的/.test(was) ? ['AI 新加的' + what] : ['AI 改过，原来是：', h('del', null, was)]));

/* ---------- 交给 AI：照定稿的剧本提炼；照你的批注改 ---------- */
async function distill(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能让 AI 提炼', 'err'); return; }
  if (hasParas(s) && !(await confirmDlg({ title: '让 AI 重新提炼', body: 'AI 照定稿的剧本重新提炼。这一段出场的、镜头表' + (noteCount(s) ? '和写的批注' : '') + '都换成 AI 新提炼的；梗概和人物、道具、场景的描写，AI 会照着现在的改（换之前流水线留一版在历史记录）。', ok: '重新提炼' }))) return;
  if (s.定稿) { s.定稿 = ''; touch(); }
  await flush();   // AI 照流水线里现在的全片设定提炼，先存上
  if (F.err) return;
  await startJob({ 事: '提炼', 段: s.段 });
  rerender();
}
/* 批注写成一份（哪一样、原文、批注），存在 第N段_提炼.json 旁边，AI 照着改 */
function notesMd(s) {
  const out = ['# ' + segName(s.段) + ' 提炼批注', '', '文件：定稿的剧本/' + segName(s.段) + '/' + segName(s.段) + '_提炼.json（流水线第' + s.段 + '段的提炼，以流水线里现在这一版为准）', '时间：' + nowText()];
  const all = str(s.提炼总批).trim(), b = batOf(s);
  if (all) out.push('', '## 整体', all);
  if (str(b.梗概).trim()) out.push('', '## 梗概', '原文：' + (F.doc.梗概.trim() || '（空）'), '批注：' + b.梗概.trim());
  for (const [k, id] of castItems(s)) {
    const t = str(b[itemKey(k, id)]).trim();
    if (!t) continue;
    const e = k === '场景' ? null : entryOf(k, id);
    out.push('', '## ' + k + '「' + (k === '场景' ? sceneLabel(id) : id) + '」', '原文：' + (k === '场景' ? id : (e && e.描写.trim()) || '（没写描写）'), '批注：' + t);
  }
  for (const { i, t } of notesOf(s)) { const x = s.段落[i]; out.push('', '## 镜头' + (i + 1), '原文：写什么：' + (x.写什么.trim() || '（空）') + '　作用：' + (x.作用.trim() || '（空）'), '批注：' + t); }
  return out.join('\n') + '\n';
}
async function fixByNotes(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能交给 AI 改', 'err'); return; }
  if (!noteCount(s)) { toast('还没写批注：在一样的右上角点笔，写它要怎么改', 'err'); return; }
  await flush();
  if (F.err) return;
  try { await FS.write(at([F.name, '定稿的剧本', segName(s.段), segName(s.段) + '_提炼_批注.md']), C.encodeText(notesMd(s))); }
  catch (e) { toast('批注没存上：' + e.message, 'err'); return; }
  await startJob({ 事: '提炼按批注改', 段: s.段 });
  rerender();
}

/* ---------- 梗概、人物、道具、场景：一样一张卡，能直接改、能写批注；AI 改过的标出原来是什么 ---------- */
function itemRow(s, k, id, foot) {
  let cur = id;   // 场景那一句改着改着就变了：记着现在是哪一句
  const e = k === '人物' || k === '道具' ? entryOf(k, id) : null;
  const nk = () => itemKey(k, cur);
  const what = k === '梗概' ? '全片讲什么' : k === '场景' ? '在哪、什么样' : '描写';
  const ta = h('textarea', { class: 'fq-in why', rows: k === '梗概' ? '3' : '2', spellcheck: 'false', 'data-f': '文',
    placeholder: k === '梗概' ? '全片讲什么，三五句话' : k === '场景' ? '地方名：一句话写在哪、什么样' : k === '人物' ? '只写看得见的：年纪、长相、身材、穿着、一两处特征' : '样子、结构、材质、颜色、新旧' });
  ta.value = k === '梗概' ? F.doc.梗概 : e ? e.描写 : cur;
  ta.addEventListener('input', () => {
    if (k === '梗概') F.doc.梗概 = ta.value;
    else if (e) e.描写 = ta.value;
    else {   // 场景：全片场景里的这一句换掉，各场选了它的跟着换
      const next = ta.value.replace(/\s*[\r\n]+\s*/g, ' ').trim();
      if (next && next !== cur && !sceneLines().includes(next)) {
        const was = nk(), b = batOf(s);
        setScene(sceneLinesIn(F.doc.场景).map(x => x === cur ? next : x).join('\n'));
        cur = next;
        if (was !== nk() && b[was] !== undefined) { b[nk()] = b[was]; delete b[was]; }
      }
    }
    fit(ta); touch(); foot();
  });
  const nt = h('textarea', { class: 'fq-in why', rows: '2', spellcheck: 'false', 'data-f': '批注', placeholder: '要怎么改，写给 AI。比如：' + (k === '梗概' ? '少了结尾他把钱还回去' : k === '场景' ? '是夜里，路灯昏黄' : '他五十多岁，不是三十') });
  nt.value = str(batOf(s)[nk()]);
  nt.addEventListener('input', () => { batOf(s)[nk()] = nt.value; fit(nt); touch(); foot(); });
  const note = h('label', { class: 'fq-f fq-note' }, h('span', null, '批注'), nt);
  note.hidden = !(nt.value.trim() || OPENK.has(nk()));
  const pen = ibtn('pen', '写批注：要怎么改，交给 AI', () => { OPENK.add(nk()); note.hidden = false; nt.focus(); });
  const was = markOf(s)[nk()];
  const shared = k !== '梗概' && usedIn(k === '场景' ? '场景文字' : k, cur).filter(x => x !== s.段);
  return h('div', { class: 'fq' + (was ? ' chg' : '') },
    h('div', { class: 'fq-h' }, h('span', { class: 'fq-no' }, k), h('span', { class: 'pz-name' }, k === '梗概' ? '全片的' : k === '场景' ? sceneLabel(cur) : id),
      shared && shared.length ? h('span', { class: 'faint', title: '描写是全片通用的，在这里改了，这几段也跟着变' }, '第' + shared.join('、') + '段也用') : null,
      h('span', { class: 'ln' }), h('div', { class: 'fq-acts' }, pen)),
    h('div', null, h('label', { class: 'fq-f' }, h('span', null, what), ta), was ? wasP(was, '这一' + (k === '人物' ? '个' : k === '场景' ? '处' : k === '梗概' ? '段' : '样')) : null, note));
}

/* ---------- 还没定下来：能改、能写批注 ---------- */
function editCard(s) {
  const seg = s.段, job = busyJob(s), has = hasParas(s);
  const rows = h('div', { class: 'fq-list' }), items = h('div', { class: 'pz-items' }), picks = h('div', { class: 'fs-sel pz-sel' }), syn = h('div', { class: 'pz-items' });
  const miss = h('div', { class: 'wf-fab-note' }), cnt = h('em');
  const doneBtn = h('button', { class: 'btn ink', type: 'button', title: '都改好了就点。下一步是资产', onclick: () => finalize(s) }, icon('check'), '定下来');
  const fixBtn = h('button', { class: 'btn ink', type: 'button', title: '把写的批注交给 AI：只改批注说到的地方', onclick: () => fixByNotes(s) });   // 写了批注才露出来，和「定下来」摆在一起
  const foot = () => {
    const m = missing(s), n = noteCount(s);
    miss.textContent = m.length ? '还差：' + m.map(shortNos).join('；') : n ? '还有 ' + n + ' 条批注没交给 AI' : '都写了，可以定下来。';
    miss.classList.toggle('todo', m.length > 0 || n > 0);
    cnt.textContent = s.段落.length ? s.段落.length + ' 个镜头' : '';
    fixBtn.textContent = '交给 AI 照批注改（' + n + ' 条）';
    fixBtn.hidden = !n;
    doneBtn.classList.toggle('ghost', n > 0);   // 有批注：先交给 AI，定下来退成次要的
  };
  const bad = jobFailed('提炼', seg) || jobFailed('提炼按批注改', seg);
  const bar = h('div', { class: 'pz-bar' }, ...(job ? [jobLine(job), h('span', { class: 'fn-note' }, job.事 === '提炼' ? 'AI 照定稿的剧本在提炼，好了这里自动出现。' : 'AI 照你的批注在改，改好这里自动换上，改过的地方标红。')]
    : !has ? [bad, h('span', { class: 'fn-note' }, '剧本定稿了。让 AI 照剧本提炼：全片梗概、这一段出场的人物场景道具（连描写）、这一段的镜头表。提炼好以后你可以直接改，也可以写批注交给 AI 改。'), h('span', { class: 'sp' }),
      h('button', { class: 'btn sm ink', type: 'button', onclick: () => distill(s) }, '让 AI 提炼')]
    : [bad, h('span', { class: 'fn-note' }, '直接在下面改；或者点一样右上角的笔写批注，写完交给 AI 照批注改。'), h('span', { class: 'sp' }),
      h('button', { class: 'btn sm ghost', type: 'button', title: 'AI 照定稿的剧本重新提炼，出场的、镜头表换掉', onclick: () => distill(s) }, '让 AI 重新提炼')]).filter(Boolean));
  /* 整体批注：对这一场提炼的整体意见 */
  const all = h('textarea', { class: 'fl-ta sm', spellcheck: 'false', 'data-f': '总批', placeholder: '对这一段提炼的整体意见，写给 AI（比如：漏了卖菜大妈；镜头分得太碎）。没有就空着' });
  all.value = str(s.提炼总批);
  all.addEventListener('input', () => { s.提炼总批 = all.value; fit(all); touch(); foot(); });
  /* 出场的：选上的人物、场景、道具（小牌子，能去掉、能再选）；下面一样一张卡写描写 */
  const paintCast = () => {
    picks.replaceChildren(...[
      ...castRefs(s, (k, id) => { s[k] = s[k].filter(x => x !== id); touch(); paintCast(); foot(); }),
      ...mentioned(s).map(x => h('button', { class: 'fl-ref sug ' + kindCls(x.key), type: 'button', title: '这一段的字里提到了，点一下选上', onclick: () => { s[x.key].push(x.id); touch(); paintCast(); } },
        x.file && !F.gone.has(x.file) ? thumbImg(x.file) : h('i', { class: 'ph' }, kindOf(x.key)[0]), h('span', null, x.name), h('small', null, kindOf(x.key) + ' · ' + (x.only ? '用它？' : '提到了')))),
      h('button', { class: 'btn sm', type: 'button', onclick: e => openPickPop(e.currentTarget, s, () => { paintCast(); foot(); }) }, icon('plus'), '选人物、场景、道具'),
    ]);
    items.replaceChildren(...castItems(s).map(([k, id]) => itemRow(s, k, id, foot)));
    fitAll();
  };
  const focusAt = (i, key) => { const x = rows.querySelector(`.fq[data-i="${i}"] [data-f="${key}"]`); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } };
  const paint = () => { rows.replaceChildren(...s.段落.map((_, i) => shotRow(i))); foot(); fitAll(); };
  const unfoldShots = () => { for (const k of [...FOLD.set]) if (k.startsWith(seg + '/段落')) setFold(k, false); };   // 段数、顺序一变，哪段收着就对不上了：都展开
  const addShot = (i = s.段落.length) => { s.段落.splice(i, 0, { 写什么: '', 作用: '' }); unfoldShots(); touch(); paint(); focusAt(i, '写什么'); };
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= s.段落.length) return; [s.段落[i], s.段落[j]] = [s.段落[j], s.段落[i]]; unfoldShots(); touch(); paint(); };
  const del = async i => {
    const x = s.段落[i];
    if ((x.写什么.trim() || x.作用.trim()) && !(await confirmDlg({ title: '删掉镜头 ' + (i + 1), body: '「' + (x.写什么.trim() || x.作用.trim()) + '」这个镜头删掉，后面的往前排。', ok: '删掉', danger: true }))) return;
    s.段落.splice(s.段落.indexOf(x), 1); unfoldShots(); touch(); paint();
  };
  /* 一个镜头：写什么、起什么作用，下面可以写批注；AI 照批注改过的，标出原来是什么。写好了可以收成一行 */
  function shotRow(i) {
    const sh = s.段落[i];
    const mk = (key, ph) => {
      const what = key === '写什么';
      const ta = h('textarea', { class: 'fq-in ' + (what ? 'what' : 'why'), rows: what ? '1' : '3', spellcheck: 'false', placeholder: ph, 'data-f': key });
      ta.value = str(sh[key]);
      ta.addEventListener('input', () => {
        if (what && /[\r\n]/.test(ta.value)) ta.value = ta.value.replace(/\s*[\r\n]+\s*/g, '');   // 写什么只有一行
        sh[key] = ta.value; fit(ta); touch(); foot();
      });
      ta.addEventListener('keydown', e => {   // 写什么里回车：到下面的作用。作用里回车照常换行，Ctrl+回车到下一段（最后一段就加一段）
        if (e.key !== 'Enter' || isComposing(e) || key === '批注') return;
        const idx = s.段落.indexOf(sh);
        if (what) { e.preventDefault(); focusAt(idx, '作用'); }
        else if (e.ctrlKey || e.metaKey) { e.preventDefault(); if (idx < s.段落.length - 1) focusAt(idx + 1, '写什么'); else addShot(); }
      });
      return ta;
    };
    const note = h('label', { class: 'fq-f fq-note' }, h('span', null, '批注'), mk('批注', '这个镜头要怎么改，写给 AI。比如：作用没写到点上，这个镜头是让观众知道他已经没钱了'));
    note.hidden = !(str(sh.批注).trim() || OPEN.has(sh));
    const body = h('div', null,
      h('label', { class: 'fq-f' }, h('span', null, '写什么'), mk('写什么', '这个镜头写什么，一句话')),
      sh.AI改 ? wasP(sh.AI改, '一个镜头') : null,
      h('label', { class: 'fq-f' }, h('span', null, '起什么作用'), mk('作用', '为什么要有这个镜头：它让观众看到什么、明白什么。')),
      note);
    const tog = folder(seg + '/段落' + i, body, () => (sh.写什么.trim() || '还空着') + (sh.作用.trim() ? ' —— ' + sh.作用 : '') + (str(sh.批注).trim() ? '　〔批注〕' + sh.批注 : ''), () => focusAt(i, '写什么'));
    const pen = ibtn('pen', '写批注：这个镜头要怎么改，交给 AI', () => { OPEN.add(sh); if (body.classList.contains('fold')) { setFold(seg + '/段落' + i, false); paint(); } const n = rows.querySelector(`.fq[data-i="${s.段落.indexOf(sh)}"] .fq-note`); if (n) { n.hidden = false; n.querySelector('textarea').focus(); } });
    return h('div', { class: 'fq' + (sh.AI改 ? ' chg' : ''), 'data-i': i },
      h('div', { class: 'fq-h' }, h('span', { class: 'fq-no' }, '镜头 ' + (i + 1)), h('span', { class: 'ln' }), tog,
        h('div', { class: 'fq-acts' }, pen, ibtn('up', '往前挪', () => move(i, -1), i === 0), ibtn('down', '往后挪', () => move(i, 1), i === s.段落.length - 1), ibtn('x', '删掉这个镜头', () => del(i)))),
      body);
  }
  const foldAll = on => { s.段落.forEach((_, i) => setFold(seg + '/段落' + i, on)); paint(); };
  const el = h('section', { class: 'fl-scene', 'data-seg': seg },
    h('div', { class: 'fs-h' }, h('span', { class: 'fs-no' }, '第' + seg + '段'), h('div', { class: 'fs-title' }, s.名.trim() || h('span', { class: 'faint' }, '没起名')),
      h('span', { class: 'fs-state' }, job ? 'AI 在做' : has ? '还在改' : '还没提炼')),
    bar,
    job ? doneBody(s) : [
      has ? h('div', { class: 'pz-all' }, h('div', { class: 'fs-lab', style: 'margin-top:0' }, '整体批注', h('em', null, '可以不写')), all) : null,
      h('div', { class: 'fs-lab' }, '梗概', h('em', null, '全片的，各段共用')), syn,
      h('div', { class: 'fs-lab pz-sec' }, '出场的', h('em', null, '人物、道具的描写和场景那一句是全片通用的，改了全片设定也跟着变')), picks, items,
      h('div', { class: 'fs-lab pz-sec' }, '镜头表', cnt, h('em', null, '照定稿的剧本分：一个镜头一件事，写什么、起什么作用'), h('span', { class: 'sp' }),
        has ? [h('button', { class: 'fl-fold', type: 'button', tabindex: '-1', title: '几个镜头都收成一行', onclick: () => foldAll(true) }, '都收起'),
          h('button', { class: 'fl-fold', type: 'button', tabindex: '-1', onclick: () => foldAll(false) }, '都展开')] : null),
      rows,
      h('button', { class: 'fl-add', type: 'button', onclick: () => addShot() }, has ? '＋ 加一个镜头' : '＋ 自己写一个镜头')],
    /* 「定下来」悬在右下角，页面多长都看得见（2026-11-13 他要的）；上面一行小字说还差什么 */
    !job && has ? h('div', { class: 'wf-fab' }, miss, fixBtn, doneBtn) : null);
  if (!job) { syn.replaceChildren(itemRow(s, '梗概', '', foot)); paintCast(); paint(); }
  return el;
}

async function finalize(s) {
  const before = s.段落.length;
  s.段落 = s.段落.filter(x => x.写什么.trim() || x.作用.trim() || str(x.批注).trim());   // 整条空着的不算
  if (s.段落.length !== before) touch();
  if (!s.段落.some(x => x.写什么.trim())) { swapCard(s); toast('至少要有一个镜头写了「写什么」，才能定下来', 'err'); return; }
  const n = noteCount(s);
  if (n && !(await confirmDlg({ title: '批注还没交给 AI', body: '还有 ' + n + ' 条批注没交给 AI 改。就这样定下来，这些批注清掉。', ok: '就这样定', cancel: '回去' }))) { swapCard(s); return; }
  const m = missing(s);
  if (m.length && !(await confirmDlg({ title: '就这样定下来？', body: '还差：' + m.map(shortNos).join('；') + '。', ok: '就这样定', cancel: '回去补' }))) { swapCard(s); return; }
  if (!pickCount(s) && !(await confirmDlg({ title: '没选出场的', body: '这一段没有出场的人物、场景、道具，资产那一步就没东西可出。就这样定下来？', ok: '就这样定', cancel: '回去选' }))) { swapCard(s); return; }
  for (const x of s.段落) { delete x.AI改; delete x.批注; }   // 红批、批注到这里为止
  s.提炼改 = {}; s.提炼批 = {}; s.提炼总批 = '';
  s.定稿 = nowText(); touch();
  await flush();
  if (!F.err) FS.write(at([F.name, '历史记录', '定稿的剧本', '流水线__' + stampNow() + '.json']), C.encodeText(F.text)).catch(() => {});   // 每定一场留一版
  await loadSides();
  rerender(0);
  toast('第' + s.段 + '段的提炼定下来了。下一步：资产');
}

/* ---------- 只看：梗概、出场的（连描写）、镜头表 ---------- */
function doneBody(s) {
  const desc = castItems(s).map(([k, id]) => {
    const e = k === '场景' ? null : entryOf(k, id), lab = k === '场景' ? sceneLabel(id) : id, cut = lab.endsWith('…');   // 场景那一句没有「地方名：」的，整句摆出来
    return [h('dt', null, k), h('dd', null, cut ? null : [h('b', null, lab), '　'], k === '场景' ? (cut ? id : sceneRest(id)) : (e && e.描写.trim()) || h('span', { class: 'faint' }, '没写描写'))];
  });
  return [h('dl', { class: 'fs-info' }, h('dt', null, '梗概'), h('dd', null, F.doc.梗概.trim() || h('span', { class: 'faint' }, '没写')),
      h('dt', null, '出场'), h('dd', { class: 'fs-sel' }, castRefs(s).length ? castRefs(s) : h('span', { class: 'faint' }, '没选')), ...desc),
    h('div', { class: 'fs-lab' }, '镜头表'), paraList(s)];
}
/* 定下来以后：只看不改；剧本后来重新定稿了，要你看一眼（待核对） */
function doneView(s) {
  const seg = s.段, stale = paraStale(s);
  return h('section', { class: 'fl-scene done', 'data-seg': seg },
    h('div', { class: 'fs-h' }, h('span', { class: 'fs-no' }, '第' + seg + '段'), h('div', { class: 'fs-title' }, s.名.trim() || h('span', { class: 'faint' }, '没起名')),
      h('span', { class: 'fs-state ok', title: '定下来的时间：' + s.定稿 }, icon('check'), '定了 ' + s.定稿.slice(5, 16)),
      h('button', { class: 'btn ghost sm', title: '回到能改、能写批注的样子', onclick: () => { s.定稿 = ''; touch(); swapCard(s); } }, '再改')),
    stale ? h('div', { class: 'pz-warn' }, '剧本后来重新定稿了，这些是照以前的剧本提炼的。看一眼：还对得上，点「照旧」；对不上，让 AI 照新剧本重新提炼。',
      h('div', null, h('button', { class: 'btn sm', type: 'button', title: '不用改，照旧定下来', onclick: () => { s.定稿 = nowText(); touch(); swapCard(s); } }, '照旧'),
        h('button', { class: 'btn sm ink', type: 'button', onclick: () => distill(s) }, '让 AI 照新剧本重新提炼'))) : null,
    doneBody(s),
    h('div', { class: 'wf-foot' }, h('span', { class: 'fn-note' }, '提炼定下来了。下一步：资产。')),
    h('div', { class: 'wf-fab' }, h('button', { class: 'btn ink', type: 'button', onclick: () => go('资产', { s: seg }) }, '下一步：资产 →')));   // 和「定下来」在同一个地方
}
/* 剧本还没定稿：先去写剧本。以前就有镜头表的（老项目、剧本定稿以后又改过），照旧摆出来看 */
function lockView(s) {
  return [h('div', { class: 'wf-lock' }, '剧本定稿以后，AI 照剧本提炼梗概、出场的人物场景道具和镜头表。先到「剧本」那一步写好剧本、点「剧本定稿」。', h('button', { class: 'btn ink', onclick: () => go('剧本', { s: s.段 }) }, '← 去写剧本')),
    hasParas(s) || pickCount(s) ? h('section', { class: 'fl-scene done' }, h('div', { class: 'fs-lab', style: 'margin-top:0' }, '现在的', h('em', null, '剧本定稿以后再看要不要重新提炼')), doneBody(s)) : null];
}
/* 「镜头 1、2、3、4、7 没写作用」缩成「镜头 1～4、7 没写作用」：十几段都没写时，悬着的那行小字别太长 */
function shortNos(t) {
  return t.replace(/[0-9]+(?:、[0-9]+)+/g, list => {
    const n = list.split('、').map(Number), out = [];
    for (let i = 0; i < n.length; i++) { let j = i; while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++; out.push(j - i >= 2 ? n[i] + '～' + n[j] : n.slice(i, j + 1).join('、')); i = j; }
    return out.join('、');
  });
}

start({
  name: '分场', title: '提炼', scene: true,
  render() {
    const s = sceneNow(), p = paraState(s);
    if (p.st === 'lock') return lockView(s);
    return s.定稿 && p.st !== 'ai' ? doneView(s) : editCard(s);
  },
  sides(changed) { const s = sceneNow(); if (s && changed.has(s.段) && !typing() && !window.UI.popOpen) rerender(); },   // AI 提炼好、改好的并进来了：整页重画
  jobDone() { if (!typing()) rerender(); },
});
</script>
</body>
