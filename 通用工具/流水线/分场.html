<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 提炼</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
<style>
/* 提炼页（11-16 改版，照 提炼页改版_设计稿.html）：顶上一条钉住（段名、要按的、三个页签），下面一次只摆一页：镜头表 / 出场的 / 梗概。只这一页用，样式就放在这里 */
.pz-head { position: sticky; top: 117px; z-index: 18; margin: -18px -22px 14px; padding: 12px 22px 0; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; background: var(--sheet); }
.fl-scene.done .pz-head { background: #fcf9f3; }
.pz-head.stuck { border-radius: 0; box-shadow: 0 12px 18px -16px rgba(40, 28, 16, .4); }
.pz-head .fs-h { flex-wrap: wrap; row-gap: 6px; margin-bottom: 2px; }
.pz-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.pz-all { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.pz-all.on { color: var(--zhu); text-decoration-color: var(--zhu-line); font-family: var(--kai); font-size: 13.5px; }
.pz-tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 4px; }
.pz-tab { padding: 6px 14px 9px; border: 0; border-bottom: 2.5px solid transparent; background: none; cursor: pointer; font: 15px var(--serif); letter-spacing: .1em; color: var(--ink-3); white-space: nowrap; }
.pz-tab:hover { color: var(--ink); }
.pz-tab.on { border-bottom-color: var(--ink); color: var(--ink); font-weight: 600; }
.pz-tab em { margin-left: 6px; padding: 0 7px; border-radius: 9px; background: var(--paper-2); font: normal 12px/1.6 var(--sans); letter-spacing: 0; color: var(--ink-3); }
.pz-tab small { margin-left: 4px; font: 11.5px var(--sans); letter-spacing: 0; color: var(--ink-4); }
.pz-tab .dot { display: inline-block; width: 7px; height: 7px; margin-left: 5px; border-radius: 50%; background: var(--zhu); vertical-align: 2px; }
.pz-tabs .sp { flex: 1; }
.pz-note { align-self: center; padding-bottom: 4px; font-size: 12.5px; color: var(--dai); }
.pz-note.todo { color: var(--zhu); }
.pz-hint { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-3); }
.pz-under { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; }
.pz-warn { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--zhu-line); border-radius: 9px; background: var(--zhu-soft); font-size: 13.5px; line-height: 1.8; }
.pz-warn .btn { margin: 8px 8px 0 0; }
.miss { color: var(--zhu); }
.pz-nt { display: block; margin-top: 2px; font: 13.5px/1.7 var(--kai); color: var(--zhu); white-space: pre-wrap; word-break: break-word; }
.pz-tx .fq-was, .pz-ct .fq-was { margin: 4px 0 0; }
.fq-was { font-size: 12.5px; line-height: 1.7; color: var(--zhu); }
.fq-was del { color: var(--ink-3); text-decoration-color: var(--zhu); }
/* 改的格子：写什么一行，作用、描写几行，批注朱笔 */
.pz-f { display: block; margin: 0 0 8px; cursor: text; }
.pz-f > span { display: block; margin: 0 0 2px; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .1em; }
.pz-f .fq-in { padding: 6px 12px; font-size: 15.5px; line-height: 1.85; }
.pz-f .fq-in.what { min-height: 0; }
.pz-f .fq-in.why { min-height: 76px; }
.pz-f .fq-in.nt { min-height: 0; }
.pz-f.z > span { color: var(--zhu); }
.pz-f.z .fq-in { border-color: var(--zhu-line); background: #fffaf7; color: var(--zhu); font-family: var(--kai); }
.pz-ops { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 2px; }
.pz-ops .sp { flex: 1; }
.fl-link.danger { color: var(--zhu); text-decoration-color: var(--zhu-line); }
/* 镜头表：一镜一行，点开在原地改；左边拖着换顺序 */
.pz-tb { border: 1px solid var(--line-2); border-radius: 10px; background: var(--sheet); }
.pz-tb:empty { display: none; }
.pz-r { position: relative; display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) 30px; gap: 6px; align-items: start; padding: 9px 8px 9px 6px; border-top: 1px solid var(--line); cursor: pointer; scroll-margin: 230px 0 40px; outline: 0; }
.pz-r:first-child { border-top: 0; border-radius: 10px 10px 0 0; }
.pz-r:last-child { border-radius: 0 0 10px 10px; }
.pz-r:hover { background: rgba(244, 239, 230, .45); }
.pz-r:focus-visible { box-shadow: inset 0 0 0 2px var(--dai-line); }
.pz-g { padding-top: 2px; color: var(--ink-4); letter-spacing: -2px; text-align: center; cursor: grab; touch-action: none; user-select: none; opacity: .55; }
.pz-r:hover .pz-g { opacity: 1; }
.pz-no { padding-top: 1px; font: 15px/1.7 var(--kai); color: var(--dai); white-space: nowrap; }
.pz-tx { min-width: 0; }
.pz-tx > b { display: block; font: 600 15.5px/1.7 var(--serif); letter-spacing: .02em; color: var(--ink); word-break: break-word; }
.pz-tx > small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.7; color: var(--ink-3); }
.pz-r .pz-more { opacity: .4; }
.pz-r:hover .pz-more { opacity: 1; }
.pz-r.note::after, .pz-c.note::after { content: ''; position: absolute; right: 0; top: 0; border: 7px solid transparent; border-top-color: var(--zhu); border-right-color: var(--zhu); border-top-right-radius: 9px; }
.pz-r.chg { box-shadow: inset 3px 0 0 var(--zhu-line); }
.pz-r.open { cursor: default; background: #fffefa; box-shadow: inset 3px 0 0 var(--dai); }
.pz-r.open .pz-tx { padding-top: 2px; }
.pz-tb.dragging, .pz-tb.dragging * { cursor: grabbing !important; user-select: none; }
.pz-r.drag { z-index: 2; background: #fff; box-shadow: 0 10px 24px -10px rgba(40, 28, 16, .45), inset 3px 0 0 var(--dai); }
.pz-tb.ro .pz-r { grid-template-columns: 40px minmax(0, 1fr); padding-left: 14px; cursor: default; }
.pz-tb.ro .pz-r:hover { background: none; }
.pz-tb.ro .pz-tx > p { margin: 0; font-size: 14px; line-height: 1.8; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.pz-menu { display: flex; flex-direction: column; padding: 6px; }
.pz-menu button { padding: 7px 14px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; font: 14px var(--sans); color: var(--ink); white-space: nowrap; }
.pz-menu button:hover { background: var(--paper-2); }
.pz-menu button.danger { color: var(--zhu); }
.fl-pop:has(.pz-menu) { width: auto; }
/* 出场的：人物、场景、道具三组，一样一张小卡，点卡在原地改 */
.pz-grp { margin: 0 0 18px; }
.pz-gh { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; padding-left: 9px; border-left: 4px solid var(--k); font: 600 15px var(--serif); letter-spacing: .14em; color: var(--k); }
.pz-gh em { font: normal 12px var(--sans); letter-spacing: 0; color: var(--ink-3); }
.pz-gh em.miss { color: var(--zhu); }
.pz-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.pz-c { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; min-width: 0; padding: 9px 26px 9px 9px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--sheet); cursor: pointer; text-align: left; font: inherit; color: inherit; outline: 0; scroll-margin: 230px 0 40px; }
.pz-c:hover { border-color: var(--k-line, var(--ink-4)); }
.pz-c:focus-visible { box-shadow: 0 0 0 3px var(--dai-soft); border-color: var(--dai-line); }
.pz-im { width: 46px; height: 46px; display: grid; place-items: center; overflow: hidden; border-radius: 7px; background: var(--k-soft, var(--paper-2)); font: 18px var(--kai); color: var(--k, var(--ink-3)); }
.pz-im img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.pz-ct { display: block; min-width: 0; }
.pz-ct > b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 600 14.5px/1.5 var(--sans); color: var(--ink); word-break: break-word; }
.pz-ct .ds { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); word-break: break-word; }
.pz-ct small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink-4); }
.pz-ct small.zhu { color: var(--zhu); }
.pz-ct .pz-nt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12.5px; }
.pz-x { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-4); cursor: pointer; opacity: .6; }
.pz-c:hover .pz-x { opacity: 1; }
.pz-x:hover { background: var(--paper-2); color: var(--zhu); }
.pz-x .ic { width: 11px; height: 11px; stroke-width: 2; }
.pz-c.chg { box-shadow: inset 3px 0 0 var(--zhu-line); }
.pz-c.lost { border-style: dashed; }
.pz-c.sug { border-style: dashed; border-color: var(--k-line, var(--line-2)); background: var(--k-soft, transparent); padding-right: 9px; }
.pz-c.sug .ds { color: var(--dai); }
.pz-c.plus { display: grid; place-items: center; grid-template-columns: 1fr; min-height: 66px; padding: 9px; border-style: dashed; background: none; color: var(--ink-3); font-size: 13.5px; letter-spacing: .06em; }
.pz-c.plus:hover { color: var(--ink); background: rgba(255, 253, 249, .7); }
.pz-c.open { grid-column: 1 / -1; grid-template-columns: 64px minmax(0, 1fr); padding: 12px 14px; cursor: default; border-color: var(--dai-line); background: #fffefa; box-shadow: inset 3px 0 0 var(--dai); }
.pz-c.open .pz-im { width: 64px; height: 64px; }
.pz-c.open .pz-ct > b { display: block; margin-bottom: 6px; }
.pz-c.open .pz-ct > b small { display: inline; margin-left: 10px; font-weight: 400; }
.pz-c.ro { cursor: default; padding-right: 9px; }
.pz-c.ro.pic { cursor: pointer; }
.pz-c.ro .ds { -webkit-line-clamp: 4; }
/* 梗概 */
.pz-syn { padding: 12px 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--sheet); font: 16px/1.95 var(--serif); white-space: pre-wrap; word-break: break-word; }
.pz-syned.chg { padding-left: 12px; box-shadow: inset 3px 0 0 var(--zhu-line); }
.pz-syned .fq-in.why { min-height: 130px; }
@media (max-width: 1240px) { .pz-head { margin: -16px -16px 12px; padding: 10px 16px 0; } }
</style>
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="../公用/关键帧绑定.js"></script>
<script src="流水线.js"></script>
<script>
/* ============================================================
   流水线 · 提炼（一场的第二步。页面文件还叫 分场.html）
   2026-11-16 他定：第一步直接写剧本，梗概、人物、场景、道具不先写。剧本定稿以后，AI 照定稿的剧本一次提炼出：
   全片的梗概、这一场出场的人物道具场景（连描写，并进全片设定）、这一场的镜头表（每个镜头写什么、起什么作用）。
   提炼好你可以直接改，也可以写批注、点「交给 AI 照批注改」。改好点「定下来」，下一步是资产。
   AI 提炼的写在 定稿的剧本/第N段/第N段_提炼.json（页面只读），流水线.js 看到新的一版就并进全片设定和这一场；
   批注交给 AI 时存成旁边的 第N段_提炼_批注.md，AI 改完收进历史记录。
   人物、道具的描写和场景那一句是全片通用的：在这里改了，全片设定和别的场跟着变。
   11-16 改版（他看了 提炼页改版_设计稿.html 定的）：镜头表、出场的、梗概分三个页签，一次只看一样，回到上回看的那一页；
   段名、页签、「交给 AI 照批注改」「定下来」钉在顶上；镜头表一镜一行，点开在原地改，按住左边拖着换顺序；
   出场的分人物、场景、道具三组，一样一张小卡，点卡在原地改描写、写批注。数据、AI 那边都没变。
   共用的东西（读写流水线.json、顶栏、步骤条、小部件、并进来的规矩 takeDistill）在 流水线.js。
   ============================================================ */
'use strict';
const swapCard = () => rerender();
const notesOf = s => s.段落.map((x, i) => ({ i, t: str(x.批注).trim() })).filter(x => x.t);
const batOf = s => (s.提炼批 && typeof s.提炼批 === 'object' && !Array.isArray(s.提炼批) ? s.提炼批 : (s.提炼批 = {}));
const markOf = s => (s.提炼改 && typeof s.提炼改 === 'object' && !Array.isArray(s.提炼改) ? s.提炼改 : {});
/* 这一场出场的、能写描写的几样：人物、道具是全片表里的一行，场景是全片场景里的一句（只用文字写的） */
const castItems = s => [...s.人物.map(n => ['人物', n]), ...uniq(s.场景文字).map(t => ['场景', t]), ...s.道具.map(n => ['道具', n])];
const itemKey = (k, id) => k === '梗概' ? '梗概' : distillKey(k, k === '场景' ? sceneLabel(id) : id);
const itemNotes = s => { const b = batOf(s), live = new Set(['梗概', ...castItems(s).map(([k, id]) => itemKey(k, id))]); return Object.entries(b).filter(([k, v]) => live.has(k) && str(v).trim()); };
const noteCount = s => notesOf(s).length + itemNotes(s).length + (str(s.提炼总批).trim() ? 1 : 0);
const busyJob = s => { const p = paraState(s); return p.st === 'ai' ? p.job : null; };
const wasP = (was, what) => h('p', { class: 'fq-was', title: 'AI 改过，定下来以后不再标' }, ...(/^（新加的/.test(was) ? ['AI 新加的' + what] : ['AI 改过，原来是：', h('del', null, was)]));

/* ---------- 这一页记着的：看哪一页（回到上回看的那一页，头一回是镜头表）、点开了哪一镜、哪一样 ---------- */
const TABS = ['镜头表', '出场的', '梗概'];
const OPEN = { shot: null, cast: '' };   // shot：点开的那一镜（镜头表里那一行）；cast：点开的那一样（itemKey）
const tabKey = () => 'antou:flow:pz-tab:' + LINK.root + '/' + F.name;
const tabNow = () => { try { const t = localStorage.getItem(tabKey()); return TABS.includes(t) ? t : TABS[0]; } catch (e) { return TABS[0]; } };
const setTab = t => { try { localStorage.setItem(tabKey(), t); } catch (e) { /* 记不下：下回从镜头表开始 */ } };
const pzPin = () => window.UI.pinUnder(document.querySelector('.pz-head'), document.getElementById('wf-steps'));
window.addEventListener('scroll', pzPin, { passive: true });
window.addEventListener('resize', pzPin);

/* ---------- 交给 AI：照定稿的剧本提炼；照你的批注改 ---------- */
async function distill(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能让 AI 提炼', 'err'); return; }
  if (hasParas(s) && !(await confirmDlg({ title: '让 AI 重新提炼', body: 'AI 照定稿的剧本重新提炼。这一段出场的、镜头表' + (noteCount(s) ? '和写的批注' : '') + '都换成 AI 新提炼的；梗概和人物、道具、场景的描写，AI 会照着现在的改（换之前流水线留一版在历史记录）。', ok: '重新提炼' }))) return;
  if (s.定稿) { s.定稿 = ''; touch(); }
  await flush();   // AI 照流水线里现在的全片设定提炼，先存上
  if (F.err) return;
  await startJob({ 事: '提炼', 段: s.段 });
  rerender();
}
/* 批注写成一份（哪一样、原文、批注），存在 第N段_提炼.json 旁边，AI 照着改 */
function notesMd(s) {
  const out = ['# ' + segName(s.段) + ' 提炼批注', '', '文件：定稿的剧本/' + segName(s.段) + '/' + segName(s.段) + '_提炼.json（流水线第' + s.段 + '段的提炼，以流水线里现在这一版为准）', '时间：' + nowText()];
  const all = str(s.提炼总批).trim(), b = batOf(s);
  if (all) out.push('', '## 整体', all);
  if (str(b.梗概).trim()) out.push('', '## 梗概', '原文：' + (F.doc.梗概.trim() || '（空）'), '批注：' + b.梗概.trim());
  for (const [k, id] of castItems(s)) {
    const t = str(b[itemKey(k, id)]).trim();
    if (!t) continue;
    const e = k === '场景' ? null : entryOf(k, id);
    out.push('', '## ' + k + '「' + (k === '场景' ? sceneLabel(id) : id) + '」', '原文：' + (k === '场景' ? id : (e && e.描写.trim()) || '（没写描写）'), '批注：' + t);
  }
  const nos = shotNos(s);
  for (const { i, t } of notesOf(s)) { const x = s.段落[i]; out.push('', '## 镜头' + nos[i], '原文：写什么：' + (x.写什么.trim() || '（空）') + '　作用：' + (x.作用.trim() || '（空）'), '批注：' + t); }
  return out.join('\n') + '\n';
}
async function fixByNotes(s) {
  if (!AI.ok) { toast('本机服务是旧的，重开一次才能交给 AI 改', 'err'); return; }
  if (!noteCount(s)) { toast('还没写批注：点开一镜或一样，在「批注」里写要怎么改', 'err'); return; }
  await flush();
  if (F.err) return;
  try { await FS.write(at([F.name, '定稿的剧本', segName(s.段), segName(s.段) + '_提炼_批注.md']), C.encodeText(notesMd(s))); }
  catch (e) { toast('批注没存上：' + e.message, 'err'); return; }
  await startJob({ 事: '提炼按批注改', 段: s.段 });
  rerender();
}

/* ---------- 梗概、人物、道具、场景的格子：描写（直接改，全片通用）和批注（写给 AI）；AI 改过的标出原来是什么。
   ref.id：场景那一句改着改着就变了，记着现在是哪一句（点开的卡、「这一段不用它」跟着认） ---------- */
function itemFields(s, k, ref, foot) {
  const e = k === '人物' || k === '道具' ? entryOf(k, ref.id) : null;
  const nk = () => itemKey(k, ref.id);
  const ta = h('textarea', { class: 'fq-in why', rows: k === '梗概' ? '4' : '2', spellcheck: 'false', 'data-f': '文',
    placeholder: k === '梗概' ? '全片讲什么，三五句话' : k === '场景' ? '地方名：一句话写在哪、什么样' : k === '人物' ? '只写看得见的：年纪、长相、身材、穿着、一两处特征' : '样子、结构、材质、颜色、新旧' });
  ta.value = k === '梗概' ? F.doc.梗概 : e ? e.描写 : ref.id;
  ta.addEventListener('input', () => {
    if (k === '梗概') F.doc.梗概 = ta.value;
    else if (e) e.描写 = ta.value;
    else {   // 场景：全片场景里的这一句换掉，各场选了它的跟着换
      const next = ta.value.replace(/\s*[\r\n]+\s*/g, ' ').trim();
      if (next && next !== ref.id && !sceneLines().includes(next)) {
        const was = nk(), b = batOf(s);
        setScene(sceneLinesIn(F.doc.场景).map(x => x === ref.id ? next : x).join('\n'));
        ref.id = next;
        if (was !== nk()) { if (b[was] !== undefined) { b[nk()] = b[was]; delete b[was]; } if (OPEN.cast === was) OPEN.cast = nk(); }
      }
    }
    fit(ta); touch(); foot();
  });

  const acts = edit && has ? [allBtn, h('button', { class: 'btn sm ghost', type: 'button', title: 'AI 照定稿的剧本重新提炼，出场的、镜头表换掉', onclick: () => distill(s) }, 'AI 重新提炼'), fixBtn, doneBtn]
    : edit ? [h('button', { class: 'btn sm ink', type: 'button', onclick: () => distill(s) }, '让 AI 提炼')]
    : mode === 'done' ? [h('button', { class: 'btn sm ghost', type: 'button', title: '回到能改、能写批注的样子', onclick: () => { s.定稿 = ''; touch(); swapCard(s); } }, '再改'),
      h('button', { class: 'btn sm ink', type: 'button', onclick: () => go('资产', { s: seg }) }, '下一步：资产 →')] : [];
  const state = mode === 'ai' ? h('span', { class: 'fs-state' }, 'AI 在做') : mode === 'done' ? h('span', { class: 'fs-state ok', title: '定下来的时间：' + s.定稿 }, icon('check'), '定了 ' + s.定稿.slice(5, 16))
    : mode === 'lock' ? h('span', { class: 'fs-state' }, '剧本定稿以后再看要不要重新提炼') : h('span', { class: 'fs-state' }, has ? '还在改' : '还没提炼');
  const head = h('div', { class: 'pz-head' }, h('div', { class: 'fs-h' }, h('span', { class: 'fs-no' }, mode === 'lock' ? '现在的' : '第' + seg + '段'),
    h('div', { class: 'fs-title' }, mode === 'lock' ? '' : s.名.trim() || h('span', { class: 'faint' }, '没起名')), state, acts.length ? h('div', { class: 'pz-acts' }, acts) : null), tabs);
  function paintHead() {
    const cur = tabNow(), dots = edit ? dotsOf(s) : {};
    tabs.replaceChildren(...TABS.map(t => h('button', { class: 'pz-tab' + (t === cur ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': String(t === cur), onclick: () => switchTo(t) },
      t, t === '镜头表' ? h('em', null, String(s.段落.length)) : t === '出场的' ? h('em', null, String(pickCount(s))) : h('small', null, '全片'),
      dots[t] ? h('i', { class: 'dot', title: dots[t] }) : null)), h('span', { class: 'sp' }), ...(edit && has ? [note] : []));
    if (!edit || !has) return;
    const m = missing(s), n = noteCount(s), all = str(s.提炼总批).trim();
    note.textContent = m.length ? '还差：' + m.map(shortNos).join('；') : n ? '还有 ' + n + ' 条批注没交给 AI' : '都写了，可以定下来';
    note.classList.toggle('todo', m.length > 0 || n > 0);
    fixBtn.textContent = '交给 AI 照批注改（' + n + ' 条）';
    fixBtn.style.display = n ? '' : 'none';   // .btn 是 inline-flex，hidden 盖不住
    doneBtn.classList.toggle('ghost', n > 0);   // 有批注：先交给 AI，定下来退成次要的
    allBtn.textContent = all ? '整体批注：' + oneLine(all) : '写整体批注';
    allBtn.title = all || '对这一段提炼的整体意见，写给 AI';
    allBtn.classList.toggle('on', !!all);
  }
  const paintBody = () => { const t = tabNow(); body.replaceChildren(...[(edit ? EDIT : SHOW)[t](s, paintHead)].flat(Infinity).filter(Boolean)); fitAll(); };
  function switchTo(t) {
    if (t === tabNow()) return;
    setTab(t); paintHead(); paintBody();
    const pin = parseFloat(head.style.top) || 0, top = el.getBoundingClientRect().top;
    if (top < pin) window.scrollTo(0, top + window.scrollY - pin);   // 滚下去了：换页回到这一页的开头
    pzPin();
  }
  const bad = edit ? (jobFailed('提炼', seg) || jobFailed('提炼按批注改', seg)) : null;
  const under = mode === 'ai' && job ? h('div', { class: 'pz-under' }, jobLine(job), h('span', { class: 'fn-note' }, job.事 === '提炼' ? 'AI 照定稿的剧本在提炼，好了这里自动出现。' : 'AI 照你的批注在改，改好这里自动换上，改过的地方标红。'))
    : edit && (bad || !has) ? h('div', { class: 'pz-under' }, bad, has ? null : h('span', { class: 'fn-note' }, '剧本定稿了。让 AI 照剧本提炼：全片梗概、这一段出场的人物场景道具（连描写）、这一段的镜头表。提炼好以后你可以直接改，也可以写批注交给 AI 改。'))
    : mode === 'done' && paraStale(s) ? h('div', { class: 'pz-warn' }, '剧本后来重新定稿了，这些是照以前的剧本提炼的。看一眼：还对得上，点「照旧」；对不上，让 AI 照新剧本重新提炼。',
      h('div', null, h('button', { class: 'btn sm', type: 'button', title: '不用改，照旧定下来', onclick: () => { s.定稿 = nowText(); touch(); swapCard(s); } }, '照旧'),
        h('button', { class: 'btn sm ink', type: 'button', onclick: () => distill(s) }, '让 AI 照新剧本重新提炼'))) : null;
  const el = h('section', { class: 'fl-scene pz' + (edit ? '' : ' done'), 'data-seg': seg }, head, under, body);
  paintHead(); paintBody();
  setTimeout(pzPin, 0);   // 画上去以后再量钉在哪
  return el;
}

async function finalize(s) {
  const before = s.段落.length;
  s.段落 = s.段落.filter(x => x.写什么.trim() || x.作用.trim() || str(x.批注).trim());   // 整条空着的不算
  if (s.段落.length !== before) touch();
  if (!s.段落.some(x => x.写什么.trim())) { swapCard(s); toast('至少要有一个镜头写了「写什么」，才能定下来', 'err'); return; }
  const n = noteCount(s);
  if (n && !(await confirmDlg({ title: '批注还没交给 AI', body: '还有 ' + n + ' 条批注没交给 AI 改。就这样定下来，这些批注清掉。', ok: '就这样定', cancel: '回去' }))) { swapCard(s); return; }
  const m = missing(s);
  if (m.length && !(await confirmDlg({ title: '就这样定下来？', body: '还差：' + m.map(shortNos).join('；') + '。', ok: '就这样定', cancel: '回去补' }))) { swapCard(s); return; }
  if (!pickCount(s) && !(await confirmDlg({ title: '没选出场的', body: '这一段没有出场的人物、场景、道具，资产那一步就没东西可出。就这样定下来？', ok: '就这样定', cancel: '回去选' }))) { swapCard(s); return; }
  for (const x of s.段落) { delete x.AI改; delete x.批注; }   // 红批、批注到这里为止
  s.提炼改 = {}; s.提炼批 = {}; s.提炼总批 = '';
  s.定稿 = nowText(); touch();
  OPEN.shot = null; OPEN.cast = '';
  await flush();
  if (!F.err) FS.write(at([F.name, '历史记录', '定稿的剧本', '流水线__' + stampNow() + '.json']), C.encodeText(F.text)).catch(() => {});   // 每定一场留一版
  await loadSides();
  rerender(0);
  toast('第' + s.段 + '段的提炼定下来了。下一步：资产');
}

/* 剧本还没定稿：先去写剧本。以前就有镜头表的（老项目、剧本定稿以后又改过），照旧摆出来看 */
function lockView(s) {
  return [h('div', { class: 'wf-lock' }, '剧本定稿以后，AI 照剧本提炼梗概、出场的人物场景道具和镜头表。先到「剧本」那一步写好剧本、点「剧本定稿」。', h('button', { class: 'btn ink', onclick: () => go('剧本', { s: s.段 }) }, '← 去写剧本')),
    hasParas(s) || pickCount(s) ? pzPage(s, 'lock') : null];
}
/* 「镜头 1、2、3、4、7 没写作用」缩成「镜头 1～4、7 没写作用」：十几段都没写时，那行小字别太长 */
function shortNos(t) {
  return t.replace(/[0-9]+(?:、[0-9]+)+/g, list => {
    const n = list.split('、').map(Number), out = [];
    for (let i = 0; i < n.length; i++) { let j = i; while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++; out.push(j - i >= 2 ? n[i] + '～' + n[j] : n.slice(i, j + 1).join('、')); i = j; }
    return out.join('、');
  });
}

start({
  name: '分场', title: '提炼', scene: true,
  render() {
    const s = sceneNow(), p = paraState(s);
    if (p.st === 'lock') return lockView(s);
    return pzPage(s, p.st === 'ai' ? 'ai' : s.定稿 ? 'done' : 'edit');
  },
  sides(changed) { const s = sceneNow(); if (s && changed.has(s.段) && !typing() && !window.UI.popOpen) rerender(); },   // AI 提炼好、改好的并进来了：整页重画
  jobDone() { if (!typing()) rerender(); },
});
</script>
