<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文生资产流程图</title>
<style>
:root { --paper: #f4efe6; --sheet: #fffdf9; --ink: #2a2622; --ink-2: #554d45; --ink-3: #887e74; --line: #d6cab6; --zhu: #a83a2c; --dai: #3e5c5e; --huang: #fff4c9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.85 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
main { max-width: 780px; margin: 0 auto; padding: 32px 22px 120px; }
h1 { margin: 0 0 4px; font: 600 26px/1.4 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .08em; }
.sub { margin: 0 0 20px; font-size: 14.5px; color: var(--ink-2); }
h2 { margin: 34px 0 10px; font: 600 19px/1.5 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .1em; }
.fig { padding: 10px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
.key { margin: 8px 4px 0; font-size: 13px; color: var(--ink-3); }
.key i { display: inline-block; width: 14px; height: 10px; margin: 0 4px 0 12px; border: 1px solid; border-radius: 3px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: var(--ink); }
.ts { font-size: 12px; fill: var(--ink-2); }
.tl { font-size: 12.5px; font-weight: 600; fill: var(--ink-2); }
.tn { font-size: 11px; fill: var(--zhu); }
.tg { font-size: 11px; fill: var(--dai); }
.box { fill: #fbf8f1; stroke: var(--line); }
.arr { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
.ok rect { fill: #e3efec; stroke: var(--dai); } .ok .th { fill: #24403f; } .ok .ts { fill: var(--dai); }
.me rect { fill: #fdf3e3; stroke: #b9822f; } .me .th { fill: #6b4a12; } .me .ts { fill: #8a6420; }
.back { stroke: var(--zhu); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.skip { stroke: var(--dai); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.re rect { fill: #fbeeea; stroke: var(--zhu); stroke-dasharray: 4 3; } .re .th { fill: #7a2a1f; } .re .ts { fill: var(--zhu); }
.card { margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.card h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; }
.card h3 .no { display: inline-block; min-width: 1.7em; color: var(--dai); }
.card p { margin: 3px 0; color: var(--ink-2); }
.opts { margin: 8px 0 2px; }
.opts label { display: block; margin: 5px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opts label:hover { background: #faf5ea; }
.opts input { margin-right: 8px; }
.opts .rec { color: var(--dai); font-size: 13px; margin-left: 4px; }
textarea { display: block; width: 100%; margin-top: 8px; min-height: 2.6em; padding: 7px 10px; border: 1px dashed #c8b99f; border-radius: 8px; background: #fffef9; font: 15px/1.7 'Noto Sans SC', 'Microsoft YaHei', sans-serif; color: var(--ink); resize: vertical; }
textarea:focus { outline: none; border-style: solid; border-color: var(--dai); background: #fff; }
textarea.has { border-style: solid; border-color: #b9822f; background: var(--huang); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(255,253,249,.96); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 14px; }
.bar button { padding: 6px 14px; border: 1px solid var(--dai); border-radius: 8px; background: #fff; color: var(--dai); font: inherit; cursor: pointer; }
.bar button:hover { background: #eef5f3; }
#st { color: var(--ink-2); }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-3); }
</style>
</head>
<body>
<main>
<h1>文生资产 · 流程图</h1>
<p class="sub" id="sub"></p>

<div class="fig">
<svg viewBox="0 0 700 980" role="img" aria-label="文生资产流程图">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="190" y="16" width="320" height="56" rx="8"/>
<text class="th" x="350" y="34" text-anchor="middle" dominant-baseline="central">工序一　全片设定</text>
<text class="ts" x="350" y="54" text-anchor="middle" dominant-baseline="central">你写粗的：人物、场景、道具各几句</text>
<line class="arr" x1="350" y1="72" x2="350" y2="94" marker-end="url(#arrow)"/>

<rect class="box" x="190" y="96" width="320" height="56" rx="8"/>
<text class="th" x="350" y="114" text-anchor="middle" dominant-baseline="central">工序二　这一场剧本定稿</text>
<text class="ts" x="350" y="134" text-anchor="middle" dominant-baseline="central">定稿了，资产和提示词才开</text>
<path class="arr" d="M350 152 L350 168 M185 168 L533 168 M185 168 L185 186 M533 168 L533 186"/>

<rect x="6" y="198" width="356" height="574" rx="12" fill="none" stroke="#887e74" stroke-dasharray="5 5"/>
<rect x="45" y="186" width="280" height="24" rx="12" fill="#fffdf9" stroke="#887e74"/>
<text class="tl" x="185" y="198" text-anchor="middle" dominant-baseline="central">工序三　文生资产（人物、场景、道具）</text>
<line class="arr" x1="185" y1="210" x2="185" y2="226" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="228" width="290" height="52" rx="8"/>
<text class="th" x="185" y="246" text-anchor="middle" dominant-baseline="central">① 列清单</text>
<text class="ts" x="185" y="265" text-anchor="middle" dominant-baseline="central">AI 读定稿剧本：要哪些、各要撑住什么</text>
<line class="arr" x1="185" y1="280" x2="185" y2="304" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="306" width="290" height="52" rx="8"/>
<text class="th" x="185" y="324" text-anchor="middle" dominant-baseline="central">② 核旧图</text>
<text class="ts" x="185" y="343" text-anchor="middle" dominant-baseline="central">撑得住就沿用，撑不住你来选</text>
<line class="arr" x1="185" y1="358" x2="185" y2="382" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="384" width="290" height="52" rx="8"/>
<text class="th" x="185" y="402" text-anchor="middle" dominant-baseline="central">③ 写字</text>
<text class="ts" x="185" y="421" text-anchor="middle" dominant-baseline="central">AI 写出图提示词；场景先做 GEO</text>
<line class="arr" x1="185" y1="436" x2="185" y2="460" marker-end="url(#arrow)"/>

<g class="me">
<rect x="40" y="462" width="290" height="52" rx="8"/>
<text class="th" x="185" y="480" text-anchor="middle" dominant-baseline="central">④ 你批字</text>
<text class="ts" x="185" y="499" text-anchor="middle" dominant-baseline="central">AI 照改；你点「照这个出图」</text>
</g>
<line class="arr" x1="185" y1="514" x2="185" y2="538" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="540" width="290" height="52" rx="8"/>
<text class="th" x="185" y="558" text-anchor="middle" dominant-baseline="central">⑤ 出图</text>
<text class="ts" x="185" y="577" text-anchor="middle" dominant-baseline="central">一次一张，AI 先核：缺的、多的</text>
<line class="arr" x1="185" y1="592" x2="185" y2="616" marker-end="url(#arrow)"/>

<g class="me">
<rect x="40" y="618" width="290" height="52" rx="8"/>
<text class="th" x="185" y="636" text-anchor="middle" dominant-baseline="central">⑥ 你批图</text>
<text class="ts" x="185" y="655" text-anchor="middle" dominant-baseline="central">没照字画就改图；要换样子先改字</text>
</g>
<line class="arr" x1="185" y1="670" x2="185" y2="694" marker-end="url(#arrow)"/>

<g class="ok">
<rect x="40" y="696" width="290" height="52" rx="8"/>
<text class="th" x="185" y="714" text-anchor="middle" dominant-baseline="central">⑦ 确认可用</text>
<text class="ts" x="185" y="733" text-anchor="middle" dominant-baseline="central">再出下一张；场景图再核一遍 GEO</text>
</g>

<path class="skip" d="M40 332 L22 332 L22 722 L36 722" marker-end="url(#arrow)"/>
<text class="tg" x="15" y="527" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 15 527)">沿用的、只用文字的：不出图</text>
<path class="back" d="M330 644 L348 644 L348 410 L334 410" marker-end="url(#arrow)"/>
<text class="tn" x="356" y="527" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 356 527)">要换样子：回去改字</text>

<rect x="372" y="198" width="322" height="414" rx="12" fill="none" stroke="#887e74" stroke-dasharray="5 5"/>
<rect x="388" y="186" width="290" height="24" rx="12" fill="#fffdf9" stroke="#887e74"/>
<text class="tl" x="533" y="198" text-anchor="middle" dominant-baseline="central">工序四　提示词（和工序三可以同时做）</text>
<line class="arr" x1="533" y1="210" x2="533" y2="226" marker-end="url(#arrow)"/>

<rect class="box" x="390" y="228" width="286" height="52" rx="8"/>
<text class="th" x="533" y="246" text-anchor="middle" dominant-baseline="central">写提示词</text>
<text class="ts" x="533" y="265" text-anchor="middle" dominant-baseline="central">按条写，定分镜（照旧）</text>
<line class="arr" x1="533" y1="280" x2="533" y2="304" marker-end="url(#arrow)"/>

<rect class="box" x="390" y="306" width="286" height="52" rx="8"/>
<text class="th" x="533" y="324" text-anchor="middle" dominant-baseline="central">⑧ 要关键帧的那一条</text>
<text class="ts" x="533" y="343" text-anchor="middle" dominant-baseline="central">先定取哪一刻：开头、中间、结尾</text>
<line class="arr" x1="533" y1="358" x2="533" y2="382" marker-end="url(#arrow)"/>

<g class="me">
<rect x="390" y="384" width="286" height="52" rx="8"/>
<text class="th" x="533" y="402" text-anchor="middle" dominant-baseline="central">写字 → 你批字</text>
<text class="ts" x="533" y="421" text-anchor="middle" dominant-baseline="central">和资产一样，点「照这个出图」</text>
</g>
<line class="arr" x1="533" y1="436" x2="533" y2="460" marker-end="url(#arrow)"/>

<g class="me">
<rect x="390" y="462" width="286" height="52" rx="8"/>
<text class="th" x="533" y="480" text-anchor="middle" dominant-baseline="central">出图 → 你批图</text>
<text class="ts" x="533" y="499" text-anchor="middle" dominant-baseline="central">要用的图确认了再出；有白模照白模</text>
</g>
<line class="arr" x1="533" y1="514" x2="533" y2="538" marker-end="url(#arrow)"/>

<g class="ok">
<rect x="390" y="540" width="286" height="52" rx="8"/>
<text class="th" x="533" y="558" text-anchor="middle" dominant-baseline="central">关键帧确认可用</text>
<text class="ts" x="533" y="577" text-anchor="middle" dominant-baseline="central">不要关键帧的条，不走这几步</text>
</g>

<path class="back" d="M676 254 L690 254 L690 124 L512 124" marker-end="url(#arrow)"/>
<text class="tn" x="603" y="111" text-anchor="middle" dominant-baseline="central">改戏：回剧本，再定稿</text>
<text class="tn" x="603" y="138" text-anchor="middle" dominant-baseline="central">只重做受影响的</text>

<path class="arr" d="M185 748 L185 836 L340 836 L340 850" marker-end="url(#arrow)"/>
<path class="arr" d="M533 592 L533 836 L360 836 L360 850" marker-end="url(#arrow)"/>
<g class="ok">
<rect x="190" y="852" width="320" height="56" rx="8"/>
<text class="th" x="350" y="870" text-anchor="middle" dominant-baseline="central">你点头一条，出一条样片</text>
<text class="ts" x="350" y="890" text-anchor="middle" dominant-baseline="central">这一条的提示词、参考图都好了</text>
</g>
<line class="arr" x1="350" y1="908" x2="350" y2="928" marker-end="url(#arrow)"/>
<rect class="box" x="230" y="930" width="240" height="38" rx="8"/>
<text class="th" x="350" y="949" text-anchor="middle" dominant-baseline="central">工序五　审片（照旧）</text>
</svg>
<p class="key">颜色：<i style="background:#fbf8f1;border-color:#d6cab6"></i>AI 做 <i style="background:#fdf3e3;border-color:#b9822f"></i>你来批 <i style="background:#e3efec;border-color:#3e5c5e"></i>定下来</p>
</div>

<template id="fig-back">
<div class="fig">
<svg viewBox="0 0 700 324" role="img" aria-label="写提示词时要回头改">
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="re"><rect x="6" y="12" width="128" height="60" rx="8"/>
<text class="th" x="70" y="34" text-anchor="middle" dominant-baseline="central">只改拍法</text>
<text class="ts" x="70" y="54" text-anchor="middle" dominant-baseline="central">机位、动作、东西放哪</text></g>
<line class="arr" x1="134" y1="42" x2="150" y2="42" marker-end="url(#arrow2)"/>
<g class="me"><rect x="152" y="12" width="170" height="60" rx="8"/>
<text class="th" x="237" y="34" text-anchor="middle" dominant-baseline="central">直接改提示词</text>
<text class="ts" x="237" y="54" text-anchor="middle" dominant-baseline="central">剧本、资产都不动</text></g>
<text class="tn" x="340" y="42" dominant-baseline="central">动到已定的站位、样子：回资产复核</text>

<g class="re"><rect x="6" y="92" width="128" height="60" rx="8"/>
<text class="th" x="70" y="114" text-anchor="middle" dominant-baseline="central">要改戏</text>
<text class="ts" x="70" y="134" text-anchor="middle" dominant-baseline="central">谁做什么、先后、台词</text></g>
<line class="arr" x1="134" y1="122" x2="150" y2="122" marker-end="url(#arrow2)"/>
<g class="me"><rect x="152" y="92" width="170" height="60" rx="8"/>
<text class="th" x="237" y="114" text-anchor="middle" dominant-baseline="central">剧本页改，再定稿</text>

<rect class="box" x="340" y="92" width="170" height="60" rx="8"/>
<text class="th" x="425" y="114" text-anchor="middle" dominant-baseline="central">列影响清单</text>

<line class="arr" x1="510" y1="122" x2="526" y2="122" marker-end="url(#arrow2)"/>
<g class="me"><rect x="528" y="92" width="170" height="60" rx="8"/>
<text class="th" x="613" y="114" text-anchor="middle" dominant-baseline="central">你点头，只重做这些</text>
<text class="ts" x="613" y="134" text-anchor="middle" dominant-baseline="central">没列上的照旧，也能全看</text></g>

<g class="re"><rect x="6" y="172" width="128" height="60" rx="8"/>
<text class="th" x="70" y="194" text-anchor="middle" dominant-baseline="central">要加一样资产</text>
<text class="ts" x="70" y="214" text-anchor="middle" dominant-baseline="central">不改戏的</text></g>
<line class="arr" x1="134" y1="202" x2="150" y2="202" marker-end="url(#arrow2)"/>
<g class="me"><rect x="152" y="172" width="170" height="60" rx="8"/>
<text class="th" x="237" y="194" text-anchor="middle" dominant-baseline="central">资产里加一样</text>
<text class="ts" x="237" y="214" text-anchor="middle" dominant-baseline="central">写清要它撑住什么</text></g>
<line class="arr" x1="322" y1="202" x2="338" y2="202" marker-end="url(#arrow2)"/>
<rect class="box" x="340" y="172" width="170" height="60" rx="8"/>
<text class="th" x="425" y="194" text-anchor="middle" dominant-baseline="central">写字→批字→出图→批图</text>

<g class="me"><rect x="528" y="172" width="170" height="60" rx="8"/>
<text class="th" x="613" y="194" text-anchor="middle" dominant-baseline="central">只改挂它的那一条</text>
<text class="ts" x="613" y="214" text-anchor="middle" dominant-baseline="central">别的提示词不动</text></g>

<g class="re"><rect x="6" y="252" width="128" height="60" rx="8"/>

<line class="arr" x1="134" y1="282" x2="150" y2="282" marker-end="url(#arrow2)"/>
<g class="me"><rect x="152" y="252" width="170" height="60" rx="8"/>
<text class="th" x="237" y="274" text-anchor="middle" dominant-baseline="central">退回去</text>

<line class="arr" x1="322" y1="282" x2="338" y2="282" marker-end="url(#arrow2)"/>
<rect class="box" x="340" y="252" width="170" height="60" rx="8"/>
<text class="th" x="425" y="274" text-anchor="middle" dominant-baseline="central">共用的先列谁在用</text>

<line class="arr" x1="510" y1="282" x2="526" y2="282" marker-end="url(#arrow2)"/>
<rect class="box" x="528" y="252" width="170" height="60" rx="8"/>
<text class="th" x="613" y="274" text-anchor="middle" dominant-baseline="central">用到它的标待核对</text>

</div>
</template>

<div id="sections"></div>

<h2>其他意见</h2>
<div class="card"><textarea data-k="其他" placeholder="还有什么想法，写在这里"></textarea></div>

<p class="foot" id="foot"></p>

<div class="bar"><span id="st">在每一块下面的虚线框里写批注，自动存。</span><button id="copy">复制批注</button></div>
