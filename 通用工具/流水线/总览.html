<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 总览</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/资产路径.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="../公用/关键帧绑定.js"></script>
<script src="../公用/镜头作用.js"></script>
<script src="../公用/音色.js"></script>
<script src="../公用/文字描写.js"></script>
<script src="../公用/资产改过.js"></script>
<script src="../公用/资产归类.js"></script>
<script src="../公用/资产照的.js"></script>
<script src="../公用/资产认图.js"></script>
<script src="流水线.js"></script>
<script src="资产旧图.js"></script>
<script>
/* ============================================================
   流水线 · 总览（首页）
   一眼看清走到哪了：各场的 剧本 → 提炼 → 资产 → 提示词 各到哪一步（审片在提示词那一步每条上，11-22 起不单算一步），点哪一格进哪一步；全片设定（梗概、人物、场景、道具）提炼到什么样。
   （11-16 他定：第一步直接写剧本，梗概、人物、场景、道具剧本定稿以后由 AI 提炼，所以「剧本」摆在「全片设定」上面；11-16 晚他又说去掉「分场」这个叫法：分场就是剧本，添加分场改叫添加剧本）
   （原来顶上有一块「接着做」，11-14 他说不需要：从剧本那一行直接进，已删）
   添加剧本、把以前 AI 写的段搬进来，也在这一页。剧本是人自己写的（11-16 晚他定：不让 AI 写剧本，AI 只照批注改；「让 AI 写剧本…」已删）。
   共用的东西（读写流水线.json、顶栏、各场的状态）在 流水线.js。
   ============================================================ */
'use strict';
async function addSceneDlg() {
  const mine = new Set(F.doc.场.map(s => s.段));
  const olds = new Set(F.pj.order.filter(seg => { const sl = F.pj.segs.get(seg); return sl.script.length || sl.shots.length; }));
  const segIn = h('input', { class: 'inp', value: C.nextSeg([...mine, ...F.pj.order]), spellcheck: 'false' });
  const nameIn = h('input', { class: 'inp', placeholder: '可以先空着', maxlength: '24', 'data-focus': '' });
  const err = h('div', { class: 'fld-err' });
  /* 新加的段一律先写初步剧本（11-21 起每段自己选；11-22 他定以后都先写提示词，「先写什么」那一格拿掉了；11-26 他定改回先写剧本，叫初步剧本。以前先写剧本的段照旧） */
  const r = await dialog(close => {
    const ok = () => {
      const seg = C.normSeg(segIn.value.trim());
      if (!segOk(seg)) { err.textContent = '段号只能是数字和 -，如 1-4'; return; }
      if (mine.has(seg)) { err.textContent = '第' + seg + '段已经有剧本了'; return; }
      if (olds.has(seg)) { err.textContent = '第' + seg + '段以前写过剧本：在最下面「以前写的段」里点「搬进流水线」'; return; }
      close({ seg, name: nameIn.value.trim() });
    };
    [segIn, nameIn].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter' && !isComposing(e)) ok(); }));
    return dlgShell('添加剧本 · ' + F.name, '先写初步剧本：想到哪写到哪，AI 照它提炼分镜、找资产，再写完出片。初步剧本只是初稿，成片照它二次创作，可以不一样。这一段的初步剧本、资产、提示词、成片，都放在「' + F.name + '」各处的「第N段」文件夹里。',
      [field('段号', segIn, '写成 集-段，如 1-4；不分集就写 4'), field('名字', nameIn),
        err],
      [h('button', { class: 'btn ghost', onclick: () => close(null) }, '取消'), h('button', { class: 'btn ink', onclick: ok }, '加上')]);
  });
  if (!r) return;
  putScene({ 段: r.seg, 名: r.name, 人物: [], 道具: [], 场景图: [], 表达: '', 段落: [], 定稿: '', 剧本定稿: '', 先写提示词: true });   // 第一步写初步剧本（剧本.html）；梗概、出场的、镜头表等点「提炼分镜」以后 AI 提炼
}
function putScene(s) {
  F.doc.场.push({ 场景文字: [], 人物图: [], 道具图: [], ...s });   // 这一段的图当人物、道具用的（流水线.js 的 SEG_FIELD），先空着
  F.doc.场.sort((a, b) => C.segCompare(a.段, b.段));
  touch(); go('剧本', { s: s.段 });   // 加好了：直接去写这一场的剧本
}

/* ---------- 以前写的段：剧本、镜头表是 AI 写、人批注的 ---------- */
function legacyBlock() {
  const mine = new Set(F.doc.场.map(s => s.段)), rows = [];
  for (const seg of F.pj.order) {
    if (mine.has(seg)) continue;
    const sl = F.pj.segs.get(seg), sc = sl.script.find(e => !e.combined) || sl.script[0], sh = sl.shots[0];
    if (!sc && !sh) continue;
    const title = (sc && sc.title) || (sh && sh.title) || '', n = sh ? sh.doc.shots.length : 0;
    rows.push(h('div', { class: 'fl-old-row' }, h('span', { class: 'fs-no' }, '第' + seg + '段'),
      h('span', { class: 'fl-old-name' }, title || h('span', { class: 'faint' }, '未命名'), n ? h('small', null, n + ' 镜') : null),
      h('span', { class: 'fl-old-acts' },
        h('button', { class: 'btn ghost sm', onclick: () => seeOld(seg, sc ? 'script' : 'shots') }, sc ? '看剧本' : '看镜头表'),
        h('button', { class: 'btn sm', title: '把段名搬过来，剧本里的人物加进人物表、场景并进场景，镜头表一镜一行搬过来。原来的剧本、镜头表文件不动', onclick: () => adopt(seg) }, '搬进流水线'))));
  }
  if (!rows.length) return null;
  return h('section', { class: 'fl-sec fl-old' }, secHead('', '以前写的段', '剧本、镜头表是 AI 写、你批注的'), rows);
}
function adopt(seg) {
  const d = F.doc, sl = F.pj.segs.get(seg), sc = sl.script.find(e => !e.combined) || sl.script[0], sh = sl.shots[0];
  const head = k => { const b = sc && sc.doc.sections[0].blocks.find(x => C.labelOf(x.text) === k); return b ? C.splitLabel(b.text).value.trim() : ''; };
  const cast = C.parseCast(head('人物')).map(c => { if (!d.人物.some(e => e.名 === c.name)) d.人物.push({ 名: c.name, 描写: c.desc, 资产: [] }); return c.name; });
  const place = head('场景').split('｜').map(t => t.trim()).filter(Boolean).join('，');
  if (place && !d.场景.includes(place)) d.场景 = (d.场景.trim() ? d.场景.trim() + '\n' : '') + place;
  const shots = sh ? sh.doc.shots.map(x => ({ 写什么: x.title || '', 作用: '' })) : [];
  putScene({ 段: seg, 名: (sc && sc.title) || (sh && sh.title) || '', 人物: cast, 道具: [], 场景图: [], 表达: '', 段落: shots.length ? shots : [{ 写什么: '', 作用: '' }], 定稿: '', 扩写: '', 剧本定稿: '' });
}

/* ---------- 全片设定五格：各写到什么样，点一格去看、去改（梗概、人物、场景、道具 11-16 起是剧本定稿以后 AI 提炼的；风格 11-14 加：剧本定稿以后照剧本挑） ---------- */
function setupTiles() {
  const d = F.doc, ai = k => k === '场景' ? !!aiText('场景') : KIND[k] ? d[k].some(e => aiText(k, e.名)) : false;
  const tile = (k, note, todo) => h('button', { class: 'wf-tile' + (KINDS.includes(k) ? ' ' + kindCls(k) : '') + (todo ? ' todo' : ''), type: 'button', onclick: () => go('设定', null, k) },
    h('b', null, k), h('span', null, note), ai(k) ? h('em', null, 'AI 补了描写，去看看') : null);
  return h('div', { class: 'wf-tiles' },
    tile('梗概', d.梗概.trim() ? oneLine(d.梗概) : '还没有，剧本定稿以后提炼', false),
    tile('人物', d.人物.length ? d.人物.map(e => e.名).join('、') : '还没有，剧本定稿以后提炼', false),
    tile('场景', d.场景.trim() ? oneLine(d.场景) : '还没有，剧本定稿以后提炼', false),
    tile('道具', d.道具.length ? d.道具.map(e => e.名).join('、') : '还没有', false),
    tile('风格', filmStyle() ? filmStyle().名 + (d.场.some(s => str(s.风格).trim()) ? '（有几段另选）' : '') : '还没定，剧本定稿以后挑', !filmStyle() && d.场.some(s => scriptState(s).st === 'final')));
}
/* ---------- 各场走到哪一步：一场一行，四步各一格；点段名进等你的那一步，都做完了进提示词那一步（出片、审片在那里） ---------- */
function scenesTable() {
  const row = s => {
    const info = stepInfo(s), i = info.findIndex(x => x.st === 'you');
    return h('div', { class: 'wf-row' },
      h('button', { class: 'nm', type: 'button', title: '打开这一段', onclick: () => go(STEPS[i < 0 ? STEPS.length - 1 : i][0], { s: s.段 }) },
        h('span', { class: 'fs-no' }, '第' + s.段 + '段'), h('span', null, s.名.trim() || h('span', { class: 'faint' }, '没起名'))),
      info.map((x, j) => h('span', null, h('button', { class: 'wf-pill ' + x.st, type: 'button', title: x.st === 'lock' ? x.tx + '才能做这一步' : '去这一步', onclick: () => go(STEPS[j][0], { s: s.段 }) },
        x.st === 'ok' ? icon('check') : null, x.tx))));
  };
  const pf = C.pfAll(F.doc.场);   // 段全是写初步剧本的：表头照它的叫法（11-21 他要）
  return h('div', { class: 'wf-table' }, h('div', { class: 'wf-row head' }, h('span', null, pf ? '各段' : '剧本'), STEPS.map(x => h('span', null, x[1] + '　' + (pf && PF_STEP[x[0]] || x[2])))), F.doc.场.map(row));
}
/* ---------- 即梦授权：出片要用即梦账号。一个登录位一行：登没登录、是哪个号、还有多少积分；要登录就拿一个授权链接，你自己在浏览器里点同意。
   登录位是即梦命令行里放账号的位子：默认的一个，另外的号各起一个名字。这一页只记有哪几个名字，不退登、不清凭据 ---------- */
const JM_NAME = /^[A-Za-z0-9_-]{1,40}$/;
const JM = { list: [''], rows: new Map() };
JM.list = ['', ...jmNames()];   // 登记过的登录位（流水线.js）
const jmRow = p => { if (!JM.rows.has(p)) JM.rows.set(p, { res: null, busy: '', link: null, msg: '' }); return JM.rows.get(p); };
const jmSaveList = () => store('antou:flow:jm-list', JM.list.length > 1 ? JSON.stringify(JM.list.slice(1)) : null);
const jmGet = async (method, q, p) => { try { return await (await LINK.req(method, '/api/jimeng?' + q + '&profile=' + encodeURIComponent(p))).json(); } catch (e) { return { ok: false, error: e.message }; } };
const jmData = r => (r && r.data && (r.data.data || r.data)) || {};
const jmErr = r => (r && r.data && r.data.error) || null;   // 即梦命令行自己报的错：{code, reason, message}
const jmSeen = () => { try { return JSON.parse(sessionStorage.getItem('antou:flow:jm-seen') || '{}'); } catch (e) { return {}; } };
async function jmCheck(p) {
  const row = jmRow(p);
  row.busy = '在查…'; row.msg = ''; paintJm();
  row.res = await jmGet('GET', 'x=1', p);
  row.busy = ''; paintJm();
  if (row.res && !row.res.error) { const seen = jmSeen(); seen[p] = { t: Date.now(), res: row.res }; try { sessionStorage.setItem('antou:flow:jm-seen', JSON.stringify(seen)); } catch (e) { /* 存不下就不存 */ } }
}
async function jmLogin(p) {
  const row = jmRow(p);
  row.busy = '在要授权链接…'; row.msg = ''; row.link = null; paintJm();
  const r = await jmGet('POST', 'login', p), d = jmData(r), ch = d.challenge || {};
  row.busy = '';
  if (d.status === 'reused' || d.status === 'logged_in') { await jmCheck(p); row.msg = '已经登录着，不用再授权。'; paintJm(); return; }
  const url = ch.verificationUriComplete || ch.verificationUri;
  if (!url || !ch.deviceCode) { const e = jmErr(r); row.msg = '没拿到授权链接：' + (r.error || (e && (e.message || e.reason)) || r.raw || '即梦命令行没给'); paintJm(); return; }
  row.link = { url, user: ch.userCode || '', code: ch.deviceCode }; paintJm();
  for (let i = 0; i < 8 && row.link && row.link.code === ch.deviceCode; i++) {   // 等你在浏览器里点同意：一次等 50 秒，最多等几分钟
    const w = await jmGet('POST', 'wait&code=' + encodeURIComponent(ch.deviceCode), p), e = jmErr(w);
    if (!row.link || row.link.code !== ch.deviceCode) return;
    if (jmData(w).status === 'logged_in') { row.link = null; await jmCheck(p); row.msg = '授权好了。'; paintJm(); return; }
    if (e && String(e.code) === '40011') continue;   // 只是这一回等的时间到了，接着等
    row.link = null;
    row.msg = e && String(e.code) === '40014' ? '这个授权链接过期了，再点一次「去授权」。' : '这次授权没成：' + (w.error || (e && (e.message || e.reason)) || '即梦命令行没说原因') + '。';
    paintJm(); return;
  }
  if (row.link) { row.link = null; row.msg = '等了几分钟没等到。授权完了点「查一下」。'; paintJm(); }
}
async function jmAdd() {
  const name = await window.UI.inputDlg({ title: '加一个登录位', body: '另一个即梦账号用的位子，起个名字（字母、数字、横线）。即梦命令行里已经有的，填它原来的名字。', label: '名字', ok: '加上',
    check: v => !JM_NAME.test(v) ? '只能用字母、数字、横线、下划线' : JM.list.includes(v) || v === 'default' ? '已经有了' : '' });
  if (!name) return;
  JM.list.push(name); jmSaveList(); paintJm(); jmCheck(name);
}
function jmRowEl(p) {
  const row = jmRow(p), st = row.res && row.res.status, sd = jmData(st), ad = jmData(row.res && row.res.account);
  const logged = !!st && st.ok && sd.loggedIn === true, fail = row.res && (row.res.error || (st && st.error));
  const credits = ad.availableCredits != null ? ad.availableCredits : ad.credits && ad.credits.available;
  const raw = () => dialog(close => { const el = dlgShell('即梦命令行原话 · ' + (p || '默认登录位'), '', [h('pre', { class: 'mdview' }, ((st && st.raw) || '') + (row.res.account ? '\n\n' + (row.res.account.raw || '') : ''))], [h('button', { class: 'btn ink', 'data-focus': '', onclick: () => close() }, '好了')]); el.classList.add('wide'); return el; });
  const state = row.busy ? h('span', { class: 'ai-run' }, h('i', { class: 'wt-ring' }), h('span', { class: 'wt-t' }, row.busy))
    : fail ? h('span', { class: 'fn-note warn' }, fail + '。在普通终端里跑 dreamina-canvas auth status 看看。')
      : !st ? h('span', { class: 'fn-note' }, '还没查')
        : logged ? h('span', { class: 'fs-state ok', title: ad.vipLevel ? '会员：' + ad.vipLevel : '' }, icon('check'), '登录着' + (ad.displayName ? '：' + ad.displayName : '') + (credits != null ? '　积分 ' + credits : ''))
          : h('span', { class: 'fs-state', style: 'color:var(--zhu);border-color:var(--zhu-line)' }, '没登录，或者登录过期了');
  return h('div', { class: 'wf-jm-row' },
    h('div', { class: 'wf-jm-h' }, h('b', null, p || '默认登录位'), state, h('span', { class: 'sp' }),
      st && !fail ? h('button', { class: 'fl-link', type: 'button', onclick: raw }, '看原话') : null,
      h('button', { class: 'btn sm', type: 'button', disabled: !!row.busy, onclick: () => jmCheck(p) }, '查一下'),
      h('button', { class: 'btn sm', type: 'button', disabled: !!row.busy || !!row.link, title: '拿一个授权链接，在登着即梦账号的浏览器里打开、点同意', onclick: () => jmLogin(p) }, '去授权'),
      p ? h('button', { class: 'fl-link', type: 'button', title: '这一页不再列它。不退登，凭据还在', onclick: () => { JM.list = JM.list.filter(x => x !== p); JM.rows.delete(p); jmSaveList(); paintJm(); } }, '不列了') : null),
    row.link ? h('div', { class: 'fl-aibox', style: 'margin-top:10px' }, h('p', null, '在登着即梦账号的浏览器里打开这个链接，点同意（这里在等，授权好了自己会变）：'),
      h('p', null, h('a', { href: row.link.url, target: '_blank', rel: 'noopener', style: 'word-break:break-all;color:var(--dai)' }, row.link.url)),
      row.link.user ? h('p', { class: 'faint small' }, '页面上要是问验证码，填：' + row.link.user) : null,
      h('p', null, h('button', { class: 'fl-link', type: 'button', onclick: () => { row.link = null; row.msg = '不等了。授权完了点「查一下」。'; paintJm(); } }, '不等了'))) : null,
    row.msg ? h('p', { class: 'fn-note', style: 'margin-top:8px' }, row.msg) : null);
}
function jmBody() {
  return [...JM.list.map(jmRowEl), h('div', { class: 'wf-acts' }, h('button', { class: 'btn sm ghost', type: 'button', onclick: jmAdd }, icon('plus'), '加一个登录位'))];
}
function paintJm() { const el = document.getElementById('wf-jm'); if (el) el.replaceChildren(...jmBody().filter(Boolean)); }
/* 打开首页自己查一遍（一个一个来；十分钟里查过的不再查） */
async function jmAuto() {
  if (!AI.ok) return;
  const seen = jmSeen();
  for (const p of JM.list.slice()) {
    const c = seen[p];
    if (c && Date.now() - c.t < 10 * 60e3) { jmRow(p).res = c.res; paintJm(); }
    else await jmCheck(p);
  }
}

function render() {
  const d = F.doc;
  return [
    h('div', { class: 'fl-head' }, h('div', { class: 'fl-kicker' }, '流 水 线'),
      h('div', { class: 'fl-trow' }, h('div', { class: 'fl-title' }, F.name), h('button', { class: 'btn sm', title: '每个项目有自己的流水线。写之前先看一眼是不是这个项目', onclick: pickProject }, icon('folder'), '换项目'))),
    h('section', { class: 'fl-sec' }, secHead('', '剧　本', !d.场.length ? '' : C.pfAll(d.场) ? '一段一条线：写初步剧本 → 提炼分镜 → 资产 → 写完出片（审片在每条提示词上）。点哪一格进哪一步' : '一个剧本一条线：写剧本 → 提炼 → 资产 → 提示词（出片、审片都在这一步）。点哪一格进哪一步'),
      d.场.length ? scenesTable() : h('div', { class: 'fl-empty' }, h('p', null, '还没有剧本。'), h('p', { class: 'faint small' }, '一个一个加，自己写剧本；写完 AI 照你的批注改，定稿以后 AI 提炼梗概、出场的人物场景道具和镜头表。')),
      h('div', { class: 'wf-acts' }, h('button', { class: 'btn sm ink', onclick: addSceneDlg }, icon('plus'), '添加剧本'))),
    h('section', { class: 'fl-sec' }, secHead('', '全片设定', '各段剧本定稿以后 AI 提炼的，各段共用；也能自己改'), setupTiles()),
    legacyBlock(),
    AI.ok ? h('section', { class: 'fl-sec' }, secHead('', '即梦授权', '出片要用即梦账号：看登没登录、是哪个号'), h('div', { id: 'wf-jm' }, jmBody())) : null,
  ];
}

start({ name: '总览', render }).then(jmAuto);
</script>
</body>
</html>
