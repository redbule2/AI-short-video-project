   2026-11-15 他定：白模只当普通素材，可以只管其中几秒，上面这一套不再用。挂白模只补它自己的两句（多一个〔用在哪几秒〕），去掉白模只删它自己的句子（事件脚本里提到它的那一处换成〔〕），

   2026-11-14 加了「出关键帧…」（文生资产流程图 ⑧，他定关键帧在这一步做）：每一条都能出，取哪一刻、参考哪几张图你定，AI 照这一条的分镜写字，你批过点「在 Codex 里出图」（11-23 起和资产一样：开一个 Codex 对话聊，满意了说「定稿」）；

   2026-11-16 加了筛选（第3-4段提示词多，他看不出哪些出过片）：列表上面「全部 / 已出片 / 没出片」，钉在步骤条下面，选的记在这台电脑的浏览器里。
     已出片＝成片/第N段 里有这一条现在这一版出的样片，认法和「审片」弹窗同一套（公用/样片归属.js）：名字里带这一版的记号（提示词01、镜头1-5改6），
     或者以前在审片页选定过它，或者这一段只有一条。出过片的那一条标「已出片 第几条」。
     11-24 他问「没有出片的提示词为什么会有审片按钮」（11-12_改5、13b-14_改2 的片审完收进了历史记录，筛选算没出片，审片却能点）：
     筛选和标签改成和「审片」能不能点同一套（ReviewPop.madeOf）：历史记录/成片 里的也算，全在历史记录里的标「已出片 · 片在历史记录」。
   2026-11-19 筛选那一排最右边加「历史记录」（他要的：默认不摆，点了只看历史记录里收进去的视频提示词：看字、@图片 能点开、和现在的比；流水线/历史记录.js）。
     11-25 他问「历史记录里为什么只能看到提示词、看不到视频」：看历史记录时「全部 / 已出片 / 没出片」照样筛（数历史记录里的几版），
     出过片的那一版标「已出片」、点「审片」弹出审片台，左边放它出的样片、右边是那一版的字（哪一版出的照名字和出片时间认：公用/历史记录.js 的 made）。
   2026-11-21 他定：一条提示词那一行只摆 接着写（AI 写的稿是 进去改）、批准出片、看任务书、审片。
     审片：这一版出过片才能点（没出是灰的），直接到审片那一步、打开这条样片对照看、写批注；这一版出了几条，先挑一条。
     出关键帧…、删除 收进最右边的「⋯」；挂白模、挂关键帧 到写稿页右栏「资产」里点「插入」；看排好的 拿掉了。
   2026-11-22 他定：已经出片的提示词不能改，只能新增提示词（本机服务 filmed.js 认、拦）。这一版出过片（成片、历史记录里有它出的样片，或者正在出片），
     那一行的「接着写」「进去改」换成「另存成改N」：原稿和样片不动，另存成下一版（11-23 起不照抄，见下面）。
     11-24 他定：「打开看、写批注」拿掉，换成「进去看」：打开写稿页，锁着只能看（写稿页顶上那一条也能另存）。
     挂白模的「去掉」、关键帧的「改…」不摆。写稿页打开出过片的那一版也锁着（公用/写稿出过片.js）。
     同一天又定：出过片的那一版「批准出片」灰掉（不再是红的），要再出先另存成新的一版。照本机服务认的「出过片」算，不照「已出片」标签（老名字的样片标签会认到新稿上）。
   2026-11-23 他定：「另存成改N」不许原样照抄（11-12_改3 照抄成改4，又出了一样的片）。点了交给 AI（照例复制给你自己的 AI）：照这一版样片的审片批注、
     这一版提示词上写的批注改，改好的另存成下一版（本机服务 review-fork.js）。一份批注都没有点不了；AI 一处没改就不另存。原稿、样片、审片批注都不动。
     当晚又定：「另存成改N」不看审片、批注，点了打开写稿页照它接着改（公用/写稿出过片.js）；改了提示词或素材才存成新的一版，一处没改不另存（本机服务比，filmed.js）。
     交给 AI 照审片批注改挪进那一行的「⋯」（reviewFork）。
   2026-11-22 他定：审片改成弹窗（流水线/审片弹窗.js），不再单独一页（第五步「审片」拿掉了）。「审片」最新这一版出过片才能点（成片、历史记录里的都算）；
     当晚又定：前几版出过、最新这一版没出的也灰掉。弹窗里摆这一条几版出的样片、能换着看，进去以后换不到别的提示词；复制批注、这条不要了也在弹窗里。
   共用的东西（读写流水线.json、顶栏、步骤条、AI 任务）在 流水线.js。
   ============================================================ */
'use strict';
const X = { tasks: new Set(), notes: new Map(), open: new Set(), vids: [], side: new Map(), map: new Map(), secs: new Map(), dur: new Map(), fw: new Map(), filmed: new Map() };   // filmed：出过片的几版（11-22）   // 出片任务书、AI 批注、展开着的批注；这一段的视频、写稿过程文件、参考素材映射里的登记、视频多长
const PROMPT_BTN = true;   // 「写一条提示词」的入口。2026-11-12 他先说「先收起」，当晚资产确认完想在网页上写，问「为什么没有办法在网页上写」，就放回来了。改成 false 就又收起（已经有的稿照样列）
const taskOf = window.Core.vpTask;   // 视频提示词_02.txt → 出片任务_02.txt；视频提示词_改1.txt → 出片任务_改1.txt；老名字 4-6_补1.txt → 4-6_出片任务_补1.txt（公用/核心.js，和本机服务那头同一份）
const sideOf = name => name.replace(/\.txt$/i, '') + '_写稿.json';
const dirOf = s => [F.name, '提示词', segName(s.段)];
const timeOfFile = (s, name) => { const rec = F.names.get(s.段); return rec && rec.time ? rec.time.get(name) || 0 : 0; };
/* AI 批注的格式（和写稿页是同一个）：总评一行，一条一节 */
function parseNotes(md) {
  const out = { sum: (/^总评[：:][ \t]*(.+)$/m.exec(md) || [])[1] || '', items: [] };
  for (const part of md.split(/^##[ \t]+/m).slice(1)) {
    const f = k => { const m = new RegExp('^-[ \\t]*' + k + '[：:][ \\t]*(.*)$', 'm').exec(part); return m ? m[1].trim() : ''; };
    const it = { where: f('位置') || '整体', lv: f('级别') || '提醒', find: f('原文'), say: f('批注'), why: f('原因'), to: f('改成') };
    if (it.say) out.items.push(it);
  }
  return out;
}
/* 这一页另外要读的：任务书在不在、AI 批注写了什么；这一段文件夹里的视频（挂白模从这里挑）、各份稿的挂图、参考素材映射里的登记 */
const VIDEO_RE = /\.(mp4|mov|m4v|webm)$/i;
async function loadExtra() {
  const s = sceneNow();
  if (!s) return;
  const rec = F.names.get(s.段), names = rec ? [...rec.set] : [];
  X.tasks = new Set(names.filter(n => window.Core.RE_TASK.test(n)));   // 出片任务_改1.txt、老名字的 4-6_出片任务_补1.txt（和 taskOf 一样）
  const notes = new Map();
  for (const n of names) if (/_AI批注\.md$/.test(n)) {
    try { notes.set(n.replace(/_AI批注\.md$/, '.txt'), parseNotes(C.decodeText((await FS.read(at([...dirOf(s), n]))).buf).text)); } catch (e) { /* 读不了就当没有 */ }
  }
  X.notes = notes;
  const ls = lister(F.name), base = AP.segDir(s.段), vids = [];
  const take = (list, dir) => { for (const x of list) if (x.kind === 'file' && VIDEO_RE.test(x.name)) vids.push({ file: base + '/' + (dir ? dir + '/' : '') + x.name, name: x.name.replace(/\.[^.]+$/, ''), dir, mtime: x.mtime || 0 }); };
  const top = await ls(base);
  take(top, '');
  for (const d of top.filter(x => x.kind === 'directory' && !x.name.endsWith(SHOTS_TAIL))) take(await ls(base + '/' + d.name), d.name);
  X.vids = vids.sort((a, b) => (/白模/.test(b.name) - /白模/.test(a.name)) || a.file.localeCompare(b.file, 'zh', { numeric: true }));
  const side = new Map();
  for (const e of promptsOf(s.段)) if (e.draft) { try { side.set(e.name, await readJson(at([...dirOf(s), sideOf(e.name)]))); } catch (err) { /* 读不了就当没有 */ } }
  X.side = side;
  const map = new Map(), secs = new Map(), pre = '提示词/' + segName(s.段) + '/';   // secs：AI 写稿时估的每镜秒数（公用/秒数.js）
  try { for (const [k, v] of Object.entries((await readJson(at([F.name, '资产', '参考素材映射.json']))).prompts || {})) if (k.startsWith(pre)) { map.set(k.slice(pre.length), Array.isArray(v && v.references) ? v.references : []); if (v && v.秒数) secs.set(k.slice(pre.length), v.秒数); } } catch (e) { /* 还没有映射 */ }
  X.map = map; X.secs = secs;
  const filmed = new Map();   // 出过片的几版（11-22，本机服务 filmed.js）：原稿不能改，只能另存
  if (LINK.v >= 22) { try { for (const [n, f] of Object.entries((await (await LINK.req('GET', '/api/filmed?p=' + encodeURIComponent(F.name) + '&s=' + encodeURIComponent(s.段))).json()).版 || {})) filmed.set(n, f); } catch (e) { /* 问不到：照没出过片摆，存的时候服务照样拦 */ } }
  X.filmed = filmed;
  await loadFrameWords(s);
}
/* 出过片的一版另存成下一版（11-22 他定；11-23 晚又定：另存不看审片、批注）：打开写稿页照这一版接着改，
   改了提示词或素材才存成「X_改N」，一处没改就不另存（公用/写稿出过片.js、本机服务 filmed.js）。原稿和它出的样片不动。按钮在 forkBtn */
function forkPrompt(s, e) {

    try { g = await RefFile.find(FS, at([F.name]), r.path, m && m.sha256); } catch (err) { RefPic.show(Promise.reject(err), label, r.path); return; }
    RefPic.show(Promise.resolve(URL.createObjectURL(new Blob([g.bytes], { type: imgType(g.file) }))), label, g.old ? RefFile.note(g) + '：' + g.file : r.path);
  } };
});
</script>
