<script>
/* ============================================================
   流水线 · 提示词（一场的第四道工序）
   这一场的图都确认可用了才开。一条一份提示词、出一条视频（一般 15 秒，Seedance 2.5 最长 30 秒）；镜头在提示词的「分镜」里设计（镜头表那一步 2026-11-12 取消了）。
   分几条你定（2026-11-16 他定）：每写一条先勾它拍镜头表里的哪几个镜头，名字就是镜头号：1-5.txt、4-9.txt（只一个 3.txt，不连着的 1-3、5.txt）。
     老稿（视频提示词.txt、视频提示词_02.txt……）照旧认、照旧用。
   提示词一律 AI 写（照 sd25-pe），只写勾的那几个镜头，可另外写要求；本机服务照名字认这一条拍哪几个镜头。
     点「复制任务，自己交给 AI」，贴进你自己开的对话。写好以后打开看、写批注交给 AI 改；也能「进去改」自己动手改字（他要留着）。
   每镜几秒（2026-11-15 他定）：AI 写稿、照批注改稿时顺手估每一镜几秒，记在参考素材映射这一条的「秒数」（公用/秒数.js）；
     点「批准出片」时时长自动填合计，下面列每镜几秒。估完以后稿子又改过（进去改的），弹窗提醒秒数是改之前估的。
   写好以后：让 AI 批一批（只批不改）→ 你点「批准出片」，选好怎么出，页面排好任务书，就交给 Codex 去即梦出样片。
   出片要花积分：页面只在你点了「批准出片」、在弹窗里又点了一次以后才发出去。2026-11-15 他定：「生成任务书」和「批准出片」合成一个按钮。
   前面（剧本、资产、拍摄风格）在这一条写好以后又动过的，标「待核对」：看一眼，沿用或者改。
   2026-11-13 晚加了白模（和 DeepSeek 商量定的，见 白模与分段_讨论.md；同时加的「分条」一览和「分成几条…」11-13 他说不要，拿掉了）：
     白模：资产/第N段（含下一层文件夹）里的视频挂在某一条上当 @视频N。你来写的稿记在写稿过程文件的「挂图」里、素材段带两句 sd25-pe 白模模板句；
       AI 先写的稿由 AI 登记进参考素材映射。白模在提示词写好以后又重渲过，标「白模改过」。带白模的条批准出片就直接跳过核验，不用另勾（11-15 他定的）。
   2026-11-13 夜加了关键帧（他要的）：资产那一步「关键帧」一块里的图（只这一场用），写提示词时勾几张挂在这一条上当 @图片N，
     素材里照 sd25-pe「关键帧锚点」写好句子（公用/关键帧写法.js，和写稿页同一套），〔〕里这一刻看得见什么要你填；AI 先写的也照勾的这几张写。
     去掉几张：含它编号的句子都删（先摆出来给你看），后面的编号往前挪，不留空号（任务书照编号顺序挂素材）。
     2026-11-15 加（他在写稿页删了「开场参考@图片9」，任务书报编号没连着）：你来写的稿点「批准出片」时先查一遍编号，正文里不再写的号去掉、后面的往前挪，
       正文、挂图、参考素材映射一起挪；挪什么先写在弹窗里，点了才挪（公用/素材编号.js）。AI 写的稿照旧由本机服务拦下。
   2026-11-14 加了删除（他要的）：每条最右边「删除」。不是彻底删：提示词和它的写稿资料、批注、批注截图、AI 批注、出片任务书，用同一个时间移进 历史记录/提示词/第N段（原名__时间）；
     流水线.json 里这一条的「选定」「沿用」、参考素材映射里这一条的登记一起去掉（删了最后一条，再写的会用回这个名字，不能接着用旧的）。样片留在成片里不动；别的条不改名。
   2026-11-14 AI 写的稿（没有写稿资料的）也能「进去改」（他问「我想进去改为什么做不到」）：直接用写稿页打开；回到流水线时写稿页替它建写稿资料（原文先留一版在历史记录），以后就是手写稿（接着写）。
     2026-11-14 在副本上试过：只改一镜，别的字一个不动。
     原来只给「打开看、写批注」（批注交给 AI 改），这个入口还在。
   2026-11-14 白模＋关键帧和普通写法分开（他定：照官方《Seedance 2.5 提示词指南》「粗粒度白模 + 阶段关键帧」的例子）：一条同时挂了白模和关键帧，
     素材里不用 sd25-pe 的关键帧锚点句和白模那一句，换成「以@视频1作为整支视频唯一的运镜……参考」「@图片A至@图片B是各镜头的关键帧……」「所有画面照对应的关键帧……」三句；
     事件脚本每一镜开头写它在白模里的整秒和参考哪张（「镜头1：0-4秒，首帧参考@图片1。」）。秒数照白模旁边「_说明.md」里的切点（一镜一行「镜头1：0-4秒」），没有说明留〔起〕〔止〕。
     新建、挂白模、改关键帧、去掉白模都照这个换；还是普通写法的标「要换成白模＋关键帧写法」，排任务书时本机服务拦下。句子和校对在 公用/白模关键帧写法.js（写稿页、本机服务同一套）。
   2026-11-15 他定：白模只当普通素材，可以只管其中几秒，上面这一套不再用。挂白模只补它自己的两句（多一个〔用在哪几秒〕），去掉白模只删它自己的句子（事件脚本里提到它的那一处换成〔〕），
     关键帧照普通写法；页面不再换写法、不标、不拦。已经一镜一镜写参考哪张的老稿（「@图片…是各镜头的关键帧」）照旧能用，「改关键帧」不替它重排，进去自己改。
   2026-11-14 加了「出关键帧…」（文生资产流程图 ⑧，他定关键帧在这一步做）：每一条都能出，取哪一刻、参考哪几张图你定，AI 照这一条的分镜写字，你批过点「照这个出图」；
     用到的人物、场景、道具图确认可用了才出。挂了白模的，截白模那一刻当第一张参考图。这一条后来改过、参考图换过，标「看一眼」。做法在下面「出关键帧」那一节。
   2026-11-16 加了筛选（第3-4段提示词多，他看不出哪些出过片）：列表上面「全部 / 已出片 / 没出片」，钉在步骤条下面，选的记在这台电脑的浏览器里。
     已出片＝成片/第N段 里有这一条现在这一版出的样片，认法和审片那一步同一套（公用/样片归属.js）：名字里带这一版的记号（提示词01、镜头1-5改6），
     或者审片里选定了它，或者这一段只有一条；审完移进历史记录的不算。出过片的那一条标「已出片 第几条」。
   共用的东西（读写流水线.json、顶栏、步骤条、AI 任务）在 流水线.js。
   ============================================================ */
'use strict';
const X = { tasks: new Set(), notes: new Map(), open: new Set(), vids: [], side: new Map(), map: new Map(), secs: new Map(), dur: new Map(), fw: new Map() };   // 出片任务书、AI 批注、展开着的批注；这一段的视频、写稿过程文件、参考素材映射里的登记、视频多长
const PROMPT_BTN = true;   // 「写一条提示词」的入口。2026-11-12 他先说「先收起」，当晚资产确认完想在网页上写，问「为什么没有办法在网页上写」，就放回来了。改成 false 就又收起（已经有的稿照样列）
const taskOf = window.Core.vpTask;   // 视频提示词_02.txt → 出片任务_02.txt；视频提示词_改1.txt → 出片任务_改1.txt；补片稿 _改2_补1 → 出片任务_改2_补1（公用/核心.js，和本机服务那头同一份）
const sideOf = name => name.replace(/\.txt$/i, '') + '_写稿.json';
const dirOf = s => [F.name, '提示词', segName(s.段)];
const timeOfFile = (s, name) => { const rec = F.names.get(s.段); return rec && rec.time ? rec.time.get(name) || 0 : 0; };
/* AI 批注的格式（和写稿页是同一个）：总评一行，一条一节 */
function parseNotes(md) {
  const out = { sum: (/^总评[：:][ \t]*(.+)$/m.exec(md) || [])[1] || '', items: [] };
  for (const part of md.split(/^##[ \t]+/m).slice(1)) {
    const f = k => { const m = new RegExp('^-[ \\t]*' + k + '[：:][ \\t]*(.*)$', 'm').exec(part); return m ? m[1].trim() : ''; };
    const it = { where: f('位置') || '整体', lv: f('级别') || '提醒', find: f('原文'), say: f('批注'), why: f('原因'), to: f('改成') };
    if (it.say) out.items.push(it);
  }
  return out;
}
/* 这一页另外要读的：任务书在不在、AI 批注写了什么；这一段文件夹里的视频（挂白模从这里挑）、各份稿的挂图、参考素材映射里的登记 */
const VIDEO_RE = /\.(mp4|mov|m4v|webm)$/i;
async function loadExtra() {
  const s = sceneNow();
  if (!s) return;
  const rec = F.names.get(s.段), names = rec ? [...rec.set] : [];
  X.tasks = new Set(names.filter(n => window.Core.RE_TASK.test(n)));   // 出片任务_改1.txt、补片的 出片任务_改2_补1.txt（和 taskOf 一样）
  const notes = new Map();
  for (const n of names) if (/_AI批注\.md$/.test(n)) {
    try { notes.set(n.replace(/_AI批注\.md$/, '.txt'), parseNotes(C.decodeText((await FS.read(at([...dirOf(s), n]))).buf).text)); } catch (e) { /* 读不了就当没有 */ }
  }
  X.notes = notes;
  const ls = lister(F.name), base = '资产/' + segName(s.段), vids = [];
  const take = (list, dir) => { for (const x of list) if (x.kind === 'file' && VIDEO_RE.test(x.name)) vids.push({ file: base + '/' + (dir ? dir + '/' : '') + x.name, name: x.name.replace(/\.[^.]+$/, ''), dir, mtime: x.mtime || 0 }); };
  const top = await ls(base);
  take(top, '');
  for (const d of top.filter(x => x.kind === 'directory' && !x.name.endsWith(SHOTS_TAIL))) take(await ls(base + '/' + d.name), d.name);
  X.vids = vids.sort((a, b) => (/白模/.test(b.name) - /白模/.test(a.name)) || a.file.localeCompare(b.file, 'zh', { numeric: true }));
  const side = new Map();
  for (const e of promptsOf(s.段)) if (e.draft) { try { side.set(e.name, await readJson(at([...dirOf(s), sideOf(e.name)]))); } catch (err) { /* 读不了就当没有 */ } }
  X.side = side;
  const map = new Map(), secs = new Map(), pre = '提示词/' + segName(s.段) + '/';   // secs：AI 写稿时估的每镜秒数（公用/秒数.js）
  try { for (const [k, v] of Object.entries((await readJson(at([F.name, '资产', '参考素材映射.json']))).prompts || {})) if (k.startsWith(pre)) { map.set(k.slice(pre.length), Array.isArray(v && v.references) ? v.references : []); if (v && v.秒数) secs.set(k.slice(pre.length), v.秒数); } } catch (e) { /* 还没有映射 */ }
  X.map = map; X.secs = secs;
  await loadFrameWords(s);
}

/* ---------- 白模：这一条挂了哪几段视频（参考素材映射里的，和你在写稿页、这一页挂上的「挂图」，同一个编号以挂图为准） ---------- */
function refsOf(e, side = X.side.get(e.name)) {   // side：刚读的写稿过程文件（改稿时用，免得拿页面上存的旧挂图）
  const out = new Map();
  for (const r of X.map.get(e.name) || []) if (r && /^@(图片|视频|音频)\d+$/.test(r.ref)) out.set(r.ref, { ref: r.ref, path: String(r.path || '').replace(/\\/g, '/'), from: '映射' });
  for (const [ref, p] of Object.entries((side && side.挂图) || {})) if (/^@(图片|视频|音频)\d+$/.test(ref)) out.set(ref, { ref, path: String(p).replace(/\\/g, '/'), from: '挂图' });
  return [...out.values()];
}
const vidRefs = e => refsOf(e).filter(r => /^@视频\d+$/.test(r.ref));
const vidOf = file => X.vids.find(v => v.file === file) || null;
const stemOfFile = file => file.split('/').pop().replace(/\.[^.]+$/, '');
/* 白模在这条提示词写好以后又重渲过（文件比稿子新，也比你上回点「还对得上」新） */
function bmStale(s, e) {
  const t = timeOfFile(s, e.name);
  if (!t) return false;
  const base = Math.max(t, timeOf(keptOf(s)['白模/' + e.name]));
  return vidRefs(e).some(r => { const v = vidOf(r.path); return !!v && v.mtime > base + 999; });
}
/* sd25-pe 粗粒度白模的写法：〔〕里的要你填（批准出片时还有〔〕就不让出）。11-15 起白模是普通素材，可以只管其中几秒：多填一个用在哪几秒 */
const BM_LINES = ref => [ref + '是粗粒度白模参考，用在〔哪几秒，如第2-4秒；整条都用写整条〕，仅提供〔动作路径、主体站位、机位、运镜和切镜〕，不采用其中的白模外观、材质和场景。', ref + '中的〔哪个白模几何体〕对应〔哪个人物或道具〕。'];
/* 白模旁边「_说明.md」里的切点（一镜一行「镜头1：0-4秒」）：出关键帧时猜白模第几秒用；没有说明就是空的 */
const noteOf = file => file.replace(/\.[^.]+$/, '') + '_说明.md';
async function cutsOfVid(file) {
  const parts = noteOf(file).split('/');
  try { return (await hasFile(F.name, parts)) ? BmKey.cutsOf(C.decodeText((await FS.read(at([F.name, ...parts]))).buf).text) : []; } catch (e) { return []; }
}
const { headKey, isHead, groupEmpty, HOLE } = KeyFrames;   // 组名、素材那一组放句子：和本机服务同一份（公用/关键帧写法.js）
/* 在素材段里插几句（白模这类）：放哪见 KeyFrames.putRef */
function insertRefLines(text, add) {
  const eol = /\r\n/.test(text) ? '\r\n' : '\n';
  return KeyFrames.putRef(text.split(/\r\n|\n/), add).join(eol);
}
/* 去掉含这个编号的那几句；删完只剩组名的，组名和它后面那个空行一起拿掉。别的一个字不动 */
function dropRefLines(text, ref) {   // 11-15：事件脚本里的镜头行不整行删，提到它的那一处换成〔〕（holed）
  const eol = /\r\n/.test(text) ? '\r\n' : '\n', L = text.split(/\r\n|\n/), re = new RegExp(ref + '(?![0-9])'), removed = [], holed = [];
  const s0 = L.findIndex(l => headKey(l) === '【事件脚本】'), s1 = s0 < 0 ? -1 : L.findIndex((l, i) => i > s0 && isHead(l));
  const inShots = i => s0 >= 0 && i > s0 && (s1 < 0 || i < s1);
  for (let i = L.length - 1; i >= 0; i--) if (re.test(L[i])) {
    if (inShots(i)) { L[i] = L[i].replace(new RegExp(ref + '(?![0-9])', 'g'), '〔〕'); holed.unshift(L[i]); }
    else { removed.unshift(L[i]); L.splice(i, 1); }
  }
  for (let i = L.length - 1; i >= 0; i--) {
    if (!/^【(参考素材职责|动作与声音)】$/.test(headKey(L[i]))) continue;
    const next = L[i + 1];
    if (next === undefined || !next.trim() || isHead(next)) L.splice(i, next !== undefined && !next.trim() ? 2 : 1);
  }
  return { text: L.join(eol), removed, holed };
}
/* 改一份你来写的稿：正文和写稿过程文件一起存，用写稿页同一套带版本核对的保存（稿子在别处改过就不写）。
   free：自由模式的稿也改（只换编号这种，正文和分镜稿、自由稿一起换，两种写法对得上）；out.patch：写稿过程文件里另外要换的 */
async function editDraft(s, e, fn, free) {
  const p = at([...dirOf(s), e.name]);
  let raw, side;
  try { raw = new TextDecoder('utf-8', { ignoreBOM: true }).decode((await FS.read(p)).buf); side = await readJson(at([...dirOf(s), sideOf(e.name)])); }
  catch (err) { toast('稿子读不了：' + err.message, 'err'); return false; }
  if (side.写法 === '自由' && !free) { toast('这份稿是自由模式：点「进去改」，在素材里 @ 白模、关键帧（页面不替自由模式的稿改字，免得两种写法对不上）', 'err'); return false; }
  const out = fn(raw, side);
  if (!out) return false;
  const patch = { 挂图: out.挂图, ...(out.patch || {}) }, own = k => Object.prototype.hasOwnProperty.call(side, k);
  const base = {};
  for (const k of ['写法', '写法范围', '分镜稿', '自由稿', '镜头信息', '挂图']) if (own(k)) base[k] = side[k];
  try {
    const r = await fetch(LINK.url(p) + '?draft', { method: 'POST', cache: 'no-store', headers: { 'X-Antou': '1', 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: out.text, baseText: raw, sidePatch: patch, baseEditor: base, archive: out.text !== raw }) });
    if (r.status === 409) throw new Error('稿子刚在别处改过，这回没动');
    if (!r.ok) throw new Error((await r.text()) || '本机服务出错 ' + r.status);
  } catch (err) { toast('没存上：' + err.message, 'err'); return false; }
  const kf = frameWs(s, e);   // 页面替你挂图、换写法改的稿：这一条的关键帧不算「这一条改过」
  if (kf.length) { const t = nowText(); for (const w of kf) keptOf(s)['关键帧/' + w.stem] = t; touch(); }
  await loadSides(); await loadExtra(); rerender();
  return true;
}
/* 挑一段白模：这一段文件夹里的视频，名字带「白模」的排前面；镜头号对得上的标出来 */
function bmSelect(range, cur) {
  const fit = v => range && new RegExp('(^|[^0-9])' + range[0] + (range[1] > range[0] ? '\\s*[-－—–~～]\\s*' + range[1] : '') + '([^0-9]|$)').test(v.name);
  const sel = h('select', { class: 'inp' }, h('option', { value: '' }, '不用白模'),
    X.vids.map(v => h('option', { value: v.file }, (v.dir ? v.dir + ' / ' : '') + v.name + (fit(v) ? '　（镜头号对得上）' : '') + (/白模/.test(v.name) ? '' : '　（名字里没有「白模」）'))));
  sel.value = cur || '';
  return sel;
}
const videoUrl = async file => { const r = await FS.read(at([F.name, ...file.split('/')])); return URL.createObjectURL(new Blob([r.buf], { type: /\.mov$/i.test(file) ? 'video/quicktime' : /\.webm$/i.test(file) ? 'video/webm' : 'video/mp4' })); };
/* 看一段白模：弹窗里放 */
async function seeVideo(file) {
  let url;
  try { url = await videoUrl(file); } catch (e) { toast('打不开：' + e.message, 'err'); return; }
  const v = h('video', { class: 'wf-vid', src: url, controls: '', autoplay: '', playsinline: '' }), info = h('span', { class: 'fn-note' }, file);
  v.addEventListener('loadedmetadata', () => { X.dur.set(file, v.duration); info.textContent = file + '　时长 ' + v.duration.toFixed(1) + ' 秒，' + v.videoWidth + '×' + v.videoHeight; });
  await dialog(close => { const el = dlgShell('看白模 · ' + stemOfFile(file), null, [v, info], [h('button', { class: 'btn ink', 'data-focus': '', onclick: () => close() }, '好了')]); el.classList.add('wide'); return el; });
  v.pause(); URL.revokeObjectURL(url);
}
/* 一段视频多长（秒）：读一遍元数据，记着 */
async function vidSecs(file) {
  if (X.dur.has(file)) return X.dur.get(file);
  const url = await videoUrl(file);
  try {
    const d = await new Promise((res, rej) => { const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = () => res(v.duration); v.onerror = () => rej(new Error('读不出时长')); v.src = url; });
    X.dur.set(file, d); return d;
  } finally { URL.revokeObjectURL(url); }
}
/* 已经写了一半的你来写稿：挂上白模（素材段补两句 sd25-pe 白模写法，记进挂图） */
async function attachBm(s, e) {
  if (!X.vids.length) { toast('资产 / ' + segName(s.段) + ' 里还没有视频：白模渲好放进去，这里就能挑', 'err'); return; }
  const sel = bmSelect(rangeOf(e), ''), err = h('div', { class: 'fld-err' }), fit = [...sel.options].find(o => /镜头号对得上/.test(o.textContent) && /白模/.test(o.textContent));
  if (fit) sel.value = fit.value;   // 名字里镜头号对得上的白模先挑上
  const file = await dialog(close => dlgShell('挂白模 · ' + e.label, '挑一段白模视频挂在这一条上。它和别的素材一样，可以只管其中几秒。页面在素材里补两句 sd25-pe 的白模写法：〔〕里它用在哪几秒、提供什么、哪个几何体对应谁，要你来填（没填完不让出片）。',
    [field('白模视频', sel, '放在 资产 / ' + segName(s.段) + '（含下一层文件夹）里的视频'), h('div', null, h('button', { class: 'fl-link', type: 'button', onclick: () => { if (sel.value) seeVideo(sel.value); } }, '先看一眼')), err],
    [h('button', { class: 'btn ghost', onclick: () => close(null) }, '取消'), h('button', { class: 'btn ink', onclick: () => { if (sel.value) close(sel.value); else err.textContent = '先挑一段白模'; } }, '挂上')]));
  if (!file) return;
  const refFor = (text, side) => {
    const refs = refsOf(e, side), same = refs.find(r => r.path === file && /^@视频/.test(r.ref));
    const used = [...text.matchAll(/@视频(\d+)/g)].map(m => +m[1]).concat(refs.filter(r => /^@视频/.test(r.ref)).map(r => +r.ref.slice(3)));
    return same ? same.ref : '@视频' + (Math.max(0, ...used) + 1);
  };
  const ok = await editDraft(s, e, (text, side) => {   // 11-15 起白模是普通素材：挂着关键帧也不换写法
    const ref = refFor(text, side), hang = { ...(side.挂图 || {}), [ref]: file };
    return { text: new RegExp(ref + '(?![0-9])').test(text) ? text : insertRefLines(text, BM_LINES(ref)), 挂图: hang };
  });
  if (ok) toast('白模挂上了。点「进去改」，把素材里〔〕的几处填上：它用在哪几秒、提供什么、哪个几何体对应谁');
}
/* 去掉白模：素材里含它编号的那几句删掉，事件脚本里提到它的那一处换成〔〕（先摆出来给你看），挂图里也去掉。11-15 起关键帧句子不跟着改 */
async function dropBm(s, e, r) {
  let raw;
  try { raw = C.decodeText((await FS.read(at([...dirOf(s), e.name]))).buf).text; } catch (err) { toast('稿子读不了：' + err.message, 'err'); return; }
  const pre = dropRefLines(raw, r.ref), gone = pre.removed, holed = pre.holed;
  if (!(await confirmDlg({ title: '去掉白模 · ' + e.label, body: (gone.length ? '提示词里含 ' + r.ref + ' 的这 ' + gone.length + ' 句会删掉：' + gone.map(l => '「' + l.trim() + '」').join('') : '')
    + (holed.length ? '事件脚本里这 ' + holed.length + ' 镜提到了它，句子留着，' + r.ref + ' 换成〔〕要你改写：' + holed.map(l => '「' + l.trim() + '」').join('') : '')
    + (gone.length || holed.length ? '' : '提示词里没写 ' + r.ref + '。') + '挂图里也去掉它（' + stemOfFile(r.path) + '）。改之前的一版收进历史记录。', ok: '去掉', danger: true }))) return;
  const ok = await editDraft(s, e, (text, side) => { const m = { ...(side.挂图 || {}) }; delete m[r.ref]; return { text: dropRefLines(text, r.ref).text, 挂图: m }; });
  if (ok) toast(holed.length ? '白模去掉了：事件脚本里有 ' + holed.length + ' 镜提到它的那一处换成了〔〕，打开改写' : '白模去掉了');
}

/* ---------- 关键帧：资产那一步「关键帧」一块里的图（只这一场用），挂在这一条上当 @图片N ---------- */
const isFrameFile = (s, f) => framesOf(s).includes(f) || FRAME_RE.test(stemOfFile(f));
const frameRefsOf = (s, e, side) => KeyFrames.order(refsOf(e, side).filter(r => /^@图片\d+$/.test(r.ref) && isFrameFile(s, r.path)).map(r => ({ ...r, name: stemOfFile(r.path) })));   // side：刚读的写稿过程文件（不给就用页面上存的）
const orderFiles = files => KeyFrames.order(files.map(f => ({ file: f, name: stemOfFile(f) })));
/* 编号别留空号：出片任务书照编号顺序挂素材，空一个号，后面的就全对错了。照 公用/素材编号.js 往前挪（只挪 @图片）：挪过的记进挂图，
   参考素材映射里这一条的登记存好以后跟着挪（moveMapped，11-15 起；以前登记在映射里的就挪不了）。挪不了的（没登记、两处登记对不上）不挪，gap 写为什么 */
function closeGaps(L, hang, mapped) {
  const all = [...[...mapped].map(([ref, path]) => ({ ref, path })), ...Object.entries(hang).map(([ref, path]) => ({ ref, path }))];
  const p = RefNo.plan(L.join('\n'), all, ['图片']);
  if (!p.moves.size) return { L, hang, move: new Map(), gap: p.blocked, renum: null };
  return { L: L.map(l => RefNo.apply(l, p)), hang: RefNo.hang(hang, p, all), move: p.moves, gap: '', renum: p };
}
/* 这一条的关键帧改成 files：重写素材里的关键帧句子（填过的照旧带上），新挂的排编号（先用空着的小号），记进挂图。
   去掉的那几张：它自己那几句（以它的编号开头的）删掉；别的句子里提到它的（比如事件脚本里「开场照@图片8」），句子留着、那一处换成〔〕，要你改写 */
function framePlan(s, e, text, side, files) {
  const eol = /\r\n/.test(text) ? '\r\n' : '\n', hang = { ...((side && side.挂图) || {}) };
  const mapped = new Map((X.map.get(e.name) || []).filter(r => r && /^@图片\d+$/.test(r.ref)).map(r => [r.ref, String(r.path || '').replace(/\\/g, '/')]));
  let L = text.split(/\r\n|\n/);
  const sc = KeyFrames.scan(L), old = refsOf(e, side).filter(r => /^@图片\d+$/.test(r.ref) && (isFrameFile(s, r.path) || sc.refs.includes(r.ref)));
  const oldRefs = old.map(r => r.ref), keep = old.filter(r => files.includes(r.path)), gone = old.filter(r => !files.includes(r.path));
  const had = new Set(L.map((l, i) => isHead(l) && !groupEmpty(L, i) ? headKey(l) : '').filter(Boolean));
  L = L.filter((_, i) => !sc.rows.has(i) || (sc.rows.get(i) && !oldRefs.includes(sc.rows.get(i))));   // 原来的顺序句和这几张的句子先拿掉，下面整组重写
  const removed = [], holed = [];
  for (const r of gone) {
    const re = new RegExp(r.ref + '(?![0-9])', 'g');
    L = L.flatMap(l => {
      if (!l.match(re)) return [l];
      if (l.trim().startsWith(r.ref)) { removed.push(l.trim()); return []; }
      const n = l.replace(re, HOLE); holed.push(n.trim()); return [n];
    });
    if (String(hang[r.ref] || '').replace(/\\/g, '/') === r.path) delete hang[r.ref];
  }
  const taken = new Set();
  for (const l of L) for (const m of l.matchAll(/@图片(\d+)/g)) taken.add(+m[1]);
  for (const k of [...Object.keys(hang), ...mapped.keys()]) if (/^@图片\d+$/.test(k)) taken.add(+k.slice(3));
  const next = () => { let n = 1; while (taken.has(n)) n++; taken.add(n); return '@图片' + n; };
  const list = orderFiles(files).map(x => { const k = keep.find(r => r.path === x.file); return { ...x, ref: k ? k.ref : next(), desc: k ? sc.desc.get(k.ref) || '' : '' }; });
  for (const x of list) hang[x.ref] = x.file;
  L = KeyFrames.put(L, KeyFrames.lines(list));
  for (let i = L.length - 1; i >= 0; i--) if (/^【(参考素材职责|场景)】$/.test(headKey(L[i])) && had.has(headKey(L[i])) && groupEmpty(L, i)) L.splice(i, L[i + 1] !== undefined && !L[i + 1].trim() ? 2 : 1);   // 原来有句子、这回删空了的组
  const c = closeGaps(L, hang, mapped), fixed = list.map(x => ({ ...x, ref: c.move.get(x.ref) || x.ref }));
  if (c.move.size && fixed.length > 1) for (const [i, r] of KeyFrames.scan(c.L).rows) if (r === '') c.L[i] = KeyFrames.lines(fixed)[0];   // 挪过号的，顺序句照新编号再写一遍（连着的写成「至」）
  return { text: c.L.join(eol), hang: c.hang, removed, holed: holed.map(l => l.replace(/@图片(\d+)/g, (m, d) => c.move.get('@图片' + d) || m)), gap: c.gap, moved: c.move.size > 0, list: fixed,
    renum: c.renum, gone: gone.map(r => ({ ref: r.ref, path: r.path })) };   // 存好以后参考素材映射照这两样改（moveMapped）
}
/* 挂关键帧、改关键帧：勾这一条要用的几张（已经挂着的先勾上），按镜头号排，第一张当首帧 */
async function framesDlg(s, e) {
  let raw;
  try { raw = C.decodeText((await FS.read(at([...dirOf(s), e.name]))).buf).text; } catch (err) { toast('稿子读不了：' + err.message, 'err'); return; }
  const lines = raw.split(/\r\n|\n/), sc = KeyFrames.scan(lines);
  const cur = refsOf(e).filter(r => /^@图片\d+$/.test(r.ref) && (isFrameFile(s, r.path) || sc.refs.includes(r.ref)));
  const files = orderFiles([...new Set([...framesOf(s), ...cur.map(r => r.path)])]).map(x => x.file);
  if (!files.length) { toast('这一段还没有关键帧：资产那一步「关键帧」一块里先放上（资产 / ' + segName(s.段) + ' 里名字带首帧、尾帧、关键帧的图自动列上）', 'err'); return; }
  const picks = new Set(cur.map(r => r.path)), range = rangeOf(e), refOf = f => (cur.find(r => r.path === f) || {}).ref || '';
  if (!cur.length && range) for (const f of files) { const n = KeyFrames.noOf(stemOfFile(f)); if (n != null && n >= range[0] && n <= range[1] && /首帧/.test(stemOfFile(f))) picks.add(f); }   // 老稿名字里带着段落：这几镜的首帧先勾上
  const two = lines.some(l => /^【(人物|道具|场景|动作与声音)】$/.test(headKey(l)));
  if (BmKey.isBmk(lines)) { toast('这一条的关键帧是一镜一镜写参考哪张的（「…是各镜头的关键帧」那一句）：页面不替它重排，打开稿子自己改', 'err'); return; }   // 11-15
  const grid = h('div', { class: 'fl-ag' }), sum = h('div', { class: 'fn-note' });
  const roleOf = (list, i) => KeyFrames.roleOf(list, i);
  const paint = () => {
    const list = orderFiles([...picks]);
    grid.replaceChildren(...files.map(f => {
      const i = list.findIndex(x => x.file === f);
      return tileEl({ 类别: '关键帧', 文件: f, 名称: stemOfFile(f) }, i >= 0, i >= 0 ? roleOf(list, i) + (refOf(f) ? ' · ' + refOf(f) : '') : refOf(f) ? '现在挂着，这回去掉' : '', () => { picks.has(f) ? picks.delete(f) : picks.add(f); paint(); });
    }));
    sum.textContent = list.length ? '挂 ' + list.length + ' 张：' + list.map((x, i) => x.name + '（' + roleOf(list, i) + '）').join('、') : cur.length ? '一张都不挂：素材里的关键帧句子都删掉。' : '还没勾。';
  };
  paint();
  const ok = await dialog(close => {
    const el = dlgShell((cur.length ? '改关键帧 · ' : '挂关键帧 · ') + e.label, '勾这一条要用的关键帧（资产那一步「关键帧」一块里的）。'
      + ('按镜头号排：第一张当首帧，后面依次是第二、第三个关键帧，最后一张名字带「尾帧」的当尾帧。页面在素材' + (two ? '【场景】' : '【参考素材职责】') + '最前面写好 sd25-pe 的关键帧句子，〔〕里这一刻看得见什么要你来填（没填完不让出片）。')
      + '图里画了爆炸、烟、火的，挂上会被钉住不动，先看一眼。',
      [h('div', { class: 'fl-apick' }, grid), sum],
      [h('button', { class: 'btn ghost', onclick: () => close(false) }, '取消'), h('button', { class: 'btn ink', onclick: () => close(true) }, '好了')]);
    el.classList.add('wide');
    return el;
  });
  if (!ok) return;
  const want = orderFiles([...picks]).map(x => x.file), side0 = X.side.get(e.name) || {};
  const shape = (text, side) => framePlan(s, e, text, side, want);
  const plan = shape(raw, side0);
  if (plan.text === raw && JSON.stringify(plan.hang) === JSON.stringify(side0.挂图 || {})) { toast('关键帧没有变'); return; }
  if ((plan.removed.length || plan.holed.length) && !(await confirmDlg({ title: '去掉关键帧 · ' + e.label,
    body: (plan.removed.length ? '这 ' + plan.removed.length + ' 句是去掉的那几张自己的，会删掉：' + plan.removed.map(l => '「' + l + '」').join('') : '')
      + (plan.holed.length ? '这 ' + plan.holed.length + ' 句提到了去掉的那几张，句子留着，那一处换成〔〕，要你点「进去改」改写：' + plan.holed.map(l => '「' + l + '」').join('') : '')
      + (plan.moved ? '后面的编号往前挪，不留空号。' : '') + '改之前的一版收进历史记录。', ok: '去掉', danger: true }))) return;
  let last = plan;
  const done = await editDraft(s, e, (text, side) => { last = shape(text, side); return { text: last.text, 挂图: last.hang }; });
  if (!done) return;
  let mapErr = '';
  try { if (await moveMapped(s, e, last.renum, last.gone)) { await loadExtra(); rerender(); } } catch (err) { mapErr = err.message; }   // 参考素材映射里登记的：去掉的那几张、挪过的编号跟着改
  toast((want.length ? '关键帧挂好了（' + want.length + ' 张：' + last.list.map(x => x.ref).join('、') + '）。点「进去改」，把素材里〔〕的几处填上' : '关键帧都去掉了')
    + (last.holed.length ? '；有 ' + last.holed.length + ' 句提到去掉的那几张，那一处换成了〔〕，要改写' : '')
    + (last.gap ? '。编号没理顺：' + last.gap + '，批准出片时会拦下' : '')
    + (mapErr ? '。注意：参考素材映射没跟着改（' + mapErr + '），批准出片时会拦下' : ''), last.gap || mapErr ? 'err' : undefined);
}
/* ---------- 编号别留空号（11-15）：写稿页里删了某张图的句子（比如「开场参考@图片9」），正文里就不再写它；即梦照挂的先后编号，后面的就全对错了。
   排任务书以前算一遍（公用/素材编号.js）：要挪的先写在弹窗里，点「批准出片」才挪——正文、挂图、参考素材映射一起挪，改之前的一版收进历史记录。
   只替你来写的稿挪；AI 写的稿照旧由本机服务拦下 ---------- */
const mapKeyOf = (s, e) => ['提示词', segName(s.段), e.name].join('/');
const hangRegs = side => Object.entries((side && side.挂图) || {}).map(([ref, path]) => ({ ref, path }));
async function mappedOf(s, e) {   // 参考素材映射里这一条登记的（现读，不用页面上存的）
  try {
    if (!(await hasFile(F.name, ['资产', '参考素材映射.json']))) return [];
    const j = await readJson(at([F.name, '资产', '参考素材映射.json'])), v = j && j.prompts && j.prompts[mapKeyOf(s, e)];
    return (v && Array.isArray(v.references) ? v.references : []).filter(r => r && r.ref).map(r => ({ ref: r.ref, path: String(r.path || '').replace(/\\/g, '/') }));
  } catch (err) { return []; }
}
/* 有空号返回 { p: RefNo.plan 的结果, mapped }，编号连着返回 null */
async function gapOf(s, e) {
  let text, side = {};
  try { text = C.decodeText((await FS.read(at([...dirOf(s), e.name]))).buf).text; } catch (err) { return null; }
  if (e.draft) { try { side = await readJson(at([...dirOf(s), sideOf(e.name)])); } catch (err) { return null; } }
  const mapped = await mappedOf(s, e), p = RefNo.plan(text, [...mapped, ...hangRegs(side)]);
  return p.moves.size || p.blocked ? { p, mapped } : null;
}
const samePlan = (a, b) => JSON.stringify([[...a.moves], a.dropped]) === JSON.stringify([[...b.moves], b.dropped]);
async function fixGaps(s, e, g) {
  let p = null, stale = false, before = '', after = '';
  const ok = await editDraft(s, e, (text, side) => {
    const all = [...g.mapped, ...hangRegs(side)], q = RefNo.plan(text, all);
    if (q.blocked || !q.moves.size || !samePlan(q, g.p)) { stale = true; return null; }   // 稿子刚在别处改过：这回不挪
    p = q; before = text; after = RefNo.apply(text, q);
    const patch = {};
    for (const k of ['分镜稿', '自由稿']) if (typeof side[k] === 'string') patch[k] = RefNo.apply(side[k], q);
    return { text: after, 挂图: RefNo.hang(side.挂图, q, all), patch };
  }, true);
  if (!ok) { if (stale) toast('稿子刚在别处改过，编号这回没挪：再点一次「批准出片」', 'err'); return false; }
  try { await moveMapped(s, e, p); }   // 挂图里已经记了挪过的号：这一步万一没成，任务书会拦下，不会挂错图
  catch (err) { toast('稿子里的编号挪好了，参考素材映射没跟着挪（' + err.message + '），这回没出片', 'err'); await loadExtra(); rerender(); return false; }
  try { await remarkSecs(s, e, before, after); } catch (err) { /* 记号没跟上：出片弹窗多提醒一句，不碍事 */ }
  await loadExtra(); rerender();
  return true;
}
/* 只挪了编号，镜头没变：AI 估的秒数还算数，指纹换成挪过以后的（不然出片弹窗会说「估完以后改过」） */
async function remarkSecs(s, e, before, after) {

    h('div', { class: 'wf-item-h' }, h('b', null, e.label), h('span', { class: 'faint small' }, e.name), madeTag(made), e.draft ? h('span', { class: 'fs-state', title: '在写稿页里改过：AI 估的每镜秒数可能不准，出片时会提醒' }, '改过') : null,
      stale ? [h('span', { class: 'fs-state', style: 'color:var(--zhu);border-color:var(--zhu-line)', title: imp ? '剧本重新定稿了，AI 对新旧剧本说这一条要再看：' + imp.为什么 : '这一条写好以后，前面（剧本、资产、拍摄风格）又动过。打开看一眼还对得上' }, imp ? '剧本改了，待核对' : '待核对'),

/* ---------- 筛选（11-16）：全部 / 已出片 / 没出片。选的记在这台电脑的浏览器里，各段、各项目都照它；钉在步骤条下面 ---------- */

function render() {

/* 字里的 @图片N 点开看大图（公用/点图.js）：照它所在的那一条提示词认图；从一条里打开的弹窗（看改了哪儿、看任务书）照那一条认 */
