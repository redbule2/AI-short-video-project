<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>先写提示词模式 · 流程图</title>
<style>
:root { --paper: #f4efe6; --sheet: #fffdf9; --ink: #2a2622; --ink-2: #554d45; --ink-3: #887e74; --line: #d6cab6; --zhu: #a83a2c; --dai: #3e5c5e; --huang: #fff4c9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.85 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
main { max-width: 780px; margin: 0 auto; padding: 32px 22px 120px; }
h1 { margin: 0 0 4px; font: 600 26px/1.4 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .08em; }
.sub { margin: 0 0 20px; font-size: 14.5px; color: var(--ink-2); }
h2 { margin: 34px 0 10px; font: 600 19px/1.5 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .1em; }
.fig { padding: 10px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
.key { margin: 8px 4px 0; font-size: 13px; color: var(--ink-3); line-height: 2; }
.key i { display: inline-block; width: 14px; height: 10px; margin: 0 4px 0 12px; border: 1px solid; border-radius: 3px; vertical-align: -1px; }
.key i.pill { width: 22px; border-radius: 6px; }
.key i.dash { width: 22px; height: 0; border: 0; border-top: 1.5px dashed var(--zhu); border-radius: 0; vertical-align: 3px; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: var(--ink); }
.ts { font-size: 12px; fill: var(--ink-2); }
.tl { font-size: 12.5px; font-weight: 600; fill: var(--ink-2); }
.tn { font-size: 11px; fill: var(--ink-3); }
.tr { font-size: 11px; fill: var(--zhu); }
.arr { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
.back { stroke: var(--zhu); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.me rect { fill: #fdf3e3; stroke: #b9822f; } .me .th { fill: #6b4a12; } .me .ts { fill: #8a6420; }
.ai rect { fill: #fbf8f1; stroke: var(--line); }
.ok rect { fill: #e3efec; stroke: var(--dai); } .ok .th { fill: #24403f; }
.tg text { font-size: 11.5px; font-weight: 600; }
.tg.new rect { fill: #eef3fb; stroke: #5b7aa6; } .tg.new text { fill: #2c4466; }
.tg.old rect { fill: #e3efec; stroke: var(--dai); } .tg.old text { fill: #24403f; }
.tg.mod rect { fill: var(--huang); stroke: #b9822f; } .tg.mod text { fill: #6b4a12; }
.card { margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.card h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; }
.card h3 .no { display: inline-block; min-width: 1.7em; color: var(--dai); }
.card p { margin: 3px 0; color: var(--ink-2); }
.opts { margin: 8px 0 2px; }
.opts label { display: block; margin: 5px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opts label:hover { background: #faf5ea; }
.opts input { margin-right: 8px; }
.opts .rec { color: var(--dai); font-size: 13px; margin-left: 4px; }
textarea { display: block; width: 100%; margin-top: 8px; min-height: 2.6em; padding: 7px 10px; border: 1px dashed #c8b99f; border-radius: 8px; background: #fffef9; font: 15px/1.7 'Noto Sans SC', 'Microsoft YaHei', sans-serif; color: var(--ink); resize: vertical; }
textarea:focus { outline: none; border-style: solid; border-color: var(--dai); background: #fff; }
textarea.has { border-style: solid; border-color: #b9822f; background: var(--huang); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(255,253,249,.96); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 14px; }
.bar button { padding: 6px 14px; border: 1px solid var(--dai); border-radius: 8px; background: #fff; color: var(--dai); font: inherit; cursor: pointer; }
.bar button:hover { background: #eef5f3; }
#st { color: var(--ink-2); }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-3); }
/* 两种模式并排 */
.modes { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
.modes .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; font-size: 14px; }
.modes .lab { width: 8.5em; color: var(--ink-3); font-size: 13px; }
.modes .chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.modes .chip.new { background: #eef3fb; border-color: #5b7aa6; color: #2c4466; font-weight: 600; }
.modes .chip.mod { background: var(--huang); border-color: #b9822f; color: #6b4a12; }
.modes .to { color: #b0a698; }
.modes .say { margin: 8px 0 0; font-size: 13.5px; color: var(--ink-2); }
/* 举个例子：四格 */
.eg4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.eg4 > div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); font-size: 13.5px; line-height: 1.8; }
.eg4 b { display: block; margin-bottom: 4px; font-size: 14.5px; }
.eg4 b .n { color: var(--dai); margin-right: 4px; }
.eg4 .free { padding: 6px 10px; border-radius: 8px; background: #fdf3e3; color: #4a3a22; }
.eg4 .ln { padding: 1px 0; border-bottom: 1px dotted #e5dccd; }
.eg4 .ln:last-child { border-bottom: 0; }
.eg4 .s { color: var(--ink-3); font-size: 12.5px; }
.eg4 .y { color: var(--dai); font-weight: 600; }
.eg4 .x { color: var(--zhu); font-weight: 600; }
.eg4 .w { color: #8a6420; font-weight: 600; }
.eg4 .sec { color: var(--dai); }
.eg4 .why { margin-top: 4px; color: var(--ink-3); font-size: 12.5px; }
@media (max-width: 640px) { .eg4 { grid-template-columns: 1fr; } .modes .lab { width: 100%; } }
</style>
</head>

const SECTIONS = [

    { id: 's1', no: '①', t: '你写一段提示词', p: [
