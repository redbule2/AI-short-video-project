<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 审片</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="流水线.js"></script>
<script>
/* ============================================================
   流水线 · 审片（一场的第五道工序）
   这一场出的样片都在 成片/第N段。一条一条看、写批注（用的是「项目管理」里审片那一样）：
     满意：选定它是哪一条提示词的成品；每一条都选定了，再连起来检查衔接，点「这一场定稿」。
     不满意、东西不改：回「提示词」那一步再批准出一条。
     不满意、要改：让 AI 照批注说说该回哪一道工序，你定了回哪一道就去哪一道改。
   没选上的样片及时移进 历史记录/成片/第N段（批注跟着一起移，名字不改）。
   共用的东西（读写流水线.json、顶栏、步骤条、AI 任务）在 流水线.js。
   ============================================================ */
'use strict';
const X = { tips: new Map(), open: new Set() };   // 视频名 → AI 的建议；展开着的建议
const stemOf2 = n => n.replace(/\.[^.]+$/, '');
const dirOf = s => [F.name, '成片', segName(s.段)];
async function loadExtra() {
  const s = sceneNow();
  if (!s) return;
  X.tips = new Map();
  for (const n of clipsOf(s.段).all) if (/_AI建议\.md$/.test(n)) {
    try { X.tips.set(n.replace(/_AI建议\.md$/, ''), C.decodeText((await FS.read(at([...dirOf(s), n]))).buf).text); } catch (e) { /* 读不了就当没有 */ }
  }
}
const selOf = s => (s.选定 && typeof s.选定 === 'object' ? s.选定 : (s.选定 = {}));
/* 这条样片是哪一条提示词的：选定过的照选定的；没选过，名字里带着「镜头a-b」的先猜它，只有一条提示词就是它 */
function guess(s, vid, list) {
  const hit = list.find(e => selOf(s)[e.name] === vid);
  if (hit) return hit.name;
  const by = list.find(e => e.label !== '整场' && vid.includes(e.label));
  return by ? by.name : list.length === 1 ? list[0].name : '';
}
/* 没选上的样片：移进 历史记录/成片/第N段，批注、截图、AI 建议跟着一起移，名字不改 */
async function retire(s, vid) {
  if (!(await confirmDlg({ title: '这条不要了', body: vid + ' 移进这个项目的「历史记录 / 成片 / ' + segName(s.段) + '」，它的批注、截图跟着一起移，名字不改。', ok: '移进历史记录' }))) return;
  const all = clipsOf(s.段).all, stem = stemOf2(vid), dest = [F.name, '历史记录', '成片', segName(s.段)];
  const names = [vid, stem + '_批注.md', stem + '_AI建议.md'].filter(n => all.has(n));
  try {
    for (const n of names) await FS.move(at([...dirOf(s), n]), at([...dest, n]));
    if (await FS.isDir(at([...dirOf(s), stem + '_批注截图']))) await FS.move(at([...dirOf(s), stem + '_批注截图']), at([...dest, stem + '_批注截图']));
  } catch (e) { toast('没移走：' + e.message, 'err'); }
  const sel = selOf(s);
  for (const k of Object.keys(sel)) if (sel[k] === vid) { delete sel[k]; s.成片定稿 = ''; }
  touch(); await flush(); await loadSides(); await loadExtra(); rerender();
}
/* 回头改：回哪一道由你定 */
function backMenu(anchor, s) {
  popover(anchor, close => [h('div', { class: 'fl-pop-h' }, '回哪一道工序改'),
    h('div', { class: 'fl-pl' }, [['设定', '工序一　全片设定', '人物、场景、道具写得不对'], ['分场', '工序二　段落', '这一场的事要改'], ['剧本', '工序二　剧本', '台词、动作要改'], ['资产', '工序三　资产', '长相、道具的样子不对'], ['提示词', '工序四　提示词', '镜头、表演的写法要改；或者只是重出一条']]
      .map(([page, name, why]) => h('button', { type: 'button', class: 'fl-pi', onclick: () => { close(); go(page, page === '设定' ? null : { s: s.段 }); } }, h('span', { class: 'pn' }, h('b', null, name), h('small', null, why))))),
    h('div', { class: 'fl-pop-f' }, h('span', { class: 'fn-note' }, '改了前面的东西，后面用到它的会标成「待核对」。'))]);
}
function cardOf2(s, vid, list) {
  const sel = selOf(s), mine = Object.keys(sel).find(k => sel[k] === vid), stem = stemOf2(vid), all = clipsOf(s.段).all;
  const noted = all.has(stem + '_批注.md'), tip = X.tips.get(stem), open = X.open.has(stem), job = jobOf('审片建议', s.段, j => j.视频 === vid);
  const stale = !!mine && clipStale(s, mine, vid);   // 选定以后，它那条提示词或者前面几道又动过
  const pick = h('select', { class: 'ai-ch-sel', title: '这条样片是哪一条提示词出的' }, [h('option', { value: '' }, '是哪一条的？'), ...list.map(e => h('option', { value: e.name }, e.label))]);
  pick.value = guess(s, vid, list);
  const choose = () => {
    if (!pick.value) { toast('先选它是哪一条提示词的成品', 'err'); return; }
    sel[pick.value] = vid; s.成片定稿 = ''; touch(); rerender();
    toast('选定了：' + labelOf2(pick.value) + ' 用这一条');
  };
  const drop = () => { delete sel[mine]; s.成片定稿 = ''; touch(); rerender(); };
  return h('div', { class: 'wf-item' + (mine ? ' picked' : '') },
    h('div', { class: 'wf-item-h' }, h('b', null, stem), mine ? h('span', { class: 'fs-state ok' }, icon('check'), '选定：' + labelOf2(mine)) : null, noted ? h('span', { class: 'fs-state', title: '这条写过批注' }, '有批注') : null,
      stale ? [h('span', { class: 'fs-state', style: 'color:var(--zhu);border-color:var(--zhu-line)', title: '这条样片出了以后，它那条提示词改过，或者前面（剧本、资产）又动过。再看一遍还能不能用' }, '待核对'),
        h('button', { class: 'fl-link', type: 'button', title: '看过了，这条还能用', onclick: () => { keepAsIs(s, '样片/' + vid); rerender(); } }, '还能用，沿用')] : null,
      h('span', { class: 'sp' }),
      h('button', { class: 'btn sm ink', type: 'button', title: '看样片，停在哪一帧就在哪一帧写批注', onclick: () => openShell(at([...dirOf(s), vid]), stem) }, icon('play'), '看片、写批注'),
      mine ? h('button', { class: 'btn sm ghost', type: 'button', onclick: drop }, '不选它了') : [pick, h('button', { class: 'btn sm', type: 'button', title: '满意：这一条提示词就用这条样片', onclick: choose }, '满意，选定')]),
    h('div', { class: 'wf-item-task' },
      jobLive(job) ? jobLine(job) : h('button', { class: 'btn sm', type: 'button', disabled: !noted || !AI.ok, title: noted ? '让 ' + chName() + ' 照你的批注说说：要改什么、建议回哪一道工序、会波及哪些' : '先点「看片、写批注」写下哪里不满意', onclick: () => startJob({ 事: '审片建议', 段: s.段, 视频: vid }).then(rerender) }, '不满意：让 AI 说说回哪一道'),
      jobLive(job) ? null : jobFailed('审片建议', s.段, j => j.视频 === vid),
      h('button', { class: 'btn sm', type: 'button', onclick: e => backMenu(e.currentTarget, s) }, '回头改…'),
      h('span', { class: 'sp' }),
      mine ? null : h('button', { class: 'fl-link', type: 'button', title: '没选上的样片移进历史记录', onclick: () => retire(s, vid) }, '这条不要了')),
    tip ? h('div', { class: 'fl-aibox' }, h('div', { class: 'fl-aibox-h' }, 'AI 的建议', h('span', { class: 'sp' }),
      h('button', { class: 'fl-link', type: 'button', onclick: () => { open ? X.open.delete(stem) : X.open.add(stem); rerender(); } }, open ? '收起' : '展开')),
      open ? h('pre', { class: 'mdview', style: 'max-height:none' }, tip.replace(/^# .*\n+/, '')) : h('p', { class: 'faint' }, tip.replace(/^# .*\n+/, '').split('\n').filter(l => l.trim()).pop() || '点「展开」看')) : null);
}
const labelOf2 = name => name.replace(/_?视频提示词\.txt$/i, '') || '整场';
function render() {
  const s = sceneNow(), seg = s.段;
  if (promptState(s).st !== 'ok') {
    if (!promptsOf(seg).length) return h('div', { class: 'wf-lock' }, '这一场还没有提示词。有了提示词、出了样片，再来审。',
      h('button', { class: 'btn ink', onclick: () => go('提示词', { s: seg }) }, '← 去提示词那一步'));
    const info = stepInfo(s), i = info.findIndex(x => x.st !== 'ok'), k = i < 0 || i > 3 ? 3 : i;   // 前面哪一步还没核对完
    return h('div', { class: 'wf-lock' }, '前面有改动，还没核对完：「' + STEPS[k][2] + '」那一步是「' + info[k].tx + '」。核对完了再来审。',
      h('button', { class: 'btn ink', onclick: () => go(STEPS[k][0], { s: seg }) }, '← 去' + STEPS[k][2]));
  }
  const list = promptsOf(seg), vids = clipsOf(seg).vids, sel = selOf(s), done = list.filter(e => sel[e.name] && vids.includes(sel[e.name]));
  const stales = done.filter(e => clipStale(s, e.name, sel[e.name]));
  const all = done.length === list.length && !stales.length, next = F.doc.场[F.doc.场.indexOf(s) + 1], making = AI.jobs.filter(j => j.事 === '出片' && j.段 === seg && jobLive(j));
  const toNext = () => { const i = stepInfo(next).findIndex(x => x.st === 'you'); go(STEPS[i < 0 ? 0 : i][0], { s: next.段 }); };
  const finish = async () => {
    if (!(await confirmDlg({ title: '第' + seg + '场定稿', body: '选定的 ' + list.length + ' 条：' + list.map(e => e.label + ' → ' + stemOf2(sel[e.name])).join('；') + '。定稿前把它们连起来看一遍，动作、声音、剧情接得上。', ok: '衔接没问题，定稿' }))) return;
    s.成片定稿 = nowText(); touch(); rerender(); toast('第' + seg + '场定稿了');
  };
  const bar = s.成片定稿 && all
    ? [h('span', { class: 'fs-state ok', title: '定稿的时间：' + s.成片定稿 }, icon('check'), '这一场定稿了 ' + s.成片定稿.slice(5, 16)), h('span', { class: 'fn-note' }, '没选上的样片可以移进历史记录。'), h('span', { class: 'sp' }),
      h('button', { class: 'btn ink', onclick: next ? toNext : () => go('总览') }, next ? '下一场 →' : '回首页 →')]
    : [h('span', { class: 'fn-note' + (stales.length ? ' warn' : '') }, !vids.length ? '还没有样片。回「提示词」那一步，生成任务书、批准出片；出好了这里自动出现。'
      : stales.length ? stales.length + ' 条选定的样片待核对：它出了以后，提示词或者前面几道又动过。再看一遍，还能用就点「沿用」，不能用就回提示词重出。'
        : all ? '每一条都选定了。把选定的几条连起来看一遍，衔接没问题就定稿。' : '一条一条看。满意的选定它是哪一条提示词的成品（' + done.length + '/' + list.length + '）；不满意的写批注。'), h('span', { class: 'sp' }),
    h('button', { class: 'btn sm', onclick: () => go('提示词', { s: seg }) }, '← 回提示词（再出一条）'),
    all && vids.length ? h('button', { class: 'btn ink', onclick: finish }, '这一场定稿') : null];
  return [
    h('div', { class: 'wf-bar' }, bar),
    making.length ? h('div', { class: 'wf-jobs' }, making.map(j => h('div', null, jobLine(j), h('span', { class: 'fn-note' }, j.标题)))) : null,
    h('div', { class: 'wf-items' }, vids.map(v => cardOf2(s, v, list))),
  ];
}

start({
  name: '审片', scene: true, render,
  sides() { loadExtra().then(() => { if (!typing()) rerender(); else F.later = true; }); },   // 你正在写：写完再画（tick 里补）
  jobDone() { loadExtra().then(rerender); },
}).then(() => loadExtra().then(() => { if (F.doc && sceneNow()) rerender(); }));
</script>
</body>
</html>
