<script>
/* ============================================================
   流水线 · 审片（一场的第五道工序）
   这一场出的样片都在 成片/第N段。一条一条看、写批注（审片台.html：旁边对照提示词、白模、关键帧；批注格式和「项目管理」审片那一样）：
     满意：选定它是哪一条提示词的成品；每一条都选定了，再连起来检查衔接，点「这一场定稿」。
     不满意、东西不改：回「提示词」那一步再批准出一条。
     不满意、要改：让 AI 照批注出一份修改方案（不改稿）→ 在审片台「方案」那一页逐条定 → 照方案改，另存一份「原名_改1.txt」（原稿不动），回提示词那一步出片（2026-11-14 他定）。
     不在提示词里改的（长相、台词），方案里会说回哪一道；「回头改…」去那一道。
   没选上的样片及时移进 历史记录/成片/第N段（批注、修改方案跟着一起移，名字不改）。
   共用的东西（读写流水线.json、顶栏、步骤条、AI 任务）在 流水线.js。

'use strict';
const X = { tips: new Map(), plans: new Map(), open: new Set(), sty: false, map: new Map() };   // map：参考素材映射里这一场各条提示词的登记（字里的 @图片N 点开看大图用）   // 视频名 → AI 的建议（老的）、修改方案；展开着的；风格对照展没展开
const PLAN_TAIL = '_修改方案.md', PLAN_NOTE_TAIL = '_修改方案_批注.md';

const stemOf2 = n => n.replace(/\.[^.]+$/, '');
const dirOf = s => [F.name, '成片', segName(s.段)];
async function loadExtra() {
  const s = sceneNow();
  if (!s) return;
  X.tips = new Map();
  for (const n of clipsOf(s.段).all) if (/_AI建议\.md$/.test(n)) {
    try { X.tips.set(n.replace(/_AI建议\.md$/, ''), C.decodeText((await FS.read(at([...dirOf(s), n]))).buf).text); } catch (e) { /* 读不了就当没有 */ }
  }
  X.plans = new Map();
  for (const n of clipsOf(s.段).all) if (n.endsWith(PLAN_TAIL)) {
    try { X.plans.set(n.slice(0, -PLAN_TAIL.length), planHead(C.decodeText((await FS.read(at([...dirOf(s), n]))).buf).text)); } catch (e) { /* 读不了就当没有 */ }

  try { for (const [k, v] of Object.entries((await readJson(at([F.name, '资产', '参考素材映射.json']))).prompts || {})) if (k.startsWith(pre)) map.set(k.slice(pre.length), Array.isArray(v && v.references) ? v.references : []); } catch (e) { /* 还没有映射 */ }

/* 风格对照：照这一场的拍摄风格看像不像。风格库里的「一眼认出」「容易跑偏」只给人看（11-14 加） */
function styleBox(s) {
  const n = styleName(s), c = n && n !== OWN_STYLE && STYLE.lib ? window.StyleLib.find(STYLE.lib, n) : null;
  if (!c || !c.一眼认出 || !clipsOf(s.段).vids.length) return null;
  const el = h('details', { class: 'sty-review', open: X.sty ? '' : null }, h('summary', null, '照「' + n + '」看像不像：风格库里的招牌'),
    h('ol', null, window.StyleLib.marks(c.一眼认出).map(x => h('li', null, x.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]/, '')))), c.容易跑偏 ? h('p', null, '容易跑偏：' + c.容易跑偏) : null);

}
const selOf = s => (s.选定 && typeof s.选定 === 'object' ? s.选定 : (s.选定 = {}));
/* 这条样片是哪一条提示词的（给的是这一条的原稿名 e.key，选定记在它名下）：选定过的照选定的；没选过，名字里带着「提示词02」「镜头a-b」「镜头a-b改1」这样的先猜它，只有一条提示词就是它 */
function guess(s, vid, list) {
  const hit = list.find(e => selOf(s)[e.key] === vid);
  if (hit) return hit.key;
  const parts = '_' + stemOf2(vid) + '_', by = list.find(e => e.vers.some(n => vpTok(n) !== '整场' && parts.includes('_' + vpTok(n) + '_')));
  return by ? by.key : list.length === 1 ? list[0].key : '';
}
/* 照这一条的哪一版出的：名字里带的「镜头1-5改1」→ 出片记录 → 只有一版就是它 */
function verOf(s, vid, e) {

  const parts = '_' + stemOf2(vid) + '_', hit = e.vers.filter(n => vpTok(n) !== '整场' && parts.includes('_' + vpTok(n) + '_'));
  if (hit.length) return hit[hit.length - 1];
  const t = clipsOf(s.段).time.get(vid) || 0, rec = t ? shotRecOf(s.段, e.key, t) : null;

/* 修改方案：照哪一版出的、几条、总的看法、改成了哪一版。读法和审片台、本机服务同一份（公用/审片.js 的 parsePlan），条数也和审片台一样数 */
function planHead(md) {
  const P = Review.parsePlan(md), last = P.done.length ? P.done[P.done.length - 1] : '';

/* 对照看片、写批注：审片台.html 整页盖上来（样片旁边对照提示词、白模、关键帧、资产图，批注照旧存在样片旁边）。
   它自己有「← 回审片」：先问它一声（没存的批注先存上），再收起、重读 */

  if (SHELL) SHELL.remove();

  if (pr) q.set('pr', pr);
  if (tab) q.set('tab', tab);
  const frame = h('iframe', { class: 'wf-shell-frame', title: '对照审片', src: '审片台.html?' + q });
  const close = async () => {
    if (!SHELL) return;
    try { const w = frame.contentWindow; if (w && w.DESK && await w.DESK.leave() === false) return; } catch (e) { /* 那一页坏了：照样收起 */ }
    if (SHELL) SHELL.remove();
    SHELL = null; window.DESK_HOST = null;
    document.body.classList.remove('wf-covered');
    await refresh(); await loadExtra(); rerender();
  };
  window.DESK_HOST = { close };
  SHELL = h('div', { class: 'wf-shell' }, frame);
  document.body.append(SHELL); document.body.classList.add('wf-covered');
  frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) { /* 不要紧 */ } });

/* 没选上的样片：移进 历史记录/成片/第N段，批注、截图、AI 建议、修改方案跟着一起移，名字不改 */
async function retire(s, vid) {
  if (AI.jobs.some(j => jobLive(j) && j.段 === s.段 && j.视频 === vid)) { toast('AI 正在照这条样片做事，做完再移', 'err'); return; }
  if (!(await confirmDlg({ title: '这条不要了', body: vid + ' 移进这个项目的「历史记录 / 成片 / ' + segName(s.段) + '」，它的批注、截图、修改方案跟着一起移，名字不改。照方案改出来的提示词留在原处。', ok: '移进历史记录' }))) return;
  const all = clipsOf(s.段).all, stem = stemOf2(vid), dest = [F.name, '历史记录', '成片', segName(s.段)];
  const names = [vid, stem + '_批注.md', stem + '_AI建议.md', stem + PLAN_TAIL, stem + PLAN_NOTE_TAIL].filter(n => all.has(n));
  try {
    for (const n of names) await FS.move(at([...dirOf(s), n]), at([...dest, n]));
    if (await FS.isDir(at([...dirOf(s), stem + '_批注截图']))) await FS.move(at([...dirOf(s), stem + '_批注截图']), at([...dest, stem + '_批注截图']));
  } catch (e) { toast('没移走：' + e.message, 'err'); }

}
/* 回头改：回哪一道由你定 */
function backMenu(anchor, s) {
  popover(anchor, close => [h('div', { class: 'fl-pop-h' }, '回哪一道工序改'),
    h('div', { class: 'fl-pl' }, [['设定', '工序一　全片设定', '人物、场景、道具写得不对，拍摄风格不合适'], ['分场', '工序二　段落', '这一场的事要改'], ['剧本', '工序二　剧本', '台词、动作要改'], ['资产', '工序三　资产', '长相、道具的样子不对'], ['提示词', '工序四　提示词', '镜头、表演的写法要改；或者只是重出一条']]
      .map(([page, name, why]) => h('button', { type: 'button', class: 'fl-pi', onclick: () => { close(); go(page, page === '设定' ? null : { s: s.段 }); } }, h('span', { class: 'pn' }, h('b', null, name), h('small', null, why))))),

}
/* 不满意、要改：修改方案那一行。没批注 → 先写批注；有批注 → 让 AI 出方案；有方案 → 到审片台逐条定、照方案改；改好了 → 去提示词那一步出片 */

    newer ? h('span', { class: 'fn-note warn', title: '方案是照之前的批注出的' }, '批注在方案之后改过') : null,
    h('button', { class: 'fl-link', type: 'button', disabled: !!old || !AI.ok, title: old || '照现在的批注重出一份：这一份和你批的收进历史记录', onclick: async () => { if (await confirmDlg({ title: '重出修改方案', body: '照现在的批注让 ' + chName() + ' 重出一份。这一份方案和你逐条定的，收进历史记录' + (plan.done.length ? '；已经改出来的提示词不动' : '') + '。', ok: '重出' })) ask(true); } }, '重出方案'), failed];

function planBox(s, vid) {

}
function cardOf2(s, vid, list) {

    h('div', { class: 'wf-item-h' }, h('b', null, stem), mine ? h('span', { class: 'fs-state ok' }, icon('check'), '选定：' + labelOf2(mine)) : null, noted ? h('span', { class: 'fs-state', title: '这条写过批注' }, '有批注') : null,

const labelOf2 = vpLabel;

  const show = () => { cur.hidden = false; nxt.hidden = true; cur.controls = true; nxt.controls = false; items.forEach((el, n) => el.classList.toggle('on', n === i)); now.textContent = '第 ' + (i + 1) + ' / ' + urls.length + ' 条：' + labelOf2(seq[i].e.key); };
  const playAt = k => { i = k; load(cur, k); load(nxt, k + 1); show(); cur.play().catch(() => {}); };
  const onEnd = el => () => {
    if (el !== cur) return;
    if (i + 1 >= urls.length) { now.textContent = '放完了 ' + urls.length + ' 条。点「从头放」再看一遍，或者点下面哪一条从那里放。'; return; }
    [cur, nxt] = [nxt, cur]; i++; show(); cur.play().catch(() => {}); load(nxt, i + 1);
  };
  A.addEventListener('ended', onEnd(A)); B.addEventListener('ended', onEnd(B));
  await dialog(close => {
    setTimeout(() => playAt(0), 60);
    const el = dlgShell('连起来看 · 第' + s.段 + '场', '选定的 ' + seq.length + ' 条按第1条、第2条……的顺序接着放，不存文件。看接缝处的动作、人物、光线、声音接不接得上；接不上就回提示词改那一条、重出。',
      [h('div', { class: 'wf-stage' }, A, B), now, h('ol', { class: 'wf-playlist' }, items)],
      [h('button', { class: 'btn ghost', onclick: () => playAt(0) }, '从头放'), h('button', { class: 'btn ink', 'data-focus': '', onclick: () => close() }, '看完了')]);
    el.classList.add('wide');
    return el;
  });
  for (const v of [A, B]) { v.pause(); v.removeAttribute('src'); v.load(); }
  urls.forEach(u => URL.revokeObjectURL(u));
}
function render() {
  const s = sceneNow(), seg = s.段;
  const ps = promptState(s);
  if (ps.st !== 'ok') {   // 提示词那一步不等资产了，这里只看提示词本身：还没有、AI 在写、待核对
    const msg = !promptsOf(seg).length ? '这一场还没有提示词。有了提示词、出了样片，再来审。'
      : ps.st === 'ai' ? 'AI 在写提示词，写好了再来审。'
        : '有提示词待核对：它们写好以后，前面（剧本、资产、拍摄风格）又动过。先到「提示词」那一步看一眼，点「沿用」或者改好，再来审。';
    return h('div', { class: 'wf-lock' }, msg, h('button', { class: 'btn ink', onclick: () => go('提示词', { s: seg }) }, '← 去提示词那一步'));
  }
  const list = promptsOf(seg), vids = clipsOf(seg).vids, sel = selOf(s), done = list.filter(e => sel[e.key] && vids.includes(sel[e.key]));   // 选定记在这一条的原稿名下
  const stales = done.filter(e => clipStale(s, e.key, sel[e.key]));
  const all = done.length === list.length && !stales.length, next = F.doc.场[F.doc.场.indexOf(s) + 1], making = AI.jobs.filter(j => j.事 === '出片' && j.段 === seg && jobLive(j));
  const toNext = () => { const i = stepInfo(next).findIndex(x => x.st === 'you'); go(STEPS[i < 0 ? 0 : i][0], { s: next.段 }); };
  const finish = async () => {
    if (!(await confirmDlg({ title: '第' + seg + '场定稿', body: '选定的 ' + list.length + ' 条：' + list.map(e => labelOf2(e.key) + ' → ' + stemOf2(sel[e.key])).join('；') + '。' + (list.length > 1 ? '定稿前点「连起来看」看一遍，动作、声音、剧情接得上。' : ''), ok: list.length > 1 ? '连起来看过了，定稿' : '定稿' }))) return;
    s.成片定稿 = nowText(); touch(); rerender(); toast('第' + seg + '场定稿了');
  };
  const bar = s.成片定稿 && all
    ? [h('span', { class: 'fs-state ok', title: '定稿的时间：' + s.成片定稿 }, icon('check'), '这一场定稿了 ' + s.成片定稿.slice(5, 16)), h('span', { class: 'fn-note' }, '没选上的样片可以移进历史记录。'), h('span', { class: 'sp' }),
      h('button', { class: 'btn ink', onclick: next ? toNext : () => go('总览') }, next ? '下一场 →' : '回首页 →')]
    : [h('span', { class: 'fn-note' + (stales.length ? ' warn' : '') }, !vids.length ? '还没有样片。回「提示词」那一步，生成任务书、批准出片；出好了这里自动出现。'
      : stales.length ? stales.length + ' 条选定的样片待核对：它出了以后，提示词或者前面几道又动过。再看一遍，还能用就点「沿用」，不能用就回提示词重出。'
        : all ? (list.length > 1 ? '每一条都选定了。点「连起来看」把选定的几条接着放一遍，衔接没问题就定稿。' : '选定了。没问题就定稿。') : '一条一条看。满意的选定它是哪一条提示词的成品（' + done.length + '/' + list.length + '）；不满意的写批注。'), h('span', { class: 'sp' }),
    h('button', { class: 'btn sm', onclick: () => go('提示词', { s: seg }) }, '← 回提示词（再出一条）'),
    done.length > 1 ? h('button', { class: 'btn sm' + (all ? ' ink' : ''), title: '选定的几条按第1条、第2条……的顺序在网页里接着放，不存文件', onclick: () => playAll(s, list) }, icon('play'), '连起来看') : null,
    all && vids.length ? h('button', { class: 'btn ink', onclick: finish }, '这一场定稿') : null];
  return [
    h('div', { class: 'wf-bar' }, bar), styleBox(s),
    making.length ? h('div', { class: 'wf-jobs' }, making.map(j => h('div', null, jobLine(j), h('span', { class: 'fn-note' }, j.标题)))) : null,
    h('div', { class: 'wf-items' }, vids.map(v => cardOf2(s, v, list))),
  ];
}

start({
  name: '审片', scene: true, render,
  sides() { loadExtra().then(() => { if (!typing()) rerender(); else F.later = true; }); },   // 你正在写：写完再画（tick 里补）
  jobDone() { loadExtra().then(rerender); },
}).then(() => loadExtra().then(() => { if (F.doc && sceneNow()) rerender(); }));

/* 字里的 @图片N 点开看大图（公用/点图.js）：照这条样片出自的那条提示词认图（修改方案照的那一版 → 选的、猜的那一版） */
if (window.RefPic) RefPic.watch((ref, el) => {
  const s = sceneNow(), card = el.closest('.wf-item[data-vid]');
  if (!s || !card) return null;
  const vid = card.dataset.vid, list = promptsOf(s.段), e = list.find(x => x.key === guess(s, vid, list)), plan = X.plans.get(stemOf2(vid));
  const src = (plan && plan.src) || verOf(s, vid, e) || (e ? e.name : ''), r = (X.map.get(src) || []).find(x => x && x.ref === ref);
  const p = r ? String(r.path || '').replace(/\\/g, '/') : '';
  if (!/\.(png|jpe?g|webp|gif|avif|bmp)$/i.test(p)) return null;
  const file = p.split('/').pop(), label = ref + ' · ' + file.replace(/\.[^.]+$/, '');
  const type = n => 'image/' + (/\.jpe?g$/i.test(n) ? 'jpeg' : n.split('.').pop().toLowerCase());
  return { tip: label + '　点开看大图', open: async () => {   // 原处换过新版、挪走了：到历史记录里找登记的那一份（公用/找旧版.js）
    let g;
    try { g = await RefFile.find(FS, at([F.name]), p, r.sha256); } catch (err) { RefPic.show(Promise.reject(err), label, p); return; }
    RefPic.show(Promise.resolve(URL.createObjectURL(new Blob([g.bytes], { type: type(g.file) }))), label, g.old ? RefFile.note(g) + '：' + g.file : p);
  } };
});
</script>
