<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审片后只换有毛病的几秒</title>
<style>
:root { --paper: #f4efe6; --sheet: #fffdf9; --ink: #2a2622; --ink-2: #554d45; --ink-3: #887e74; --line: #d6cab6; --zhu: #a83a2c; --dai: #3e5c5e; --huang: #fff4c9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.85 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
main { max-width: 780px; margin: 0 auto; padding: 32px 22px 120px; }
h1 { margin: 0 0 4px; font: 600 26px/1.4 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .08em; }
.sub { margin: 0 0 20px; font-size: 14.5px; color: var(--ink-2); }
h2 { margin: 34px 0 10px; font: 600 19px/1.5 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .1em; }
.card { margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.card h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; }
.card h3 .no { display: inline-block; min-width: 1.9em; color: var(--dai); }
.card p { margin: 3px 0; color: var(--ink-2); }
.opts { margin: 8px 0 2px; }
.opts label { display: block; margin: 5px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opts label:hover { background: #faf5ea; }
.opts input { margin-right: 8px; }
.opts .rec { color: var(--dai); font-size: 13px; margin-left: 4px; }
textarea { display: block; width: 100%; margin-top: 8px; min-height: 2.6em; padding: 7px 10px; border: 1px dashed #c8b99f; border-radius: 8px; background: #fffef9; font: 15px/1.7 'Noto Sans SC', 'Microsoft YaHei', sans-serif; color: var(--ink); resize: vertical; }
textarea:focus { outline: none; border-style: solid; border-color: var(--dai); background: #fff; }
textarea.has { border-style: solid; border-color: #b9822f; background: var(--huang); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(255,253,249,.96); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: center; }
.bar button { padding: 6px 14px; border: 1px solid var(--dai); border-radius: 8px; background: #fff; color: var(--dai); font: inherit; cursor: pointer; }
.bar button:hover { background: #eef5f3; }
#st { color: var(--ink-2); }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-3); }

/* 片子的时间条：一格一个镜头，宽窄照秒数 */
.fig { margin: 10px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 14.5px; }
.tl { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; }
.tl i { display: block; min-width: 10px; background: #d9d2c5; position: relative; }
.tl i.n { background: var(--dai); }
.tl i.x { background: repeating-linear-gradient(45deg, #ead2cc 0 5px, #fff 5px 10px); }
.tl i.r { background: var(--zhu); opacity: .78; }
.tl i.s { background: linear-gradient(#d9d2c5 0 55%, #d9a93a 55% 100%); }
.tl i.e { background: repeating-linear-gradient(90deg, var(--dai) 0 6px, #9fbab6 6px 9px); }
.tl i.c { background: linear-gradient(90deg, #d9d2c5 0 50%, var(--dai) 50% 100%); }
.cmp { display: grid; grid-template-columns: 4.6em 1fr; gap: 6px 12px; align-items: center; }
.cmp .lb { font-weight: 600; color: var(--ink); white-space: nowrap; }
.cmp .tx { grid-column: 2; margin: -2px 0 8px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.key { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
.key span { display: inline-block; width: 12px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 10px; }
.way { display: grid; grid-template-columns: 5.6em 1fr; gap: 4px 12px; padding: 10px 0; border-top: 1px solid #ece3d3; }
.way:first-child { border-top: 0; padding-top: 0; }
.way .lb { font-weight: 600; color: var(--dai); padding-top: 1px; }
.way .lb.red { color: var(--zhu); }
.way .tx { color: var(--ink-2); font-size: 14.5px; line-height: 1.65; }
.way .tx b { color: var(--ink); font-weight: 600; }
.way .tl { height: 14px; margin-bottom: 5px; max-width: 360px; }
.money { display: inline-block; margin-top: 2px; padding: 0 8px; border-radius: 10px; background: #f3ede1; color: var(--ink); font-size: 13px; }
/* 第2条的样子 */
.shots { display: flex; gap: 3px; }
.shot { min-width: 0; }
.shot img { display: block; width: 100%; height: 58px; object-fit: cover; border-radius: 3px; }
.shot .two { display: flex; gap: 2px; }
.shot .two img { width: 50%; }
.shot .cap { font-size: 12px; color: var(--ink-3); line-height: 1.45; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shot.bad img { outline: 3px solid var(--zhu); outline-offset: -3px; }
.said { margin: 12px 0 4px; padding: 8px 12px; border-left: 3px solid var(--zhu); background: #fbf3f0; color: var(--ink-2); font-size: 14.5px; }
.plan2 { margin-top: 10px; color: var(--ink-2); font-size: 14.5px; line-height: 1.7; }
.plan2 b { color: var(--ink); }
/* 流水线上怎么走 */
.flow { counter-reset: st; }
.flow .st { position: relative; padding: 6px 0 6px 34px; color: var(--ink-2); font-size: 14.5px; line-height: 1.65; }
.flow .st::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: #ece6da; color: var(--ink-2); font-size: 12.5px; text-align: center; line-height: 22px; }
.flow .st.new::before { background: var(--dai); color: #fff; }
.flow .st b { color: var(--ink); }
.flow .tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 9px; background: #e3efec; color: var(--dai); font-size: 12px; }
.btns { display: flex; gap: 10px; margin: 8px 0 4px; flex-wrap: wrap; }
.btns .bt { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; line-height: 1.5; }
.btns .bt b { display: block; font-size: 14.5px; }
.btns .bt span { font-size: 12.5px; color: var(--ink-3); }
.btns .bt.zhu { border-color: var(--dai); }
.btns .bt.zhu b { color: var(--dai); }
/* 文件放哪 */
.files { font: 14px/1.9 'Cascadia Mono', Consolas, 'Microsoft YaHei', monospace; color: var(--ink); }
.files div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files .d1 { padding-left: 1.5em; } .files .d2 { padding-left: 3em; }
.files em { font: 13px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-style: normal; color: var(--ink-3); margin-left: .8em; }
.files .nw { color: var(--dai); font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>审片后只换有毛病的几秒</h1>
<p class="sub" id="sub"></p>
<div id="sections"></div>
<h2>其他意见</h2>
<textarea data-k="其他" placeholder="还有什么想说的（可以不写）"></textarea>
<p class="foot" id="foot"></p>
</main>
<div class="bar"><span id="st">选一选、写批注会自动存好</span><button id="copy" type="button">复制批注</button></div>

<!-- 现在和以后 -->
<template id="now"><div class="fig"><div class="cmp">
  <span class="lb">现在</span>
  <div class="tl"><i class="r" style="flex:10"></i><i class="r" style="flex:5.2"></i><i class="r" style="flex:6"></i><i class="r" style="flex:1.6"></i><i class="r" style="flex:2.3"></i></div>
  <div class="tx">改提示词，整条重出。第2条那回 25 秒 720p 花了 500 分；没毛病的镜头也跟着变了。</div>
  <span class="lb">以后</span>
  <div class="tl"><i class="n" style="flex:10"></i><i style="flex:5.2"></i><i style="flex:6"></i><i style="flex:1.6"></i><i style="flex:2.3"></i></div>
  <div class="tx">只把有毛病的那一镜（或那几秒）交给即梦重做，在这台电脑上接回原片。别的镜头一帧不动。接、剪不花分，一两分钟。</div>
</div>
<div class="key">一格一个镜头，宽窄照秒数<span style="background:var(--zhu);opacity:.78"></span>重新生成<span style="background:var(--dai)"></span>只换这一段<span style="background:#d9d2c5"></span>原样不动</div></div></template>

<!-- 六种做法 -->
<template id="ways"><div class="fig">
  <div class="way"><span class="lb">剪掉</span><div class="tx"><div class="tl"><i class="x" style="flex:7"></i><i style="flex:3"></i><i style="flex:5.2"></i><i style="flex:6"></i><i style="flex:1.6"></i><i style="flex:2.3"></i></div>
    嫌长、多余的，直接剪。<br><span class="money">不花分 · 1 分钟</span></div></div>
  <div class="way"><span class="lb">重做一镜</span><div class="tx"><div class="tl"><i class="n" style="flex:10"></i><i style="flex:5.2"></i><i style="flex:6"></i><i style="flex:1.6"></i><i style="flex:2.3"></i></div>
    <b>一整个镜头不对</b>（机位、站位、演法）。照提示词这一镜的字，挂上人物、场景图，重出一个镜头，换掉原来那一镜。接口在原片本来切镜的地方，看不出来。<br><span class="money">每秒约 20 分，最少出 4 秒（约 80 分）· 5～10 分钟</span></div></div>
  <div class="way"><span class="lb">改这几秒</span><div class="tx"><div class="tl"><i style="flex:10"></i><i style="flex:5.2"></i><i style="flex:6"></i><i style="flex:1.6"></i><i class="c" style="flex:2.3"></i></div>
    <b>画面里只错一样</b>（指错人、多了个人、少辆车），别的要和原片一样。把那几秒剪下来交给即梦「编辑」，它照着原片只改那一处。挂的原片也算钱，所以贵一倍。<br><span class="money">每秒约 40 分（估计），最少 4 秒（约 160 分）· 5～10 分钟</span></div></div>
  <div class="way"><span class="lb">只改声音</span><div class="tx"><div class="tl"><i style="flex:10"></i><i style="flex:5.2"></i><i style="flex:6"></i><i style="flex:1.6"></i><i class="s" style="flex:2.3"></i></div>
    口音不对、少了铃声、台词说错。也是「编辑」，画面和口型不动。<br><span class="money">价钱同上</span></div></div>
  <div class="way"><span class="lb">补一段</span><div class="tx"><div class="tl"><i style="flex:10"></i><i style="flex:5.2"></i><i style="flex:6"></i><i style="flex:1.6"></i><i style="flex:2.3"></i><i class="e" style="flex:4"></i></div>
    开头或结尾要多出一点。即梦「延长」：从原片最后一帧（或第一帧）接着往下出，原片不动。<br><span class="money">新出 4 秒约 120 分（估计，含挂的 2 秒原片）· 5～10 分钟</span></div></div>
  <div class="way"><span class="lb red">整条重出</span><div class="tx"><div class="tl"><i class="r" style="flex:10"></i><i class="r" style="flex:5.2"></i><i class="r" style="flex:6"></i><i class="r" style="flex:1.6"></i><i class="r" style="flex:2.3"></i></div>
    毛病遍布整条（背景音乐、整体风格、人物处处不像），或者几处加起来比整条还贵。照旧。<br><span class="money">25 秒 720p 约 500 分</span></div></div>
</div></template>
