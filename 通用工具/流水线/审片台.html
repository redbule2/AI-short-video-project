<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对照审片</title>
<link rel="stylesheet" href="../公用/样式.css">
<style>
/* 对照审片：流水线第五道工序「审片」里点「对照看片、写批注」盖上来的那一页。样式只这一页用 */
body.dk { display: block; height: 100vh; overflow: hidden; background: var(--night); }
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.dk-fatal { margin: 18vh auto 0; max-width: 520px; padding: 28px 32px; border-radius: 10px; background: var(--sheet); font: 15px/1.9 var(--kai); color: var(--ink-2); text-align: center; }

/* ---------- 顶栏 ---------- */
.dk-top { flex: none; display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 6px 16px; background: var(--sheet); border-bottom: 1px solid var(--line-2); color: var(--ink); }
.dk-title { min-width: 0; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; }
.dk-title b { flex: none; font: 600 16px/1.3 var(--serif); letter-spacing: .06em; }
.dk-title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 15px var(--kai); color: var(--ink-2); }
.dk-top .sp { flex: 1; }
.dk-pr { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.dk-pr select { max-width: 240px; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; font: 13px var(--sans); color: var(--ink); cursor: pointer; }
.dk-st { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.dk-st .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dk-st.noted { color: var(--zhu); }
.dk-st.noted .dot { background: var(--zhu); }
.dk-st.err { color: var(--zhu); font-weight: 600; }

/* ---------- 左边放映区，右边一栏 ---------- */
.dk-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.dk-stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--night); color: var(--night-ink); }

/* 旁边对照那一排 */
.cmpbar { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 10px 18px 4px; font-size: 12.5px; color: var(--night-ink-2); }
.cb-lab { letter-spacing: .12em; }
.seg-btns { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(255, 255, 255, .07); }
.seg-btns button { padding: 3px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--night-ink-2); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.seg-btns button:not(.on):hover:not(:disabled) { color: var(--night-ink); }
.seg-btns button.on { background: var(--night-ink); color: var(--night); }
.seg-btns button:disabled { opacity: .32; cursor: default; }
.cb-alpha { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cb-alpha input { width: 110px; accent-color: var(--jin); }
.cb-link { padding: 0; border: 0; background: none; color: var(--jin); font-size: 12.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.cmpbar .sp { flex: 1; }

/* 两格画面：左边样片，右边对照；叠起来时对照盖在样片上 */
.views { flex: 1; min-height: 140px; position: relative; display: flex; gap: 10px; padding: 6px 18px; }
.view { flex: 1; min-width: 0; position: relative; display: grid; place-items: center; overflow: hidden; border-radius: 6px; background: #000; }
.view video, .view img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }   /* 贴满这一格、按比例缩，格子再矮也不裁 */
.view.main video { cursor: pointer; }
.view .lab { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 16px); padding: 2px 9px; border-radius: 4px; background: rgba(0, 0, 0, .6); color: #f3ead9; font-size: 12px; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.view .none { padding: 24px; text-align: center; font: 15px/1.9 var(--kai); color: var(--night-ink-2); }
.views.solo .view.cmp { display: none; }
.views.over .view.cmp { position: absolute; top: 6px; bottom: 6px; left: 18px; right: 18px; background: transparent; opacity: var(--a, .5); pointer-events: none; }
.views.over .view.cmp .lab, .views.over .view.cmp .none { display: none; }

/* 这一镜写的什么：像字幕一样贴在画面下面 */
.cap { flex: none; display: flex; gap: 10px; align-items: baseline; margin: 4px 18px 0; padding: 7px 12px; border-radius: 6px; background: rgba(255, 255, 255, .055); cursor: pointer; }
.cap[hidden] { display: none; }
.cap-n { flex: none; font: 600 13px var(--sans); color: var(--jin); white-space: nowrap; }
.cap-t { min-width: 0; font-size: 13.5px; line-height: 1.65; color: var(--night-ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cap.dim .cap-t { color: var(--night-ink-2); }
.cap .rf { background: rgba(255, 255, 255, .12); border-color: transparent; color: #f3ead9; }
.cap .say { color: #ffc9a6; }
.cap .sfx { color: #9fd0d2; border-bottom-color: rgba(159, 208, 210, .5); }

/* 播放那一排 */
.bar { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 18px 0; }
.ctl { width: 36px; height: 32px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--night-ink); cursor: pointer; }
.ctl:hover { background: rgba(255, 255, 255, .09); }
.ctl .ic { width: 17px; height: 17px; }
.clock { display: flex; align-items: baseline; gap: 10px; margin: 0 10px 0 6px; white-space: nowrap; }
.tc { font: 15px var(--mono); font-variant-numeric: tabular-nums; color: #f6efe2; }
.fr { font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--night-ink-2); }
.rates { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(255, 255, 255, .06); }
.rate { padding: 3px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--night-ink-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
.rate:not(.on):hover:not(:disabled) { color: var(--night-ink); }
.rate.on { background: var(--night-ink); color: var(--night); }
.rate:disabled { opacity: .32; cursor: default; }
.addbtn { margin-left: auto; }

/* 时间条：上面一排是镜头（按提示词写的秒数摆），下面是拖的那根 */
.strip { flex: none; margin: 8px 18px 0; }
.shots { position: relative; height: 24px; }
.shots[hidden] { display: none; }
.shots.flow { display: flex; gap: 3px; }
.shot { position: absolute; top: 0; height: 24px; padding: 0 7px; border: 0; border-radius: 4px 4px 0 0; background: rgba(255, 255, 255, .07); box-shadow: inset 1px 0 0 rgba(0, 0, 0, .55); color: var(--night-ink-2); font-size: 11.5px; line-height: 24px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.shots.flow .shot { position: static; flex: 1; min-width: 0; border-radius: 4px; }
.shot:hover { background: rgba(255, 255, 255, .13); color: var(--night-ink); }
.shot.on { background: rgba(179, 146, 86, .45); color: #fff6e4; }
.shot .nt { margin-left: 5px; color: #ff9a85; }
.track { position: relative; height: 30px; cursor: pointer; touch-action: none; }
.groove { position: absolute; left: 0; right: 0; top: 13px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .15); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--jin); }
.cuts { position: absolute; inset: 0; pointer-events: none; }
.cut { position: absolute; top: 8px; width: 1px; height: 14px; background: rgba(255, 255, 255, .38); }
.playhead { position: absolute; top: 6px; width: 2px; height: 18px; margin-left: -1px; border-radius: 1px; background: #fff; pointer-events: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
.marks { position: absolute; inset: 0; pointer-events: none; }
.mk { position: absolute; top: 0; width: 11px; height: 11px; margin-left: -5.5px; padding: 0; border: 2px solid var(--night); border-radius: 50%; background: #d4614f; cursor: pointer; pointer-events: auto; }
.mk.range { margin-left: 0; height: 9px; top: 1px; border-radius: 5px; border-width: 1px; min-width: 6px; background: rgba(212, 97, 79, .75); }
.mk:hover, .mk.on { background: #ff8a72; box-shadow: 0 0 0 2px rgba(255, 138, 114, .35); }
.mk.editing { background: var(--jin); }

/* 最下面：写批注；不写的时候摆快捷键 */
.composer { flex: none; padding: 4px 18px 12px; }
.keys { font-size: 11.5px; color: #6f665c; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.form { padding: 10px 14px 10px; border-radius: 9px; background: var(--sheet); color: var(--ink); box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .6); animation: rise .18s ease both; }
.frow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 4px 0; }
.form-h { font: 15px var(--kai); color: var(--zhu); letter-spacing: .2em; margin-right: 4px; }
.fend { display: inline-flex; align-items: center; gap: 6px; }
.flab { flex: none; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .1em; }
.fthumb { width: 56px; height: 32px; flex: none; border-radius: 3px; object-fit: cover; background: var(--paper-2); border: 1px solid var(--line); display: inline-block; }
.ftime { font: 13.5px var(--mono); font-variant-numeric: tabular-nums; }
.fnone { font: 13px var(--kai); color: var(--ink-4); }
.form .sel { max-width: 260px; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; font-size: 13px; color: var(--ink); }
.form .inp { width: 160px; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; outline: 0; background: #fff; font-size: 13px; }
.form .chip { padding: 1px 10px; font-size: 12.5px; }
.fcmp { min-width: 0; font-size: 12.5px; color: var(--dai); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fta { display: block; width: 100%; min-height: 64px; max-height: 26vh; margin-top: 6px; padding: 8px 12px; resize: none; overflow: auto; field-sizing: content; border: 1px solid var(--line); border-radius: 6px; outline: 0; background: #fffefa; font: 16px/1.75 var(--kai); color: var(--zhu); }
.fta::placeholder { color: var(--ink-4); font-size: 14.5px; }
.fta:focus { border-color: var(--zhu-line); box-shadow: 0 0 0 3px var(--zhu-soft); }
.form-f { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.form-f .sp { flex: 1; }
.form-f em { font-style: normal; font-size: 11px; color: var(--ink-4); }
.btn.danger { color: var(--zhu); }

/* ---------- 右边一栏 ---------- */
.dk-rail { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid var(--line-2); color: var(--ink); }
.rt-tabs { flex: none; display: flex; gap: 0; padding: 6px 6px 0; border-bottom: 1px solid var(--line); background: var(--sheet); }
.rt-tab { position: relative; flex: 1 1 auto; padding: 7px 4px 8px; border: 0; background: none; cursor: pointer; font-size: 13.5px; color: var(--ink-3); letter-spacing: .02em; white-space: nowrap; }
.rt-tab:hover { color: var(--ink); }
.rt-tab.on { color: var(--ink); font-weight: 600; }
.rt-tab.on::after { content: ''; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; border-radius: 1px; background: var(--zhu); }
.rt-tab .n { margin-left: 5px; padding: 0 6px; border-radius: 999px; background: var(--zhu); color: #fff8f2; font: 11px/1.6 var(--sans); }
.rt-tab .n.soft { background: var(--paper-3); color: var(--ink-2); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 48px; }
.hint { margin: 2px 0 10px; font: 14px/1.85 var(--kai); color: var(--ink-3); }
.hint.small { font-size: 13px; }
.warn { margin: 0 0 10px; padding: 6px 10px; border-radius: 6px; background: var(--zhu-soft); color: var(--zhu); font-size: 12.5px; line-height: 1.7; }
.sec { margin: 18px 0 7px; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .25em; }
.pane > .sec:first-child { margin-top: 0; }
.on-tag { font-size: 12px; color: var(--zhe); white-space: nowrap; }
.path { margin-top: 16px; word-break: break-all; }

/* 这一镜 */
.sh-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sh-h b { font: 600 18px var(--serif); letter-spacing: .06em; }
.sh-t { font: 13px var(--mono); color: var(--ink-2); }
.sh-h .sp { flex: 1; }
.sh-title { margin: 0 0 10px; font: 15px var(--kai); color: var(--ink-2); }
.nav { width: 30px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 6px; background: var(--sheet); cursor: pointer; color: var(--ink-2); font-size: 15px; line-height: 1; }
.nav:hover:not(:disabled) { border-color: var(--ink-4); color: var(--ink); }
.nav:disabled { opacity: .35; cursor: default; }
.kf { margin: 6px 0 2px; }
.kf .pic { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--paper-2); border: 1px solid var(--line); cursor: zoom-in; }
.kf figcaption { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.kf figcaption .sp { flex: 1; }
.kf .fc-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 关键帧：弃用了的盖个章、变灰；图下面一排：在图上批注、弃用（11-14） */
.kf-pic { position: relative; }
.kf.gone .pic { filter: grayscale(1); opacity: .5; }
.kf-stamp { position: absolute; left: 10px; top: 10px; padding: 1px 10px; border: 2px solid var(--zhu); border-radius: 4px; background: rgba(255, 251, 243, .92); color: var(--zhu); font: 700 14px var(--serif); letter-spacing: .3em; transform: rotate(-5deg); pointer-events: none; }
.kf-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
.kf-row .sp { flex: 1; }
.kf-why { margin: 8px 0 0; padding: 7px 12px 8px; border-left: 3px solid var(--zhu); border-radius: 0 6px 6px 0; background: var(--zhu-soft); }
.kf-why-h { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-3); }
.kf-why-h .sp { flex: 1; }
.kf-why-t { margin-top: 2px; font: 14px/1.75 var(--kai); color: var(--zhu); white-space: pre-wrap; word-break: break-word; }
.ni-gone { font-size: 11.5px; color: var(--zhu); white-space: nowrap; }
.fkf { min-width: 0; flex: 1; font-size: 12.5px; color: var(--zhu); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bx-gone { max-width: 320px; color: #f3a08e; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 在关键帧图上写批注：项目管理的看图页整页盖上来（和流水线「资产」那一步一样） */
.dk-shell { position: fixed; inset: 0; z-index: 45; display: flex; flex-direction: column; background: var(--paper); }
.dk-shell-h { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line-2); background: var(--sheet); font-size: 13px; color: var(--ink-3); }
.dk-shell-h b { font: 600 15px var(--serif); color: var(--ink); letter-spacing: .04em; }
.dk-shell-h .sp { flex: 1; }
.dk-shell-f { flex: 1; width: 100%; border: 0; background: var(--paper); }
.body { font-size: 14px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
.rf { display: inline-block; margin: 0 1px; padding: 0 5px; border: 1px solid transparent; border-radius: 4px; background: var(--paper-3); color: var(--ink); font: 12.5px/1.6 var(--sans); cursor: pointer; text-indent: 0; }
.rf.k-ren, .rf.k-jing, .rf.k-dao, .rf.k-zhen { background: var(--k-soft); border-color: var(--k-line); color: var(--k); }
.rf.miss { background: var(--zhu-soft); color: var(--zhu); cursor: help; }
.say { color: var(--zhu); font-family: var(--kai); font-size: 1.07em; }
.sfx { color: var(--dai); border-bottom: 1px dotted var(--dai-line); }
.k-ren  { --k: #6b4f93; --k-soft: rgba(107, 79, 147, .08); --k-line: rgba(107, 79, 147, .42); }
.k-jing { --k: #2e6c9e; --k-soft: rgba(46, 108, 158, .08); --k-line: rgba(46, 108, 158, .42); }
.k-dao  { --k: #a3651f; --k-soft: rgba(163, 101, 31, .09); --k-line: rgba(163, 101, 31, .45); }
.k-zhen { --k: #3d7a55; --k-soft: rgba(61, 122, 85, .09); --k-line: rgba(61, 122, 85, .45); }

/* 素材格子、视频一行 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile { position: relative; display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.tile img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; border-radius: 5px; background: var(--paper-2); }
.grid.wide .tile img { aspect-ratio: 16 / 9; object-position: center; }
.tile .tr { font: 11px var(--mono); color: var(--ink-3); }
.tile .tn { font-size: 12px; line-height: 1.35; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile.k-ren, .tile.k-jing, .tile.k-dao, .tile.k-zhen { border-left: 3px solid var(--k); }
.tile.on { border-color: var(--jin); box-shadow: 0 0 0 2px rgba(179, 146, 86, .3); }
.tile.gone img { filter: grayscale(1); opacity: .5; }
.mini-row { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-row .tile { width: 64px; padding: 3px; }
.mini-row .tile .tn { font-size: 11px; -webkit-line-clamp: 1; }
.vcard { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
.vcard > .ic { width: 20px; height: 20px; color: var(--ink-2); }
.vcard .vn { flex: 1; min-width: 0; line-height: 1.45; }
.vcard .vn b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard .vn small { display: block; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard audio { width: 100%; margin-top: 4px; }

/* 提示词全文 */
.pt-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.pt-h b { font: 600 15px var(--serif); }
.pt { font-size: 13.5px; line-height: 1.8; }
.pl { padding: 1px 7px; border-left: 3px solid transparent; border-radius: 5px; white-space: pre-wrap; word-break: break-word; }
.pl.blank { height: .6em; }
.pl.head { margin-top: 8px; font-weight: 600; letter-spacing: .04em; }
.pl.ln { cursor: pointer; }
.pl.ln:hover { background: var(--paper-2); }
.pl.ln.on { background: rgba(179, 146, 86, .16); border-left-color: var(--jin); }

/* 批注 */
.gen { display: block; width: 100%; min-height: 40px; max-height: 30vh; padding: 6px 10px; resize: none; overflow: auto; field-sizing: content; border: 1px dashed var(--line-2); border-radius: 6px; outline: 0; background: rgba(255, 253, 249, .6); font: 14.5px/1.75 var(--kai); color: var(--zhu); }
.gen::placeholder { color: var(--ink-4); }
.gen:focus { border-style: solid; border-color: var(--zhu-line); background: #fffefa; }
.ni { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; margin-bottom: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; }
.ni:hover { border-color: var(--line-2); }
.ni.on { border-color: var(--zhu-line); box-shadow: 0 0 0 2px var(--zhu-soft); }
.ni.editing { opacity: .45; }
.ni-img { width: 104px; height: 58px; border-radius: 4px; overflow: hidden; background: var(--paper-2); display: grid; place-items: center; font: 11px var(--kai); color: var(--ink-4); }
.ni-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ni-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ni-h { display: flex; align-items: center; gap: 7px; }
.ni-no { min-width: 18px; height: 18px; padding: 0 4px; display: grid; place-items: center; border-radius: 3px; background: var(--zhu); color: #fff8f2; font: 11px/1 var(--sans); }
.ni-t { font: 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ni-acts { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.ni:hover .ni-acts, .ni.on .ni-acts { opacity: 1; }

/* ---------- 这一页记着的 ---------- */
const D = {
  fps: 24, frames: 0, dur: 0, url: '',
  notesAt: [], shotsDir: [], notes: [], general: '', mdMtime: 0, q: Promise.resolve(), saveT: 0, saving: false, err: '', thumbs: new Map(),
  prompts: [], prompt: '', promptKeep: '', text: '', refs: [], shots: [], timed: '', cuts: [],

let CV = null;    // 对照那一格里放着的视频（白模、另一条样片）
const TOP = {}, RAIL = { userScroll: 0 };
const VURL = new Map(), IURL = new Map();   // 读出来的视频、原图：路径 → blob 网址（一页里重复用）
const host = () => { try { return window.parent !== window ? window.parent.DESK_HOST || null : null; } catch (e) { return null; } };

/* ---------- 从 mp4 头里读帧率帧数、时间和帧号怎么写、批注文件怎么读写、截图：和看文件那一页（项目管理.html）共用 公用/审片.js ---------- */
const { CATS, HAS_RVFC, videoInfo, fmt, fpsText, frameText, byFrame, kfParse, seekRaw } = window.Review;
const fmtF = f => Review.fmtF(f, D.fps);
const rangeText = n => Review.rangeText(n, D.fps);
const nowSec = () => (P ? P.f : 0) / D.fps + 1e-6;   // 画面上这一帧从第几秒起（看它在哪一镜）
const xOf = t => Math.min(100, Math.max(0, t * D.fps / Math.max(1, D.frames - 1) * 100));   // 第几秒在时间条上的位置（百分之几）

/* ============================================================
   提示词：挂了哪些素材、一镜一镜写了什么、每一镜几秒
   ============================================================ */
const MAP = new Map();   // 参考素材映射里这一场各条提示词的登记：文件名 → [{ ref, name, path }]
async function loadMap() {
  MAP.clear();
  try {
    const j = JSON.parse(await readText('资产/参考素材映射.json')), pre = '提示词/' + SEGD + '/';
    for (const [k, v] of Object.entries(j.prompts || {})) if (k.startsWith(pre)) MAP.set(k.slice(pre.length), Array.isArray(v && v.references) ? v.references : []);
  } catch (e) { /* 还没有映射 */ }
}
async function loadPromptList() {
  const ents = await listRel('提示词/' + SEGD);
  D.prompts = ents.filter(e => e.kind === 'file' && RE_VP.test(e.name)).map(e => ({ name: e.name, label: vpLabel(e.name), tok: vpTok(e.name) }))
    .sort((a, b) => (vpNo(a.name) || 999) - (vpNo(b.name) || 999) || byZh(vpBase(a.name), vpBase(b.name)) || vpVer(a.name) - vpVer(b.name));   // 改过几版的：原稿、改1、改2……挨着
}
/* 名字里带着「提示词02」「镜头1-5」的照它猜；只有一条提示词就是它 */
function guessPrompt() {
  const parts = '_' + stem(VID) + '_', by = D.prompts.find(e => e.tok !== '整场' && parts.includes('_' + e.tok + '_'));
  return by ? by.name : D.prompts.length === 1 ? D.prompts[0].name : '';
}
const KIND_CLS = { 人物: 'k-ren', 场景: 'k-jing', 道具: 'k-dao', 特效: 'k-dao', 关键帧: 'k-zhen' };
function kindOfRef(r) {
  const q = r.rel.split('/'), n = q[q.length - 1];
  if (/^@视频/.test(r.ref)) return /白模/.test(n) || q[1] === SEGD ? '白模' : '视频';   // 资产/第N段 里的视频就是白模
  if (/^@音频/.test(r.ref)) return '音频';
  if (q[0] === '资产' && q[1] === '全局资产') return ({ 人物: '人物', 场景: '场景', 道具: '道具', 特效: '特效' })[q[2]] || '其他';
  if (/首帧|尾帧|关键帧/.test(n)) return '关键帧';
  if (/空镜/.test(r.rel)) return '场景';
  return '其他';
}
const refNum = ref => +String(ref).replace(/\D+/g, '');
const refType = ref => /^@视频/.test(ref) ? 0 : /^@图片/.test(ref) ? 1 : 2;
const refBy = ref => D.refs.find(r => r.ref === ref) || null;
const vidRefs = () => D.refs.filter(r => r.kind === '白模' || r.kind === '视频');
const imgRefs = () => D.refs.filter(r => /^@图片/.test(r.ref));
const isImgRef = r => !!r && /^@图片/.test(r.ref);
/* 登记的素材原处换过新版、或者挪走了：看的、放的都是历史记录里登记的那一份（公用/找旧版.js）。
   r.at 是真去读的那一份，r.rel 还是登记的路径（认类别、弃用照旧用它） */
async function placeRefs(refs) {
  if (!window.RefFile) return;
  await Promise.all(refs.filter(r => r.sha).map(async r => {
    try {
      const g = await RefFile.locate(FS, pjAt(''), r.rel, r.sha);
      if (!g) r.note = '登记的那份找不到了，原处和历史记录里都没有';
      else if (g.old) { r.at = g.file; r.note = RefFile.note(g); }
      else if (g.here === 'changed') r.note = '原处换过了，登记的那份没找到';
    } catch (e) { /* 认不出就照原处的 */ }
  }));
}
const atOf = rel => { const r = D.refs.find(x => x.rel === rel && x.at); return r ? r.at : rel; };   // 登记的路径 → 真去读的那一份
const whereOf = r => (r.at || r.rel) + (r.note ? '　' + r.note : '');
/* 白模旁边的「_说明.md」：一镜一行「镜头1：0-4秒　炮兵打出末弹」。
   放的是历史记录里的白模：先看跟它一起收进去的说明（原名_说明__同一个时间.md），没有再看原处的 */
async function cutsOf(rel, at) {
  const side = p => p.replace(/\.[^./]+$/, '') + '_说明.md', files = [];
  if (at && at !== rel) { const m = /^(.*)__([^/]+?)(\.[^./]+)$/.exec(at); files.push(m ? m[1] + '_说明__' + m[2] + '.md' : side(at)); }
  files.push(side(rel));
  for (const f of files) {
    let md;
    try { md = await readText(f); } catch (e) { continue; }
    const out = [];
    for (const line of md.split(/\r\n|\n|\r/)) {
      const m = /镜头\s*0*([0-9]+)\s*[：:｜|]?\s*(\d+(?:\.\d+)?)\s*[-－—–~～至到]\s*(\d+(?:\.\d+)?)\s*秒\s*(.*)$/.exec(line);
      if (m && !out.some(c => c.no === +m[1])) out.push({ no: +m[1], a: +m[2], b: +m[3], title: m[4].trim() });
    }
    return out.sort((x, y) => x.a - y.a);
  }
  return [];
}
/* 一镜一行（「镜头1：0-4秒，首帧参考@图片6。……」）；老稿是「镜头 01｜标题」，正文写在下面几行。有【事件脚本】就只看那一段 */
const RE_SHOT_HEAD = /^\s*镜头\s*0*([0-9０-９]+)\s*([｜|：:])\s*(.*)$/;
const toNo = s => +String(s).replace(/[０-９]/g, c => String(c.charCodeAt(0) - 0xFF10));
const headKey = l => String(l).replace(/\s+/g, '');
const isHead = l => /^【[^】]+】$/.test(headKey(l));
function parseShots(text) {
  const L = text.split(/\r\n|\n|\r/), out = [];
  let from = 0, to = L.length;
  const ev = L.findIndex(l => headKey(l) === '【事件脚本】');
  if (ev >= 0) { from = ev + 1; const e = L.findIndex((l, i) => i > ev && isHead(l)); to = e < 0 ? L.length : e; }
  let cur = null;
  for (let i = from; i < to; i++) {
    const m = RE_SHOT_HEAD.exec(L[i]);
    if (m) {
      const no = toNo(m[1]);
      if (out.some(x => x.no === no)) { cur = null; continue; }
      const bar = m[2] === '｜' || m[2] === '|';
      cur = { no, lines: [i], title: bar ? m[3].trim() : '', body: bar ? '' : m[3].trim(), open: bar };
      out.push(cur);
      continue;
    }
    if (!cur || !cur.open) continue;
    const t = L[i].trim();
    if (!t) { if (cur.body) cur.open = false; continue; }
    if (isHead(t) || /^(保持一致|最终画面|分镜)/.test(t)) { cur.open = false; continue; }
    cur.body += (cur.body ? '\n' : '') + t; cur.lines.push(i);
  }
  for (const s of out) {
    const tag = window.BmKey ? window.BmKey.tagOf(s.body) : null;
    s.raw = L.slice(s.lines[0], s.lines[s.lines.length - 1] + 1).join('\n');   // 这一镜在稿子里原样的字，开头「镜头1：0-4秒，首帧参考@图片6。」也留着（11-15 他要和画布上的严格一致）
    s.a = tag && tag.a != null ? tag.a : null; s.b = tag && tag.b != null ? tag.b : null;
    s.kf = ((tag && tag.refs) || []).find(r => isImgRef(refBy(r))) || frameRefFor(s.no);
    delete s.open;
  }
  return out;
}
/* 这一镜的关键帧：秒数后面写的「首帧参考@图片6」；没写就看挂着的关键帧名字里的镜头号（镜头3_首帧.png） */
function frameRefFor(no) { const r = D.refs.find(x => x.kind === '关键帧' && frameNo(x.rel) === no); return r ? r.ref : ''; }
/* 每一镜几秒：提示词里写了就照它；没写照白模说明；都没有就不跟着播放走（点哪一镜看哪一镜） */
function timeShots() {
  let sh = D.shots;
  if (!sh.length && D.cuts.length) sh = D.shots = D.cuts.map(c => ({ no: c.no, lines: [], title: c.title, body: '', raw: '', a: c.a, b: c.b, kf: frameRefFor(c.no) }));
  const all = () => sh.length && sh.every(s => s.a != null && s.b != null && s.b > s.a);
  if (all()) D.timed = '提示词';
  else if (D.cuts.length) {
    for (const s of sh) { const c = D.cuts.find(x => x.no === s.no); if (c && (s.a == null || s.b == null)) { s.a = c.a; s.b = c.b; } }
    if (all()) D.timed = '白模说明';
  }
  for (const s of sh) { const c = D.cuts.find(x => x.no === s.no); if (c && !s.title) s.title = c.title; }
  if (D.timed) sh.sort((x, y) => x.a - y.a);
}
async function loadPrompt(name) {
  Object.assign(D, { prompt: name, text: '', refs: [], shots: [], timed: '', cuts: [], cur: -1, pick: -1 });
  if (!name) return;
  const dir = '提示词/' + SEGD + '/';
  try { D.text = await readText(dir + name); } catch (e) { toast('提示词读不了：' + e.message, 'err'); return; }
  let side = null;
  try { side = JSON.parse(await readText(dir + name.replace(/\.txt$/i, '') + '_写稿.json')); } catch (e) { /* 不是网页上写的稿 */ }

  return h('header', { class: 'dk-top' },
    h('button', { class: 'btn sm ink', type: 'button', title: '回到审片那一页（批注都存着）', onclick: goBack }, '← 回审片'),
    h('div', { class: 'dk-title' }, h('b', null, '第' + SEG + '场'), h('span', { title: VID }, clipLabel(VID))),
    h('span', { class: 'sp' }),
    h('label', { class: 'dk-pr' }, '出自', sel),
    TOP.status);
}
function render() {
  RAIL.tabs = h('div', { class: 'rt-tabs' });
  RAIL.body = h('div', { class: 'pane' });
  RAIL.body.addEventListener('wheel', () => { RAIL.userScroll = Date.now(); }, { passive: true });
  RAIL.body.addEventListener('pointerdown', () => { RAIL.userScroll = Date.now(); });
  document.getElementById('app').replaceChildren(renderTop(), h('div', { class: 'dk-main' }, buildStage(), h('aside', { class: 'dk-rail' }, RAIL.tabs, RAIL.body)));
  paintStatus(); paintCmp(); paintShots(); onShot(shotAt(0)); paintMarks(); paintComposer(); paintPlay(); paintTime(); paintRail();
}
const fatal = msg => h('div', { class: 'dk-fatal' }, msg, h('div', { style: 'margin-top:16px' }, h('button', { class: 'btn', type: 'button', onclick: goBack }, '← 回审片')));
async function leave() {
  if (!(await leaveForm())) return false;
  if (P) halt();
  if (D.saveT) saveNow();
  await D.q;
  return true;
}
async function goBack() {
  const ho = host();
  if (ho && typeof ho.close === 'function') { ho.close(); return; }   // 嵌在审片那一页里：那一页先问这一页 leave() 再关
  if (!(await leave())) return;
  location.href = '审片.html?' + new URLSearchParams({ p: PJ, s: SEG });
}
window.DESK = { leave, get D() { return D; }, get CMP() { return CMP; }, get P() { return P; } };   // 审片那一页关之前问一声；后面几个调试用

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  if (isComposing(e)) return;
  if (KF.shell) return;   // 盖着在关键帧图上写批注的那一页
  if (D.box) {
    if (e.key === 'Escape') { e.preventDefault(); closeBox(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); D.box.move(e.key === 'ArrowLeft' ? -1 : 1); }
    return;
  }
  if (document.querySelector('#layer .mask:not(.out)') || document.querySelector('.fl-pop')) return;
  const tag = document.activeElement && document.activeElement.tagName, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag || '');
  if (D.form && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveForm(); return; }
  if (D.form && e.key === 'Escape') { e.preventDefault(); leaveForm(); return; }
  if (typing || !P || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); const d = e.key === 'ArrowLeft' ? -1 : 1; step(e.shiftKey ? d * Math.round(D.fps) : d); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); shotStep(e.key === 'ArrowUp' ? -1 : 1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (D.form) { const ta = P.composer.querySelector('.fta'); if (ta) ta.focus(); } else openForm(); }
});
/* 点按钮不抢焦点：空格、回车照样是播放、写批注，不会去按刚点过的按钮 */
document.addEventListener('mousedown', e => { const b = e.target.closest && e.target.closest('button'); if (b && !b.closest('.form, .dk-box, #layer, .fl-pop')) e.preventDefault(); });
window.addEventListener('beforeunload', e => {
  if (D.saveT) saveNow();
  if (D.form && D.form.changed && D.form.text.trim()) { e.preventDefault(); e.returnValue = ''; }
});
/* 隔几秒看一眼批注文件：AI 改了、移走了，就重新读 */
setInterval(async () => {
  if (document.hidden || D.form || !P || D.checking || D.saving || D.saveT) return;
  D.checking = true;
  try {
    await D.q;
    const st = await FS.stat(D.notesAt), mt = st ? st.mtime : 0;
    if (!D.form && !D.saving && !D.saveT && mt !== D.mdMtime) {
      await readMd(); D.sel = null;
      paintMarks(); paintShots(); paintRail(); paintStatus();
      toast(st ? '批注在外面改过，已重新读取' : '批注文件被移走了');
    }
    if (D.refs.some(isKf) && await kfLoad() && (D.tab === 'shot' || D.tab === 'assets')) paintRail();   // 关键帧图上的批注：外面写了、改了
  } catch (e) { /* 下回再看 */ }
  finally { D.checking = false; }
}, 3000);

/* ---------- 开始 ---------- */
(async function boot() {
  const app = document.getElementById('app');
  if (!(await LINK.up())) { app.replaceChildren(fatal('这一页要经本机服务打开：在 Claude 里说「打开项目管理」。')); return; }
  if (!PJ || !SEG || !VIDEO_RE.test(VID)) { app.replaceChildren(fatal('网址里少了项目、第几场或者样片的名字。')); return; }
  document.title = '对照审片 · 第' + SEG + '场 · ' + clipLabel(VID);
  let file;
  try { file = await FS.file(pjAt(VID_REL)); } catch (e) { app.replaceChildren(fatal('打不开这条样片（' + VID_REL + '）：' + e.message)); return; }
  const info = await videoInfo(file);
  D.fps = info ? info.fps : 24; D.frames = info ? info.frames : 0;
  D.url = URL.createObjectURL(file);
  D.notesAt = pjAt('成片/' + SEGD + '/' + stem(VID) + NOTES_TAIL);
  D.shotsDir = pjAt('成片/' + SEGD + '/' + stem(VID) + SHOTS_TAIL);
  await loadMap();
  await loadPromptList();
  const md = await readMd(), has = n => !!n && D.prompts.some(p => p.name === n);
  const want = [md && md.prompt, Q.get('pr')].find(has) || guessPrompt();   // 批注里记过的（在这一页选过）→ 审片那一页给的 → 照名字猜
  if (md && md.prompt && !has(md.prompt) && !want) D.promptKeep = md.promptLine;   // 批注里记的提示词已经不在了：照原样留着
  await loadPrompt(want || '');
  await kfLoad();
  await loadClips();
  restoreCmp();
  render();
  if (window.RefPic) RefPic.watch(ref => { const r = refBy(ref); return r && isImgRef(r) ? { tip: ref + ' · ' + r.label + '　点开看大图', open: () => openRef(r) } : null; }, '.dk-box');   // 字里的 @图片N 都能点开看大图（公用/点图.js），照「出自」选的那条提示词认图
  window.focus();
})();
</script>
