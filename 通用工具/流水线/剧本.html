<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 剧本</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="流水线.js"></script>
<script>
/* ============================================================
   流水线 · 剧本（一场的第二道工序的后一半）
   段落定下来以后：让 AI 扩写成剧本；就在这一页看、点一段写批注、交给 AI 改；看完没问题点「剧本定稿」。
   定稿了才能去下一步出资产图。剧本再改，或者这一场重新定过，要再定一次。
   镜头表这一步 2026-11-12 取消了（他定的）：剧本定稿、资产确认以后直接写提示词，镜头在提示词的「分镜」里设计。
   看剧本、写批注用的是「项目管理」里剧本那一样，嵌在这一页下面。
   共用的东西（读写流水线.json、顶栏、步骤条、剧本现在什么样）在 流水线.js。
   ============================================================ */
'use strict';
let FRAME_KEY = '';   // 嵌着的批注页现在开的是哪一份：同一份就不重新嵌（AI 重写以后，里面的页面自己会换上新的）
const swapCard = () => rerender();
/* 剧本定稿：只记一个时间。剧本以后再改，或者这一场重新定过，这个定稿就不算了，要再点一次 */
async function finalScript(s) {
  await flush();
  if (F.err) return;
  const now = nowText();
  if (!s.头回定稿) s.头回定稿 = s.剧本定稿 || now;   // 头一回定稿是什么时候：以后再定稿就是「重新定稿」，这一场的资产要再核对一遍
  s.剧本定稿 = now; touch();
  await flush();
  swapCard(s);
  toast('第' + s.段 + '场剧本定稿了，可以去看资产、出资产图了');
}
/* 扩写：请 AI 把每个段落写成剧本。原来的剧本由 AI 在写新的之前收进历史记录 */
async function expand(s) {
  await flush();
  if (F.err) return;
  if (!s.头回定稿 && s.剧本定稿) s.头回定稿 = s.剧本定稿;   // 以前定过稿的：头一回定稿的时间先记下，AI 重写完再定稿就算「重新定稿」
  s.扩写 = nowText(); s.剧本定稿 = ''; touch();
  await flush();
  if (AI.ok) await startJob({ 事: '扩写剧本', 段: s.段 });
  else await sendAI('扩写 ' + flowRef() + '｜' + segName(s.段), '交给 AI 了。剧本写好，这里自动出现');
  swapCard(s);
}

/* ---------- 上面一条：剧本现在什么样、该点什么 ---------- */
const barNote = (t, warn) => h('span', { class: 'fn-note' + (warn ? ' warn' : '') }, t);
function barEls(s) {
  const { d, st, again, job } = scriptState(s), out = [], sp = () => h('span', { class: 'sp' });
  const bad = st === 'wait' ? null : jobFailed('扩写剧本', s.段) || jobFailed('按批注改', s.段);   // 上一回没做成，说一句
  const fixing = jobOf('按批注改', s.段);   // 你在下面点了「交给 AI 改」
  if (jobLive(fixing)) return [jobLine(fixing), barNote('改好以后，下面改动的地方显示成红批。')];
  if (bad) out.push(bad);
  const go1 = (label, cls) => h('button', { class: 'btn sm ' + (cls || ''), onclick: () => expand(s) }, label);
  const fin = (label, cls) => h('button', { class: 'btn sm ' + (cls || ''), title: '剧本看过了，就照这一版。定稿以后才出这一场的资产图', onclick: () => finalScript(s) }, label);
  if (st === 'none') out.push(barNote(d.combined ? '汇总稿里有这一段，还没有单独的剧本。' : '还没有剧本。AI 照梗概、人物、场景和这一场的表达，把每个段落写成剧本。'), sp(), go1('让 AI 扩写成剧本', 'ink'));
  else if (st === 'wait') out.push(...(job ? [jobLine(job), barNote('写好这里自动出现。')] : [barNote('交给 AI 了（' + s.扩写.slice(5, 16) + '），写好这里自动出现。'), h('button', { class: 'fl-link', type: 'button', onclick: () => expand(s) }, '再交一次')]));
  else if (st === 'final') out.push(h('span', { class: 'fs-state ok', title: '剧本定稿的时间：' + s.剧本定稿 }, icon('check'), '剧本定稿了 ' + s.剧本定稿.slice(5, 16)), barNote('剧本再改，要重新定稿。'), sp(),
    h('button', { class: 'btn ink', onclick: () => go('资产', { s: s.段 }) }, '下一步：资产 →'));
  else if (st === 'old') out.push(barNote('这一场后来又定过，剧本还是以前的。', true), sp(), go1('让 AI 照这一场重新扩写', 'ink'), fin('剧本不用重写，定稿'));
  else out.push(barNote(again ? '定稿以后又改过。看完没问题，再定一次。' : '在下面看剧本：点一段写批注，再点「交给 AI 改」。没问题了就定稿；定稿以后才出资产图。', again), sp(), fin('剧本定稿', 'ink'));
  return out;
}
/* ---------- 下面：左边是你的段落，右边嵌着剧本，在里面写批注 ---------- */
function paintDoc(s) {
  const d = docsOf(s.段), e = d.script || d.combined, box = document.getElementById('sb-doc');
  const key = e ? at(e.path).join('/') : '';
  if (key === FRAME_KEY && box.firstChild) return;
  FRAME_KEY = key;
  box.replaceChildren(e ? h('iframe', { class: 'wf-frame', title: '剧本', src: shellUrl(at(e.path), true) })
    : h('div', { class: 'wf-lock' }, '剧本写好以后，在这里看、写批注。'));
}
/* 只换会变的那几块：嵌着的批注页不动，写到一半的批注不会丢 */
function repaint() {
  const s = sceneNow(), bar = document.getElementById('sb-bar');
  if (!s || !s.定稿 || !bar) return false;   // 还没定下来、或者刚从没定变成定了：整页重画
  const d = docsOf(s.段);
  bar.replaceChildren(...barEls(s));
  document.getElementById('sb-side').replaceChildren(h('div', { class: 'fs-lab' }, '你的段落', h('em', null, '剧本照它们写')), ...paraList(s).filter(Boolean));
  document.getElementById('sb-docs').replaceChildren(h('span', { class: 'fn-note' }, d.script || d.combined ? '点一段写批注；写完点右上角「交给 AI 改」。' : ''));
  paintDoc(s);
}
function render() {
  const s = sceneNow();
  FRAME_KEY = '';
  if (!s.定稿) return h('div', { class: 'wf-lock' }, '这一场的段落还没定下来。先把段落写好、定下来，AI 才能照它扩写剧本。', h('button', { class: 'btn ink', onclick: () => go('分场', { s: s.段 }) }, '← 回去写段落'));
  setTimeout(repaint, 0);   // 架子先摆上，里面的东西接着填
  return [h('div', { class: 'wf-bar', id: 'sb-bar' }),
    h('div', { class: 'wf-two' }, h('aside', { class: 'wf-side', id: 'sb-side' }), h('div', null, h('div', { class: 'wf-docs', id: 'sb-docs' }), h('div', { id: 'sb-doc' })))];
}

start({ name: '剧本', scene: true, wide: true, render, repaint, sides() { rerender(); } });
</script>
</body>
</html>
