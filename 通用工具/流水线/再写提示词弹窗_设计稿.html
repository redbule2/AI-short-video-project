<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再写一条提示词的框 · 设计稿</title>
<style>
:root {
  --paper: #f4efe6; --sheet: #fffdf9; --ink: #2a2622; --ink-2: #554d45; --ink-3: #887e74; --ink-4: #b2a89b; --line: #d6cab6; --line-2: #e5dccd; --zhu: #a83a2c; --dai: #3e5c5e; --huang: #fff4c9; --zhe: #9a6a2a;
  --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.85 var(--sans); }
main { max-width: 1100px; margin: 0 auto; padding: 32px 22px 120px; }
h1 { margin: 0 0 4px; font: 600 26px/1.4 var(--serif); letter-spacing: .08em; }
.sub { margin: 0 0 16px; font-size: 14.5px; color: var(--ink-2); }
h2 { margin: 38px 0 6px; font: 600 19px/1.5 var(--serif); letter-spacing: .1em; }
.card { margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.card h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; }
.card h3 .no { display: inline-block; min-width: 1.7em; color: var(--dai); }
.card p { margin: 3px 0; color: var(--ink-2); }
.opts { margin: 8px 0 2px; }
.opts label { display: block; margin: 5px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opts label:hover { background: #faf5ea; }
.opts input { margin-right: 8px; }
.opts .rec { color: var(--dai); font-size: 13px; margin-left: 4px; }
textarea { display: block; width: 100%; margin-top: 8px; min-height: 2.6em; padding: 7px 10px; border: 1px dashed #c8b99f; border-radius: 8px; background: #fffef9; font: 15px/1.7 var(--sans); color: var(--ink); resize: vertical; }
textarea:focus { outline: none; border-style: solid; border-color: var(--dai); background: #fff; }
textarea.has { border-style: solid; border-color: #b9822f; background: var(--huang); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(255,253,249,.96); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 14px; z-index: 5; }
.bar button { padding: 6px 14px; border: 1px solid var(--dai); border-radius: 8px; background: #fff; color: var(--dai); font: inherit; cursor: pointer; }
.bar button:hover { background: #eef5f3; }
#st { color: var(--ink-2); }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-3); }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 0; font-size: 14px; }
.pc > div { padding: 8px 12px; border-radius: 8px; background: var(--sheet); border: 1px solid var(--line); color: var(--ink-2); }
.pc b { display: block; font-size: 13.5px; }
.pc .good b { color: var(--dai); } .pc .bad b { color: var(--zhu); }

/* ---- 作用标签的颜色（和流水线、提炼页同一套） ---- */
.sw-t { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 4px; font: 600 11.5px/1.65 var(--sans); white-space: nowrap; vertical-align: 1px; }
.jd { background: #e3eeed; color: #2f5355; } .pd { background: #f4e7cb; color: #7a5a1e; } .zz { background: #fbe3dc; color: #9a3326; }
.gc { background: #a83a2c; color: #fff; } .fy { background: #e5edd9; color: #46622f; } .sw { background: #e9e3da; color: #4d453d; }

/* ---- 示意：右边窗格（约 700 宽）里的框，缩小摆 ---- */
.screens { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.cap { margin: 0 0 4px; font-size: 13.5px; color: var(--ink-3); }
.scr { zoom: .9; position: relative; width: 700px; height: 660px; border-radius: 12px; overflow: hidden; background: #b9b0a4; box-shadow: 0 12px 34px -20px rgba(30,28,24,.45); font: 14px/1.5 var(--sans); color: var(--ink); }
.scr::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, #c6beb2 0 64px, #b9b0a4 64px 76px); opacity: .6; }
.dlg { position: absolute; left: 50%; top: 22px; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; background: var(--sheet); border-radius: 11px; box-shadow: 0 0 0 1px rgba(214,202,182,.8), 0 30px 70px -24px rgba(40,28,16,.5); overflow: hidden; }
.dlg.w5 { width: 560px; } .dlg.w6 { width: 676px; }
.d-head { padding: 20px 24px 10px; }
.d-head.sh { border-bottom: 1px solid var(--line-2); box-shadow: 0 6px 12px -12px rgba(40,28,16,.4); }
.d-t { margin: 0; font: 600 19px/1.4 var(--serif); }
.d-s { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.steps { display: flex; gap: 16px; margin: 6px 0 0; font-size: 12.5px; color: var(--ink-4); }
.steps .on { color: var(--ink); font-weight: 600; } .steps .ok { color: var(--dai); }
.got { margin-top: 8px; padding: 6px 10px; border-radius: 7px; background: #f6f0e4; font-size: 13px; color: var(--ink-2); }
.got b { color: var(--ink); margin-right: 6px; }
.d-body { flex: 1; overflow: hidden; padding: 0 24px 12px; position: relative; }
.d-body.fade::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(rgba(255,253,249,0), var(--sheet)); }
.sb { position: absolute; right: 5px; width: 5px; border-radius: 3px; background: #d9cfbf; }
.d-foot { display: flex; align-items: center; gap: 6px; padding: 12px 24px 16px; border-top: 1px solid var(--line-2); background: var(--sheet); }
.d-foot .sum { flex: 1; font-size: 13px; color: var(--ink-2); }
.d-foot .sum b { color: var(--ink); }
.btn { display: inline-block; padding: 7px 15px; border-radius: 6px; font-size: 13.5px; border: 1px solid transparent; white-space: nowrap; }
.btn.ink { background: var(--ink); color: #f7f1e6; }
.btn.ghost { color: var(--ink-2); }
.lab { margin: 12px 0 6px; font-size: 12px; color: var(--ink-3); letter-spacing: .24em; }
.lab .r { float: right; letter-spacing: 0; color: var(--ink-4); }
/* 镜头一行 */
.row { display: grid; grid-template-columns: 16px 24px 1fr auto; gap: 0 8px; align-items: baseline; padding: 6px 10px; margin: 0 0 4px; border: 1px solid var(--line-2); border-radius: 7px; }
.row.on { border-color: var(--ink); box-shadow: inset 0 0 0 .5px var(--ink); background: #fffaf0; }
.ck { position: relative; width: 14px; height: 14px; border: 1.5px solid #a99d8f; border-radius: 3px; align-self: center; }
.row.on .ck { background: var(--ink); border-color: var(--ink); }
.row.on .ck::after { content: ''; position: absolute; left: 3.5px; top: .5px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.row .no { font: 600 14px/1.5 var(--serif); color: var(--ink-2); }
.row .w { font-weight: 600; }
.row .sec { font-size: 12.5px; color: var(--ink-3); }
.row .y { grid-column: 3 / 5; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .had { float: right; margin-left: 8px; font-size: 12px; color: var(--zhe); }
.row.one { grid-template-columns: 16px 24px 1fr auto auto; padding: 5px 10px; }
.row.one .w .sw-t { margin: 0 0 0 6px; }
/* 三选一 */
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.picks.col { grid-template-columns: 1fr; gap: 6px; }
.pk { padding: 8px 11px; border: 1px solid var(--line-2); border-radius: 8px; }
.pk b { display: block; font-size: 13.5px; }
.pk span { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.pk.on { border-color: var(--ink); box-shadow: inset 0 0 0 .5px var(--ink); background: #fffaf0; }
.pk.on b::before { content: '● '; font-size: 10px; vertical-align: 2px; }
/* 下拉框 */
.sel { display: flex; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; background: #fff; }
.sel::after { content: '▾'; color: var(--ink-3); }
.hint { margin: 4px 0 0; font-size: 12px; color: var(--ink-3); }
/* 关键帧小图 */
.kf { display: flex; gap: 8px; flex-wrap: wrap; }
.kt { width: 118px; }
.kt .im { position: relative; height: 66px; border-radius: 6px; overflow: hidden; background: #ddd3c4; outline: 2px solid var(--ink); outline-offset: -2px; }
.kt img { display: block; width: 100%; height: 100%; object-fit: cover; }
.kt .badge { position: absolute; left: 4px; top: 4px; padding: 0 5px; border-radius: 4px; background: var(--ink); color: #f7f1e6; font-size: 11px; line-height: 1.6; }
.kt small { display: block; margin-top: 3px; font-size: 11.5px; line-height: 1.4; color: var(--ink-3); }
.more { display: inline-flex; align-items: center; justify-content: center; width: 118px; height: 66px; border: 1px dashed var(--line); border-radius: 6px; font-size: 12px; line-height: 1.4; color: var(--ink-3); text-align: center; }
.kf.sm .kt, .kf.sm .more { width: 92px; } .kf.sm .kt .im, .kf.sm .more { height: 52px; }
/* 乙：两栏 */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; height: 100%; }
.two > div { position: relative; overflow: hidden; }
</style>
</head>
<body>
<main>
<h1>再写一条提示词的框 · 设计稿</h1>
<p class="sub" id="sub"></p>

<!-- ===== 甲：两步走 ===== -->
<template id="fig-a">
<div class="screens">
  <div><p class="cap">第 1 步：拍哪几镜</p>
  <div class="scr"><div class="dlg w5">
    <div class="d-head sh"><p class="d-t">再写一条提示词 · 第3-4段</p>
      <div class="steps"><span class="on">① 拍哪几镜</span><span>② 怎么写</span></div>
      <p class="d-s">一条提示词出一条视频，一般 15 秒，最长 30 秒。勾这一条拍哪几镜。</p></div>
    <div class="d-body fade"><p class="lab">镜头表<span class="r">共 18 镜</span></p><div data-rows="1-9" data-on="5,6"></div><i class="sb" style="top:8px;height:44%"></i></div>
    <div class="d-foot"><span class="sum"><b>5-6</b> · 2 镜 · 约 9 秒 · 存成 5-6.txt</span><span class="btn ghost">取消</span><span class="btn ink">下一步：怎么写</span></div>
  </div></div></div>
  <div><p class="cap">第 2 步：怎么写</p>
  <div class="scr"><div class="dlg w5">
    <div class="d-head sh"><p class="d-t">再写一条提示词 · 第3-4段</p>
      <div class="steps"><span class="ok">① 拍哪几镜 ✓</span><span class="on">② 怎么写</span></div>
      <div class="got"><b>5-6</b>全线炮声渐息 → 地面直升机起飞 · 约 9 秒</div></div>
    <div class="d-body">
      <p class="lab">谁来写</p>
      <div class="picks">
        <div class="pk on"><b>我来写 · 分镜模式</b><span>一镜一行，可加可排。其余几块点「AI 铺底」补</span></div>
        <div class="pk"><b>我来写 · 自由模式</b><span>事件脚本一个大框，随你写。其余也是 AI 铺底</span></div>
        <div class="pk"><b>AI 先写一版</b><span>AI 照 sd25-pe 写、估秒数，你再批注</span></div>
      </div>
      <p class="lab">白模视频<span class="r">可以不挂</span></p>
      <div class="sel"><span>不挂</span></div>
      <p class="hint">管到这两镜的 3 段排在最前：镜头1-5、镜头6、镜头6-10</p>
      <p class="lab">关键帧<span class="r">照勾的镜头自动挂好，第一张当首帧</span></p>
      <div class="kf">
        <div class="kt"><div class="im"><img data-f="资产/关键帧/第3-4段/镜头5_首帧.png" alt=""><span class="badge">首帧</span></div><small>镜头5 开头</small></div>
        <div class="kt"><div class="im"><img data-f="资产/关键帧/第3-4段/镜头6_首帧.png" alt=""></div><small>镜头6 开头</small></div>
        <span class="more">＋ 其他关键帧<br>25 张</span>
      </div>
    </div>
    <div class="d-foot"><span class="btn ghost">‹ 改镜头</span><span class="sum"></span><span class="btn ghost">取消</span><span class="btn ink">开始写</span></div>
  </div></div></div>
</div>
<div class="pc"><div class="good"><b>好</b>一次只想一件事：先定拍哪几镜，再定怎么写。两步都不用往下滚。关键帧照勾的镜头自动挂好。</div><div class="bad"><b>不足</b>多点一下「下一步」。第 2 步看不到整张镜头表，只在顶上写着勾了哪几镜，要改点「改镜头」回去。</div></div>
</template>

<!-- ===== 乙：宽框两栏 ===== -->
<template id="fig-b">
<div class="screens">
  <div><p class="cap">一屏看全（你右边窗格约 700 宽）</p>
  <div class="scr"><div class="dlg w6">
    <div class="d-head sh"><p class="d-t">再写一条提示词 · 第3-4段</p><p class="d-s">一条提示词出一条视频，一般 15 秒，最长 30 秒。</p></div>
    <div class="d-body"><div class="two">
      <div class="fade"><p class="lab">拍哪几镜</p><div data-rows="1-13" data-on="5,6" data-one=""></div><i class="sb" style="top:8px;height:58%"></i></div>
      <div>
        <p class="lab">谁来写</p>
        <div class="picks col">
          <div class="pk on"><b>我来写 · 分镜模式</b><span>一镜一行。其余几块点「AI 铺底」补</span></div>
          <div class="pk"><b>我来写 · 自由模式</b><span>事件脚本一个大框，随你写</span></div>
          <div class="pk"><b>AI 先写一版</b><span>AI 写、估秒数，你再批注</span></div>
        </div>
        <p class="lab">白模视频</p>
        <div class="sel"><span>不挂</span></div>
        <p class="hint">管到这两镜的 3 段排在最前</p>
        <p class="lab">关键帧</p>
        <div class="kf sm">
          <div class="kt"><div class="im"><img data-f="资产/关键帧/第3-4段/镜头5_首帧.png" alt=""><span class="badge">首帧</span></div><small>镜头5 开头</small></div>
          <div class="kt"><div class="im"><img data-f="资产/关键帧/第3-4段/镜头6_首帧.png" alt=""></div><small>镜头6 开头</small></div>
          <span class="more">＋ 其他<br>25 张</span>
        </div>
      </div>
    </div></div>
    <div class="d-foot"><span class="sum"><b>5-6</b> · 2 镜 · 约 9 秒 · 存成 5-6.txt</span><span class="btn ghost">取消</span><span class="btn ink">开始写</span></div>
  </div></div></div>
</div>
<div class="pc"><div class="good"><b>好</b>全摆在一屏：勾镜头时，旁边的关键帧跟着换。点一下就开写。</div><div class="bad"><b>不足</b>窗格窄，两栏都挤：镜头只放得下一行字，作用要鼠标停上去才看到。一屏东西多，眼睛要来回找。</div></div>
</template>

<!-- ===== 丙：一栏收紧 ===== -->
<template id="fig-c">
<div class="screens">
  <div><p class="cap">刚打开</p>
  <div class="scr"><div class="dlg w5">
    <div class="d-head sh"><p class="d-t">再写一条提示词 · 第3-4段</p><p class="d-s">一条提示词出一条视频，一般 15 秒，最长 30 秒。</p></div>
    <div class="d-body fade"><p class="lab">拍哪几镜<span class="r">共 18 镜</span></p><div data-rows="1-9" data-on="5,6"></div><i class="sb" style="top:8px;height:30%"></i></div>
    <div class="d-foot"><span class="sum"><b>5-6</b> · 2 镜 · 约 9 秒 · 存成 5-6.txt</span><span class="btn ghost">取消</span><span class="btn ink">开始写</span></div>
  </div></div></div>
  <div><p class="cap">滚到底</p>
  <div class="scr"><div class="dlg w5">
    <div class="d-head sh"><p class="d-t">再写一条提示词 · 第3-4段</p></div>
    <div class="d-body"><div data-rows="18-19" data-on=""></div>
      <p class="lab">谁来写</p>
      <div class="picks">
        <div class="pk on"><b>我来写 · 分镜模式</b><span>一镜一行，可加可排。其余几块点「AI 铺底」补</span></div>
        <div class="pk"><b>我来写 · 自由模式</b><span>事件脚本一个大框，随你写。其余也是 AI 铺底</span></div>
        <div class="pk"><b>AI 先写一版</b><span>AI 照 sd25-pe 写、估秒数，你再批注</span></div>
      </div>
      <p class="lab">白模视频</p>
      <div class="sel"><span>不挂</span></div>
      <p class="lab">关键帧</p>
      <div class="kf">
        <div class="kt"><div class="im"><img data-f="资产/关键帧/第3-4段/镜头5_首帧.png" alt=""><span class="badge">首帧</span></div><small>镜头5 开头</small></div>
        <div class="kt"><div class="im"><img data-f="资产/关键帧/第3-4段/镜头6_首帧.png" alt=""></div><small>镜头6 开头</small></div>
        <span class="more">＋ 其他关键帧<br>25 张</span>
      </div>
      <i class="sb" style="bottom:8px;height:30%"></i>
    </div>
    <div class="d-foot"><span class="sum"><b>5-6</b> · 2 镜 · 约 9 秒 · 存成 5-6.txt</span><span class="btn ghost">取消</span><span class="btn ink">开始写</span></div>
  </div></div></div>
</div>
<div class="pc"><div class="good"><b>好</b>顺序和现在一样，改得最少。按钮钉在底下，不再滚走。</div><div class="bad"><b>不足</b>镜头多了，还要滚过整张镜头表才看到「谁来写」。一屏好几件事。</div></div>
</template>

<div id="sections"></div>
<h2>别的意见</h2>
<div class="card"><textarea data-k="其他" placeholder="上面没说到的，写在这里（可以不写）"></textarea></div>

</main>
<div class="bar"><span id="st">选好、写好自动存。</span><button id="copy">复制批注</button></div>

function rowsHtml(from, to, on, one) {
  const a = SHOTS.findIndex(x => x[0] === from), b = SHOTS.findIndex(x => x[0] === to);

    const tg = '<span class="sw-t ' + cls + '">' + tag + '</span>', ck = '<i class="ck"></i><span class="no">' + no + '</span>';

  }).join('');
}
for (const t of document.querySelectorAll('template')) for (const el of t.content.querySelectorAll('[data-rows]')) {
