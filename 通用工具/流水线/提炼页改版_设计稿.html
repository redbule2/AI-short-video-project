<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提炼页改版 · 设计稿</title>
<style>
:root { --paper: #f4efe6; --sheet: #fffdf9; --ink: #2a2622; --ink-2: #554d45; --ink-3: #887e74; --line: #d6cab6; --zhu: #a83a2c; --zhu-soft: #fbeee9; --dai: #3e5c5e; --huang: #fff4c9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.85 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 32px 22px 120px; }
h1 { margin: 0 0 4px; font: 600 26px/1.4 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .08em; }
.sub { margin: 0 0 20px; font-size: 14.5px; color: var(--ink-2); }
h2 { margin: 34px 0 10px; font: 600 19px/1.5 'Noto Serif SC', 'Songti SC', SimSun, serif; letter-spacing: .1em; }
.fig { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
.card { margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.card h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; }
.card h3 .no { display: inline-block; min-width: 1.7em; color: var(--dai); }
.card p { margin: 3px 0; color: var(--ink-2); }
.opts { margin: 8px 0 2px; }
.opts label { display: block; margin: 5px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opts label:hover { background: #faf5ea; }
.opts input { margin-right: 8px; }
.opts .rec { color: var(--dai); font-size: 13px; margin-left: 4px; }
textarea { display: block; width: 100%; margin-top: 8px; min-height: 2.6em; padding: 7px 10px; border: 1px dashed #c8b99f; border-radius: 8px; background: #fffef9; font: 15px/1.7 'Noto Sans SC', 'Microsoft YaHei', sans-serif; color: var(--ink); resize: vertical; }
textarea:focus { outline: none; border-style: solid; border-color: var(--dai); background: #fff; }
textarea.has { border-style: solid; border-color: #b9822f; background: var(--huang); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(255,253,249,.96); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 14px; }
.bar button { padding: 6px 14px; border: 1px solid var(--dai); border-radius: 8px; background: #fff; color: var(--dai); font: inherit; cursor: pointer; }
.bar button:hover { background: #eef5f3; }
#st { color: var(--ink-2); }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-3); }
.cap { margin: 8px 2px 0; font-size: 13px; color: var(--ink-3); }

/* ---- 现在和以后：一长页 vs 三个页签 ---- */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.cmp b.h { display: block; margin-bottom: 6px; font-size: 14.5px; }
.cmp .old b.h { color: var(--zhu); } .cmp .new b.h { color: var(--dai); }
.long { border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: #fbf8f1; font-size: 11.5px; line-height: 1.4; color: var(--ink-2); }
.long div { margin: 3px 0; padding: 3px 6px; border-radius: 4px; background: #fff; border: 1px solid #e6dccb; }
.long .c { background: #fdf3e3; border-color: #e8cf9f; }
.long .s { background: #eef3fb; border-color: #c7d4e8; }
.long .scr { margin: 4px 0; border: 0; border-top: 1px dashed var(--zhu); border-radius: 0; background: none; padding: 0 0 0 4px; color: var(--zhu); font-size: 11px; }
.why { margin: 6px 2px 0; font-size: 13px; color: var(--ink-3); }

/* ---- 样子：照流水线的颜色画的，页签可以点 ---- */
.mk { border: 1px solid var(--line); border-radius: 10px; background: #fbf8f1; overflow: hidden; font-size: 14px; line-height: 1.7; }
.mk input[type=radio] { display: none; }
.mk-top { position: relative; padding: 10px 14px 0; background: #fffdf9; border-bottom: 1px solid var(--line); box-shadow: 0 3px 8px -6px rgba(0,0,0,.25); }
.mk-title { display: flex; align-items: baseline; gap: 10px; }
.mk-title b { font: 600 15px 'Noto Serif SC', SimSun, serif; color: var(--ink-2); }
.mk-title span.n { font: 600 17px 'Noto Serif SC', SimSun, serif; }
.mk-st { margin-left: auto; padding: 0 9px; border: 1px solid var(--line); border-radius: 20px; font-size: 12px; color: var(--ink-3); }
.mk-pin { font-size: 11.5px; color: var(--dai); }
.mk-tabs { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.mk-tab { padding: 6px 12px 8px; border-bottom: 2.5px solid transparent; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.mk-tab em { font-style: normal; margin-left: 4px; padding: 0 6px; border-radius: 9px; background: #efe8db; font-size: 12px; color: var(--ink-3); }
.mk-tab i.dot { display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; background: var(--zhu); vertical-align: 2px; }
.mk-tab small { margin-left: 3px; color: var(--ink-3); font-size: 11.5px; }
.mk-tab:hover { color: var(--ink); }
.mk-sp { flex: 1; }
.mk-a { font-size: 13px; color: var(--zhu); text-decoration: underline dotted; cursor: default; white-space: nowrap; }
.mk-btn { padding: 3px 12px; border: 1px solid var(--ink); border-radius: 8px; background: #fff; font: inherit; font-size: 13px; white-space: nowrap; }
.mk-btn.ink { background: var(--ink); color: #fff; }
.mk-btn.zhu { border-color: var(--zhu); color: var(--zhu); }
.mk-acts { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
#mk-t1:checked ~ .mk-top label[for=mk-t1], #mk-t2:checked ~ .mk-top label[for=mk-t2], #mk-t3:checked ~ .mk-top label[for=mk-t3] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 600; }
.mk-p { display: none; padding: 12px 14px 14px; }
#mk-t1:checked ~ .p1, #mk-t2:checked ~ .p2, #mk-t3:checked ~ .p3 { display: block; }
.mk-hint { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-3); }

/* 镜头表：一镜一行 */
.mk-tb { border: 1px solid var(--line); border-radius: 8px; background: #fffdf9; }
.mk-r { position: relative; display: grid; grid-template-columns: 18px 34px 1fr 22px; gap: 6px; align-items: start; padding: 7px 8px; border-top: 1px solid #ece3d3; }
.mk-r:first-child { border-top: 0; }
.mk-r .g { color: #c4b8a4; cursor: grab; letter-spacing: -2px; padding-top: 1px; }
.mk-r .no { font: 600 13px 'Noto Serif SC', SimSun, serif; color: var(--dai); padding-top: 1px; }
.mk-r .tx b { display: block; font-weight: 500; color: var(--ink); }
.mk-r .tx small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-3); font-size: 12.5px; }
.mk-r .m { color: var(--ink-3); text-align: center; }
.mk-r.note::after { content: ''; position: absolute; right: 0; top: 0; border: 7px solid transparent; border-top-color: var(--zhu); border-right-color: var(--zhu); border-top-right-radius: 0; }
.mk-r .nt { display: block; margin-top: 2px; font-size: 12.5px; color: var(--zhu); font-family: KaiTi, 'Kaiti SC', serif; }
.mk-r.chg { box-shadow: inset 3px 0 0 var(--zhu); }
.mk-r .was { display: block; font-size: 12px; color: var(--zhu); }
.mk-r .was del { color: var(--ink-3); }
.mk-r.open { background: #fff; box-shadow: inset 3px 0 0 var(--dai); }
.mk-f { margin: 4px 0; }
.mk-f span { display: block; font-size: 12px; color: var(--ink-3); }
.mk-f div { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-height: 1.9em; }
.mk-f.z div { border-color: #e6b8ad; background: #fffaf7; color: var(--zhu); font-family: KaiTi, 'Kaiti SC', serif; }
.mk-ops { display: flex; gap: 14px; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
.mk-ops u { text-decoration: none; border-bottom: 1px dotted; }
.mk-add { margin: 8px 0 0; padding: 6px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; color: var(--ink-3); font-size: 13px; }

/* 出场的：分三组，一样一张小卡 */
.mk-grp { margin: 0 0 12px; }
.mk-gh { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; font: 600 14px 'Noto Serif SC', SimSun, serif; }
.mk-gh em { font: normal 12px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; color: var(--ink-3); }
.mk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.mk-c { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf9; }
.mk-c .im { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; font: 600 15px 'Noto Serif SC', SimSun, serif; color: #fff; }
.mk-c .nm { font-weight: 600; font-size: 13.5px; }
.mk-c .ds { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; line-height: 1.6; color: var(--ink-2); }
.mk-c .ds.miss { color: var(--zhu); }
.mk-c .tg { display: block; margin-top: 2px; font-size: 11px; color: var(--ink-3); }
.mk-c .x { position: absolute; right: 6px; top: 2px; color: #b9ad9b; font-size: 13px; }
.mk-c.sug { border-style: dashed; background: transparent; opacity: .85; }
.mk-c.sug .nm::after { content: '　点一下加上'; font-weight: 400; font-size: 11.5px; color: var(--dai); }
.mk-c.plus { display: grid; place-items: center; grid-template-columns: 1fr; border-style: dashed; background: transparent; color: var(--ink-3); font-size: 13px; min-height: 58px; }
.mk-c.open { grid-column: 1 / -1; grid-template-columns: 56px 1fr; border-color: var(--dai); background: #fff; }
.mk-c.open .im { width: 56px; height: 56px; }
.mk-c.note::after { content: ''; position: absolute; right: 0; top: 0; border: 7px solid transparent; border-top-color: var(--zhu); border-right-color: var(--zhu); }
.mk-syn { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf9; font: 14.5px/1.9 'Noto Serif SC', SimSun, serif; }
@media (max-width: 640px) { .cmp { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
<h1>提炼页改版 · 设计稿</h1>
<p class="sub" id="sub"></p>

<template id="fig-now">
<div class="cmp">
<div class="old"><b class="h">现在：一长页，第3-4段要滚 8 屏</b>
<div class="long">
<div>整体批注</div><div>梗概（全片的）</div><div class="c">出场的：10 个小牌子（选、去掉）</div>
<div class="scr">↓ 第 1 屏到这里</div>
<div class="c">人物卡：我军士兵（描写框）</div><div class="c">人物卡：外星战士</div><div class="c">人物卡：直升机驾驶员</div><div class="c">人物卡：炮手</div>
<div class="c">场景卡</div><div class="c">道具卡 × 6：飞碟、榴弹炮……</div>
<div class="scr">↓ 滚过 3 屏，镜头表才开始</div>
<div class="s">镜头 1（写什么、作用、4 个小按钮）</div><div class="s">镜头 2</div><div class="s">……</div><div class="s">镜头 19</div>
<div class="scr">↓ 一共 8 屏</div>
</div>
<p class="why">同一个人：上面小牌子里删，下面卡里改描写，两处找。</p>
</div>
<div class="new"><b class="h">以后：分三页，一次只看一样</b>
<div class="long">
<div style="background:#fffdf9;border-color:var(--line)"><b style="color:var(--ink)">镜头表 18</b>　·　出场的 10　·　梗概　　　<span style="color:var(--zhu)">交给 AI 改</span>　<b style="color:var(--ink)">定下来</b></div>
<div class="scr" style="color:var(--dai);border-color:var(--dai)">↑ 这一条钉在顶上，滚到哪都在</div>
<div class="s">1　炮兵打出末弹</div><div class="s">2　末轮炮火炸翻敌群</div><div class="s">3　最后弹壳退膛</div><div class="s">……</div><div class="s">19　外星战士又冲上来</div>
<div class="scr" style="color:var(--dai);border-color:var(--dai)">↓ 18 镜一屏半看完</div>
</div>
<p class="why">点「出场的」才换成人物、场景、道具，镜头表收起来。</p>
</div>
</div>
</template>

<template id="fig-mock">
<div class="mk">
<input type="radio" name="mk-tab" id="mk-t1" checked><input type="radio" name="mk-tab" id="mk-t2"><input type="radio" name="mk-tab" id="mk-t3">
<div class="mk-top">
  <div class="mk-title"><b>第3-5段</b><span class="n">大圣救场</span><span class="mk-pin">（这一条钉在顶上，滚到哪都在）</span><span class="mk-st">还在改</span></div>
  <div class="mk-tabs">
    <label class="mk-tab" for="mk-t1">镜头表<em>6</em></label>
    <label class="mk-tab" for="mk-t2">出场的<em>10</em><i class="dot" title="2 样没写描写"></i></label>
    <label class="mk-tab" for="mk-t3">梗概<small>全片</small></label>
    <span class="mk-sp"></span>
  </div>
  <div class="mk-acts"><span class="mk-a">整体批注</span><span class="mk-sp"></span><span style="font-size:12.5px;color:var(--ink-3)">AI 重新提炼</span><button class="mk-btn zhu">交给 AI 照批注改（2 条）</button><button class="mk-btn ink">✓ 定下来</button></div>
</div>

<div class="mk-p p1">
  <p class="mk-hint">一镜一行。点一行在原地改，回车到下一格。左边按住拖，换顺序。</p>
  <div class="mk-tb">
    <div class="mk-r"><span class="g">⋮⋮</span><span class="no">1</span><div class="tx"><b>机枪都不响了，外星战士欢呼冲向沙袋墙</b><small>接上一段的弹尽，敌人一窝蜂压到墙前，越冲越快。观众觉得阵地守不住了……</small></div><span class="m">⋯</span></div>
    <div class="mk-r note"><span class="g">⋮⋮</span><span class="no">2</span><div class="tx"><b>金光落在墙前截住敌人，云层裂开战歌骤起</b><small>冲锋被突如其来的金光硬生生截住，局面陡转……</small><span class="nt">批注：战歌放到下一镜再起</span></div><span class="m">⋯</span></div>
    <div class="mk-r open"><span class="g">⋮⋮</span><span class="no">3</span><div class="tx">
      <div class="mk-f"><span>写什么</span><div>漫天小悟空落下，领头的落地亮出“童”字</div></div>
      <div class="mk-f"><span>起什么作用</span><div>救兵亮相：先是布满天空的气势，再落到领头小悟空一个人身上……</div></div>
      <div class="mk-f z"><span>批注（写给 AI）</span><div>领头的落地要稳，别翻跟头</div></div>
      <div class="mk-ops"><u>在下面插一镜</u><u>删掉</u><span class="mk-sp"></span><u>收起</u></div>
    </div><span class="m"></span></div>
    <div class="mk-r chg"><span class="g">⋮⋮</span><span class="no">4</span><div class="tx"><b>小悟空列成横阵挡在墙前，舞棒逼退敌人</b><small>一道望不到头的小猴横阵把沙袋墙护在身后……</small><span class="was">AI 改过，原来是：<del>小悟空排成一排</del></span></div><span class="m">⋯</span></div>
    <div class="mk-r"><span class="g">⋮⋮</span><span class="no">5</span><div class="tx"><b>两边对冲，领头小悟空一棒一个打飞敌人</b><small>一矮一高两边正面相撞，领头小悟空连砸三个……</small></div><span class="m">⋯</span></div>
    <div class="mk-r"><span class="g">⋮⋮</span><span class="no">6</span><div class="tx"><b>全线挡住敌人，墙后士兵起身，机枪手惊叹</b><small>从一个人打到整条战线，敌人拔刀也挡不住……</small></div><span class="m">⋯</span></div>
  </div>
  <div class="mk-add">＋ 加一镜（号接着往下排）</div>
</div>

<div class="mk-p p2">
  <p class="mk-hint">描写是全片通用的，在这里改了，别的段跟着变。点一张卡在原地改；卡上 × 是这一段不用它。</p>
  <div class="mk-grp"><div class="mk-gh">人物 <em>4</em></div><div class="mk-cards">
    <div class="mk-c"><span class="im" style="background:#6b7a52">兵</span><div><span class="nm">我军士兵</span><span class="ds">红星军帽、土橄榄色军装、白布胸章、棕色皮背带</span><span class="tg">第3-3、3-4、3-6段也用</span></div><span class="x">×</span></div>
    <div class="mk-c"><span class="im" style="background:#9b4a3a">外</span><div><span class="nm">外星战士</span><span class="ds">砖红头盔和护甲、沙灰战衣，左腰佩刀入鞘</span><span class="tg">第3-3、3-4、3-6段也用</span></div><span class="x">×</span></div>
    <div class="mk-c open note"><span class="im" style="background:#a99f90">机</span><div><span class="nm">机枪手</span>
      <div class="mk-f"><span>描写</span><div>我军士兵，蹲在沙袋墙后，手握大砍刀</div></div>
      <div class="mk-f z"><span>批注（写给 AI）</span><div>他是守重机枪的，别写成拿刀的</div></div>
      <div class="mk-ops"><u>这一段不用它</u><span class="mk-sp"></span><u>收起</u></div></div></div>
    <div class="mk-c"><span class="im" style="background:#c99a2e">悟</span><div><span class="nm">小悟空</span><span class="ds">约十岁的儿童小猴，金棕色短毛，头戴金箍；金黄色立领短打，胸口一个朱红的“童”字</span><span class="tg">第3-6段也用</span></div><span class="x">×</span></div>
    <div class="mk-c plus">＋ 加人物</div>
  </div></div>
  <div class="mk-grp"><div class="mk-gh">场景 <em>1</em></div><div class="mk-cards">
    <div class="mk-c"><span class="im" style="background:#7c8a8c">场</span><div><span class="nm">华盛顿东郊·战场</span><span class="ds">白天，外</span><span class="tg">第3-3、3-4、3-6段也用</span></div><span class="x">×</span></div>
    <div class="mk-c sug"><span class="im" style="background:#b8b0a2">图</span><div><span class="nm">榴弹炮局部俯拍</span><span class="ds">这一段的场景图，剧本里提到了</span></div></div>
    <div class="mk-c plus">＋ 加场景</div>
  </div></div>
  <div class="mk-grp"><div class="mk-gh">道具 <em>5</em><em style="color:var(--zhu)">2 样没写描写</em></div><div class="mk-cards">
    <div class="mk-c"><span class="im" style="background:#59606a">碟</span><div><span class="nm">飞碟</span><span class="ds">巨大的圆盘形飞碟，深灰色分块金属外壳，接缝处一排排铆钉</span></div><span class="x">×</span></div>
    <div class="mk-c"><span class="im" style="background:#7a6a58">刀</span><div><span class="nm">大砍刀</span><span class="ds">抗战时期中国军队用的那种大刀，单面开刃，全长约九十厘米</span></div><span class="x">×</span></div>
    <div class="mk-c"><span class="im" style="background:#a99f90">枪</span><div><span class="nm">重机枪</span><span class="ds">带水套的水冷重机枪，架在三脚架上</span></div><span class="x">×</span></div>
    <div class="mk-c"><span class="im" style="background:#c99a2e">棒</span><div><span class="nm">金箍棒</span><span class="ds miss">还没写描写</span></div><span class="x">×</span></div>
    <div class="mk-c"><span class="im" style="background:#e0b84a">光</span><div><span class="nm">金光</span><span class="ds miss">还没写描写</span></div><span class="x">×</span></div>
    <div class="mk-c plus">＋ 加道具</div>
  </div></div>
</div>
