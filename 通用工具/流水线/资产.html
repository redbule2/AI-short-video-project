<script>

/* ============================================================
   流水线 · 资产（一场的第三道工序）
   剧本定稿、提炼定了以后才开（11-16 起出场的是剧本定稿以后提炼的）：这一场出场的人物、道具、场景图各对着哪张图。
   用已有的：点「选出场的」，从全片设定的表里选上；点「用已有的图」，从项目的图里挑一张（删掉的也能放回来）；
     剧本、段落里提到了还没选的，摆在下面点一下选上。
   字先定，图后出（2026-11-14 他定的，流程图 文生资产_流程图.html；共用的做法在 流水线.js「文生资产」那一节）：
     顶上「让 AI 写字」：AI 读定稿的剧本，给这一场还没有字的写字（出图提示词，场景先写 GEO 底稿），已经有的图核一遍撑不撑得住。
     每一格右边是眼下该做的：写字 → 批字（自己改，或写批注交给 AI 改；字定了点「照这个出图」）→ 图出好了点开看（框出来写批注点「照批注改图」，或者「看字」回去改字）
     → 确认可用。已经有图的再出，新图先当候选（「看新图」：旧图、新图并排，挑「用旧图」或「用新图」；没挑以前格子上不摆旧图的「可用」）。场景图确认以后，AI 照图再核一遍 GEO 底稿。
     只用文字写的场景也能写字、出图：图出好了点「用上这张图」，这一场改用图。道具能「加一种样子」（一个状态一张图）。
   确认可用：一张图一张图确认（2026-11-12 他定的）。确认记在全片，确认过的图别的场不用再确认；
     这一场要的图都确认了，这一步自动过。图重出过、它的描写改过，那一张要再确认。
   点一张图看大图、写批注（用的是「项目管理」里图片那一样），看大图时顶上也能点「这张确认可用」。
   第四块关键帧（11-13 夜他要的）：资产/第N段 里名字带首帧、尾帧、关键帧的自动列上，别的图点「＋ 新增关键帧」挑；只这一场用，AI 不出。
     挂到哪条提示词、当首帧还是第几个关键帧，在提示词那一步定。
   即梦画布上的图（11-14 他要的）：「用已有的图」最下面摆画布上有、本地没有一样的；和本地像素一样的只摆本地那一张，标「画布有」。
   共用的东西（读写流水线.json、顶栏、步骤条、这一场要哪些图、哪张图确认过）在 流水线.js。
   ============================================================ */
'use strict';
/* 这张图有没有提示词挂着：看 资产/参考素材映射.json（AI 写提示词时登记的） */
async function usedByPrompts(file) {
  try {
    if (!(await hasFile(F.name, ['资产', '参考素材映射.json']))) return [];
    const j = await readJson(at([F.name, '资产', '参考素材映射.json']));
    return Object.entries(j.prompts || {}).filter(([, v]) => (v && v.references || []).some(r => r && cleanFile(r.path) === file)).map(([k]) => k);
  } catch (e) { return []; }
}
/* 删一张图。两种删法：只是不引用（图还在原处，以后点那一块的「＋ 新增」能再挂回来）；图不要了（移进这个项目的 历史记录，全片各处都不再引用它；
   想重出：那一格的字还在，点「批字」→「照这个出图」；想要回来就点那一块的「＋ 新增」，在最下面「删掉的」里放回来） */
async function removeAsset(s, it, stay) {   // stay：在一样东西自己的那一页上删的，删完那一页自己换到别处，这里不重画。回 'unref'、'del'，没删回 false
  const file = it.at, isRow = !!KIND[it.类别], e = isRow ? entryOf(it.类别, it.名称) : null, k = kindOf(it.类别), frame = it.类别 === '关键帧';
  const field = isRow || frame ? '' : it.类别 === '人物图' || it.类别 === '道具图' ? it.类别 : '场景图';   // 不是表里一行的：这一场哪一格记着它
  const canUnref = it.own && (frame || (isRow ? !!e && e.资产.includes(file) : s[field].includes(file)));
  const used = await usedByPrompts(file), mineImg = !isRow && segImg(s, file) && !F.doc.场景图.includes(file);   // mineImg：这一段文件夹里的图，只这一场用
  const r = await dialog(close => dlgShell('删掉这张图 · ' + it.名称 + (it.sub ? ' · ' + it.sub : ''), file,
    [h('p', { class: 'fn-note' }, mineImg ? '图不要了：移进这个项目的「历史记录」（照原来的文件夹放），这一场不再用它。' : '图不要了：移进这个项目的「历史记录」，全片各处都不再引用它。想重出一张：它的字还在，删完点那一格的「批字」→「照这个出图」；后悔了，点「＋ 新增' + k + '」，在最下面放回来。'),
      canUnref ? h('p', { class: 'fn-note' }, isRow ? '只是不引用：图还留在原处，「' + it.名称 + '」不再挂它（各场都不挂）。以后点「＋ 新增' + k + '」能再挂回来。' : mineImg ? '只是这一场不用：图还留在 资产 / ' + segName(s.段) + ' 里，以后点「＋ 新增' + k + '」能再挑回来。' : '只是这一场不用：图还留在原处，全片还引用着，只是这一场不挂它。') : null,
      used.length ? h('p', { class: 'fn-note warn' }, '有提示词挂着这张图：' + used.join('、') + '。移走以后，那边要重新挂图。') : null],
    [h('button', { class: 'btn ghost', 'data-focus': '', onclick: () => close(null) }, '取消'),
      canUnref ? h('button', { class: 'btn', onclick: () => close('unref') }, isRow ? '只是不引用' : '只是这一场不用') : null,
      h('button', { class: 'btn zhu', onclick: () => close('del') }, '图不要了')]));
  if (!r) return false;
  if (r === 'unref') {
    if (isRow) { e.资产 = e.资产.filter(f => f !== file); e.不用 = [...new Set([...(Array.isArray(e.不用) ? e.不用 : []), file])]; }   // 记下「不用」：AI 清单里再列着它，也不替你对回去
    else if (frame) dropFrame(s, file);   // 名字带首帧的：记进这一场的「关键帧不用」，不再自己冒出来
    else s[field] = s[field].filter(f => f !== file);
    touch(); if (!stay) paint();
    return r;
  }
  const parts = file.split('/'), dir = parts.slice(0, -1), name = parts[parts.length - 1], dot = name.lastIndexOf('.'), stem = dot > 0 ? name.slice(0, dot) : name, stamp = stampNow();
  const dest = [F.name, '历史记录', ...dir, stem + '__' + stamp + (dot > 0 ? name.slice(dot) : '')];
  try { await FS.move(at([F.name, ...parts]), at(dest)); }
  catch (err) { toast('没移走：' + err.message, 'err'); return false; }
  // 看大图时写的批注、批注截图跟着一起收走：不然重出的同名图一打开就带着旧批注
  try { if (await hasFile(F.name, [...dir, stem + '_批注.md'])) await FS.move(at([F.name, ...dir, stem + '_批注.md']), at([F.name, '历史记录', ...dir, stem + '_批注__' + stamp + '.md'])); } catch (err) { /* 挪不动就留着 */ }
  try { if (await FS.isDir(at([F.name, ...dir, stem + SHOTS_TAIL]))) await FS.move(at([F.name, ...dir, stem + SHOTS_TAIL]), at([F.name, '历史记录', ...dir, stem + SHOTS_TAIL + '__' + stamp])); } catch (err) { /* 挪不动就留着 */ }
  for (const K of LISTS) for (const x of F.doc[K.key]) x.资产 = x.资产.filter(f => f !== file);
  F.doc.场景图 = F.doc.场景图.filter(f => f !== file);
  for (const x of F.doc.场) for (const f2 of ['场景图', '人物图', '道具图', '关键帧', '关键帧不用']) x[f2] = arrOf(x[f2]).filter(f => f !== file);
  delete F.doc.可用[file];   // 图不在了，它的「可用」也不留：重出的那一张要重新确认
  touch();
  await flush();
  window.UI.dropThumbs();   // 重出的图会回到同一个名字：做好的缩小图不能再用
  try { F.pool = await loadPool(F.name); } catch (err) { /* 下回再读 */ }
  await loadSides();
  if (stay) return r;
  rerender();
  toast('移进历史记录了：' + dest.slice(1).join(' / '));
  return r;
}
/* ---------- 用已有的图：项目 资产/全局资产 里的图点一张，这一场就用上它；删掉的（在历史记录里）点一下放回来 ---------- */
/* 这一张图该挂到哪一行：从哪一格点开的就是那一行；不然看哪一行已经引用它，再不然照图名里的叫法找（老名字「项目_类别_叫法_资产」也认） */
function rowFor(x, cell) {
  const K = LISTS.find(k => k.cats(x.类别));
  if (!K) return null;
  return (cell && cell.类别 === K.key ? entryOf(K.key, cell.名称) : null) || F.doc[K.key].find(r => r.资产.includes(x.文件)) || F.doc[K.key].find(r => r.名 === tokenOf(x) || r.名 === x.名称) || null;
}
/* 这一段文件夹里的一张图，这一场当 k 用：只这一场用，不挂表里哪一行（原来当别的用的，挪过来） */
function useSeg(s, k, x) {
  const was = segKind(s, x.文件);
  putSeg(s, k, x.文件); orderCast(s); touch();
  return '「' + x.名称 + '」这一场当' + k + '用上了' + (was && was !== k ? '（原来当' + was + '）' : '') + '，只这一场用';
}
/* 这一场用上一张已有的图：人物、道具的图挂到 rowFor 找到的那一行（找不到就照叫法加一行），这一场选上；场景图加进全片和这一场 */
function useImage(s, x, cell) {
  const file = x.文件;
  if (isSceneImg(x)) {
    if (!F.doc.场景图.includes(file)) F.doc.场景图.push(file);
    if (!s.场景图.includes(file)) s.场景图.push(file);
    orderCast(s); touch();
    return '场景图「' + x.名称 + '」这一场用上了';
  }
  const K = LISTS.find(k => k.cats(x.类别));
  let e = rowFor(x, cell);
  const fresh = !e;
  if (fresh) { e = { 名: tokenOf(x), 描写: '', 资产: [] }; F.doc[K.key].push(e); }
  if (!e.资产.includes(file)) {
    if (!K.multi && e.资产.length) e.不用 = [...new Set([...(Array.isArray(e.不用) ? e.不用 : []), ...e.资产])];   // 人物换图：换下来的那张记进「不用」，AI 清单里列着它也不再替你挂回去
    e.资产 = K.multi ? [...e.资产, file] : [file];
  }
  if (Array.isArray(e.不用)) { e.不用 = e.不用.filter(f => f !== file); if (!e.不用.length) delete e.不用; }
  if (e.不用时) { delete e.不用时[file]; if (!Object.keys(e.不用时).length) delete e.不用时; }
  if (!s[K.key].includes(e.名)) s[K.key].push(e.名);
  orderCast(s); touch();
  return K.key + '「' + e.名 + '」' + (fresh ? '加进了' + K.key + '表，' : '') + '挂上了这张图，这一场也选上了';
}
/* 删掉的图：历史记录/资产/全局资产/类别/原名__时间.后缀（「图不要了」移过去的） */
async function loadDeleted() {
  const ls = lister(F.name), out = [];
  for (const c of (await ls('历史记录/资产/全局资产')).filter(e => e.kind === 'directory').map(e => e.name))
    for (const e of (await ls('历史记录/资产/全局资产/' + c)).filter(x => x.kind === 'file' && IMG_RE.test(x.name))) {
      const m = /^(.+)__(\d{8})-(\d{6})(\.[^.]+)$/.exec(e.name);
      if (m) out.push({ 类别: c, 名称: m[1], 文件: '历史记录/资产/全局资产/' + c + '/' + e.name, 原处: '资产/全局资产/' + c + '/' + m[1] + m[4], 序: m[2] + m[3], 戳: m[2] + '-' + m[3], 时: m[2].slice(4, 6) + '-' + m[2].slice(6) + ' ' + m[3].slice(0, 2) + ':' + m[3].slice(2, 4) });
    }
  return out.sort((a, b) => b.序.localeCompare(a.序)).slice(0, 80);
}
/* ---------- 新增素材：人物、场景、道具三块各一个「＋ 新增」（k），上面一条的「用已有的图」三样都摆（k 空着）。
   人物、道具：表里有、这一场还没选的，点名字选上；表里没有的「＋ 新加一个」。
   全片的图（资产/全局资产）：点一张这一场就用上，人物、道具的图挂到表里那一行（照图名里的叫法找，表里没有就加一行），场景图也进全片的引用。
   这一段的图（资产/第N段 和下一层文件夹）：只给这一场用，不挂表里哪一行；三样都摆的时候，点了先问当人物、场景还是道具（11-13 他要「挑图时选类别」）。
   删掉的图（历史记录里）在最下面，点一下放回原处再用上 ---------- */
const guessKind = x => FRAME_RE.test((x.组 || '') + x.名称) ? '关键帧' : /空镜|场景|底图/.test((x.组 || '') + x.名称) ? '场景' : '';
const SEG_KINDS = [...KINDS, '关键帧'];   // 这一段的图能当的：人物、场景、道具、关键帧
async function addDlg(s, k, cell) {   // cell：从「还没有图」「图不在了」那一格点开的：挑的全片的图挂到那一行
  closePop(); hideHov();
  let deleted = [], mine = [];
  try { F.pool = await loadPool(F.name); } catch (e) { /* 读不出来就用手里的 */ }   // 页面开着的时候放进来的图（自己拷的、Codex 出的）也要列出来
  try { deleted = await loadDeleted(); } catch (e) { deleted = []; }
  try { mine = await loadSegPool(F.name, s.段); } catch (e) { mine = []; }
  const row = cell && KIND[cell.类别] ? cell : null;   // 给表里哪一行挑图
  cvLoad();   // 即梦画布上的图：不等它，读好了摆在最下面
  await dialog(close => {
    const box = h('div', { class: 'fl-apick' }), jump = h('div', { class: 'fl-jump' });
    const here = x => isSceneImg(x) ? s.场景图.includes(x.文件) : LISTS.some(K => K.cats(x.类别) && s[K.key].some(n => { const e = entryOf(K.key, n); return !!e && e.资产.includes(x.文件); }));
    const owner = x => { if (isSceneImg(x)) return ''; for (const K of LISTS) { const e = F.doc[K.key].find(r => r.资产.includes(x.文件)); if (e) return e.名 + ' 的图'; } return '还没人用'; };
    const segNote = x => { const u = segKind(s, x.文件); return !u ? '' : !k || u === k ? '这一场当' + u + '用着' : '这一场当' + u + '用着，点了改当' + k; };
    const pickSeg = async x => {
      const u = segKind(s, x.文件), g = u || guessKind(x);
      const to = k || await choiceDlg({ title: '「' + x.名称 + '」这一场当什么用？', body: '这一段文件夹里的图，只给这一场用，不挂到表里哪一行。' + (u ? '现在当' + u + '用着。' : ''),
        buttons: [{ label: '取消', value: null, cls: 'ghost' }, ...SEG_KINDS.map(c => ({ label: '当' + c, value: c, cls: kindCls(c), focus: c === g }))] });
      if (!to) return;
      if (u === to) { toast('这一场已经当' + to + '用着了。不用了点那一格右上角的 ×'); return; }
      toast(useSeg(s, to, x)); paintBox(); repaint();
    };
    const pick = async x => {
      if (x.类别 === '这一段') return pickSeg(x);
      const K = LISTS.find(c => c.cats(x.类别)), r = isSceneImg(x) ? null : rowFor(x, row);
      if (isSceneImg(x) ? s.场景图.includes(x.文件) : r && r.资产.includes(x.文件) && s[K.key].includes(r.名)) { toast('这一场已经在用它了。不用了点那一格右上角的 ×'); return; }
      if (r && !K.multi && r.资产.length && !r.资产.includes(x.文件) && !(await confirmDlg({ title: '「' + r.名 + '」换成这张图？', body: '现在挂的是 ' + baseOf(r.资产[0]) + '，换成 ' + x.名称 + '。原来那张还留在项目里，随时能换回去。', ok: '换成这一张' }))) return;
      toast(useImage(s, x, row)); paintBox(); repaint();
    };
    const back = async x => {   // 放回原处（批注、批注截图一起），再照点图那样挂上：人物原来有图的，先问换不换
      try { await FS.move(at([F.name, ...x.文件.split('/')]), at([F.name, ...x.原处.split('/')])); }
      catch (e) { toast('没放回来：' + e.message + '（原处要是已经有一张同名的图，先处理那一张）', 'err'); return; }
      const dir = x.原处.split('/').slice(0, -1), stem = stemOf(x.原处.split('/').pop()), old = ['历史记录', ...dir];
      try { const n = stem + '_批注__' + x.戳 + '.md'; if (await hasFile(F.name, [...old, n]) && !(await hasFile(F.name, [...dir, stem + '_批注.md']))) await FS.move(at([F.name, ...old, n]), at([F.name, ...dir, stem + '_批注.md'])); } catch (e) { /* 挪不动就留在历史记录里 */ }
      try { const n = stem + SHOTS_TAIL + '__' + x.戳; if (await FS.isDir(at([F.name, ...old, n])) && !(await FS.isDir(at([F.name, ...dir, stem + SHOTS_TAIL])))) await FS.move(at([F.name, ...old, n]), at([F.name, ...dir, stem + SHOTS_TAIL])); } catch (e) { /* 同上 */ }
      window.UI.dropThumbs();
      try { F.pool = await loadPool(F.name); } catch (e) { /* 下回再读 */ }
      await loadSides();
      deleted = deleted.filter(d => d !== x);
      paintBox(); repaint();
      toast('放回来了：' + x.原处);
      const it = F.pool.find(p => p.文件 === x.原处);
      if (it) await pick(it);
    };
    const fromPc = async () => {   // 电脑别处的图：找到、起好名字，复制进项目（电脑找图.js），再照点图那样用上
      hideHov();
      const r = await pcFind({ s, k, row });
      if (!r) return;
      window.UI.dropThumbs();
      try { F.pool = await loadPool(F.name); } catch (e) { /* 下回再读 */ }
      try { mine = await loadSegPool(F.name, s.段); } catch (e) { /* 同上 */ }
      await loadSides();
      toast('复制进来了：' + r.file.replace(/\//g, ' / '));
      const x = r.seg ? mine.find(m => m.文件 === r.file) : F.pool.find(p => p.文件 === r.file);
      if (x && r.seg) toast(useSeg(s, r.kind, x));
      if (x && !r.seg && !here(x)) await pick(x);
      else { if (x && !r.seg) toast('「' + x.名称 + '」这一场本来就挂着这张图，补上了'); paintBox(); repaint(); }   // 「图不在了」那一格照原名复制回来的
    };
    const paintBox = () => {   // 三样都摆：人物、场景、道具（全片的）、这一段的、删掉的；一样：表里的、全片的、这一段的、删掉的。顶上一排点了跳到那一块
      const out = [], marks = {}, lab = (c, text) => h('div', { class: 'pick-lab ' + kindCls(c) }, text);

      k === '道具' && s.道具.length ? h('button', { class: 'btn sm ghost', type: 'button', title: '一个道具几种样子（比如面车白天、夜里），一种一张图：写个名字和要求，AI 先写字', onclick: () => addLookDlg(s) }, '加一种样子') : null,
      h('button', { class: 'btn sm ' + kindCls(k), type: 'button', title: SEC_ADD[k], onclick: () => addDlg(s, k) }, icon('plus'), '新增' + k)),
    mine.length ? h('div', { class: 'wf-grid' }, k === '人物' ? withVoices(s, mine) : mine.map(it => chipEl(s, it))) : h('p', { class: 'fn-note as-sec-e' }, SEC_EMPTY[k]));
});
/* 人物那一块：人物表里的每个人，最后一张图后面跟一格音色（试听、挑一段、不用，音色绑定.js，11-15） */
const withVoices = (s, mine) => mine.flatMap((it, i) => { const n = it.名称, el = chipEl(s, it); return entryOf('人物', n) && !mine.slice(i + 1).some(x => x.名称 === n) ? [el, VoiceBind.chip(n, paint)] : [el]; });
const DETAIL = adMode();   // 网址带 a=…：这一页是一样东西自己的那一页（资产详情.js，11-14）
const paint = () => { if ((DETAIL ? adRepaint : repaint)() === false) rerender(); };
function render() {
  const s = sceneNow(), seg = s.段;
  const lk = assetState(s);
  if (lk.st === 'lock') return assetLock(s, lk);
  setTimeout(repaint, 0);   // 架子先摆上，里面的东西接着填
  pickFromHash(s);
  return [h('div', { class: 'as-head', id: 'as-bar' }), h('div', { id: 'as-more' }), h('div', { class: 'as-secs', id: 'as-grid' }), h('div', { class: 'wf-fab', id: 'as-fab' })];
}

/* 从一样东西的那一页点「回资产页挑一张」回来：网址带 #pick=类别/名称，给那一格打开挑图 */
function pickFromHash(s) {
  let v = '';
  try { v = decodeURIComponent(location.hash.slice(1)); } catch (e) { return; }
  const m = /^pick=([^/]+)\/(.+)$/.exec(v);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  setTimeout(() => { const it = assetsOf(s).list.find(x => x.类别 === m[1] && x.名称 === m[2]); if (it) addDlg(s, kindOf(it.类别), it); }, 60);
}

start({ name: '资产', scene: true, render: DETAIL ? adRender : render, repaint: DETAIL ? adRepaint : repaint,
  ...(DETAIL ? { sub: true, step: adFrom(), wide: true, leave: adLeave } : {}),
  jobDone(ended) {   // 只用文字写的场景，图出好了：这一场改用这张图（全片设定里那一句还在）
    for (const j of ended) {
      if (j.事 !== '出图' || j.状态 !== '做完' || j.类别 !== '场景' || !j.文件名) continue;
      const s = F.doc.场.find(x => x.段 === j.段), t = s && uniq(s.场景文字).find(x => sceneStem(x) === j.文件名), file = '资产/全局资产/场景/' + j.文件名 + '.png';
      if (t && F.pool.some(p => p.文件 === file)) { useSceneImg(s, t, file); toast('「' + j.文件名 + '」的图出好了，第' + s.段 + '场改用这张图'); }
    }
    paint();
  } });
</script>
</body>
</html>
