<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线 · 资产</title>
<link rel="stylesheet" href="../公用/样式.css">
<link rel="stylesheet" href="流水线.css">
<style>
/* 资产页（11-16 改版，照 资产页改版_设计稿.html）：顶上一条钉住（走到哪了、要按的、四个页签），下面一次只摆一样；
   人物、场景、道具一样一张大图卡，关键帧一镜一张小卡（三格：开头、中间、结尾），挑图在右边一栏（挑图栏.js）。只这一页用，样式就放在这里 */
.as-head { position: sticky; top: 117px; z-index: 18; margin: -8px -14px 16px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); background: var(--paper); }
.as-head.stuck { box-shadow: 0 12px 18px -16px rgba(40, 28, 16, .4); }
.as-h1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.as-h1 .sp, .as-tabs .sp { flex: 1; }
.as-h1 .btn.ghost { color: var(--ink-3); }
.as-h1 .btn.ghost:hover { color: var(--ink); }
.as-tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 4px; margin-top: 4px; }
.as-tabs .pz-tab.on { border-bottom-color: var(--k); color: var(--k); }
.as-tabs .fl-link { align-self: center; padding-bottom: 4px; }
.as-hint { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-3); }
/* 大图卡 */
.ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
.ac { position: relative; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-top: 3px solid var(--k); border-radius: 10px; background: var(--sheet); transition: border-color .15s, box-shadow .15s; }
.ac[role=button] { cursor: pointer; }
.ac[role=button]:hover { box-shadow: 0 8px 18px -12px rgba(40, 28, 16, .4); }
.ac.bad { box-shadow: 0 0 0 2px var(--zhu-line); }
.ac.flash { animation: asFlash 1.6s ease; }
.ac-pic { aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; border-radius: 7px 7px 0 0; background: var(--paper-2); font: 13.5px var(--kai); color: var(--ink-4); }
.ac-pic img { display: block; width: 100%; height: 100%; object-fit: contain; }
.ac-pic.none { background: repeating-linear-gradient(135deg, var(--paper) 0 8px, var(--paper-2) 8px 16px); }
.ac-bd { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 7px 10px 9px; }
.ac-nm { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-weight: 600; font-size: 14px; }
.ac-nm > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac-nm small { flex: none; font-weight: normal; font-size: 12px; color: var(--ink-3); }
.ac-swap { display: none; margin-left: auto; flex: none; padding: 0; border: 0; background: none; font: 12px var(--sans); color: var(--dai); text-decoration: underline dotted; cursor: pointer; }
.ac:hover .ac-swap, .ac:focus-within .ac-swap { display: inline; }
.ac-st { font-size: 12px; line-height: 1.55; color: var(--ink-3); }
.ac-st.ok { color: var(--dai); }
.ac-st.todo { color: var(--zhu); }
.ac-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ac-acts:empty { display: none; }
.ac-acts .fl-asset-ok { margin-left: 0; }
.ac > .fl-asset-x { top: 6px; right: 6px; }
.ac:hover > .fl-asset-x, .ac:focus-within > .fl-asset-x { display: grid; }
.ac.sug { border-style: dashed; border-top-style: dashed; background: transparent; }
.ac.sug .ac-st { color: var(--dai); }
.ac.plus { min-height: 150px; display: grid; place-items: center; padding: 12px; border: 1px dashed var(--line-2); background: transparent; font-size: 13.5px; color: var(--ink-3); text-align: center; cursor: pointer; }
.ac.plus small { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-4); }
.ac.plus:hover { border-color: var(--k); color: var(--k); }
/* 关键帧：顶上「还没绑」一排，下面一镜一张小卡 */
.kb-tray { margin: 0 0 14px; padding: 10px 12px; border: 1px dashed #c9b48e; border-radius: 10px; background: #fffaf0; }
.kb-tray.done { padding: 7px 12px; border-color: var(--line-2); background: transparent; }
.kb-tray.over { border-style: solid; border-color: var(--zhu); background: var(--zhu-soft); }
.kb-tray-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; }
.kb-tray-h b { color: var(--zhu); }
.kb-tray-h .sp { flex: 1; }
.kb-loose { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.kb-tile { width: 156px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); font-size: 12px; cursor: grab; }
.kb-tile.sel { outline: 2.5px solid var(--zhu); outline-offset: 1px; }
.kb-im { aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; background: var(--paper-2); font: 12px var(--kai); color: var(--ink-4); }
.kb-im img { display: block; width: 100%; height: 100%; object-fit: cover; }
.kb-tile .kb-nm { padding: 4px 7px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.kb-tile small { display: block; padding: 0 7px; font-size: 11.5px; color: var(--dai); }
.kb-tile .kb-acts { padding: 5px 6px 7px; }
.kb-acts { display: flex; flex-wrap: wrap; gap: 4px; }
.kb-acts .fl-asset-ok { margin-left: 0; padding: 1px 8px; font-size: 11.5px; }
.kb-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.kb-shot { min-width: 0; padding: 7px 8px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.kb-shot.chg { box-shadow: inset 3px 0 0 var(--zhu); }
.kb-sh { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.kb-sh b { flex: none; font: 600 13.5px var(--serif); color: var(--k); }
.kb-sh > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.kb-sh .fl-asset-ok { padding: 0 8px; font-size: 11.5px; }
.kb-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; }
.kb-slot { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; border: 1px dashed var(--line-2); border-radius: 6px; background: var(--paper); font: 11.5px var(--kai); color: var(--ink-4); cursor: pointer; }
.kb-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kb-slot.has { border-style: solid; border-color: var(--k-line); cursor: grab; }
.kb-slot:hover { border-color: var(--k); }
.kb-k { position: absolute; left: 0; bottom: 0; z-index: 1; padding: 0 5px; border-top-right-radius: 5px; background: rgba(42, 38, 34, .55); font: 10.5px/1.6 var(--sans); color: #fff; }
.kb-more { position: absolute; right: 3px; top: 3px; z-index: 1; padding: 0 5px; border-radius: 7px; background: var(--dai); font: 10.5px/1.6 var(--sans); color: #fff; }
.kb-ok { position: absolute; left: 3px; top: 3px; z-index: 1; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: var(--dai); color: #fff; }
.kb-ok .ic { width: 10px; height: 10px; stroke-width: 2.4; }
.kb-gone { font: 11px var(--kai); color: var(--zhu); }
.kb-picking .kb-slot:not(.has), .kb-dragging .kb-slot:not(.has) { border-color: var(--zhu-line); background: var(--zhu-soft); color: var(--zhu); }
.kb-picking .kb-slot.has { cursor: copy; }
.kb-slot.over { border: 2px solid var(--zhu); }
.fl-pop:has(.kb-menu) { width: 420px; }
.kb-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 4px; overflow: auto; }
.kb-mi { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; }
.kb-mi.cur { border-color: var(--k-line); background: var(--k-soft); }
.kb-mi-im { aspect-ratio: 16 / 9; overflow: hidden; padding: 0; border: 0; border-radius: 5px; background: var(--paper-2); cursor: zoom-in; }
.kb-mi-im img { display: block; width: 100%; height: 100%; object-fit: cover; }
.kb-mi-b { min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.kb-mi-b b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-mi-b small { color: var(--ink-3); }
.kb-mi-n { margin: 6px 12px 4px; }
/* 挑图栏（挑图栏.js）：右边滑出一栏，不盖左边 */
.pb { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(620px, 64vw); display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 12px; border-left: 1px solid var(--line); background: var(--sheet); box-shadow: -18px 0 40px -24px rgba(40, 28, 16, .45); animation: pbIn .18s ease both; }
@keyframes pbIn { from { transform: translateX(24px); opacity: 0; } }
.pb-h { display: flex; align-items: flex-start; gap: 10px; }
.pb-t { flex: 1; min-width: 0; }
.pb-t b { display: block; font: 600 16.5px var(--serif); letter-spacing: .06em; }
.pb-t small { display: block; font-size: 12.5px; line-height: 1.6; color: var(--ink-3); }
.pb-x { flex: none; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line-2); border-radius: 50%; background: var(--sheet); color: var(--ink-3); cursor: pointer; }
.pb-x:hover { color: var(--zhu); border-color: var(--zhu-line); }
.pb-x .ic { width: 12px; height: 12px; }
.pb-tabs { display: flex; flex-wrap: wrap; gap: 2px 16px; border-bottom: 1px solid var(--line); }
.pb-tab { padding: 4px 0 7px; border: 0; border-bottom: 2px solid transparent; background: none; font: 13.5px var(--sans); color: var(--ink-3); cursor: pointer; }
.pb-tab:hover { color: var(--ink); }
.pb-tab.on { border-bottom-color: var(--ink); color: var(--ink); font-weight: 600; }
.pb-tab em { margin-left: 4px; font-style: normal; font-size: 11.5px; font-weight: normal; color: var(--ink-4); }
.pb-q { width: 100%; }
.pb-body { flex: 1; min-height: 0; overflow: auto; padding: 2px 2px 6px; }
.pb-body .pick-lab { margin: 12px 0 6px; font: 13.5px var(--kai); letter-spacing: .15em; color: var(--ink-2); }
.pb-body .pick-lab:first-child { margin-top: 2px; }
.pb .fl-ag { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
.pb .fl-at.sel { border-color: var(--zhu); box-shadow: 0 0 0 3px var(--zhu-soft); color: var(--ink); }
.pb .fl-at.on { opacity: .62; cursor: default; }
.pb .fl-at small { color: var(--ink-3); }
.pb-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.pb-f .sp { flex: 1; }
.pb-sel { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink-2); }
@media (max-width: 720px) { .pb { width: 100%; } }
</style>
</head>
<body class="wf">
<div id="wf"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="../公用/核心.js"></script>
<script src="../公用/底座.js"></script>
<script src="../公用/界面.js"></script>
<script src="../公用/音色.js"></script>
<script src="../公用/关键帧绑定.js"></script>
<script src="../公用/镜头作用.js"></script>
<script src="流水线.js"></script>
<script src="资产详情.js"></script>
<script src="电脑找图.js"></script>
<script src="音色绑定.js"></script>
<script src="挑图栏.js"></script>
<script>

/* ============================================================
   流水线 · 资产（一场的第三道工序）
   剧本定稿、提炼定了以后才开（11-16 起出场的是剧本定稿以后提炼的）：这一场出场的人物、道具、场景图各对着哪张图。
   11-16 改版（他看了 资产页改版_设计稿.html，四处都照推荐的定）：
     顶上一条钉住：走到哪了（确认了几张、缺图、字等你批……点了跳过去）、「让 AI 写字」、这一步要按的那一个，下面四个页签：人物、场景、道具、关键帧，一次看一样，回到上回看的那一页。
     人物、场景、道具：一样一张大图卡。图下名字、走到哪了、眼下该按的钮；点卡进它自己的那一页（资产详情.js）。人物的音色并在卡底下一行。
       没图的卡「挑现成的图」：右边滑出一栏（挑图栏.js），顶上写明给谁挑，挑中的就挂给它，不再照图名猜。剧本里提到、还没加上的，虚线卡排在后面；最后一张「＋ 加人物」。
     关键帧：一镜一张小卡，三格（开头、中间、结尾），一格几张的角上「+1」，点一格看这几张、换现用、确认、解绑。没绑的摆在顶上「还没绑」一排：
       拖到哪一格就绑上，或者点一下图再点格子；格子里的图拖到别的格子就改绑，拖回「还没绑」就解绑。空的格子点一下，从这一段文件夹里挑一张绑上。
   字先定，图后出（2026-11-14 他定的，流程图 文生资产_流程图.html；共用的做法在 流水线.js「文生资产」那一节）：
     「让 AI 写字」：AI 读定稿的剧本，给这一场还没有字的写字（出图提示词，场景先写 GEO 底稿），已经有的图核一遍撑不撑得住。
     每张卡上是眼下该做的：写字 → 批字（自己改，或写批注交给 AI 改；字定了点「照这个出图」）→ 图出好了点开看 → 确认可用。
     已经有图的再出，新图先当候选（「看新图」：旧图、新图并排，挑「用旧图」或「用新图」；没挑以前卡上不摆旧图的「可用」）。
     只用文字写的场景也能写字、出图：图出好了点「用上这张图」，这一场改用图。道具能「加一种样子」（一个状态一张图）。
   确认可用：一张图一张图确认（2026-11-12 他定的）。确认记在全片，确认过的图别的场不用再确认；这一场要的图都确认了，这一步自动过。图重出过、它的描写改过，那一张要再确认。
   关键帧绑到镜头表的「一镜一刻」上（2026-11-16 他定，流程图 关键帧绑定_流程图.html；算法在 公用/关键帧绑定.js）；同一镜同一刻几张，一张现用、别的备选；
     镜头表后来改了那一镜的字，那张卡左边一道红线，看过点「还对得上」。挂到哪条提示词，在提示词那一步定。
   共用的东西（读写流水线.json、顶栏、步骤条、这一场要哪些图、哪张图确认过）在 流水线.js。
   ============================================================ */
'use strict';
/* 这张图有没有提示词挂着：看 资产/参考素材映射.json（AI 写提示词时登记的） */
async function usedByPrompts(file) {
  try {
    if (!(await hasFile(F.name, ['资产', '参考素材映射.json']))) return [];
    const j = await readJson(at([F.name, '资产', '参考素材映射.json']));
    return Object.entries(j.prompts || {}).filter(([, v]) => (v && v.references || []).some(r => r && cleanFile(r.path) === file)).map(([k]) => k);
  } catch (e) { return []; }
}
/* 删一张图。几种删法：这一段不用它（人物、道具：这一段不出场，全片表里还在）；只是不引用（图还在原处，以后点「挑现成的图」能再挂回来）；
   图不要了（移进这个项目的 历史记录，全片各处都不再引用它；想重出：那一格的字还在，点「批字」→「照这个出图」；想要回来，挑图那一栏「删掉的」里放回来） */
async function removeAsset(s, it, stay) {   // stay：在一样东西自己的那一页上删的，删完那一页自己换到别处，这里不重画。回 'drop'、'unref'、'del'，没删回 false
  const file = it.at, isRow = !!KIND[it.类别], e = isRow ? entryOf(it.类别, it.名称) : null, k = kindOf(it.类别), frame = it.类别 === '关键帧';
  const field = isRow || frame ? '' : it.类别 === '人物图' || it.类别 === '道具图' ? it.类别 : '场景图';   // 不是表里一行的：这一场哪一格记着它
  const canUnref = it.own && (frame || (isRow ? !!e && e.资产.includes(file) : s[field].includes(file)));
  const canDrop = isRow && it.own && !stay && s[it.类别].includes(it.名称);
  const used = await usedByPrompts(file), mineImg = !isRow && segImg(s, file) && !F.doc.场景图.includes(file);   // mineImg：这一段文件夹里的图，只这一场用
  const r = await dialog(close => dlgShell('删掉这张图 · ' + it.名称 + (it.sub ? ' · ' + it.sub : ''), file,
    [canDrop ? h('p', { class: 'fn-note' }, '这一段不用「' + it.名称 + '」：这一段不出场，全片的' + k + '表里还在，图也还挂着。') : null,
      h('p', { class: 'fn-note' }, mineImg ? '图不要了：移进这个项目的「历史记录」（照原来的文件夹放），这一段不再用它。' : '图不要了：移进这个项目的「历史记录」，全片各处都不再引用它。想重出一张：它的字还在，删完点那一格的「批字」→「照这个出图」；后悔了，在挑图那一栏的「删掉的」里放回来。'),
      canUnref ? h('p', { class: 'fn-note' }, isRow ? '只是不引用：图还留在原处，「' + it.名称 + '」不再挂它（各段都不挂）。以后点「挑现成的图」能再挂回来。' : frame ? '只是这一段不当关键帧：图还留在 资产 / ' + segName(s.段) + ' 里。' : mineImg ? '只是这一段不用：图还留在 资产 / ' + segName(s.段) + ' 里，以后点「＋ 加' + k + '」能再挑回来。' : '只是这一段不用：图还留在原处，全片还引用着，只是这一段不挂它。') : null,
      used.length ? h('p', { class: 'fn-note warn' }, '有提示词挂着这张图：' + used.join('、') + '。移走以后，那边要重新挂图。') : null],
    [h('button', { class: 'btn ghost', 'data-focus': '', onclick: () => close(null) }, '取消'),
      canDrop ? h('button', { class: 'btn', onclick: () => close('drop') }, '这一段不用它') : null,
      canUnref ? h('button', { class: 'btn', onclick: () => close('unref') }, isRow ? '只是不引用' : frame ? '不当关键帧' : '只是这一段不用') : null,
      h('button', { class: 'btn zhu', onclick: () => close('del') }, '图不要了')]));
  if (!r) return false;
  if (r === 'drop') { s[it.类别] = s[it.类别].filter(n => n !== it.名称); touch(); paint(); return r; }
  if (r === 'unref') {
    if (isRow) { e.资产 = e.资产.filter(f => f !== file); e.不用 = [...new Set([...(Array.isArray(e.不用) ? e.不用 : []), file])]; }   // 记下「不用」：AI 清单里再列着它，也不替你对回去
    else if (frame) dropFrame(s, file);   // 名字带首帧的：记进这一场的「关键帧不用」，不再自己冒出来
    else s[field] = s[field].filter(f => f !== file);
    touch(); if (!stay) paint();
    return r;
  }
  const parts = file.split('/'), dir = parts.slice(0, -1), name = parts[parts.length - 1], dot = name.lastIndexOf('.'), stem = dot > 0 ? name.slice(0, dot) : name, stamp = stampNow();
  const dest = [F.name, '历史记录', ...dir, stem + '__' + stamp + (dot > 0 ? name.slice(dot) : '')];
  try { await FS.move(at([F.name, ...parts]), at(dest)); }
  catch (err) { toast('没移走：' + err.message, 'err'); return false; }
  // 看大图时写的批注、批注截图跟着一起收走：不然重出的同名图一打开就带着旧批注
  try { if (await hasFile(F.name, [...dir, stem + '_批注.md'])) await FS.move(at([F.name, ...dir, stem + '_批注.md']), at([F.name, '历史记录', ...dir, stem + '_批注__' + stamp + '.md'])); } catch (err) { /* 挪不动就留着 */ }
  try { if (await FS.isDir(at([F.name, ...dir, stem + SHOTS_TAIL]))) await FS.move(at([F.name, ...dir, stem + SHOTS_TAIL]), at([F.name, '历史记录', ...dir, stem + SHOTS_TAIL + '__' + stamp])); } catch (err) { /* 挪不动就留着 */ }

}

start({ name: '资产', scene: true, render: DETAIL ? adRender : render, repaint: DETAIL ? adRepaint : repaint,
  ...(DETAIL ? { sub: true, step: adFrom(), wide: true, leave: adLeave } : {}),
  jobDone(ended) {   // 只用文字写的场景，图出好了：这一场改用这张图（全片设定里那一句还在）
    for (const j of ended) {
      if (j.事 !== '出图' || j.状态 !== '做完' || j.类别 !== '场景' || !j.文件名) continue;
      const s = F.doc.场.find(x => x.段 === j.段), t = s && uniq(s.场景文字).find(x => sceneStem(x) === j.文件名), file = '资产/全局资产/场景/' + j.文件名 + '.png';
      if (t && F.pool.some(p => p.文件 === file)) { useSceneImg(s, t, file); toast('「' + j.文件名 + '」的图出好了，第' + s.段 + '段改用这张图'); }
    }
    paint();
  } });
</script>
</body>
