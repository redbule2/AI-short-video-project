<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能修改批注</title>
<!-- 技能文件的现状嵌在下面的 skill-data 块里；技能文件改过以后跑 node 通用工具/技能修改批注.js 重嵌。
     这页只收改动和批注（存在浏览器里），不动真文件。 -->
<style>
:root { --red:#fdecea; --redd:#f4b4ae; --green:#e3f6e8; --greend:#a6e3b8; --yel:#fff7d6; --yeld:#e6cb66; --grey:#f2f2ef; --line:#e3e3de; --ink:#222; --sub:#6b6b6b; --blue:#2563eb; --navy:#34407a; --hh:54px; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; font:16px/1.75 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; color:var(--ink); background:#f7f7f4; }
button { font:inherit; font-size:15px; padding:4px 13px; border:1px solid #c9c9c4; border-radius:6px; background:#fff; color:var(--ink); cursor:pointer; }
button:hover { filter:brightness(.96); }
button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
textarea { font:inherit; }

header { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line); padding:8px 20px; display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0 auto 0 0; white-space:nowrap; }
#sum { color:var(--sub); font-size:14px; white-space:nowrap; }
#sum b { color:#8a5a00; font-weight:600; }
.seg { display:inline-flex; border:1px solid #c9c9c4; border-radius:6px; overflow:hidden; }
.seg button { border:0; border-radius:0; font-size:14px; padding:4px 10px; border-left:1px solid #dcdcd7; }
.seg button:first-child { border-left:0; }
.seg button.on { background:var(--navy); color:#fff; }
#tocbtn { display:none; }

.wrap { display:flex; gap:18px; align-items:flex-start; max-width:1260px; margin:0 auto; padding:16px 20px 140px; }
aside { position:sticky; top:calc(var(--hh) + 14px); flex:0 0 214px; max-height:calc(100vh - var(--hh) - 30px); overflow:auto; font-size:14px; line-height:1.5; }
aside a { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:3px 8px; border-radius:5px; color:#333; text-decoration:none; }
aside a.l1 { font-weight:600; }
aside a.l3 { padding-left:22px; color:#666; font-size:13px; }
aside a:hover { background:#ecece7; }
aside a.cur { background:#e4e9f8; color:#1f3a8a; }
aside .n { flex:none; min-width:18px; text-align:center; font-size:12px; line-height:18px; border-radius:9px; background:#f1c453; color:#4a3500; padding:0 5px; }
aside .n:empty { display:none; }
main { flex:1 1 auto; min-width:0; max-width:1010px; }

.intro { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 18px; margin-bottom:14px; }
.intro p { margin:2px 0; }
.intro .sub { color:var(--sub); font-size:13.5px; margin-top:6px; }
.stale { background:#fff4d6; border:1px solid #e9c46a; border-radius:8px; padding:8px 14px; margin-bottom:12px; font-size:15px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.stale.bad { background:var(--red); border-color:var(--redd); }

/* 一行：记号｜文字｜按钮 */
.row { display:grid; grid-template-columns:34px minmax(0,1fr) 196px; align-items:start; border-radius:6px; padding:1px 4px 1px 0; }
.row:hover, .row:focus-within { background:#fff; box-shadow:0 0 0 1px var(--line); }
.mk { text-align:right; padding:3px 7px 0 0; color:#9a9a94; font-size:15px; user-select:none; white-space:nowrap; }
.main { min-width:0; }
.txt { padding:3px 8px; border-radius:5px; white-space:pre-wrap; overflow-wrap:anywhere; outline:none; min-height:calc(1.75em + 6px); cursor:text; }
.txt:focus { background:#fff; box-shadow:inset 0 0 0 2px #9db9f5; }
.txt:empty::before { content:attr(data-ph); color:#aaa; }
.old { margin:2px 0; padding:2px 8px; border-radius:5px; background:var(--red); color:#5b2a26; white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; }
.old::before { content:"原来"; margin-right:.8em; color:#a8635c; font-size:13px; }
.old .d { background:var(--redd); text-decoration:line-through; }
.row.changed .txt, .row.new .txt { background:var(--green); }
.row.changed .txt:focus, .row.new .txt:focus { background:#f3fbf5; }
.row.deleted .txt { background:var(--red); color:#8a4a44; text-decoration:line-through; cursor:default; }
.row.new .mk { color:#2a8a4a; font-weight:700; }
.txt::highlight(ins) { background-color:#a6e3b8; }

.ops { display:flex; gap:4px; padding:4px 0 0 8px; visibility:hidden; }
.row:hover .ops, .row:focus-within .ops { visibility:visible; }
.ops button { font-size:13px; line-height:1.5; padding:1px 8px; border-color:#d5d5d0; border-radius:5px; color:#444; white-space:nowrap; }
.ops button:hover { border-color:var(--blue); color:var(--blue); filter:none; }
.ops button[data-op=del]:hover { border-color:#d9534f; color:#d9534f; }
.ops .s { display:none; }

textarea.note { display:block; width:100%; margin:3px 0 5px; padding:5px 9px; font-size:15px; line-height:1.6; border:1px solid var(--yeld); border-radius:5px; background:var(--yel); resize:none; overflow:hidden; min-height:36px; outline:none; }
textarea.note:focus { box-shadow:0 0 0 2px #f1dc8c; }

.row.h { scroll-margin-top:calc(var(--hh) + 12px); }
.row.h .txt { font-weight:700; }
.row.h1 .txt { font-size:22px; }
.row.h2 { margin-top:26px; }
.row.h2 .txt { font-size:20px; }
.row.h2 .mk::after { content:""; display:inline-block; width:4px; height:22px; background:var(--navy); border-radius:2px; vertical-align:-5px; }
.row.h3 { margin-top:14px; }
.row.h3 .txt { font-size:17px; color:var(--navy); }
.row.h4 .txt { color:var(--navy); }
.row.p.label .txt { font-weight:600; }

.sp { height:8px; }
.codebox { margin:6px 0 8px 34px; padding:8px 0 8px 2px; background:#fff; border:1px solid var(--line); border-radius:8px; }
.codebox .row { grid-template-columns:0 minmax(0,1fr) 196px; }
.codebox .mk { visibility:hidden; padding:0; overflow:hidden; }
.codebox .txt { font-size:15px; line-height:1.7; }
.codebox .row:hover, .codebox .row:focus-within { background:#f6f8ff; }
.fmbox { margin:0 0 6px; padding:6px 0; border:1px dashed #c9c9c4; border-radius:8px; background:#fafaf7; scroll-margin-top:calc(var(--hh) + 12px); }
.fmbox .cap { font-size:13px; color:var(--sub); padding:0 12px 2px 42px; }
.row.fm .txt { font-size:15px; }
.row.fm .k { font-size:13px; color:var(--sub); padding:0 8px; }
.row.locked .txt { color:#888; cursor:default; }

.overall { margin-top:34px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 18px 16px; }
.overall h2 { font-size:17px; margin:0 0 6px; }
#overall { display:block; width:100%; min-height:90px; padding:8px 10px; border:1px solid #cfcfca; border-radius:6px; resize:vertical; }
.none-hint { display:none; color:var(--sub); padding:30px 0; text-align:center; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:8px 18px; border-radius:8px; display:none; z-index:30; max-width:90vw; }

/* 只看动过的 */
body.only .unit:not(.touched):not(.ctx), body.only .sp, body.only .codebox:not(.has), body.only .fmbox:not(.has) { display:none; }
body.only.none .none-hint { display:block; }
/* 改完的样子 */
body.clean .old, body.clean .row.deleted, body.clean textarea.note, body.clean .ops { display:none; }
body.clean .row.changed .txt, body.clean .row.new .txt { background:transparent; }
body.clean .txt::highlight(ins) { background-color:transparent; }
.mk .as { display:none; }
body.clean .row.new .mk { color:#9a9a94; font-weight:400; }
body.clean .mk .plus { display:none; }
body.clean .mk .as { display:inline; }
body.clean .row { grid-template-columns:34px minmax(0,1fr) 0; }
body.clean .codebox .row { grid-template-columns:0 minmax(0,1fr) 0; }

@media (max-width:900px) {
  #tocbtn { display:inline-block; }
  header { padding:6px 10px; gap:4px 8px; }
  header h1 { font-size:16px; }
  header button { padding:4px 9px; font-size:14px; }
  .seg button { padding:4px 8px; }
  #sum { order:9; flex-basis:100%; }   /* 窄的时候按钮排一行，改了几处另起一行 */
  .wrap { padding:12px 10px 140px; }
  aside { display:none; position:fixed; top:var(--hh); left:0; bottom:0; width:270px; max-height:none; padding:10px; background:#fff; border-right:1px solid var(--line); box-shadow:4px 0 18px rgba(0,0,0,.14); z-index:15; }
  body.toc-open aside { display:block; }
  .codebox { margin-left:10px; }
  .fmbox .cap { padding-left:36px; }
}
@media (max-width:760px) {
  .row { grid-template-columns:28px minmax(0,1fr) 108px; }
  .codebox .row { grid-template-columns:0 minmax(0,1fr) 108px; }
  .ops { gap:3px; padding-left:4px; }
  .ops button { padding:1px 6px; }
  .ops .l { display:none; }
  .ops .s { display:inline; }
}
</style></head>
<body>
<header id="hd">
  <button type="button" id="tocbtn">目录</button>
  <h1 id="title">技能修改批注</h1>
  <span id="sum"></span>
  <span class="seg" id="view"><button type="button" data-v="all" class="on">全部</button><button type="button" data-v="only">只看动过的</button><button type="button" data-v="clean">改完的样子</button></span>
  <button type="button" class="primary" id="copy">复制批注</button>
  <button type="button" id="down">存成文件</button>
  <button type="button" id="clear">清空</button>
</header>
<div class="wrap">
<aside id="toc"></aside>
<main>
  <div class="intro">
    <p><b>改</b>：点哪句改哪句。改过的变绿，原句红字留在上面。</p>
    <p><b>加、删、批注</b>：鼠标移到那一句，右边有按钮。写完一条按回车，接着写下一条。</p>
    <p><b>交给我</b>：自动保存。批完点「复制批注」贴进对话，或直接跟我说一声。</p>
    <p class="sub" id="src"></p>
  </div>
  <div id="stale"></div>
  <div id="doc"></div>
  <p class="none-hint">还没有动过的地方。</p>
  <section class="overall"><h2>整体意见</h2><textarea id="overall" placeholder="对整份技能的意见，或挂不到哪一句上的话，写这里"></textarea></section>
</main>
</div>

<script id="skill-data" type="application/json">{"name":"seedance-prompt-format","title":"提示词格式技能","short":"提示词格式","file":".agents/skills/seedance-prompt-format/SKILL.md","sha":"37c4980cb58a150522e3ddecc4c68703123d1b568c26eea7e07a0831f515b76d","mtime":"11-12 01:16","text":"---\nname: \"seedance-prompt-format\"\ndescription: \"写 Seedance 2.5 视频提示词时使用：剧情短片分段写成 txt。一套写法：本段事件、素材、基础设定、本段、分镜、保持一致。分镜先填分栏底稿，再逐镜转换成一段连贯正文；先过写戏规矩。延长和编辑照 sd25-pe 的模板。与 sd25-pe 冲突时以 sd25-pe 为准。\"\n---\n\n# Seedance 2.5 视频提示词 · 通用格式\n\n## 使用方式\n\n1. 先加载 sd25-pe，冲突时以它为准。\n2. 普通生成按「三」先填分镜底稿，核对后转成连续正文，〔 〕换成本片内容。\n3. 延长和编辑看「六」。\n4. 每段一个 txt，只放提示词正文。\n5. 文件名和存放照 AGENTS.md。\n6. 七分区旧稿不动；新写、重写的段用本骨架。\n7. 写完过一遍「七、自检」。\n\n---\n\n## 参考素材必须与审核页绑定\n\n- 写好视频提示词时，同时在本项目 `资产/参考素材映射.json` 登记该稿，键为项目内的提示词相对路径。每个编号写明 `ref`、`name`、`path`、`sha256`，路径从本项目的 `资产/` 开始，图片、视频、音频分别从 1 连续编号。只登记本稿采用的素材。\n- 登记 `prompt_sha256`，计算前仅去掉正文开头的 BOM，将 CRLF、CR 统一为 LF，再以 UTF-8 计算 SHA-256。素材 SHA-256 按源文件原始字节计算。\n- 先逐张查看选定图片，再写素材职责。审核页、任务书、实际上传顺序共同使用这份映射。改稿、换图、改名或增加声音后，重新核对并更新该稿登记，不凭文件名、镜号或上传完成顺序推测编号。\n- 交稿前运行 `python -X utf8 通用工具/核对参考素材.py --project \u003c项目绝对路径> --prompt \u003c项目内提示词相对路径>`，所有编号和文件校验通过后再交审核。工具文件位于工作区的 `通用工具` 下，命令从工作区根目录执行。\n- 审核页显示未绑定或校验失败时，先补正映射再交审核。原稿和映射的历史按 AGENTS.md 归档。\n\n---\n\n## 一、写戏规矩\n\n- 目标导向：要什么、怕什么？真人会怎么做？\n- 反应要由刚发生的事引起。\n- 听的人给一拍反应，不无故不动。\n- 反应写成看得见的动作。\n- 不过度演绎：被逼到了才爆发。\n- 最重的那句，写被什么点着。\n- 再写身体怎么使劲、话怎么往上冲。\n- 夸张放在事上，人按常理反应。\n- 禁止写一直不变的表情姿势。\n- 禁止堆表情小动作，挑最清楚的一两处。\n- 说话做事朝着对方，不无故冲镜头。\n- 人多只写主要人物，次要人物各忙各的。\n- 人少要写明具体人数。\n- 放手：表情、小动作的细节。\n- 不放手：人数、站位、道具。\n- 不放手：台词原文、镜头顺序。\n- 放手的底：一句台词配一个看得见的动作。\n\n---\n\n## 二、总规则\n\n1. 全片不变的放基础设定，各段照抄。\n2. 本段不变的放本段。\n3. 随剧情变的放分镜。\n4. 同一件事不无故写两处。\n5. 图内外观少复述，动作变化写清。\n6. 只带本段出现的人、分场景、道具。\n7. 同一人物、物件、分场景，各段照抄。\n8. 不写时间码、秒数、画幅、分辨率。\n9. 不提上一段、下一段，模型看不到。\n10. 每段不超过 30 秒，段数能少就少。\n11. 台词用 `{}`，音效用 `\u003c>`，称谓不加符号。\n12. 不用括号、引号；【】只给 `【未采用素材】`。\n13. 主体用称谓，关键状态可引图。\n14. 称谓定了不换，不用他、她。\n15. 页面选全能参考、16:9、720p。\n16. 页面上声音打开。\n17. 时长交稿时报出来。\n18. 人和机位有钟面报钟点，否则靠固定物说。\n19. 难出的镜头单独出一条，再剪。\n\n---\n\n## 三、先填底稿，再出正文\n\n### 第一步：填写分镜底稿\n\n先确定素材、基础设定和本段信息，再逐镜填写下面的栏目。底稿用于把内容想清楚、查漏和核对，默认不另存或交付；用户要看时再展示。最终 txt 只放下方正文骨架，不同时放两套分镜。已有稿按批注修改时，只对获准修改的镜头执行这两步，其余原文保持不动。\n\n按已有剧情填写，不为填满栏目新增动作、表情、台词或转场。没有的项目在底稿标明无；本段已统一说明且本镜没有变化的声音、站位，标明沿用本段。\n\n```text\n镜头 01｜〔标题〕\n机位/景别/角度：〔在哪个分场景、机位在哪朝哪拍、景别与角度〕。\n画面构图：〔开镜时谁在哪、朝哪；前后景关系与必要道具；引用图时说明对应哪个阶段〕。\n进入状态：〔开镜时人物正在做什么；已有剧情中是什么事引起当前反应〕。\n\n小节一\n动作/表情：〔谁做什么、对方如何反应；只挑一两处必要的表演，写清先后或同时〕。\n镜头：〔固定还是移动；跟着谁、何时起动、怎样移动、到哪里结束〕。\n台词：〔谁对谁、什么语气、画内或画外发声；台词原文用 {}；发生在上述哪个动作时〕。\n声音：〔本镜新增或变化的声源、远近、起止及与动作的关系；音效用 \u003c>〕。\n\n退出状态：〔结束时人物位置、朝向、动作和道具状态；只写衔接所需的〕。\n切点：〔哪个动作、台词或声音触发切换，怎样切；无特定要求不硬加〕。\n```\n\n确有多个连续节拍时，按先后续写小节二中的动作、镜头、台词、声音，不因分栏额外加戏。全段填完后，核对前后镜的状态衔接、空间、素材职责和动作因果；问题先在底稿解决。\n\n### 第二步：转换成连续正文\n\n- 每个镜号下只写一段，合并栏目名，按实际发生顺序组织句子。\n- 机位、构图、进入状态合成清楚的开镜描述；动作、运镜、台词和声音写在各自发生处，保留先后、同时与持续关系。\n- 只合并重复信息、调整语序和补必要连接词；不新增、删除或替换独立动作、人物反应、台词、声源、运镜、镜头或切点。\n- 主体身份与数量、机位朝向、构图和空间关系保持不变。\n- 台词原文、说话人、对象、语气和画内外位置保持不变；不把提高嗓门改成压低声音，不为行文顺畅改词。\n- 保留必要的起止状态、位移路径、道具归属和素材引用的阶段；不把开镜或结束时的状态写成全程要求。\n- 退出状态顺接动作结果，切点接在触发事件处；不能因为去掉栏目名就把信息一起删掉。\n- 同一信息在底稿多栏重复时，正文只表达一次；不同阶段再次发生的动作不当成重复删除。底稿中的无、沿用等占位说明不进入正文。\n- 转换后逐项对照底稿，确认只是换了表达形式，剧情、表演、声画关系和镜头设计没有变化。需要改内容时先回改底稿，再转换。\n\n### 最终正文骨架\n\n没有的行整行删掉。\n多张关键帧才写顺序行。\n\n```text\n以〔按剧情先后排列的关键帧@图片N〕作为关键帧。\n\n本段事件：〔谁要什么、情绪从哪来，所以发生了什么；结束时什么样〕。\n\n素材\n〔称谓〕对应@图片N，外貌、发型和服装以@图片N为准。\n〔道具〕对应@图片N，只采用〔结构、材质、颜色〕。\n@图片N是〔哪个分场景〕从〔哪〕往〔哪〕看的样子，只采用〔空间布局、陈设、材质、灯光〕。\n@图片N作为首帧。\n该首帧定义视频开始时的〔构图、主体位置、姿态、道具状态、场景、镜头方向〕。\n@图片N定义镜头〔编号〕在〔阶段〕的关键状态：〔该刻可见状态〕。\n@图片N作为尾帧。\n该尾帧定义视频结束时的〔构图、主体位置、姿态、道具状态、场景、镜头方向〕。\n【未采用素材】\n@图片N未参与本段，不用于人物、场景、道具、动作或镜头。\n\n基础设定\n影像风格：〔片种、质感〕。\n摄影：〔摄影机、胶片质感、景深，只写全片不变的〕。\n光色基调：〔时间和天光；主光从哪来；色调〕。\n\n本段\n核心氛围：〔时间和地点的一句画面〕。〔人物在做什么〕；整体〔什么感觉〕。\n分场景｜〔叫法〕：〔传了场景图的写参考@图片N〕。〔本段拍得到的地方：有什么、各在哪〕。〔项目 GEO 的场景段，照放〕。\n轴线：〔项目 GEO 的轴线行，照放〕。\n人物：〔本段几个人、各是谁〕。〔没有图的写长相、衣着〕。〔说话的人写声线：年龄、音色、腔调〕。\n站位：〔开场时谁在几点、坐还是站、朝着谁、隔多远；有首帧时仅开场站位照@图片N；必要的图外关系补写〕。\n物件：〔没有图的写结构、材质、颜色〕。\n道具：〔几个、开场什么样、什么时候出现、最后在哪〕。\n声音：〔配乐；不要就写无背景音乐〕。〔环境音、音效：点名的写声源、哪个近哪个远；交给模型的写只生成哪几类声音，根据画面内容适配相应的音效〕。〔有台词：口型同步，不说话的人闭口〕。〔旁白、字幕〕。\n\n分镜\n\n镜头 01｜〔标题〕\n〔在哪个分场景；只有一个不写〕。〔开镜时看见什么〕。〔景别、机位在几点朝几点拍、高低、固定还是移动〕。〔站位变了的，写谁在几点、朝着谁；机位偏离6点朝12点或过肩的，写谁在画面左右〕。〔谁要什么，所以做什么、接着做什么；有关键帧的，写清动作做到哪一步时对应图中画面；台词 {}、音效 \u003c> 写在发生处；听的人被哪句话引出什么反应〕。〔往哪移动、经过哪里、最后在哪；没有位移不写〕。〔必要的退出状态和切点，顺接对应事件；没有不写〕。音效：〔什么在响、怎么响、离机位远还是近；有明确触发时机的已写在发生处，本段的声音够用就整句不写〕。\n\n镜头 02｜〔标题〕\n〔……〕\n\n保持一致：〔最怕错的两三条〕。\n```\n\n---\n\n## 四、各处怎么写\n\n### 本段事件\n- 先写谁要什么，再写发生了什么。\n- 写清情绪从哪来。\n- 写到结束时的样子，不引台词。\n\n### 素材\n- 一张图一行，写只采用什么。\n- 首尾帧角色句各自独立一行。\n- 首尾帧定义紧接角色句。\n- 首帧只定义视频开始时的状态。\n- 尾帧只定义视频结束时的状态。\n- 中间关键帧按需选用。\n- 仅借外观的图不标作关键帧。\n- 用户已定引用与职责不擅改。\n- 多关键帧先列采用顺序。\n- 关键帧逐张写明镜号与阶段。\n- 每张关键帧只定义该刻状态。\n- 动作衔接写进对应分镜。\n- 图示状态须与对应动作相容。\n- 不默认要求关键状态停留。\n- 不承诺逐帧复刻。\n- 按结尾对齐需求选用尾帧。\n- 首尾帧画幅保持一致。\n- 室内场景给两个朝向的图。\n- 只上传本段用到的图。\n- 不用的图逐个列进 `【未采用素材】`。\n- 尾帧、白模、参考视频照 sd25-pe 写。\n- 多组东西同框齐动，挂白模视频。\n- 白模只放物件和运镜，不放人。\n- 挂白模的镜头，人数和站位交给关键帧。\n- 持续在动的火、烟不画进关键帧。\n\n### 基础设定\n- 影像风格、摄影按片子选。\n- 摄影只写全片不变的，景别运镜进分镜。\n\n### 本段\n- 核心氛围用画面写，不堆形容词。\n- 不写总场景，每段只管自己的场景。\n- 只写本段拍得到的地方。\n- 大环境也当一处分场景，拍到才写。\n- 分场景一处一行，各起叫法。\n- 同一处地方，叫法、方位、数量各段一样。\n- 没有场景图的分场景，用文字锁定。\n- 只用一次的分场景，写地点和固定物。\n- 分场景照放项目 GEO，不现写。\n- 场景段里的逐图句放进素材。\n- 传了场景图，在对应场景开头引用。\n- 照抄时@编号按本段的图改。\n- 没有 GEO，先用 scene-geo 做。\n- 人数和道具数量写明。\n- 人物只写看得见的长相、衣着。\n- 没有图的人，外形要一眼分得开。\n- 没要求不写普通话。\n- 后面才出现的，写明什么时候出现。\n- 站位只写开场那一刻。\n- 写谁在哪、朝谁、隔多远，靠固定物说。\n- 离开锚物的，写夹在哪两样之间。\n- 首帧站位仅用于开场。\n- 图外必需内容写明何时如何出现。\n- 必要空间关系仍须写清。\n- 后上场的人，到上场那镜再写。\n- 核心氛围只写在做什么，不写站位。\n- 点名的环境音在本段写全，镜头里有变化才写。\n- 安静的场面也写声源。\n- 不点名声音，就写只要哪几类、按画面配。\n- 心里话只做画外旁白。\n\n### 分镜\n- 先按「三」填分栏底稿、核对，再转换正文。\n\n一镜写什么：\n\n- 一镜按顺序写七样，没有的不写。\n- 一、机位在哪、朝哪拍、景别。\n- 二、画面里有谁。\n- 三、谁要什么。\n- 四、一个主要动作，开镜就做。\n- 五、一句台词，配一个语气词。\n- 六、听的人一拍反应。\n- 七、怎么切。\n- 一镜一段话，一件事写到底。\n- 背景只当气氛，至多一句。\n- 动作因果沿用剧情。\n- 后面才出现的，前面的镜头不提。\n- 禁止把结尾的状态写成全程的。\n\n机位和运镜：\n\n- 分场景不止一个，每镜开头写叫法。\n- 镜头里不重写分场景。\n- 机位写清在哪、朝哪拍。\n- 运镜与固定机位按剧情选。\n- 不以运镜代替主体动作。\n- 过肩镜头写明越过谁拍谁。\n- 要拍到反应，两人同框或切过去。\n- 首镜第一帧起就在动，写清可见动作。\n\n站位：\n\n- 站位变了才在镜头里写。\n- 关键帧位置仅限指定时刻。\n- 站位随动作更新。\n- 位移写清方向、路径与终点。\n- 没有图的镜头，用文字写清站位。\n- 位置靠固定物说，不只写画面左右。\n- 同一钟点的人和机位，用远近或地标分开。\n- 机位偏离6点朝12点或过肩，写画面左右。\n\n台词：\n\n- 台词写谁对谁说、什么语气。\n- 台词原文只在 `{}` 里出现一次。\n- 说话时手上的事不停。\n- 画外说话写明画外发声。\n- 禁止写“语速快”“停一拍”这类说法。\n- 读错的字换成同音常用字。\n- 屏幕文字留给后期贴。\n\n声音：\n\n- 音效写发声的物件，后跟 `\u003c>`。\n- 本段的声音不够这一镜用，才加一句音效。\n- 与动作或切点有明确时序关系的声音写在发生处，其余声场补充写在镜头最后，不另起一行。\n- 写什么在响、怎么响、远还是近。\n- 一镜只挑一两样，不堆。\n- 画面外的声音写明画外。\n- 同一声音效只标一次 `\u003c>`。\n\n### 保持一致\n- 只留最怕错的两三条。\n- 不加新信息。\n- 保持一致只列不变属性。\n\n---\n\n## 五、出了错再补\n\n哪一镜出错补哪一镜，整篇不换写法。补之前先查这一镜是否写多了。\n\n关键帧相关排查：\n\n- 开头停滞：检查起始动作。\n- 主体不动：检查全程位置约束。\n- 图外缺项：检查出现时机与遮挡。\n- 动作不接：检查关键状态可达性。\n- 图文冲突：先统一该刻状态。\n- 改图或改职责须遵从用户意图。\n- 对照测试每次只改一个变量。\n- 模式差异需多次对照验证。\n\n其他问题：\n\n- 进出画面、道具位置错：补开始和结束状态。\n- 认错人或道具：这一镜补称谓对应@图片N。\n- 朝向拍反：补机位在谁身后，不拍反打。\n- 站错位、换边：补钟点和画面左右。\n- 环境音断了：补这一镜的声源和远近。\n- 冒泡、回音、啸叫：删水、浪、回音类词。\n- 配乐删不掉：各种叫法都写上，首尾各写一遍。\n- 切点生硬：补跟着哪个动作切。\n- 拼版图读成两人：补画面只有一个〔称谓〕。\n- 还不行：拼版拆成脸和全身两张图。\n- 脸被镜头拉变形：补脸和手保持真实比例。\n\n---\n\n## 六、延长和编辑\n\n模板照 sd25-pe 的「视频编辑模板」「视频延长模板」。\n\n- 只坏开头：没人说话处裁开，后段向前延长。\n- 只坏结尾：坏掉之前裁开，前段向后延长。\n- 只改某样东西或某段声音：视频编辑。\n- 续接下一段：普通生成，上段尾帧当首帧。\n- 又改又延长：先编辑，再延长新片。\n\n---\n\n## 七、自检\n\n- [ ] 已逐镜填写分栏底稿，先解决内容与衔接问题，再转换正文。\n- [ ] 正文逐项对照底稿，未擅改动作、表演、台词、声画时序、素材职责和切点。\n- [ ] 重复信息只合并表达，不同阶段的动作与必要起止状态未误删。\n- [ ] 最终 txt 只有一套连续分镜正文，不含底稿栏目或占位说明。\n- [ ] 本段事件写了目标、情绪来由与结束状态。\n- [ ] 每张图写明采用范围。\n- [ ] 首尾帧角色句各自独立。\n- [ ] 首尾帧定义限定开始或结束时。\n- [ ] 多关键帧顺序声明放在首句。\n- [ ] 关键帧标明镜号、阶段与状态。\n- [ ] 关键帧之间写了动作衔接。\n- [ ] 图示状态与动作过程相容。\n- [ ] 未将外观参考误作关键状态。\n- [ ] 未把该刻站位写成整镜固定。\n- [ ] 未自动挂齐所有关键帧。\n- [ ] 用户已定引用与职责未擅改。\n- [ ] 图内外观未无故重复细描。\n- [ ] 必要空间关系未因有图省略。\n- [ ] 图外必需内容写明出现方式与时机。\n- [ ] 只带了本段出现的人、分场景、道具。\n- [ ] 同一件事没有无故写两处。\n- [ ] 随剧情变的没写进基础设定和本段。\n- [ ] 基础设定、人物、物件、分场景照抄了。\n- [ ] 分场景照放了项目 GEO。\n- [ ] 没写总场景；场景只写了本段拍得到的。\n- [ ] 同一处地方的叫法、方位、数量各段一样。\n- [ ] 场景图在对应场景开头引用了。\n- [ ] 写了几个人；道具写了数量和去向。\n- [ ] 写了开场站位，各镜跟它对得上。\n- [ ] 分场景不止一个的，每镜写了在哪个。\n- [ ] 每镜写了机位朝向；站位变了的写了站位。\n- [ ] 有钟面的，人和机位都报了钟点。\n- [ ] 本段声音不够用的镜头加了音效。\n- [ ] 声音行写明了要不要配乐、要哪几类声音。\n- [ ] 镜头动静符合剧情需求。\n- [ ] 首镜写明第一帧起的可见动作。\n- [ ] 动作因果与剧情一致。\n- [ ] 没有一直不变的表情姿势。\n- [ ] 每句台词写了谁对谁说、什么语气。\n- [ ] 有人听的台词，写了听的人的反应。\n- [ ] 没有超过两百字的镜头。\n- [ ] 没有时间码、秒数、画幅、括号、引号。\n- [ ] 保持一致不超过三条。\n- [ ] 未将变化中的状态要求恒定。\n\n---\n\n## 八、关键帧依据与冲突\n\n核验日期：2026-11-10。\n适用范围：全能参考中的图片职责。\n本节不进入视频提示词正文。\n\n证据与上级冲突见 [关键帧核验.md](关键帧核验.md)。\n"}</script>

if (!DATA.text) { doc.textContent = '这页还没嵌进技能文件。让 Claude 跑一下：node 通用工具/技能修改批注.js'; return; }
document.title = DATA.title + ' · 修改批注';
$('#title').textContent = document.title;
$('#src').textContent = '这页不动真文件，我照你的批注改。技能文件：' + DATA.file.replace(/\//g, '\\') + '，' + DATA.mtime + ' 的版本。';

/* ---------- 把技能文件拆成一行一行 ---------- */
function parse(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  let inCode = false, inFm = false;
  return lines.map((raw, k) => {
    const n = k + 1, r = { n, id: 'L' + n, raw, kind: 'p', prefix: '', body: raw };
    let m;
    if (n === 1 && raw.trim() === '---') { inFm = true; r.kind = 'skip'; }
    else if (inFm) {
      if (raw.trim() === '---') { inFm = false; r.kind = 'skip'; }
      else { r.kind = 'fm'; if ((m = raw.match(/^([A-Za-z_][\w-]*:\s*)(.*)$/))) { r.prefix = m[1]; r.body = m[2]; } }
    }
    else if (/^\s*(```|~~~)/.test(raw)) { inCode = !inCode; r.kind = inCode ? 'fence-open' : 'fence-close'; }
    else if (inCode) r.kind = raw.trim() ? 'code' : 'gap';
    else if (!raw.trim()) r.kind = 'blank';
    else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(raw)) r.kind = 'hr';
    else if ((m = raw.match(/^(#{1,6}\s+)(.*)$/))) { r.kind = 'h'; r.level = m[1].trim().length; r.prefix = m[1]; r.body = m[2]; }
    else if ((m = raw.match(/^(\s*[-*+]\s+\[[ xX]\]\s+)(.*)$/))) { r.kind = 'check'; r.prefix = m[1]; r.body = m[2]; }
    else if ((m = raw.match(/^(\s*[-*+]\s+)(.*)$/))) { r.kind = 'li'; r.prefix = m[1]; r.body = m[2]; }
    else if ((m = raw.match(/^(\s*\d+[.)]\s+)(.*)$/))) { r.kind = 'ol'; r.prefix = m[1]; r.body = m[2]; }
    return r;
  });
}
const rows = parse(DATA.text);
const byId = new Map();   // 'L12' → 那一行
const units = [];         // 有内容的行，按先后
const heads = [];         // 进目录的标题

/* ---------- 存在这页上的改动 ---------- */
const KEY_PREFIX = 'skilledit:' + DATA.name + ':';
const KEY = KEY_PREFIX + DATA.sha.slice(0, 8);   // 技能文件一变，钥匙跟着变，旧批注不会套到新行号上
const blank = () => ({ v: 1, seq: 0, edits: {}, dels: {}, notes: {}, adds: {}, overall: '' });
let state = blank(), canSave = true, timer = 0;
let openNote = null;   // 刚点开、还没写字的批注框
let holding = null;    // 正在点这一行的按钮：它空着也先别收走
let editing = null;    // 正在打字的那块
let counts = { e: 0, d: 0, a: 0, n: 0 };
const insMap = new Map();   // 改过的行：新加的字在哪几段
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1) state = Object.assign(blank(), s); } catch (e) { canSave = false; }

const isEmpty = () => !Object.keys(state.edits).length && !Object.keys(state.dels).length && !Object.keys(state.notes).length && !Object.keys(state.adds).length && !(state.overall || '').trim();
function flush() {
  clearTimeout(timer); timer = 0;
  try {
    if (isEmpty()) localStorage.removeItem(KEY);
    else localStorage.setItem(KEY, JSON.stringify(Object.assign({}, state, { t: Date.now(), file: DATA.file, sha: DATA.sha, sum: sumText(), text: asText() })));
  } catch (e) { if (canSave) { canSave = false; warnSave(); } }
}
const save = () => { clearTimeout(timer); timer = setTimeout(flush, 300); };
function warnSave() {
  const d = el('div', 'stale bad', '这页存不住批注（浏览器不让存）。改完请马上点「复制批注」或「存成文件」。');
  $('#stale').prepend(d);
}
function tidy() {   // 读回来的东西对不上现在的行，就丢掉
  for (const k of ['edits', 'dels']) for (const id in state[k]) if (!byId.has(id)) delete state[k][id];
  for (const id in state.edits) state.edits[id] = String(state.edits[id]).split('\n')[0];
  for (const aid in state.adds) {
    const list = Array.isArray(state.adds[aid]) ? state.adds[aid] : [];
    list.forEach(a => { if (a) a.body = String(a.body || '').split('\n')[0].trim(); });
    const keep = byId.has(aid) ? list.filter(a => a && a.id && (a.body || state.notes[a.id])) : [];
    if (keep.length) state.adds[aid] = keep; else delete state.adds[aid];
  }
  const live = new Set();
  for (const aid in state.adds) state.adds[aid].forEach(a => live.add(a.id));
  for (const id in state.notes) if (!(byId.has(id) || live.has(id)) || !String(state.notes[id]).trim()) delete state.notes[id];
  state.overall = state.overall || '';
}

/* ---------- 两句话哪里不一样 ---------- */
function diff(a, b) {
  const la = a.length, lb = b.length;
  let p = 0; while (p < la && p < lb && a[p] === b[p]) p++;
  let s = 0; while (s < la - p && s < lb - p && a[la - 1 - s] === b[lb - 1 - s]) s++;
  const n = la - p - s, m = lb - p - s, blocks = [];   // [原句起, 原句止, 新句起, 新句止]
  if (n || m) {
    if (!n || !m || n * m > 3e6) blocks.push([p, p + n, p, p + m]);
    else {
      const w = m + 1, dp = new Uint16Array((n + 1) * w);
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
        dp[i * w + j] = a[p + i] === b[p + j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      let i = 0, j = 0, cur = null;
      while (i < n || j < m) {
        if (i < n && j < m && a[p + i] === b[p + j]) { if (cur) { blocks.push(cur); cur = null; } i++; j++; }
        else {
          if (!cur) cur = [p + i, p + i, p + j, p + j];
          if (j >= m || (i < n && dp[(i + 1) * w + j] >= dp[i * w + j + 1])) { i++; cur[1] = p + i; } else { j++; cur[3] = p + j; }
        }
      }
      if (cur) blocks.push(cur);
      for (let k = blocks.length - 1; k > 0; k--) {   // 两处只隔一个字的并成一处，免得花
        const x = blocks[k - 1], y = blocks[k];
        if (y[0] - x[1] <= 1 && y[2] - x[3] <= 1) { x[1] = y[1]; x[3] = y[3]; blocks.splice(k, 1); }
      }
    }
  }
  return { del: blocks.filter(x => x[1] > x[0]).map(x => [x[0], x[1]]), ins: blocks.filter(x => x[3] > x[2]).map(x => [x[2], x[3]]) };
}
function markDel(a, del) {
  let out = '', at = 0;
  del.forEach(([s, e]) => { out += esc(a.slice(at, s)) + '<span class="d">' + esc(a.slice(s, e)) + '</span>'; at = e; });
  return out + esc(a.slice(at));
}
function paintIns() {   // 新加的字涂深绿：不往文字里塞标签，光标不会乱
  if (!window.Highlight || !window.CSS || !CSS.highlights) return;
  const hl = new Highlight();
  insMap.forEach((segs, id) => {
    const r = rowEl(id), t = r && r.querySelector('.txt');
    if (!t || t === editing || t.childNodes.length !== 1 || t.firstChild.nodeType !== 3) return;
    const node = t.firstChild;
    segs.forEach(([s, e]) => { if (s < e && e <= node.length) { const rg = new Range(); rg.setStart(node, s); rg.setEnd(node, e); hl.add(rg); } });
  });
  CSS.highlights.set('ins', hl);
}

/* ---------- 画出来 ---------- */
const PT = (() => { const d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; } catch (e) {} return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; })();
const setEditable = (t, on) => { t.contentEditable = on ? PT : 'false'; };
const setText = (t, v) => { if (t.childNodes.length === 1 && t.firstChild.nodeType === 3 && t.firstChild.data === v) return; t.textContent = v; };
const rowEl = id => doc.querySelector('.row[data-id="' + id + '"]');
const markOf = r => r.kind === 'li' ? '•' : r.kind === 'check' ? '☐' : r.kind === 'ol' ? r.prefix.trim() : '';
const LBL = { note: ['批注', '注', '写批注'], add: ['加一条', '＋', '在这一条下面加一条'], del: ['删', '✕', '删掉这一条'], undel: ['恢复', '↺', '不删了'], reset: ['还原', '↺', '改回原来的字'] };

function locate(id) {
  if (id[0] === 'L') { const r = byId.get(id); return r ? { item: r, anchor: r, isNew: false } : null; }
  for (const aid in state.adds) {
    const list = state.adds[aid], idx = list.findIndex(a => a.id === id);
    if (idx >= 0) return { item: list[idx], anchor: byId.get(aid), isNew: true, list, idx };
  }

}
function fit(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function makeNote(id, isHead) {
  const t = el('textarea', 'note'); t.rows = 1; t.dataset.note = id;
  t.placeholder = isHead ? '对这一节的意见' : '批注：哪里不对、想怎么改';
  t.value = state.notes[id] || '';

  return t;
}

  const row = el('div', cls); row.dataset.id = id;

  const main = el('div', 'main');
  if (!isNew && anchor.kind === 'fm' && anchor.prefix) main.appendChild(el('div', 'k', anchor.prefix.replace(/:\s*$/, '')));
  const old = el('div', 'old'); old.hidden = true;

  txt.textContent = isNew ? item.body : (!state.dels[id] && id in state.edits ? state.edits[id] : anchor.body);
  if (isNew) txt.dataset.ph = '写新加的这一条';
  main.append(old, txt);
  const mk = el('div', 'mk');
  if (isNew) { const [lead, extra] = addLead(anchor); mk.append(el('span', 'plus', '＋'), el('span', 'as', extra ? '·' : /\[/.test(lead) ? '☐' : lead.trim() ? '•' : '')); }   // 「改完的样子」里换成普通记号

/* 只换这一行的颜色、原句和按钮，不碰正在打字的那块 */

  row.classList.toggle('deleted', deleted); row.classList.toggle('changed', changed); row.classList.toggle('noted', !!state.notes[id]);

  if (changed) { const d = diff(anchor.body, state.edits[id]); old.innerHTML = markDel(anchor.body, d.del); insMap.set(id, d.ins); } else insMap.delete(id);

}

    const keep = list.filter(a => a.body || state.notes[a.id] || openNote === a.id || holding === a.id);
    if (keep.length) { state.adds[r.id] = keep; keep.forEach(a => r.unit.appendChild(makeRow(a, r))); } else delete state.adds[r.id];

/* 摆出整页 */
(() => {
  let box = null, curH2 = null, curH3 = null;
  rows.forEach(r => {
    if (r.kind === 'skip') {
      if (r.n === 1) { box = el('div', 'fmbox'); box.id = 'top'; box.appendChild(el('div', 'cap', '文件头：AI 靠 description 这句决定什么时候用这个技能')); doc.appendChild(box); } else box = null;
      return;
    }
    if (r.kind === 'fence-open') { box = el('div', 'codebox'); doc.appendChild(box); return; }
    if (r.kind === 'fence-close') { box = null; return; }
    if (r.kind === 'blank' || r.kind === 'gap') { (box || doc).appendChild(el('div', 'sp')); return; }
    if (r.kind === 'hr') return;
    if (r.kind === 'h' && r.level <= 3) { if (r.level <= 2) { curH2 = r; curH3 = null; } else curH3 = r; heads.push(r); }
    r.h2 = curH2; r.h3 = curH3; r.box = box;
    r.unit = el('div', 'unit');
    byId.set(r.id, r); units.push(r);
    (box || doc).appendChild(r.unit);
  });
})();
tidy();
units.forEach(renderUnit);

/* ---------- 目录 ---------- */
const toc = $('#toc');
(() => {
  const add = (hid, label, lvl, target) => { const a = el('a', 'l' + lvl); a.href = '#' + target; a.dataset.h = hid; a.append(el('span', 't', label), el('span', 'n')); toc.appendChild(a); };
  if (document.getElementById('top')) add('top', '文件头', 2, 'top');
  heads.forEach(h => add(h.id, h.body, h.level, 'h-' + h.id));
})();
$('#tocbtn').onclick = () => document.body.classList.toggle('toc-open');
toc.addEventListener('click', e => { if (up(e.target, 'a')) document.body.classList.remove('toc-open'); });
function spy() {
  const y = $('#hd').offsetHeight + 30; let cur = null;
  for (const h of heads) { const e = document.getElementById('h-' + h.id); if (!e || !e.offsetParent) continue; if (e.getBoundingClientRect().top <= y) cur = h.id; else break; }
  toc.querySelectorAll('a.cur').forEach(a => a.classList.remove('cur'));
  const a = cur && toc.querySelector('a[data-h="' + cur + '"]'); if (a) a.classList.add('cur');
}
let spyQ = 0;
window.addEventListener('scroll', () => { if (!spyQ) spyQ = requestAnimationFrame(() => { spyQ = 0; spy(); }); }, { passive: true });
const hd = $('#hd'), setHH = () => document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');
if (window.ResizeObserver) new ResizeObserver(setHH).observe(hd);
setHH();

/* ---------- 数一数动了几处 ---------- */
function sumText() {
  const p = [];
  if (counts.e) p.push('改 ' + counts.e + ' 处'); if (counts.d) p.push('删 ' + counts.d + ' 处'); if (counts.a) p.push('加 ' + counts.a + ' 条'); if (counts.n) p.push('批注 ' + counts.n + ' 条');
  if ((state.overall || '').trim()) p.push('有整体意见');
  return p.join('、');
}
function recount() {
  const c = { e: 0, d: 0, a: 0, n: 0 }, cnt = new Map();
  const bump = (k, t) => cnt.set(k, (cnt.get(k) || 0) + t);
  doc.querySelectorAll('.codebox.has, .fmbox.has').forEach(b => b.classList.remove('has'));
  units.forEach(r => {
    const id = r.id, list = state.adds[id] || []; let t = 0;
    if (state.dels[id]) { c.d++; t++; } else if (id in state.edits) { c.e++; t++; }
    if (state.notes[id]) { c.n++; if (t === 0) t++; }
    list.forEach(a => { if (a.body) { c.a++; t++; } if (state.notes[a.id]) { c.n++; if (!a.body) t++; } });
    r.unit.classList.toggle('touched', t > 0 || list.length > 0);
    if (t) { bump(r.h2 ? r.h2.id : 'top', t); if (r.h3) bump(r.h3.id, t); if (r.box) r.box.classList.add('has'); }
  });
  counts = c;
  heads.forEach(h => h.unit.classList.toggle('ctx', (cnt.get(h.id) || 0) > 0));
  toc.querySelectorAll('a').forEach(a => { a.querySelector('.n').textContent = cnt.get(a.dataset.h) || ''; });
  const s = sumText();
  $('#sum').innerHTML = s ? '<b>' + esc(s) + '</b>' : '还没有改动';
  document.body.classList.toggle('none', !(c.e + c.d + c.a + c.n));
}

/* ---------- 改字 ---------- */

  const id = c.item.id, v = t.textContent.replace(/\r/g, '').replace(/\s+$/, '');
  if (c.isNew) c.item.body = v.trim();
  else if (!v || v === c.anchor.body.replace(/\s+$/, '')) delete state.edits[id]; else state.edits[id] = v;
  decor(row, c.item, c.anchor); paintIns(); recount(); save();
}

    else if (v === c.anchor.body.replace(/\s+$/, '')) { delete state.edits[id]; setText(t, c.anchor.body); }
    else { state.edits[id] = v; setText(t, v); }
    decor(row, c.item, c.anchor);
  }
  if (rest.length) {   // 一次贴进来好几行：后面的各算新加的一条
    const list = state.adds[c.anchor.id] || (state.adds[c.anchor.id] = []);
    let at = c.isNew ? list.indexOf(c.item) + 1 : 0;

/* ---------- 批注框 ---------- */
function onNote(t) {
  const id = t.dataset.note;
  if (t.value.trim()) state.notes[id] = t.value; else delete state.notes[id];
  fit(t);
  const r = up(t, '.row'); if (r) r.classList.toggle('noted', !!state.notes[id]);
  recount(); save();
}

/* ---------- 一行右边的按钮 ---------- */
/* 正在写的那块算写完。自己收尾，不指望浏览器一定发「失去光标」的通知（窗口不在前面时不发） */

  if (op === 'add') { if (c.isNew && !c.item.body) focusTxt(id); else if (canAdd(id)) addAfter(id); return; }
  if (op === 'note') openNote = id;
  else if (op === 'del') { if (c.isNew) dropAdd(c, null); else state.dels[id] = true; if (openNote === id && c.isNew) openNote = null; }
  else if (op === 'undel') delete state.dels[id];
  else if (op === 'reset') delete state.edits[id];
  renderUnit(c.anchor);
  if (op === 'note') { const t = doc.querySelector('textarea.note[data-note="' + id + '"]'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  paintIns(); recount(); save();
}
doc.addEventListener('mousedown', e => {
  const b = up(e.target, 'button[data-op]'); if (!b || e.button !== 0) return;
  e.preventDefault();   // 不让正在写的那块先丢了光标再重画
  const id = up(b, '.row').dataset.id, op = b.dataset.op;
  holding = id; commitActive(); holding = null;
  doOp(id, op);
});
doc.addEventListener('focusin', e => { const t = up(e.target, '.txt'); if (t) { editing = t; t._before = t.textContent; } });
doc.addEventListener('input', e => { const t = up(e.target, '.txt'); if (t) return onTxt(t, e.isComposing); const n = up(e.target, 'textarea.note'); if (n) onNote(n); });
doc.addEventListener('compositionend', e => { const t = up(e.target, '.txt'); if (t) onTxt(t, false); });
doc.addEventListener('focusout', e => {
  const t = up(e.target, '.txt'), n = t ? null : up(e.target, 'textarea.note'), a = t || n; if (!a || a._left) return;
  if (editing === a) editing = null;
  const row = up(a, '.row'), to = up(e.relatedTarget, '.row');
  if (t) commitTxt(t, !!row && to === row); else closeNote(n, !!row && to === row);
});
doc.addEventListener('keydown', e => {
  const t = up(e.target, '.txt');
  if (t) {
    if (e.key === 'Enter') {
      if (e.isComposing || e.keyCode === 229) return;   // 拼音选字的回车不算
      e.preventDefault();
      const id = up(t, '.row').dataset.id;
      leave(t);
      if (!e.shiftKey && canAdd(id)) addAfter(id);
    } else if (e.key === 'Escape') { if (t._before != null) { t.textContent = t._before; onTxt(t, false); } leave(t); }
    return;
  }
  const n = up(e.target, 'textarea.note');
  if (n && (e.key === 'Escape' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey)))) { e.preventDefault(); leave(n); }
});
doc.addEventListener('paste', e => {   // 只贴纯文字；贴进来好几行的，第一行接在光标处，其余各成一条
  const t = up(e.target, '.txt'); if (!t) return;
  e.preventDefault();
  const lines = ((e.clipboardData || window.clipboardData).getData('text/plain') || '').replace(/\r\n?/g, '\n').split('\n');
  document.execCommand('insertText', false, lines.shift().replace(/\s+$/, ''));
  const rest = lines.map(s => s.replace(/^\s*(?:[-*+•]\s+(?:\[[ xX]\]\s+)?|\d+[.)、]\s*)/, '').trim()).filter(Boolean);
  if (rest.length) { t._rest = rest; leave(t); }
});

/* ---------- 整体意见、三种看法 ---------- */
const overall = $('#overall');
overall.value = state.overall || '';
overall.addEventListener('input', () => { state.overall = overall.value; recount(); save(); });
$('#view').addEventListener('click', e => {
  const b = up(e.target, 'button'); if (!b) return;
  commitActive();
  document.body.classList.remove('only', 'clean');
  if (b.dataset.v !== 'all') document.body.classList.add(b.dataset.v);
  $('#view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  paintIns();
});

/* ---------- 交出去的文字 ---------- */
function pathOf(r) { const p = []; if (r.h2) p.push(r.h2.body); if (r.h3) p.push(r.h3.body); return p.length ? p.join(' › ') : '文件头'; }
function nextContent(r) { for (let i = r.n; i < rows.length; i++) if (rows[i].kind !== 'blank' && rows[i].kind !== 'gap') return rows[i]; return null; }   // rows[r.n] 就是下一行
function addLead(anchor) {   // 新加的一条前面带什么记号
  let k = anchor;
  if (k.kind === 'h' || k.kind === 'p') { const nx = nextContent(k); if (nx && (nx.kind === 'li' || nx.kind === 'check' || nx.kind === 'ol')) k = nx; else return ['', '']; }
  if (k.kind === 'li') return [k.prefix, ''];
  if (k.kind === 'check') return [k.prefix.replace(/\[[xX]\]/, '[ ]'), ''];
  if (k.kind === 'ol') return ['', '，编号顺延'];
  return ['', ''];
}
function asText() {
  const out = ['【' + DATA.title + ' 修改批注】', '文件：' + DATA.file + '（' + DATA.mtime + ' 的版本，' + DATA.sha.slice(0, 8) + '）', sumText() || '没有改动'];
  let n = 0, last = null;
  const note = id => state.notes[id] ? ['   批注：' + String(state.notes[id]).trim().replace(/\n/g, '\n   　　　')] : [];
  units.forEach(r => {
    const id = r.id, where = '第' + r.n + '行', items = [];
    if (state.dels[id]) items.push(['删（' + where + '）：' + r.raw].concat(note(id)));
    else if (id in state.edits) items.push(['改（' + where + '）', '   原文：' + r.raw, '   改成：' + r.prefix + state.edits[id]].concat(note(id)));
    else if (state.notes[id]) items.push(['批注（' + where + '）', '   原文：' + r.raw].concat(note(id)));
    (state.adds[id] || []).forEach(a => {
      if (!a.body && !state.notes[a.id]) return;
      if (!a.body) { items.push(['批注（' + where + '后面想加一条）'].concat(note(a.id))); return; }
      const [lead, extra] = addLead(r);
      items.push(['加（' + where + '后面' + extra + '）：' + lead + a.body].concat(note(a.id)));
    });
    if (!items.length) return;
    const p = pathOf(r);
    if (p !== last) { out.push('', '〔' + p + '〕'); last = p; }
    items.forEach(it => { out.push(++n + '. ' + it[0]); for (let i = 1; i < it.length; i++) out.push(it[i]); });
  });
  if ((state.overall || '').trim()) out.push('', '整体意见：' + state.overall.trim());
  return out.join('\n');
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = 'none'; }, 2600); }
function copyText(txt, msg) {
  const done = () => toast(msg);
  const fb = () => {
    const a = el('textarea'); a.value = txt; a.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(a); a.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    a.remove(); if (ok) done(); else toast('复制没成功，请点「存成文件」');
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fb); else fb();
}
$('#copy').onclick = () => { commitActive(); if (isEmpty()) return toast('还没有改动'); flush(); copyText(asText(), '已复制，贴到对话里就行'); };
$('#down').onclick = () => {
  commitActive(); if (isEmpty()) return toast('还没有改动'); flush();
  const name = '技能修改批注_' + DATA.short + '_批注.md', a = el('a');
  a.href = URL.createObjectURL(new Blob([asText() + '\n'], { type: 'text/markdown;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已存到“下载”文件夹：' + name);
};
$('#clear').onclick = () => {
  commitActive();
  if (isEmpty()) return toast('本来就是空的');
  if (!confirm('这页上的改动和批注全部清掉？')) return;
  clearTimeout(timer); state = blank(); openNote = null; insMap.clear();
  try { localStorage.removeItem(KEY); } catch (e) {}
  units.forEach(renderUnit); overall.value = '';
  paintIns(); recount(); toast('已清空');
};

/* ---------- 技能文件改过以后，上一版上留着的批注 ---------- */
function staleBanner() {
  const ks = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KEY_PREFIX) && k !== KEY) ks.push(k); } } catch (e) { return; }
  const two = x => String(x).padStart(2, '0');
  ks.forEach(k => {
    let s = null; try { s = JSON.parse(localStorage.getItem(k)); } catch (e) {}
    if (!s || !s.text) { try { localStorage.removeItem(k); } catch (e) {} return; }
    const w = s.t ? new Date(s.t) : null, when = w ? two(w.getMonth() + 1) + '-' + two(w.getDate()) + ' ' + two(w.getHours()) + ':' + two(w.getMinutes()) + ' 写的，' : '';
    const d = el('div', 'stale');
    d.appendChild(el('span', '', '技能文件在你上次批注之后改过了。上一版上还留着你的批注（' + when + (s.sum || '') + '）'));
    const b1 = el('button', '', '复制那次的批注'), b2 = el('button', '', '不要了');
    b1.type = b2.type = 'button';
    b1.onclick = () => copyText(s.text, '已复制上一版的批注');
    b2.onclick = () => { if (!confirm('上一版上的批注不要了？')) return; try { localStorage.removeItem(k); } catch (e) {} d.remove(); };
    d.append(b1, b2); $('#stale').appendChild(d);
  });
}

window.addEventListener('pagehide', () => { commitActive(); flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
paintIns(); recount(); spy(); staleBanner();
if (!canSave) warnSave();
window.skillEdit = { key: KEY, state: () => JSON.parse(JSON.stringify(state)), text: asText };   // 给 Claude 读批注用
})();
</script>
</body></html>
