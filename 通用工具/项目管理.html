/* 停下来：正在放就按现在的时间算是第几帧，之后都对准这一帧 */
function halt() {
  const vd = P.video;
  if (!vd.paused) { vd.pause(); P.f = clampF(Math.floor(vd.currentTime * S.v.fps + 1e-3)); }
  return P.f;
}
function step(d) { if (P) seekTo(halt() + d); }
function togglePlay() { if (!P) return; const vd = P.video; if (vd.paused || vd.ended) vd.play().catch(e => toast('放不了：' + e.message, 'err')); else seekTo(halt()); }
function setRate(r) {
  S.rate = r;
  if (!P) return;
  P.video.defaultPlaybackRate = r; P.video.playbackRate = r;
  [...P.rates.children].forEach((b, i) => b.classList.toggle('on', RATES[i] === r));
}
function toggleMute() { S.muted = !S.muted; if (P) { P.video.muted = S.muted; P.muteBtn.replaceChildren(icon(S.muted ? 'mute' : 'sound')); } }
function paintPlay() { if (P) P.playBtn.replaceChildren(icon(P.video.paused || P.video.ended ? 'play' : 'pause')); }
function paintTime() {
  const p = P;
  if (!p || !S.v) return;
  const d = p.video.duration, n = Math.max(1, S.v.frames - 1);
  p.tc.textContent = fmtF(p.f) + ' / ' + (isFinite(d) ? fmt(d) : '-:--.-');
  p.fr.textContent = `第 ${p.f + 1} 帧`;
  const x = Math.min(100, p.f / n * 100) + '%';
  p.ph.style.left = x; p.fill.style.width = x;
}
function paintMarks() {
  const p = P, v = S.v;
  if (!p || !v) return;
  const n = Math.max(1, v.frames - 1), pc = f => Math.min(100, f / n * 100);
  p.marks.replaceChildren(...v.notes.map((x, i) => {
    const a = pc(x.f), cls = 'mk' + (x.f2 != null ? ' range' : '') + (S.sel === x.id ? ' on' : '') + (S.form && S.form.id === x.id ? ' editing' : '');
    const el = h('button', { class: cls, title: `${i + 1}．${rangeText(x)}　${x.text.slice(0, 40)}`, style: x.f2 != null ? `left:${a}%;width:${pc(x.f2) - a}%` : `left:${a}%`, onclick: () => jump(x) });
    el.addEventListener('pointerdown', e => e.stopPropagation());
    return el;
  }));
}

/* ---------- 写批注 ---------- */
function dropFormUrls() {
  const fm = S.form;
  if (fm) for (const e of [fm.a, fm.b]) if (e && e.url && !e.saved) URL.revokeObjectURL(e.url);
}
function defaultShot(f) {
  const prev = [...S.v.notes].reverse().find(n => n.f <= f && n.shot);
  return prev ? prev.shot : '';
}
async function openForm(n) {
  if (!P || S.opening || !(await leaveForm())) return;
  halt();
  if (n) {
    S.form = { id: n.id, a: { f: n.f, img: n.img }, b: n.f2 != null ? { f: n.f2, img: n.img2 } : null, cats: new Set(n.cats), shot: n.shot, text: n.text, changed: false };
    S.sel = n.id;
    seekTo(n.f);
  } else {
    S.opening = true;   // 连按两下回车只开一张
    try {
      const p = P;
      await seekTo(p.f);
      if (P !== p) return;
      const a = await grabEnd();
      if (P !== p) return;
      S.form = { id: null, a, b: null, cats: new Set(), shot: defaultShot(a.f), text: '', changed: false };
    } finally { S.opening = false; }
  }
  paintRail(); paintMarks();
  const body = $('#rail-body'); if (body) body.scrollTop = 0;
  const ta = $('.fta'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
async function setEnd(which) {
  const fm = S.form;
  if (!fm || !P) return;
  await seekTo(halt());
  if (!P || S.form !== fm) return;
  const e = await grabEnd();
  if (which === 'b' && e.f === fm.a.f) { if (e.url) URL.revokeObjectURL(e.url); toast('结束和开始是同一帧：先往后放到结束的地方，再点这里'); return; }
  const old = fm[which]; if (old && old.url) URL.revokeObjectURL(old.url);
  fm[which] = e; fm.changed = true;
  paintForm();
}
function clearEnd() { const fm = S.form; if (fm.b && fm.b.url) URL.revokeObjectURL(fm.b.url); fm.b = null; fm.changed = true; paintForm(); }
async function saveForm() {
  const fm = S.form, v = S.v;
  if (!fm || fm.busy) return;
  const text = fm.text.trim();
  if (!text) { toast('先写几个字再存'); const ta = $('.fta'); if (ta) ta.focus(); return; }
  fm.busy = true;
  let ends = [fm.a, fm.b].filter(Boolean).sort((x, y) => x.f - y.f);
  if (ends.length === 2 && ends[0].f === ends[1].f) ends = [ends[0]];
  for (const e of ends) if (e.blob && !e.img) { e.img = await writeShot(v, e.f, e.blob); e.saved = !!e.img; }
  const old = fm.id ? v.notes.find(n => n.id === fm.id) : null;
  const note = {
    id: fm.id || uid(), f: ends[0].f, img: ends[0].img || '', f2: ends[1] ? ends[1].f : null, img2: ends[1] ? ends[1].img || '' : '',
    cats: Review.catsOf(fm.cats), shot: Review.shotOf(fm.shot), cmp: old ? old.cmp : '', kf: old ? old.kf : null, text,   // 审片台写的「对照」「弃用关键帧」这页不改，照原样留着
  };
  v.notes = [...v.notes.filter(n => n !== old), note].sort(byFrame);
  dropFormUrls();
  S.form = null; S.sel = note.id;
  if (old) await dropUnused(v, [old.img, old.img2]);
  await saveNow();
  paintRail(); paintMarks();
  toast(old ? '改好了' : `记下了：${rangeText(note)}`);
}
/* 写了一半要走：问一句 */
async function leaveForm() {
  if (!S.form) return true;
  if (!(await Desk.formLeave(S.form))) return false;
  dropFormUrls();
  S.form = null;
  paintRail(); paintMarks();
  return true;
}
async function delNote(n) {
  const ok = await confirmDlg({ title: '删掉这条批注？', body: Review.brief(n, S.v.fps) + '\n这条的截图也一起删掉。', ok: '删掉', danger: true });
  const v = S.v;
  if (!ok || !v || !v.notes.includes(n)) return;
  v.notes = v.notes.filter(x => x !== n);
  if (S.form && S.form.id === n.id) { dropFormUrls(); S.form = null; }
  if (S.sel === n.id) S.sel = null;
  await dropUnused(v, [n.img, n.img2]);
  await saveNow();
  paintRail(); paintMarks();
  toast('删掉了');
}
function jump(n) {
  if (!P) return;
  halt();
  S.sel = n.id;
  seekTo(n.f);
  paintRail(); paintMarks();
}
async function copyForAI() {
  const v = S.v;
  await v.q;
  const path = Desk.abs ? shown(v, v.notesAt) : [Desk.rootName, ...v.notesAt].join('/');
  Desk.copyText('按审片批注改提示词 ' + path, '复制好了，贴给 Claude 或 Codex');
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  if (!Desk.is('review')) return;   // 正在别的功能里：回来再画
  renderMain();
}
function renderMain() {
  const main = $('#main');
  if (S.view === 'player' && S.v && P) {
    main.replaceChildren(renderTop(), h('div', { class: 'stage' }, P.col, renderRail()));
    paintPlay(); paintTime(); paintMarks(); paintStatus();
    return;
  }
  main.replaceChildren(renderListTop(), renderList());
}
const placeName = parts => parts && parts.length ? parts[parts.length - 1] : Desk.rootName;
function renderListTop() {
  const n = S.groups.reduce((a, g) => a + g.videos.length, 0);
  return h('header', { class: 'top' },
    h('div', { class: 'crumb' }, h('span', { class: 'ptitle' }, placeName(S.dir)), h('span', { class: 'crumb-seg' }, '样片')),
    h('div', { class: 'top-right' }, S.loading ? null : h('div', { class: 'status' }, n ? `${n} 条` : '')));
}
/* 一个文件夹里的样片：按项目、按段排开，点一条开始看 */
function renderList() {
  const wrap = h('div', { class: 'ig-wrap' });
  const any = S.groups.some(g => g.videos.length);
  if (S.loading) { wrap.append(h('div', { class: 'ig-empty' }, '正在读取「' + placeName(S.dir) + '」……')); return wrap; }
  if (!any) {
    wrap.append(h('div', { class: 'ig-empty' }, '这里没找到样片（mp4）', h('br'), h('small', null, '样片放进 成片 下这一段的文件夹，就会出现在这里')));
    return wrap;
  }
  for (const g of S.groups) {
    if (!g.videos.length) continue;
    if (S.groups.length > 1) wrap.append(h('div', { class: 'ig-h pj' }, g.name));
    const subs = [...new Set(g.videos.map(it => it.sub))];
    for (const sub of subs) {
      if (sub) wrap.append(h('div', { class: 'ig-h' }, sub));
      wrap.append(h('div', { class: 'ig' }, g.videos.filter(it => it.sub === sub).map(it => videoCard(g, it))));
    }
  }
  return wrap;
}
function videoCard(g, it) {
  const box = h('div', { class: 'ci-img' }, icon('film'));
  if (it.thumb) {   // 有批注的，拿第一张截图当封面
    const dir = it.path.slice(0, -1);
    FS.file([...dir, stem(it.name) + SHOTS_TAIL, it.thumb]).then(f => {
      const u = URL.createObjectURL(f), img = h('img', { alt: '', decoding: 'async' });
      img.onload = img.onerror = () => setTimeout(() => URL.revokeObjectURL(u), 1000);
      img.src = u; box.append(img);
    }).catch(() => {});
  }
  const meta = [it.count ? `批注 ${it.count}` : '', it.general ? '整条意见' : ''].filter(Boolean).join(' · ');
  return h('button', { class: 'card-i', type: 'button', title: it.path.join(' / '), onclick: () => openVideo(g, it) }, box,
    h('div', { class: 'ci-b' }, h('div', { class: 'ci-name' }, it.label), h('div', { class: 'ci-meta' }, meta ? h('span', { class: 'noted' }, meta) : '还没批')));
}
function renderTop() {
  const v = S.v, back = S.dir || v.g.cp;
  return h('header', { class: 'top' },
    h('div', { class: 'crumb' }, h('button', { class: 'ptitle', title: '回到「' + placeName(back) + '」的样片', onclick: () => showList(back) }, v.g.name),
      v.item.sub ? h('span', { class: 'crumb-seg' }, v.item.sub) : null,
      h('span', { class: 'crumb-seg', title: v.name }, v.item.label)),
    h('div', { class: 'top-right' },
      h('div', { class: 'status', id: 'status' }),
      h('button', { class: 'btn ink', id: 'ai-btn', onclick: copyForAI, title: '复制一句话，贴给 Claude 或 Codex，它照批注改提示词' }, icon('copy'), '交给 AI')));
}
function paintStatus() { const v = S.v; if (v && S.view === 'player') Desk.noteStatus(v, shown(v, v.notesAt), '整条'); }
function paintRail() {
  const old = $('#rail');
  if (!old || !S.v || !Desk.is('review')) return;
  const sc = ($('#rail-body') || {}).scrollTop || 0;
  const focusTa = document.activeElement && document.activeElement.classList.contains('fta');
  old.replaceWith(renderRail());
  const body = $('#rail-body'); if (body) body.scrollTop = sc;
  if (focusTa) { const ta = $('.fta'); if (ta) ta.focus(); }
  paintStatus();
}
function paintForm() {
  const old = $('.form');
  if (!old || !S.form) { paintRail(); return; }
  const ta = old.querySelector('.fta'), focused = document.activeElement === ta, s = ta.selectionStart, e = ta.selectionEnd;
  old.replaceWith(renderForm());
  if (focused) { const t = $('.fta'); t.focus(); t.setSelectionRange(s, e); }
  paintMarks();
}
function renderRail() {
  const v = S.v;
  const head = h('div', { class: 'rail-h' });
  if (v.g.pr) {
    const sel = h('select', { class: 'sel', title: '这条样片是照哪份提示词出的', onchange: e => { e.target.blur(); setPrompt(e.target.value); } },
      h('option', { value: '' }, v.promptKeep ? '（原来记的：' + baseName(v.promptKeep) + '）' : v.prompts.length ? '没对应' : '本段没找到视频提示词'),
      v.prompts.map((p, i) => h('option', { value: String(i) }, p.label)));
    sel.value = v.prompt ? String(v.prompts.indexOf(v.prompt)) : '';
    head.append(h('label', { class: 'prow' }, h('span', null, '对应提示词'), sel));
  }
  const gen = h('textarea', {
    class: 'gen', rows: 1, placeholder: '整条片子的意见（可不写）', value: v.general,
    oninput: e => { v.general = e.target.value; grow(e.target); saveLater(); },
    onblur: () => { if (v.saveT) saveNow(); },
    onkeydown: e => { if (e.key === 'Escape') e.target.blur(); },
  });
  head.append(gen);
  requestAnimationFrame(() => grow(gen));
  const body = h('div', { class: 'rail-body', id: 'rail-body' });
  if (S.form) body.append(renderForm());
  body.append(h('div', { class: 'list-h' }, v.notes.length ? `批注 ${v.notes.length} 条` : '还没有批注'));
  if (!v.notes.length && !S.form) body.append(h('p', { class: 'list-empty' }, '看到哪里不对，停下来按回车（或点「写批注」），写一句就行。要说一段，先停在开头写，再放到结尾点「到」那一行的按钮。'));
  v.notes.forEach((n, i) => body.append(renderItem(n, i)));
  return h('aside', { class: 'rail', id: 'rail' }, head, body);
}
function renderForm() {
  const fm = S.form, v = S.v;
  const no = fm.id ? v.notes.findIndex(n => n.id === fm.id) + 1 : 0;
  const thumb = e => e.url ? h('img', { class: 'fthumb', src: e.url, alt: '' }) : e.img ? shotImg(v, e.img, 'fthumb') : h('span', { class: 'fthumb' });
  const endRow = (label, e, which) => h('div', { class: 'frow' },
    h('span', { class: 'flab' }, label),
    e ? [thumb(e), h('span', { class: 'ftime', title: `第${e.f + 1}帧` }, fmtF(e.f))] : h('span', { class: 'fnone' }, '只这一刻'),
    h('span', { class: 'fgo' },
      which === 'b' && e ? h('button', { class: 'btn ghost sm', title: '不要结束时间', onclick: clearEnd }, '去掉') : null,
      h('button', { class: 'btn sm', title: which === 'a' ? '开头改成播放器里现在这一帧' : '结束设成播放器里现在这一帧', onclick: () => setEnd(which) }, '用当前画面')));
  const chips = h('div', { class: 'chips' }, CATS.map(c => h('button', {
    class: 'chip' + (fm.cats.has(c) ? ' on' : ''),
    onclick: e => { fm.cats.has(c) ? fm.cats.delete(c) : fm.cats.add(c); e.currentTarget.classList.toggle('on', fm.cats.has(c)); fm.changed = true; },
  }, c)));
  let shot;
  if (v.shots.length) {
    const opts = v.shots.map(s => `${s.no}｜${s.title}`);
    if (fm.shot && !opts.includes(fm.shot)) opts.unshift(fm.shot);
    shot = h('select', { class: 'sel', onchange: e => { fm.shot = e.target.value; fm.changed = true; e.target.blur(); } },
      h('option', { value: '' }, '不标'), opts.map(o => h('option', { value: o }, '镜头 ' + o.replace('｜', '　'))));
    shot.value = fm.shot;
  } else {
    shot = h('input', { class: 'inp', value: fm.shot, placeholder: v.g.pr ? '上面选了对应的提示词，这里就能挑' : '第几镜，比如 03（可空）', oninput: e => { fm.shot = e.target.value; fm.changed = true; } });
  }
  const ta = h('textarea', {
    class: 'fta', placeholder: '哪里不对，想要什么样', value: fm.text,
    oninput: e => { fm.text = e.target.value; fm.changed = true; grow(e.target); },
  });
  requestAnimationFrame(() => grow(ta));
  return h('div', { class: 'form' },
    h('div', { class: 'form-h' }, no ? `改第 ${no} 条` : '新批注'),
    endRow('从', fm.a, 'a'), endRow('到', fm.b, 'b'),
    h('div', { class: 'frow' }, h('span', { class: 'flab' }, '分类'), chips),
    h('div', { class: 'frow' }, h('span', { class: 'flab' }, '镜头'), shot),
    ta,
    h('div', { class: 'form-f' },
      fm.id ? h('button', { class: 'btn ghost sm danger', onclick: () => { const n = v.notes.find(x => x.id === fm.id); if (n) delNote(n); } }, '删掉') : null,
      h('span', { class: 'sp' }),
      h('em', null, 'Ctrl + 回车 存'),
      h('button', { class: 'btn ghost sm', onclick: () => leaveForm() }, '取消'),
      h('button', { class: 'btn ink sm', onclick: saveForm }, '存好')));
}
function renderItem(n, i) {
  const v = S.v, editing = S.form && S.form.id === n.id;
  return h('div', { class: 'ni' + (S.sel === n.id ? ' on' : '') + (editing ? ' editing' : ''), title: '点一下跳到这里', onclick: () => jump(n) },
    h('div', { class: 'ni-img' }, n.img ? shotImg(v, n.img) : '没有截图'),
    h('div', { class: 'ni-main' },
      h('div', { class: 'ni-h' },
        h('span', { class: 'ni-no' }, i + 1),
        h('span', { class: 'ni-t' }, rangeText(n)),
        h('span', { class: 'ni-acts' },
          h('button', { class: 'mini', title: '改这条', onclick: e => { e.stopPropagation(); openForm(n); } }, '改'),
          h('button', { class: 'mini del', title: '删掉这条', onclick: e => { e.stopPropagation(); delNote(n); } }, '删'))),
      n.cats.length || n.shot ? h('div', { class: 'ni-tags' },
        n.cats.map(c => h('span', { class: 'tag c' + CATS.indexOf(c) }, c)),
        n.shot ? h('span', { class: 'ni-shot', title: '镜头 ' + n.shot }, '镜头 ' + n.shot.replace('｜', ' ')) : null) : null,
      h('div', { class: 'ni-text' }, n.text)));
}

/* ---------- 键盘、窗口 ---------- */
document.addEventListener('keydown', e => {
  if (!Desk.is('review') || isComposing(e) || $('.mask')) return;
  const tag = document.activeElement && document.activeElement.tagName;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  if (S.form && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveForm(); return; }
  if (S.form && e.key === 'Escape') { e.preventDefault(); leaveForm(); return; }
  if (typing || !P || S.view !== 'player' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); const d = e.key === 'ArrowLeft' ? -1 : 1; step(e.shiftKey ? d * Math.round(S.v.fps) : d); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.form) { const ta = $('.fta'); if (ta) ta.focus(); } else openForm(); }
});
window.addEventListener('beforeunload', e => {
  const v = S.v;
  if (v && v.saveT) saveNow();
  if (S.form && S.form.changed && S.form.text.trim()) { e.preventDefault(); e.returnValue = ''; }
});
/* 切回来时看一眼（右边窗格里每两秒看一眼）：AI 改了或移走了批注文件，就重新读；列着的文件夹多了新视频，跟着变 */
let CHECKING = false;
async function recheck() {
  if (CHECKING || !Desk.is('review') || $('.mask')) return;
  CHECKING = true;
  try {
    const v = S.v;
    if (v && !S.form && S.view === 'player') {
      await v.q;
      const st = await FS.stat(v.notesAt);
      if (S.v === v && !S.form && (st ? st.mtime : 0) !== v.mdMtime) {
        const md = await readMd(v);
        if (md && md.prompt) { const p = v.prompts.find(x => x.name === md.prompt); if (p && p !== v.prompt) { v.prompt = p; v.shots = await readShots(p); } }
        S.sel = null;
        paintRail(); paintMarks(); syncCount();
        toast(st ? '批注在外面改过，已重新读取' : '批注文件被移走了');
      }
    }
    if (S.view === 'list' && !S.loading && S.dir && Date.now() - S.listAt > 8000) {
      const tok = S.tok, groups = await scanList(S.dir);
      if (tok === S.tok && S.view === 'list') { S.groups = groups; S.listAt = Date.now(); render(); }
    }
  } catch (e) { /* 下次再看 */ }
  finally { CHECKING = false; }
}

Desk.MOD.review = { enter, leave, reset, recheck };
})();
</script>
<script>
/* ============================================================
   图片批注：白模图、空镜图、关键帧，在图上框出来写批注；上一张、下一张
   批注存成图片旁边的「图片名_批注.md」；画好框的标注图放在旁边的「图片名_批注截图」文件夹里
   流水线点一张图就打开；点文件夹，这里把里面的图摆开
   ============================================================ */
(function () {
'use strict';
const Desk = window.Desk;
const { C, FS, h, icon, isComposing, pathEq, byName, stem, toast, confirmDlg, IMG_RE, NOTES_TAIL, SHOTS_TAIL } = Desk;
const { thumbOf, dropThumbs, whenSeen } = window.UI;   // 缩小图用 公用/界面.js 的

const KINDS = ['白模', '空镜', '关键帧', '其他'];   // 图的类别：看文件名，名字里没写就看所在的文件夹
const KIND_CLS = { 白模: 'cat-bm', 空镜: 'cat-kj', 关键帧: 'cat-gj', 其他: 'cat-qt' };
const KIND_RE = [['白模', /白模/], ['空镜', /空镜/], ['关键帧', /关键帧|首帧|尾帧/]];
const CATS = ['构图', '人物', '道具', '场景', '光影', '其他'];   // 批注的分类
const MARK = '标注图.jpg';
const MIN_BOX = 0.012;   // 拖得比这还小，就算点了一下

const S = {
  ready: false, view: 'grid',   // grid：一个文件夹里的图；viewer：正在看一张
  dir: null, items: [], subdirs: [], loading: false, listAt: 0, gtok: 0, filter: '全部',
  list: [], i: -1,              // 上一张、下一张就在这一串里走
  v: null, form: null, sel: null, zoom: false, tok: 0,
};
let V = null;   // 看图的那一块：图、框、底下一排小图

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const TE = new TextEncoder();
const clamp01 = x => Math.max(0, Math.min(1, x));
const pc = x => (Math.round(x * 1000) / 10).toFixed(1) + '%';
const { mdEsc } = window.Review;
function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }
function kindOf(path) {
  for (const s of [path[path.length - 1], ...path.slice(-3, -1).reverse()]) for (const [k, re] of KIND_RE) if (re.test(s)) return k;
  return '其他';
}
const placeName = parts => parts && parts.length ? parts[parts.length - 1] : Desk.rootName;
const atTop = parts => !parts.length || (parts.length === 1 && parts[0] === '项目');   // 总文件夹、项目：只列文件夹

/* ---------- 小图：360 宽，露出来才做（做法在 公用/界面.js） ---------- */
function thumbEl(path) {
  const img = h('img', { alt: '', decoding: 'async', draggable: 'false' });
  return whenSeen(img, () => thumbOf(path, 360).then(u => { img.src = u; }).catch(() => img.remove()));
}
/* 整张图：前后几张留着，翻得快 */
const FULL = new Map();
function fullUrl(path) {
  const k = path.join('/');
  let p = FULL.get(k);
  if (p) FULL.delete(k);
  else { p = FS.file(path).then(f => URL.createObjectURL(f)); p.catch(() => FULL.delete(k)); }
  FULL.set(k, p);
  while (FULL.size > 5) { const [k0, p0] = FULL.entries().next().value; FULL.delete(k0); p0.then(URL.revokeObjectURL).catch(() => {}); }
  return p;
}
function dropFull(path) { const k = path.join('/'), p = FULL.get(k); if (p) { FULL.delete(k); p.then(URL.revokeObjectURL).catch(() => {}); } }

/* ---------- 一个文件夹里的图（往下看三层；历史记录、批注截图不看） ---------- */
async function scanImages(parts) {
  const out = [];
  const walk = async (p, sub, depth) => {
    let ents; try { ents = await FS.list(p); } catch (e) { return; }
    const names = new Set(ents.map(e => e.name));
    ents.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'file' ? -1 : 1) || byName(a, b));
    for (const e of ents) {
      if (Desk.hiddenName(e.name)) continue;
      if (e.kind === 'directory') {
        if (depth > 0 && e.name !== '历史记录' && !e.name.endsWith(SHOTS_TAIL)) await walk([...p, e.name], sub ? sub + ' / ' + e.name : e.name, depth - 1);
        continue;
      }
      if (!IMG_RE.test(e.name)) continue;
      const path = [...p, e.name];
      out.push({ path, name: e.name, sub, kind: kindOf(path), noted: names.has(stem(e.name) + NOTES_TAIL) });
    }
  };
  await walk(parts, '', 3);
  return out;
}
const filtered = () => S.filter === '全部' ? S.items : S.items.filter(it => it.kind === S.filter);

/* ---------- 位置：按图的宽高算百分比，从左上角量起 ---------- */
function whereOf(b) {
  if (!b) return '整张';
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, col = cx < 1 / 3 ? 0 : cx < 2 / 3 ? 1 : 2, row = cy < 1 / 3 ? 0 : cy < 2 / 3 ? 1 : 2;
  return [['左上', '正上', '右上'], ['左边', '正中', '右边'], ['左下', '正下', '右下']][row][col] + (b.w || b.h ? ' · 框' : ' · 一个点');
}
function posText(n, v) {
  const b = n.box, px = (x, W) => Math.round(x * W);
  if (!b) return n.rawPos || '整张';
  if (!b.w && !b.h) return `点 左${pc(b.x)} 上${pc(b.y)}（像素 ${px(b.x, v.natW)},${px(b.y, v.natH)}）`;
  return `框 左${pc(b.x)} 上${pc(b.y)} 宽${pc(b.w)} 高${pc(b.h)}（像素 ${px(b.x, v.natW)},${px(b.y, v.natH)} 到 ${px(b.x + b.w, v.natW)},${px(b.y + b.h, v.natH)}）`;
}
function parsePos(s) {
  if (!s || /整张/.test(s)) return { box: null };
  const num = re => { const m = re.exec(s); return m ? +m[1] / 100 : null; };
  const x = num(/左\s*([\d.]+)\s*%/), y = num(/上\s*([\d.]+)\s*%/), w = num(/宽\s*([\d.]+)\s*%/), hh = num(/高\s*([\d.]+)\s*%/);
  if (x == null || y == null) return { box: null, raw: s.trim() };   // 读不懂：照原样留着
  return { box: { x: clamp01(x), y: clamp01(y), w: clamp01(w || 0), h: clamp01(hh || 0) } };
}

/* ---------- 批注文件：AI 一读就懂，页面也读得回来 ---------- */
const shown = (v, parts) => Review.relPath(v.notesAt, parts, Desk.abs);   // 知道完整位置就写 E:\ 开头的，否则写相对这份批注所在文件夹的
const marked = v => v.notes.some(n => n.box);
function mdText(v) {
  const L = [`# 图片批注｜${v.name}`, '', `图片：${shown(v, v.path)}`, `类别：${v.kind}`];
  if (v.prompt) L.push(`提示词：${shown(v, v.prompt)}`);
  if (marked(v)) L.push(`标注图：${shown(v, [...v.shotsDir, MARK])}`);
  L.push('', `用户在 ${Desk.PAGE} 里看这张图写的批注。原图 ${v.natW}×${v.natH}；「位置」按图的宽和高算百分比，从左上角量起，括号里是原图上的像素` +
    (marked(v) ? '；标注图上红框旁边的数字就是第几条，先看标注图再读批注。' : '。') + (Desk.abs ? '' : '路径都相对这份批注所在的文件夹。'), '');
  if (v.general.trim()) L.push('## 整体', '批注：' + mdEsc(v.general.trim()), '');
  v.notes.forEach((n, i) => {
    L.push(`## ${i + 1}｜${whereOf(n.box)}`, '位置：' + posText(n, v));
    if (n.cats.length) L.push('分类：' + n.cats.join('、'));
    L.push('批注：' + mdEsc(n.text), '');
  });
  return L.join('\n');
}
function parseMd(md) {
  const out = { general: '', notes: [] }, all = [];
  let cur = null;
  for (const line of String(md).replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const hd = /^##\s*(整体|\d+)\s*(?:[｜|]\s*(.*))?$/.exec(line);
    if (hd) { all.push(cur = { general: hd[1] === '整体', pos: '', cats: [], text: null }); continue; }
    if (!cur) continue;
    if (cur.text !== null) { cur.text += '\n' + line; continue; }   // 批注写在最后，可以有好几行
    let m;
    if ((m = /^批注：(.*)$/.exec(line))) cur.text = m[1];
    else if ((m = /^位置：(.*)$/.exec(line))) cur.pos = m[1];
    else if ((m = /^分类：(.*)$/.exec(line))) cur.cats = m[1].split(/[、，,\/／\s]+/).filter(Boolean);
  }
  for (const x of all) {
    const text = (x.text || '').trim();
    if (!text) continue;
    if (x.general) { out.general = text; continue; }
    const p = parsePos(x.pos);
    out.notes.push({ id: uid(), box: p.box, rawPos: p.raw || '', cats: x.cats, text });
  }
  return out;
}
const markSig = v => JSON.stringify([v.natW, v.natH, ...v.notes.map(n => n.box)]);
async function readMd(v) {
  try {
    const r = await FS.read(v.notesAt), p = parseMd(C.decodeText(r.buf).text);
    v.notes = p.notes; v.general = p.general; v.mdMtime = r.mtime;
  } catch (e) { v.notes = []; v.general = ''; v.mdMtime = 0; }
  v.markSig = await FS.stat([...v.shotsDir, MARK]) ? markSig(v) : '';   // 标注图在，就当它是照现在的框画的
}
/* 标注图：原图上画红框、标号，AI 一看就知道说的是哪里 */
async function markBlob(v) {
  const k = Math.min(1, 2400 / Math.max(v.natW, v.natH)), W = Math.round(v.natW * k), H = Math.round(v.natH * k);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.drawImage(v.img, 0, 0, W, H);
  const L = Math.max(W, H), lw = Math.max(3, Math.round(L / 360)), fs = Math.max(18, Math.round(L / 48));
  g.font = `600 ${fs}px "Microsoft YaHei", "PingFang SC", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const line = (draw, w, color) => { g.lineWidth = w; g.strokeStyle = color; g.beginPath(); draw(); g.stroke(); };
  v.notes.forEach((n, i) => {
    const b = n.box;
    if (!b) return;
    const x = b.x * W, y = b.y * H, w = b.w * W, hh = b.h * H, pt = !b.w && !b.h, r = fs * 0.75;
    const shape = pt ? () => { g.arc(x, y, r, 0, Math.PI * 2); g.moveTo(x - r * 1.6, y); g.lineTo(x - r * 0.5, y); g.moveTo(x + r * 0.5, y); g.lineTo(x + r * 1.6, y); } : () => g.rect(x, y, w, hh);
    line(shape, lw + 3, 'rgba(0, 0, 0, .55)'); line(shape, lw, '#ff3b30');
    const t = String(i + 1), tw = Math.max(fs * 1.2, g.measureText(t).width + fs * 0.6), th = fs * 1.35;
    let lx = pt ? x + r : x - lw / 2, ly = pt ? y - r - th : y - th - lw / 2;
    if (ly < 0) ly = pt ? y + r : y + lw;
    lx = Math.max(0, Math.min(W - tw, lx));
    g.fillStyle = '#d8452f'; g.fillRect(lx, ly, tw, th);
    g.fillStyle = '#fff'; g.fillText(t, lx + tw / 2, ly + th / 2 + 1);
  });
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('标注图没画出来')), 'image/jpeg', 0.9));
}
/* 写进文件；批注全删光就删掉文件。框变了才重画标注图。上一次还没写完的，排在后面接着写 */
function saveNow() {
  const v = S.v;
  if (!v) return Promise.resolve();
  clearTimeout(v.saveT); v.saveT = 0;
  v.q = v.q.then(async () => {
    try {
      if (v.notes.length || v.general.trim()) await FS.write(v.notesAt, TE.encode(mdText(v)));
      else if (await FS.stat(v.notesAt)) await FS.remove(v.notesAt);
      const sig = markSig(v);
      if (sig !== v.markSig) {
        if (marked(v)) await FS.write([...v.shotsDir, MARK], await markBlob(v));
        else {
          try { await FS.remove([...v.shotsDir, MARK]); } catch (e) { /* 本来就没有 */ }
          try { await FS.remove(v.shotsDir); } catch (e) { /* 还有别的文件，或者本来就没有 */ }
        }
        v.markSig = sig;
      }
      const st = await FS.stat(v.notesAt);
      v.mdMtime = st ? st.mtime : 0; v.err = '';
    } catch (e) { v.err = e.message; toast('批注没存上：' + e.message, 'err'); }
    if (S.v === v) { paintStatus(); syncNoted(); }
  });
  return v.q;
}
function saveLater() { const v = S.v; clearTimeout(v.saveT); v.saveT = setTimeout(saveNow, 500); }
function syncNoted() {
  const v = S.v, on = !!(v.notes.length || v.general.trim());
  for (const it of S.items) if (pathEq(it.path, v.path)) it.noted = on;
  if (V) paintStrip();
}
/* 资产图对应的资产提示词：提示词 下面同样的位置，图名_提示词.txt */
async function promptOf(path) {
  const i = path.lastIndexOf('资产');
  if (i < 0) return null;
  const p = [...path.slice(0, i), '提示词', ...path.slice(i + 1, -1), stem(path[path.length - 1]) + '_提示词.txt'];
  return (await FS.stat(p)) ? p : null;
}

/* ---------- 进来、出去：流水线点开一张图、一个图片文件夹 ---------- */
async function enter(m, opts) {
  const first = !S.ready;
  S.ready = true;
  if (opts.open) {   // 文件夹就摆开；图打不开就摆开它所在的文件夹，别留一片空白
    if (!IMG_RE.test(opts.open[opts.open.length - 1])) { await showGrid(opts.open); return; }
    await openAt(opts.open);
    if (!S.v || !pathEq(S.v.path, opts.open)) await showGrid(opts.open.slice(0, -1));
    return;
  }
  if (first) {   // 头一回进来：接着看上次那张；没有就摆开上次的文件夹，再没有就是上次那个项目的 资产
    const rn = Desk.rootName, split = s => s ? s.split('/').filter(Boolean) : null;
    const last = split(localStorage.getItem('antou:img:last:' + rn)), dir = split(localStorage.getItem('antou:img:dir:' + rn));
    if (last && IMG_RE.test(last[last.length - 1]) && await FS.stat(last)) {
      if (dir && Desk.under(last, dir)) { S.dir = dir; S.items = await scanImages(dir); S.subdirs = []; S.listAt = Date.now(); }
      await openAt(last);
      if (!S.v) await showGrid(S.dir || last.slice(0, -1));
      return;
    }
    if (dir && await FS.isDir(dir)) { await showGrid(dir); return; }
    const pj = localStorage.getItem('antou:last:' + rn), a = pj ? ['项目', pj, '资产'] : null;
    await showGrid(a && await FS.isDir(a) ? a : []);
    return;
  }
  if (S.view === 'viewer' && S.v && V) { render(); recheck(); return; }
  await showGrid(S.dir || []);
}
async function leave() {
  if (!(await leaveForm())) return false;
  if (S.v && S.v.saveT) saveNow();
  return true;
}
function reset() {
  S.tok++; S.gtok++;
  closeImage();
  dropThumbs();
  for (const p of FULL.values()) p.then(URL.revokeObjectURL).catch(() => {});
  FULL.clear();
  Object.assign(S, { ready: false, view: 'grid', dir: null, items: [], subdirs: [], loading: false, listAt: 0, filter: '全部', list: [], i: -1 });
}
/* 打开一张图（路径从总文件夹算起）：上一张、下一张在它所在的文件夹里走 */
async function openAt(path) {
  const dir = path.slice(0, -1);
  if (!S.dir || !Desk.under(path, S.dir) || !S.items.some(it => pathEq(it.path, path))) {
    S.gtok++; S.loading = false;
    S.dir = dir; S.items = await scanImages(dir); S.subdirs = []; S.listAt = Date.now();
  }
  let it = S.items.find(x => pathEq(x.path, path));
  if (!it) { it = { path, name: path[path.length - 1], sub: '', kind: kindOf(path), noted: false }; S.items.push(it); }   // 没扫到（比如在历史记录里）也照样打开
  if (S.filter !== '全部' && it.kind !== S.filter) S.filter = '全部';
  S.list = filtered();
  await openImage(path);
}
/* 打开一个文件夹：把里面的图摆开 */
async function showGrid(parts) {
  if (S.view === 'viewer' && !(await leaveForm())) return;
  if (S.v && S.v.saveT) saveNow();
  const tok = ++S.gtok;
  S.dir = parts; S.view = 'grid'; S.loading = true;
  render();
  let items = [], subdirs = [];
  try {
    const ents = await FS.list(parts);
    subdirs = ents.filter(e => e.kind === 'directory' && !Desk.hiddenName(e.name) && !e.name.endsWith(SHOTS_TAIL)).map(e => e.name).sort((a, b) => a.localeCompare(b, 'zh', { numeric: true }));
    if (!atTop(parts)) items = await scanImages(parts);
  } catch (e) { toast('读不了这个文件夹：' + e.message, 'err'); }
  if (tok !== S.gtok) return;
  S.items = items; S.subdirs = subdirs; S.loading = false; S.listAt = Date.now();
  S.list = filtered();
  try { localStorage.setItem('antou:img:dir:' + Desk.rootName, parts.join('/')); } catch (e) { /* 记不下就算了 */ }
  render();
}
function setFilter(f) {
  S.filter = f; S.list = filtered();
  render();
}

/* ---------- 打开一张图 ---------- */
function closeImage() {
  const v = S.v;
  if (v) clearTimeout(v.saveT);
  if (V && V.ro) V.ro.disconnect();
  V = null; S.v = null; S.form = null; S.sel = null;
}
async function openImage(path, opts = {}) {
  if (S.v && pathEq(S.v.path, path) && !opts.reload) { if (S.view !== 'viewer') { S.view = 'viewer'; render(); } return; }
  if (!opts.reload && !(await leaveForm())) return;
  if (S.v && S.v.saveT) saveNow();
  const tok = ++S.tok;
  let url, st;
  try { [url, st] = await Promise.all([fullUrl(path), FS.stat(path)]); }
  catch (e) { toast('打不开这张图：' + e.message, 'err'); return; }
  const img = h('img', { alt: '', draggable: 'false' });
  // 等它读完就行，不用 decode()：窗口没在画的时候 decode() 一直不回话
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('读不出')); img.src = url; }); }
  catch (e) { dropFull(path); if (tok === S.tok) toast('这张图显示不出来：' + path[path.length - 1], 'err'); return; }
  const dir = path.slice(0, -1), name = path[path.length - 1], base = stem(name);
  const v = {
    path, name, dir, kind: kindOf(path), notesAt: [...dir, base + NOTES_TAIL], shotsDir: [...dir, base + SHOTS_TAIL],
    natW: img.naturalWidth, natH: img.naturalHeight, img, mtime: st ? st.mtime : 0,
    notes: [], general: '', mdMtime: 0, markSig: '', prompt: null, q: Promise.resolve(), saveT: 0, err: '',
  };
  await readMd(v);
  v.prompt = await promptOf(path);
  if (tok !== S.tok) return;
  const keep = opts.reload && S.v && pathEq(S.v.path, path) ? { form: S.form, sel: S.sel } : null;
  closeImage();
  S.v = v; S.view = 'viewer';
  if (keep) { S.form = keep.form; S.sel = keep.sel; }
  S.i = S.list.findIndex(it => pathEq(it.path, path));
  try {
    localStorage.setItem('antou:img:last:' + Desk.rootName, path.join('/'));
    if (S.dir) localStorage.setItem('antou:img:dir:' + Desk.rootName, S.dir.join('/'));
  } catch (e) { /* 记不下就算了 */ }
  V = buildViewer(v);
  render();
  for (const d of [1, -1]) { const it = S.list[S.i + d]; if (it) fullUrl(it.path).catch(() => {}); }   // 前后两张先读着
}
async function go(d) {
  if (!S.v) return;
  const j = S.i + d;
  if (S.i < 0 || j < 0 || j >= S.list.length) { toast(d > 0 ? '已经是最后一张了' : '已经是第一张了'); return; }
  await openImage(S.list[j].path);
}

/* ---------- 看图：图、框、底下一排小图 ---------- */
function ctlBtn(name, title, fn, text) { return h('button', { class: 'ctl' + (text ? ' txt' : ''), title, onclick: fn }, name ? icon(name) : null, text || null); }
function buildViewer(v) {
  const x = {};
  x.ov = h('div', { class: 'iv-ov', title: '拖一个框，或点一下，写这一处的批注' });
  x.wrap = h('div', { class: 'iv-wrap' }, v.img, x.ov);
  x.screen = h('div', { class: 'iv-screen' + (S.zoom ? ' zoom' : '') }, x.wrap);
  x.pos = h('span', { class: 'iv-pos' });
  x.zoomBtn = ctlBtn('zoom', '原大／适应窗口（Z）', toggleZoom, S.zoom ? '适应窗口' : '原大');
  x.strip = h('div', { class: 'strip' });
  x.col = h('section', { class: 'deck' }, x.screen,
    h('div', { class: 'bar' },
      ctlBtn('prev', '上一张（←）', () => go(-1)), x.pos, ctlBtn('next', '下一张（→）', () => go(1)),
      x.zoomBtn, h('span', { class: 'sp' }),
      h('button', { class: 'btn zhu addbtn', title: '对整张图写一条（回车）；要说某一处，直接在图上拖一个框', onclick: () => openForm(null, null) }, icon('plus'), '写批注')),
    x.strip,
    h('div', { class: 'keys' }, '在图上拖一个框，或点一下，写这一处的批注　　← → 上一张、下一张　　回车 对整张写一条　　Z 原大'));
  x.ro = new ResizeObserver(() => fit());
  x.ro.observe(x.screen);
  // 在图上画框：拖出一个框，没怎么拖就算点了一下
  x.ov.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.bx-no')) return;
    e.preventDefault();
    x.ov.setPointerCapture(e.pointerId);
    const r = x.ov.getBoundingClientRect();
    const at = ev => ({ x: clamp01((ev.clientX - r.left) / r.width), y: clamp01((ev.clientY - r.top) / r.height) });
    const a = at(e);
    let b = a;
    const rect = () => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) });
    const ghost = h('div', { class: 'bx ghost' });
    const move = ev => { b = at(ev); placeBox(ghost, rect()); if (!ghost.isConnected) x.ov.append(ghost); };
    const up = () => {
      x.ov.removeEventListener('pointermove', move); x.ov.removeEventListener('pointerup', up); x.ov.removeEventListener('pointercancel', up);
      ghost.remove();
      const q = rect();
      drawn(q.w < MIN_BOX && q.h < MIN_BOX ? { x: a.x, y: a.y, w: 0, h: 0 } : q);
    };
    x.ov.addEventListener('pointermove', move); x.ov.addEventListener('pointerup', up); x.ov.addEventListener('pointercancel', up);
  });
  return x;
}
function fit() {
  const v = S.v, x = V;
  if (!x || !v || !x.screen.isConnected) return;
  const cs = getComputedStyle(x.screen);
  const aw = x.screen.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = x.screen.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const k = S.zoom ? 1 : Math.max(0.01, Math.min(aw / v.natW, ah / v.natH));
  x.wrap.style.width = Math.max(1, Math.round(v.natW * k)) + 'px';
  x.wrap.style.height = Math.max(1, Math.round(v.natH * k)) + 'px';
}
function toggleZoom() {
  S.zoom = !S.zoom;
  if (!V) return;
  V.screen.classList.toggle('zoom', S.zoom);
  fit(); paintBar();
}
function placeBox(el, b) {
  el.style.left = b.x * 100 + '%'; el.style.top = b.y * 100 + '%';
  if (b.w || b.h) { el.style.width = b.w * 100 + '%'; el.style.height = b.h * 100 + '%'; }
}
function boxEl(b, label, cls, onPick) {
  const el = h('div', { class: 'bx' + (!b.w && !b.h ? ' pt' : '') + (b.y < 0.06 ? ' low' : '') + (cls ? ' ' + cls : '') },
    label ? h('button', { class: 'bx-no', type: 'button', title: onPick ? '改这一条' : null, onclick: onPick || null }, label) : null);
  placeBox(el, b);
  return el;
}
function paintBoxes() {
  const v = S.v, x = V;
  if (!x || !v) return;
  const fm = S.form, els = [];
  v.notes.forEach((n, i) => {
    const editing = fm && fm.id === n.id, b = editing ? fm.box : n.box;
    if (b) els.push(boxEl(b, String(i + 1), editing ? 'editing' : S.sel === n.id ? 'on' : '', e => { e.stopPropagation(); openForm(n); }));
  });
  if (fm && !fm.id && fm.box) els.push(boxEl(fm.box, '新', 'editing'));
  x.ov.replaceChildren(...els);
}
function paintBar() {
  if (!V) return;
  const n = S.list.length;
  V.pos.textContent = (S.filter !== '全部' ? S.filter + ' ' : '') + (S.i >= 0 ? `${S.i + 1} / ${n}` : `— / ${n}`);
  V.zoomBtn.replaceChildren(icon('zoom'), S.zoom ? '适应窗口' : '原大');
}
function paintStrip() {
  const x = V;
  if (!x) return;
  x.strip.hidden = S.list.length < 2;
  x.strip.replaceChildren(...S.list.map((it, j) => h('button', { class: 'st' + (j === S.i ? ' on' : ''), type: 'button', title: it.name, onclick: () => j !== S.i && openImage(it.path) },
    thumbEl(it.path), it.noted ? h('i', { class: 'st-dot' }) : null)));
  const on = x.strip.children[S.i];
  if (on) requestAnimationFrame(() => on.scrollIntoView({ block: 'nearest', inline: 'center' }));
}
/* 小图：框里那一块；点就以它为中心取一块；整张就是整张 */
function cropCanvas(b, w, hh) {
  const v = S.v, c = h('canvas');
  c.width = w * 2; c.height = hh * 2;
  if (!v) return c;
  const g = c.getContext('2d'), W = v.natW, H = v.natH;
  let sx = 0, sy = 0, sw = W, sh = H;
  if (b && (b.w || b.h)) { sx = b.x * W; sy = b.y * H; sw = Math.max(2, b.w * W); sh = Math.max(2, b.h * H); }
  else if (b) { const s = Math.min(W, H) * 0.25; sx = Math.max(0, Math.min(W - s, b.x * W - s / 2)); sy = Math.max(0, Math.min(H - s, b.y * H - s / 2)); sw = sh = s; }
  const k = Math.min(c.width / sw, c.height / sh), dw = sw * k, dh = sh * k;
  g.fillStyle = '#191714'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(v.img, sx, sy, sw, sh, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  if (b && !b.w && !b.h) {   // 点：在中间画个圈
    const cx = (c.width - dw) / 2 + (b.x * W - sx) * k, cy = (c.height - dh) / 2 + (b.y * H - sy) * k;
    g.lineWidth = 3; g.strokeStyle = '#ff3b30'; g.beginPath(); g.arc(cx, cy, 9, 0, Math.PI * 2); g.stroke();
  }
  return c;
}

/* ---------- 写批注 ---------- */
function drawn(b) {
  const fm = S.form;
  if (fm) { fm.box = b; fm.changed = true; paintForm(); paintBoxes(); focusTa(); return; }
  openForm(null, b);
}
function focusTa() { const ta = $('.fta'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
async function openForm(n, box) {
  if (!S.v || !(await leaveForm())) return;
  if (n) { S.form = { id: n.id, box: n.box, rawPos: n.rawPos, cats: new Set(n.cats), text: n.text, changed: false }; S.sel = n.id; }
  else S.form = { id: null, box: box || null, rawPos: '', cats: new Set(), text: '', changed: !!box };
  paintRail(); paintBoxes();
  const body = $('#rail-body'); if (body) body.scrollTop = 0;
  focusTa();
}
async function saveForm() {
  const fm = S.form, v = S.v;
  if (!fm || fm.busy || !v) return;
  const text = fm.text.trim();
  if (!text) { toast('先写几个字再存'); focusTa(); return; }
  fm.busy = true;
  const old = fm.id ? v.notes.find(n => n.id === fm.id) : null;
  const note = { id: fm.id || uid(), box: fm.box, rawPos: fm.box ? '' : fm.rawPos || '', cats: [...CATS.filter(c => fm.cats.has(c)), ...[...fm.cats].filter(c => !CATS.includes(c))], text };
  v.notes = old ? v.notes.map(n => n === old ? note : n) : [...v.notes, note];
  S.form = null; S.sel = note.id;
  await saveNow();
  paintRail(); paintBoxes();
  toast(old ? '改好了' : `记下了：第 ${v.notes.indexOf(note) + 1} 条`);
}
/* 写了一半要走：问一句 */
async function leaveForm() {
  if (!S.form) return true;
  if (!(await Desk.formLeave(S.form))) return false;
  S.form = null;
  paintRail(); paintBoxes();
  return true;
}
async function delNote(n) {
  const v = S.v;
  const ok = await confirmDlg({ title: '删掉这条批注？', body: `第 ${v.notes.indexOf(n) + 1} 条　${n.text.length > 60 ? n.text.slice(0, 60) + '…' : n.text}`, ok: '删掉', danger: true });
  if (!ok || S.v !== v || !v.notes.includes(n)) return;
  v.notes = v.notes.filter(x => x !== n);
  if (S.form && S.form.id === n.id) S.form = null;
  if (S.sel === n.id) S.sel = null;
  await saveNow();
  paintRail(); paintBoxes();
  toast('删掉了');
}
function pick(n) {
  S.sel = S.sel === n.id ? null : n.id;
  paintRail(); paintBoxes();
  const el = S.sel && V && V.ov.querySelector('.bx.on');
  if (el && S.zoom) el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}
async function copyForAI() {
  const v = S.v;
  await v.q;
  const path = Desk.abs ? shown(v, v.notesAt) : [Desk.rootName, ...v.notesAt].join('/');
  Desk.copyText('按图片批注修改 ' + path, '复制好了，贴给 Claude 或 Codex');
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  if (!Desk.is('image')) return;   // 正在别的功能里：回来再画
  const main = $('#main');
  if (S.view === 'viewer' && S.v && V) {
    main.replaceChildren(renderTop(), h('div', { class: 'stage' }, V.col, renderRail()));
    fit(); paintBoxes(); paintBar(); paintStrip(); paintStatus();
  } else main.replaceChildren(renderGridTop(), renderGrid());
}
function renderGridTop() {
  return h('header', { class: 'top' },
    h('div', { class: 'crumb' }, h('span', { class: 'ptitle' }, placeName(S.dir)), h('span', { class: 'crumb-seg' }, '图片')),
    h('div', { class: 'top-right' }, S.loading ? null : h('div', { class: 'status' }, S.items.length ? `${S.items.length} 张` : '')));
}
function renderGrid() {
  const wrap = h('div', { class: 'ig-wrap' });
  if (S.loading) { wrap.append(h('div', { class: 'ig-empty' }, '正在读取「' + placeName(S.dir) + '」……')); return wrap; }
  const dirCards = () => h('div', { class: 'ig' }, S.subdirs.map(name => h('button', { class: 'card-i dirc', type: 'button', title: [...S.dir, name].join(' / '), onclick: () => showGrid([...S.dir, name]) },
    h('div', { class: 'ci-img' }, icon('folder')), h('div', { class: 'ci-b' }, h('div', { class: 'ci-name' }, name), h('div', { class: 'ci-meta' }, '文件夹')))));
  if (!S.items.length) {
    if (S.subdirs.length) wrap.append(h('div', { class: 'ig-h' }, atTop(S.dir) ? '选一个文件夹' : '这一层没有图，往下看'), dirCards());
    else wrap.append(h('div', { class: 'ig-empty' }, '这里没有图', h('br'), h('small', null, '出好的图放进这个文件夹，就会出现在这里')));
    return wrap;
  }
  const count = k => S.items.filter(it => it.kind === k).length;
  wrap.append(h('div', { class: 'ig-bar' },
    [['全部', S.items.length], ...KINDS.map(k => [k, count(k)]).filter(([, n]) => n)].map(([k, n]) =>
      h('button', { class: 'fl' + (S.filter === k ? ' on' : ''), type: 'button', onclick: () => setFilter(k) }, k, h('em', null, n))),
    h('span', { class: 'sp' }), h('span', { class: 'ci-meta' }, '点一张开始批；看图时 ← → 翻上一张、下一张')));
  const list = filtered();
  if (!list.length) { wrap.append(h('div', { class: 'ig-empty' }, '这里没有' + S.filter + '的图')); return wrap; }
  const subs = [...new Set(list.map(it => it.sub))];
  for (const sub of subs) {
    if (subs.length > 1 || sub) wrap.append(h('div', { class: 'ig-h' }, sub || placeName(S.dir)));
    wrap.append(h('div', { class: 'ig' }, list.filter(it => it.sub === sub).map(imageCard)));
  }
  return wrap;
}
function imageCard(it) {
  return h('button', { class: 'card-i', type: 'button', title: it.path.join(' / '), onclick: () => { S.list = filtered(); openImage(it.path); } },
    h('div', { class: 'ci-img' }, thumbEl(it.path)),
    h('div', { class: 'ci-b' }, h('div', { class: 'ci-name' }, stem(it.name)),
      h('div', { class: 'ci-meta' }, h('span', { class: 'ftag ' + KIND_CLS[it.kind] }, it.kind), it.noted ? h('span', { class: 'noted' }, '有批注') : null)));
}
function renderTop() {
  const v = S.v, back = S.dir || v.dir, it = S.list[S.i];
  return h('header', { class: 'top' },
    h('div', { class: 'crumb' }, h('button', { class: 'ptitle', title: '回到「' + placeName(back) + '」的图', onclick: () => showGrid(back) }, placeName(back)),
      it && it.sub ? h('span', { class: 'crumb-seg' }, it.sub) : null,
      h('span', { class: 'crumb-seg', title: v.name }, stem(v.name))),
    h('div', { class: 'top-right' },
      h('span', { class: 'ftag ' + KIND_CLS[v.kind], title: '按文件名和所在文件夹认的' }, v.kind),
      h('div', { class: 'status', id: 'status' }),
      h('button', { class: 'btn ink', id: 'ai-btn', onclick: copyForAI, title: '复制一句话，贴给 Claude 或 Codex，它照批注改' }, icon('copy'), '交给 AI')));
}
function paintStatus() { const v = S.v; if (v && S.view === 'viewer') Desk.noteStatus(v, shown(v, v.notesAt), '整张'); }
function paintRail() {
  const old = $('#rail');
  if (!old || !S.v || !Desk.is('image')) return;
  const sc = ($('#rail-body') || {}).scrollTop || 0;
  const focused = document.activeElement && document.activeElement.classList.contains('fta');
  old.replaceWith(renderRail());
  const body = $('#rail-body'); if (body) body.scrollTop = sc;
  if (focused) focusTa();
  paintStatus();
}
function paintForm() {
  const old = $('.form');
  if (!old || !S.form) { paintRail(); return; }
  const ta = old.querySelector('.fta'), focused = document.activeElement === ta, s = ta.selectionStart, e = ta.selectionEnd;
  old.replaceWith(renderForm());
  if (focused) { const t = $('.fta'); t.focus(); t.setSelectionRange(s, e); }
}
function renderRail() {
  const v = S.v;
  const head = h('div', { class: 'rail-h' });
  if (v.prompt) head.append(h('div', { class: 'prow', title: v.prompt.join(' / ') }, h('span', null, '资产提示词'), h('span', { class: 'pv' }, v.prompt[v.prompt.length - 1])));
  const gen = h('textarea', {
    class: 'gen', rows: 1, placeholder: '整张图的意见（可不写）', value: v.general,
    oninput: e => { v.general = e.target.value; grow(e.target); saveLater(); },
    onblur: () => { if (v.saveT) saveNow(); },
    onkeydown: e => { if (e.key === 'Escape') e.target.blur(); },
  });
  head.append(gen);
  requestAnimationFrame(() => grow(gen));
  const body = h('div', { class: 'rail-body', id: 'rail-body' });
  if (S.form) body.append(renderForm());
  body.append(h('div', { class: 'list-h' }, v.notes.length ? `批注 ${v.notes.length} 条` : '还没有批注'));
  if (!v.notes.length && !S.form) body.append(h('p', { class: 'list-empty' }, '哪里不对，就在图上拖一个框把它圈出来（点一下是标一个点），写一句就行。对整张图的意见写在上面，或者按回车写一条。'));
  v.notes.forEach((n, i) => body.append(renderItem(n, i)));
  return h('aside', { class: 'rail', id: 'rail' }, head, body);
}
function renderForm() {
  const fm = S.form, v = S.v;
  const no = fm.id ? v.notes.findIndex(n => n.id === fm.id) + 1 : 0;
  const chips = h('div', { class: 'chips' }, CATS.map(c => h('button', {
    class: 'chip' + (fm.cats.has(c) ? ' on' : ''), type: 'button',
    onclick: e => { fm.cats.has(c) ? fm.cats.delete(c) : fm.cats.add(c); e.currentTarget.classList.toggle('on', fm.cats.has(c)); fm.changed = true; },
  }, c)));
  const ta = h('textarea', {
    class: 'fta', placeholder: '哪里不对，想要什么样', value: fm.text,
    oninput: e => { fm.text = e.target.value; fm.changed = true; grow(e.target); },
  });
  requestAnimationFrame(() => grow(ta));
  return h('div', { class: 'form' },
    h('div', { class: 'form-h' }, no ? `改第 ${no} 条` : '新批注'),
    h('div', { class: 'frow' }, h('span', { class: 'flab' }, '位置'),
      h('div', { class: 'fregion' }, cropCanvas(fm.box, 96, 60)),
      h('span', { class: 'fpos' }, fm.box ? whereOf(fm.box) : fm.rawPos ? '照原来写的' : '整张图'),
      h('span', { class: 'fgo' }, fm.box ? h('button', { class: 'btn ghost sm', type: 'button', title: '不框了，说的是整张图', onclick: () => { fm.box = null; fm.changed = true; paintForm(); paintBoxes(); } }, '不框') : null),
      h('span', { class: 'fhint' }, fm.box ? '在图上重新拖一个框，就换成新框' : '在图上拖一个框标出说的是哪里；点一下是标一个点')),
    h('div', { class: 'frow' }, h('span', { class: 'flab' }, '分类'), chips),
    ta,
    h('div', { class: 'form-f' },
      fm.id ? h('button', { class: 'btn ghost sm danger', type: 'button', onclick: () => { const n = v.notes.find(x => x.id === fm.id); if (n) delNote(n); } }, '删掉') : null,
      h('span', { class: 'sp' }),
      h('em', null, 'Ctrl + 回车 存'),
      h('button', { class: 'btn ghost sm', type: 'button', onclick: () => leaveForm() }, '取消'),
      h('button', { class: 'btn ink sm', type: 'button', onclick: saveForm }, '存好')));
}
function renderItem(n, i) {
  const editing = S.form && S.form.id === n.id;
  return h('div', { class: 'ni' + (S.sel === n.id ? ' on' : '') + (editing ? ' editing' : ''), title: '点一下，在图上标出来', onclick: () => pick(n) },
    h('div', { class: 'ni-img' }, cropCanvas(n.box, 112, 63)),
    h('div', { class: 'ni-main' },
      h('div', { class: 'ni-h' },
        h('span', { class: 'ni-no' }, i + 1),
        h('span', { class: 'ni-t', title: posText(n, S.v) }, n.box ? whereOf(n.box) : n.rawPos ? '照原来写的' : '整张'),
        h('span', { class: 'ni-acts' },
          h('button', { class: 'mini', type: 'button', title: '改这条', onclick: e => { e.stopPropagation(); openForm(n); } }, '改'),
          h('button', { class: 'mini del', type: 'button', title: '删掉这条', onclick: e => { e.stopPropagation(); delNote(n); } }, '删'))),
      n.cats.length ? h('div', { class: 'ni-tags' }, n.cats.map(c => h('span', { class: 'tag c' + CATS.indexOf(c) }, c))) : null,
      h('div', { class: 'ni-text' }, n.text)));
}

/* ---------- 键盘、窗口 ---------- */
document.addEventListener('keydown', e => {
  if (!Desk.is('image') || isComposing(e) || $('.mask')) return;
  const tag = document.activeElement && document.activeElement.tagName;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  if (S.form && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveForm(); return; }
  if (S.form && e.key === 'Escape') { e.preventDefault(); leaveForm(); return; }
  if (typing || S.view !== 'viewer' || !S.v || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'PageUp' || e.key === 'PageDown') { e.preventDefault(); go(e.key === 'ArrowLeft' || e.key === 'PageUp' ? -1 : 1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.form) focusTa(); else openForm(null, null); }
  else if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); toggleZoom(); }
});
window.addEventListener('beforeunload', e => {
  const v = S.v;
  if (v && v.saveT) saveNow();
  if (S.form && S.form.changed && S.form.text.trim()) { e.preventDefault(); e.returnValue = ''; }
});
/* 切回来时看一眼（右边窗格里每两秒看一眼）：AI 改了图、改了或移走了批注，就重新读；摆开的文件夹多了新图，跟着变 */
let CHECKING = false;
async function recheck() {
  if (CHECKING || !Desk.is('image') || $('.mask')) return;
  CHECKING = true;
  try {
    const v = S.v;
    if (v && !S.form && S.view === 'viewer') {
      await v.q;
      const [st, ns] = await Promise.all([FS.stat(v.path), FS.stat(v.notesAt)]);
      if (S.v !== v || S.form) return;
      if (st && st.mtime !== v.mtime) {   // 图换过了：重读，批注照留
        dropFull(v.path); dropThumbs(v.path);
        await openImage(v.path, { reload: true });
        toast('这张图换过了，已重新读取');
      } else if ((ns ? ns.mtime : 0) !== v.mdMtime) {
        await readMd(v);
        S.sel = null;
        paintRail(); paintBoxes(); syncNoted();
        toast(ns ? '批注在外面改过，已重新读取' : '批注文件被移走了');
      }
    }
    if (S.view === 'grid' && !S.loading && S.dir && Date.now() - S.listAt > 8000) {
      const tok = S.gtok, dir = S.dir, items = atTop(dir) ? [] : await scanImages(dir);
      const sig = list => list.map(it => it.path.join('/') + (it.noted ? '*' : '')).join('|');
      if (tok === S.gtok && S.view === 'grid' && pathEq(S.dir, dir)) {
        S.listAt = Date.now();
        if (sig(items) !== sig(S.items)) { S.items = items; S.list = filtered(); render(); }
      }
    }
  } catch (e) { /* 下次再看 */ }
  finally { CHECKING = false; }
}

Desk.MOD.image = { enter, leave, reset, recheck };
})();
</script>
<script>
/* 四样看法都登记好了：启动 */
window.Desk.boot();
</script>
