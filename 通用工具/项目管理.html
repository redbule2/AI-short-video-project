function issue(level, msg, loc) { return { level, msg, loc: loc || null }; }

function lintPrompt(doc, fileName) {
  const out = [];
  if (!doc.sections.length) {
    doc.pre.forEach(b => { if (/〔[^〕]*〕/.test(b.text)) out.push(issue('warn', '还有没填的〔 〕：' + b.text.slice(0, 18) + (b.text.length > 18 ? '…' : ''), { sec: 'pre', block: b.id })); });
    if (/视频提示词/.test(fileName || '') || segFromName(fileName || '')) out.push(issue('info', '没有认出分区；这份提示词按自由格式编辑（延长、编辑类提示词本来就不分区）。'));
    return out;
  }
  // 现行骨架和七分区旧稿各查各的：共用的几条在前，分开的看 merged
  const merged = doc.fmt === 'merged', table = promptTable(doc);
  const keys = doc.sections.map(s => s.key);
  for (const s of table) if (!keys.includes(s.key) && !s.optional) out.push(issue(merged && s.key === 'keep' ? 'info' : 'warn', '缺少分区：' + s.name, { sec: s.key, missing: true }));
  const idx = keys.map(k => table.findIndex(s => s.key === k));
  if (idx.some((v, i) => i && v < idx[i - 1])) out.push(issue('warn', '分区顺序和固定格式不一致（' + table.map(s => s.name).join(' → ') + '）。'));
  const each = (fn) => doc.sections.forEach(s => {
    s.blocks.forEach(b => fn(b, s, null));
    if (s.shots) s.shots.forEach(sh => sh.blocks.forEach(b => fn(b, s, sh)));
  });
  let ph = 0;
  each((b, s, sh) => {
    const t = b.text;
    if (!t.trim()) return;
    const loc = { sec: s.key, shot: sh && sh.id, block: b.id };
    if (/〔[^〕]*〕/.test(t)) { ph++; if (ph <= 6) out.push(issue('warn', '还有没填的〔 〕：' + t.slice(0, 18) + (t.length > 18 ? '…' : ''), loc)); }
    if (/[（）()“”"‘’「」『』]/.test(t)) out.push(issue('warn', '提示词里不用括号和引号', loc));
    const br = t.match(/【[^】]*】/g);
    if (br && br.some(x => x !== '【未采用素材】')) out.push(issue('warn', '【】只用在「【未采用素材】」这一处', loc));
    if (/[0-9０-９]+(?:\.[0-9]+)?\s*秒|[0-9]{1,2}:[0-9]{2}(?![0-9])/.test(t) && !/16:9|9:16/.test(t)) out.push(issue('info', '提示词里不写时间码和秒数（时长在生成参数里设）', loc));
    if (/横屏|竖屏|16\s*[:：]\s*9|9\s*[:：]\s*16|720p|1080p|分辨率|画幅/i.test(t)) out.push(issue('warn', '画幅、分辨率这类生成参数不写进提示词', loc));
    if (merged) {   // 镜头里只有「照@图片N」「对应@图片N」这类引用能带编号
      if (sh && /@(图片|视频|音频)\s*[0-9]+/.test(t.replace(/(?:照|对应|参考)\s*@(?:图片|视频|音频)\s*[0-9]+/g, ''))) out.push(issue('info', '镜头里人和道具用称谓；@编号只在「站位照@图片N」这类地方写', loc));
    } else {
      const refAllowed = s.key === 'cast' || s.key === 'keep' || (sh && /^本镜调用[：:]/.test(t));
      if (/@(图片|视频|音频)\s*[0-9]+/.test(t) && !refAllowed) out.push(issue('info', '@编号只写在人物与参考图对应、本镜调用、保持一致三处', loc));
    }
    const bad = t.match(/语速快|停一拍|拖一拍|没出声|没催|店里很安静|表演克制|寂静/g);
    if (bad) out.push(issue('warn', '避开「' + [...new Set(bad)].join('、') + '」这类写法', loc));
    if (!merged && sh && /^环境音[：:]/.test(t) && /安静/.test(t)) out.push(issue('warn', '环境音里写声源，不写「安静」', loc));
    if (!merged && sh && /^台词[：:]/.test(t) && !/^台词[：:]\s*无\s*$/.test(t) && !/\{[^}]*\}/.test(t)) out.push(issue('warn', '台词原文要放在 {} 里', loc));
    if (sh && /(?<!其)[她他](?!们)/.test(t.replace(/吉他/g, ''))) out.push(issue('info', '分镜里用称谓指人，不用她、他', loc));
  });
  if (ph > 6) out.push(issue('warn', '另外还有 ' + (ph - 6) + ' 处没填的〔 〕'));
  const rows = k => doc.sections.filter(s => s.key === k).flatMap(s => s.blocks).filter(b => b.text.trim());
  let places = [];   // 本段写了几处分场景：各自的叫法
  if (merged) {
    const sceneRows = [...rows('basic'), ...rows('seg')].filter(b => /^(总场景[：:]|分场景[｜|])/.test(b.text.trim()));
    places = sceneRows.map(b => /^分场景[｜|]\s*([^：:]+?)\s*[：:]/.exec(b.text.trim())).filter(Boolean).map(m => m[1]);
    // 素材里的场景图，要在分场景那一行引用
    rows('refs').forEach(b => {
      const m = /^@图片\s*([0-9]+)\s*是.*样子/.exec(b.text.trim());
      if (m && !sceneRows.some(r => new RegExp('@图片\\s*' + m[1] + '(?![0-9])').test(r.text))) out.push(issue('info', `@图片${m[1]} 是场景图，要在分场景那一行开头引用`, { sec: 'refs', block: b.id }));
    });
  }
  const shotsSec = doc.sections.find(s => s.key === 'shots');
  if (shotsSec) {
    if (!shotsSec.shots.length) out.push(issue('warn', '分镜里还没有镜头', { sec: 'shots' }));
    shotsSec.shots.forEach((sh, k) => {
      const has = l => sh.blocks.some(b => new RegExp('^' + l + '[：:]').test(b.text));
      const loc = { sec: 'shots', shot: sh.id };
      if (merged) {   // 一镜一段话：不查七分区的那几栏
        const body = sh.blocks.filter(b => b.text.trim());
        if (!body.length) out.push(issue('warn', `镜头${k + 1} 还没写`, loc));
        else if (places.length > 1 && !places.some(n => body[0].text.split('。')[0].includes(n))) out.push(issue('info', `镜头${k + 1} 开头要写在哪个分场景`, loc));
        return;
      }
      if (!has('本镜调用')) out.push(issue('warn', `镜头${k + 1} 缺「本镜调用」`, loc));
      if (!has('环境音')) out.push(issue('warn', `镜头${k + 1} 缺「环境音」`, loc));
      if (!has('切点')) out.push(issue('info', `镜头${k + 1} 缺「切点」`, loc));
    });
  }
  return out;
}

function lintScript(doc) {
  const out = [];
  const [H, B] = doc.sections.map(s => s.blocks);
  const get = l => H.find(b => labelOf(b.text) === l);
  const scene = get('场景'), cast = get('人物');
  if (!scene || !splitLabel(scene.text).value.trim()) out.push(issue('warn', '段头缺「场景：时间｜内/外｜地点」', scene ? { sec: 'head', block: scene.id } : { sec: 'head' }));
  else if (splitLabel(scene.text).value.split('｜').length < 3) out.push(issue('info', '场景按「时间｜内/外｜地点」三项写', { sec: 'head', block: scene.id }));
  if (!cast || !splitLabel(cast.text).value.trim()) out.push(issue('warn', '段头缺「人物」', cast ? { sec: 'head', block: cast.id } : { sec: 'head' }));
  const dur = get('时长');
  if (dur) out.push(issue('warn', '固定格式不写时长，这一行删掉', { sec: 'head', block: dur.id }));
  if (!B.some(b => b.text.replace(/^[△▲]\s*/, '').trim())) out.push(issue('warn', '正文还是空的', { sec: 'body' }));
  const names = cast ? parseCast(splitLabel(cast.text).value).map(c => c.name) : [];
  for (const b of B) {
    const role = scriptRole(b.text, 'body');
    const loc = { sec: 'body', block: b.id };
    if (role === 'plain' && b.text.trim()) out.push(issue('info', '这一行不是 △ 动作、台词、字幕、音效中的任何一种', loc));
    if (/[0-9０-９](?:\.[0-9]+)?\s*秒/.test(b.text)) out.push(issue('info', '剧本里不写秒数', loc));
    if (role === 'action' && !b.text.replace(/^[△▲]\s*/, '').trim()) out.push(issue('info', '空的 △ 动作行', loc));
    if (role === 'line' && names.length) {
      const who = parseLine(b.text).who;
      if (!names.some(n => n.includes(who) || who.includes(n.replace(/若干$/, '')))) out.push(issue('info', '台词角色「' + who + '」不在人物表里', loc));
    }
  }
  return out;
}

function lintShots(doc) {
  const out = [];
  if (!doc.shots.length) out.push(issue('warn', '还没有镜头', { sec: 'shots' }));
  doc.shots.forEach((sh, k) => {
    const loc = { shot: sh.id }, n = countChars(sh.title);
    if (!n) out.push(issue('warn', `镜头${k + 1} 还没写概述`, loc));
    else if (n > SHOT_MAX) out.push(issue('warn', `镜头${k + 1} 的概述有 ${n} 个字，不能超过十个字`, loc));
    if (/[0-9０-９]\s*秒/.test(sh.title)) out.push(issue('warn', `镜头${k + 1} 的概述里不写秒数`, loc));
  });
  const old = shotOldCount(doc);
  if (old) out.push(issue('warn', `还留着 ${old} 行旧格式的内容；固定格式只写每一镜的概述`, { sec: 'old' }));
  return out;
}

/* ---------- 文本编码 ---------- */
function decodeText(buf) {
  const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(u8), encoding: 'utf-8' }; }
  catch (e) {
    try { return { text: new TextDecoder('gb18030').decode(u8), encoding: 'gb18030' }; }
    catch (e2) { return { text: TD.decode(u8), encoding: 'utf-8' }; }
  }
}
/* TextDecoder 会吃掉开头的 BOM：先看原始字节 */
function hasBom(buf) { const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf); return u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF; }
const encodeText = s => TE.encode(s);

/* ---------- 红批：先按段对齐，再按字比对 ---------- */
// 文档里能改的文字，按显示顺序：每一行，加上镜头表的概述
function units(doc) {
  const out = [];
  (function walk(x) {
    if (Array.isArray(x)) { x.forEach(walk); return; }
    if (!x || typeof x !== 'object') return;
    if (typeof x.text === 'string') { out.push({ k: x.id, t: x.text }); return; }
    if (typeof x.title === 'string') out.push({ k: 't' + x.id, t: x.title });
    for (const v of Object.values(x)) if (v && typeof v === 'object') walk(v);
  })(doc);
  return out;
}
// 最长公共子序列：[[op, a 的下标, b 的下标]]，op 为 '=' '-' '+'
function lcsOps(a, b) {
  const n = a.length, m = b.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) ops.push(['=', i++, j++]);
    else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) ops.push(['+', -1, j++]);
    else ops.push(['-', i++, -1]);
  }
  return ops;
}
// 两段文字有多像：相同的两字组合占多少
function similar(a, b) {
  if (a.length < 2 || b.length < 2) return 0;
  const g = new Map();
  for (let i = 0; i < a.length - 1; i++) { const k = a.substr(i, 2); g.set(k, (g.get(k) || 0) + 1); }
  let hit = 0;
  for (let i = 0; i < b.length - 1; i++) { const k = b.substr(i, 2), c = g.get(k); if (c) { hit++; g.set(k, c - 1); } }
  return 2 * hit / (a.length + b.length - 2);
}
// base：原来的文字（数组）；doc：现在的文档
// 返回 Map(key → { was: 原文，新加的为 null；gone: 这一段前面删掉的段 })，没改过的段不在里面
function redline(base, doc) {
  const cur = units(doc), now = cur.map(u => u.t);
  const marks = new Map();
  let s = 0; while (s < base.length && s < now.length && base[s] === now[s]) s++;
  let e = 0; while (e < base.length - s && e < now.length - s && base[base.length - 1 - e] === now[now.length - 1 - e]) e++;
  const a = base.slice(s, base.length - e), b = now.slice(s, now.length - e);
  let gone = [], dels = [], adds = [];
  const put = (j, was) => {
    const u = cur[s + j];
    if (was === null && !u.t.trim() && !gone.length) return;   // 新加的空行不标
    if (was !== u.t || gone.length) marks.set(u.k, { was, gone });
    gone = [];
  };
  // 一处连续的改动里，删掉的和新加的按相似度配对：配上的算「改过」，配不上的算删了、加了
  const flush = () => {
    let from = 0;
    for (const x of dels) {
      let best = -1, bs = .3;
      for (let k = from; k < adds.length; k++) { const v = similar(a[x], b[adds[k]]); if (v > bs) { bs = v; best = k; } }
      if (best < 0) { if (a[x].trim()) gone.push(a[x]); continue; }
      for (let k = from; k < best; k++) put(adds[k], null);
      put(adds[best], a[x]); from = best + 1;
    }
    for (let k = from; k < adds.length; k++) put(adds[k], null);
    dels = []; adds = [];
  };
  for (const [op, i, j] of lcsOps(a, b)) {
    if (op === '=') { flush(); if (gone.length) put(j, a[i]); }
    else if (op === '-') dels.push(i); else adds.push(j);
  }
  flush();
  if (gone.length) {
    const nx = cur[s + b.length], u = cur[cur.length - 1];
    if (nx) marks.set(nx.k, { was: nx.t, gone });
    else if (u) { const m = marks.get(u.k); marks.set(u.k, { was: m ? m.was : u.t, gone: m ? m.gone : [], tail: gone }); }   // 删在全文最后的，跟在最后一段后面
  }
  return marks;
}
// 一段之内按字比对：[['=', 没动的], ['-', 删掉的], ['+', 添上的]]
function diffChars(a, b) {
  let s = 0; while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let e = 0; while (e < a.length - s && e < b.length - s && a[a.length - 1 - e] === b[b.length - 1 - e]) e++;
  const x = a.slice(s, a.length - e), y = b.slice(s, b.length - e);
  const runs = [];
  const add = (op, t) => { const l = runs[runs.length - 1]; if (l && l[0] === op) l[1] += t; else runs.push([op, t]); };
  if (s) add('=', a.slice(0, s));
  if (x.length * y.length > 4e6) { add('-', x); add('+', y); }
  else for (const [op, i, j] of lcsOps(x, y)) add(op, op === '+' ? y[j] : x[i]);
  if (e) add('=', a.slice(a.length - e));
  // 夹在两处改动中间的一两个字并进改动里，红批读起来是一整处
  const out = [];
  let del = '', ins = '';
  const flush = () => { if (del) out.push(['-', del]); if (ins) out.push(['+', ins]); del = ins = ''; };
  runs.forEach(([op, t], k) => {
    if (op === '-') del += t;
    else if (op === '+') ins += t;
    else if ((del || ins) && t.length <= 2 && k < runs.length - 1) { del += t; ins += t; }
    else { flush(); out.push(['=', t]); }
  });
  flush();
  return out;
}

/* ---------- 批注：存成 Markdown，AI 照着改，编辑器也读得回来 ---------- */
// nt = { title, file, general, items: [{ where, text, n, note }] }；n：同样的原文是全文第几处
function notesToMd(nt) {
  const out = [`# 批注｜${nt.title}`, '', `文件：${nt.file}`, '',
    'AI 照 AGENTS.md 的「按批注修改」来改：只改批注说到的地方，别的一字不动；改版前原文件移进 历史记录，改完这份批注也移进去。',
    '批注要是把原文抄下来改过的，就是要这一段改成批注里写的样子。', ''];
  if (nt.general) out.push('## 整体', '批注：' + nt.general, '');
  nt.items.forEach((x, i) => out.push(`## ${i + 1}｜${x.where}`, `原文${x.n > 1 ? `（第${x.n}处）` : ''}：${x.text}`, '批注：' + x.note, ''));
  return out.join('\n');
}
function parseNotes(md) {
  const all = [];
  let cur = null;
  for (const line of String(md).replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const hd = /^##\s*(整体|\d+)\s*(?:[｜|]\s*(.*))?$/.exec(line);
    if (hd) { all.push(cur = { where: hd[1] === '整体' ? null : (hd[2] || '').trim(), text: null, n: 1, note: null }); continue; }
    if (!cur) continue;
    if (cur.note !== null) { cur.note += '\n' + line; continue; }
    const m = /^批注：(.*)$/.exec(line), o = cur.text === null && /^原文(?:（第(\d+)处）)?：(.*)$/.exec(line);
    if (m) cur.note = m[1];
    else if (o) { cur.text = o[2]; cur.n = +o[1] || 1; }
    else if (cur.text !== null) cur.text += '\n' + line;   // 原文里本来就有换行
  }
  const done = all.filter(x => x.note !== null && x.note.trim()).map(x => ({ ...x, note: x.note.trim() }));
  const g = done.find(x => x.where === null);
  return { general: g ? g.note : '', items: done.filter(x => x.where !== null && x.text !== null) };
}

function cloneDoc(doc) {
  const d = JSON.parse(JSON.stringify(doc));
  const re = o => { if (Array.isArray(o)) o.forEach(re); else if (o && typeof o === 'object') { if ('id' in o) o.id = uid(); Object.values(o).forEach(re); } };
  re(d);
  return d;

/* 正在看哪一份：文件夹树上标出来（路径从总文件夹算起） */

/* 文件夹树、地址里点了一份（路径从总文件夹算起）：项目文件夹打开目录，文件打开那一份 */

  const now = Desk.under(cur, from) ? [...to, ...cur.slice(from.length)] : cur;
  const e = findEntry(Desk.toPm(now), S.ed.entry.seg);

async function loadProjects() {
  const keep = e => e.kind === 'directory' && !/^[.$]|^(node_modules|System Volume Information)$/.test(e.name);
  const top = (await FS.list([])).filter(keep);
  PJ_AT.clear();
  S.hasHome = top.some(e => e.name === PJ_HOME);
  let ents = top;
  if (S.hasHome) {
    ents = (await FS.list([PJ_HOME])).filter(keep);
    for (const e of ents) PJ_AT.set(e.name, [PJ_HOME]);
    // 还没挪进 项目 的旧项目：总文件夹下带 提示词、资产、成片、定稿的剧本 的文件夹
    for (const e of top) {

      if (sub.some(x => x.kind === 'directory' && STD_DIRS.includes(x.name) && x.name !== '历史记录')) { PJ_AT.set(e.name, []); ents.push(e); }

}

async function parseEntry(entry, buf) {

/* 红批的底稿：第一次打开时的原文，记在浏览器里。AI 改过以后，改动的地方显示红批，直到「清稿」 */
const baseKey = ed => 'antou:base:' + S.rootName + '/' + ed.target.join('/');
function readBase(ed) { try { const r = JSON.parse(localStorage.getItem(baseKey(ed)) ?? movedBase(ed) ?? 'null'); return Array.isArray(r) ? r : null; } catch (e) { return null; } }
/* 文件改成短名以前记下的底稿：同一文件夹里长名的那份搬到短名下，红批不丢 */
function movedBase(ed) {
  const t = ed.target, cur = t[t.length - 1], pre = 'antou:base:' + S.rootName + '/' + t.slice(0, -1).join('/') + '/';
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i), name = k && k.startsWith(pre) ? k.slice(pre.length) : '';
    if (!name || name.includes('/') || name === cur || shortName(t, name) !== cur) continue;
    const v = localStorage.getItem(k);
    try { localStorage.setItem(baseKey(ed), v); localStorage.removeItem(k); } catch (e) { /* 存满了就不搬 */ }
    return v;
  }
  return null;
}
function setBase(ed, base) { ed.base = base; ed.marks = null; try { localStorage.setItem(baseKey(ed), JSON.stringify(base)); } catch (e) { /* 存满了就不存 */ } }
function keepBase(ed) { if (!readBase(ed)) setBase(ed, ed.base); }
function marks() { const ed = S.ed; if (!ed.marks) ed.marks = C.redline(ed.base, ed.doc); return ed.marks; }
async function cleanCopy() {

/* ---------- 批注：存在原文件旁边，AI 照着改 ---------- */
/* 同样的文字出现几次就记第几处：批注靠「原文＋第几处」对回段落 */
function unitList(doc) { const seen = new Map(); return C.units(doc).map(u => { const n = (seen.get(u.t) || 0) + 1; seen.set(u.t, n); return { ...u, n }; }); }
async function readNotes(ed) {
  let nt = { general: '', items: [] };

  try { const r = await FS.read(ed.notesAt); nt = C.parseNotes(C.decodeText(r.buf).text); ed.notesMtime = r.mtime; } catch (e) { /* 还没有批注 */ }
  const at = new Map(unitList(ed.doc).map(u => [u.t + '\n' + u.n, u.k]));
  const byKey = new Map(), lost = [];   // lost：原文已经改过，对不上了
  for (const x of nt.items) { const k = at.get(x.text + '\n' + x.n); if (k && !byKey.has(k)) byKey.set(k, x); else lost.push(x); }

}

  const items = [];

  const e = ed.entry, what = `第${e.seg}段 ${KN[e.kind]}${e.kind === 'prompt' && !e.main ? ' ' + e.label : ''}`;
  const file = e.combined ? `${at(e.path).join('/')} 里的第${e.seg}段（改完另存成 ${at(ed.target).join('/')}，汇总稿不动）` : at(ed.target).join('/');
  return C.notesToMd({ title: what, file, general: ed.notes.general, items: [...items, ...ed.notes.lost] });
}
/* 写进文件；全删光了就删掉文件。上一次还没写完的，排在后面接着写 */
function saveNotes(ed) {
  ed.q = (ed.q || Promise.resolve()).then(async () => {
    try {
      if (noteCount(ed)) ed.notesMtime = (await FS.write(ed.notesAt, C.encodeText(notesMd(ed)))).mtime;
      else if (await FS.stat(ed.notesAt)) { await FS.remove(ed.notesAt); ed.notesMtime = 0; }
      Desk.T.setNoted(at(ed.target), !!noteCount(ed));   // 文件夹树上的小红点
    } catch (e) { toast('批注没存上：' + e.message, 'err'); }
  });
  return ed.q;
}
const saveNotesLater = debounce(saveNotes, 400);
/* 本机服务第 5 版起有 AI 任务：开一个，底下守着一条，显示谁在改、用了多久；改完文件一变，页面自己换上红批 */
async function aiJob(body) {
  let j;
  try { j = await (await LINK.req('POST', '/api/job', C.encodeText(JSON.stringify({ ...body, 渠道: localStorage.getItem('antou:flow:channel') || 'claude' })))).json(); }
  catch (e) { toast('没交上：' + e.message, 'err'); return; }
  const line = h('span', null, ''), chip = h('div', { class: 'toast' }, h('i', { class: 's' }), line), t0 = Date.now();
  document.getElementById('toasts').append(chip);
  for (;;) {
    const sec = Math.round((Date.now() - t0) / 1000);
    line.textContent = (j.状态 === '排队' ? j.渠道名 + ' 排着队' : j.步骤 || j.渠道名 + ' 在改') + '　' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    if (j.状态 !== '排队' && j.状态 !== '在做') break;
    await new Promise(r => setTimeout(r, 2000));
    try { j = await (await LINK.req('GET', '/api/job/' + j.id)).json(); } catch (e) { break; }
  }
  chip.remove();
  toast(j.状态 === '做完' ? j.结果 : '没改成：' + (j.错误 || j.状态), j.状态 === '做完' ? '' : 'err');
}
async function copyForAI(paths) {
  let text = (paths || [S.ed.notesAt]).map(p => '按批注修改 ' + at(p).join('/')).join('\n');
  if (LINK.on) {   // 右边窗格：直接交到 AI 手上
    if (S.ed) await S.ed.q;   // 批注先写完
    if (LINK.v >= 5) {   // 直接开 AI 任务（用哪个 AI，看流水线顶栏选的那个）：剧本、镜头表的批注，和各段视频提示词的批注
      const list = (paths || [S.ed.notesAt]).map(p => at(p));
      const isVp = p => p.length === 5 && p[0] === '项目' && p[2] === '提示词' && /^第[0-9-]+段$/.test(p[3]) && /视频提示词_批注\.md$/.test(p[4]);
      const mine = list.filter(p => (p[0] === '项目' && p[2] === '定稿的剧本') || isVp(p));
      for (const p of mine) aiJob({ 事: isVp(p) ? '按批注改提示词' : '按批注改', 项目: p[1], 批注: p.join('/') });
      if (mine.length === list.length) return;
      text = list.filter(p => !mine.includes(p)).map(p => '按批注修改 ' + p.join('/')).join('\n');
    }
    try {
      const r = await (await LINK.req('POST', '/api/ai', text)).json();
      toast(r.online ? '交给 AI 了，改好这里自动刷新' : '记下了。AI 这会儿没在等这一种批注，去对话里说一声「看右边」');
    } catch (e) { toast('没交上：' + e.message, 'err'); }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('复制好了，贴给 Claude 或 Codex'); }
  catch (e) { toast('复制没成功：' + e.message, 'err'); }
}
function findEntry(path, seg) {

}

/* ---------- 文本高亮 ---------- */
function tokenize(text, kind) {
  const re = kind === 'prompt'
    ? /(\{[^{}\n]*\})|(<[^<>\n]*>)|(@(?:图片|视频|音频)\s*[0-9]+)|(【[^】\n]*】)|(〔[^〕\n]*〕)/g
    : /(「[^」\n]*」)|([（(]音效[：:][^）)\n]*[）)])|(“[^”\n]*”)|(〔[^〕\n]*〕)/g;
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ t: text.slice(last, m.index), c: '', o: last });
    let c;
    if (kind === 'prompt') c = m[1] ? 'tk-say' : m[2] ? 'tk-sfx' : m[3] ? 'tk-ref' : m[4] ? 'tk-br' : 'tk-ph';
    else c = m[1] ? 'tk-q' : m[2] ? 'tk-sfx' : m[3] ? 'tk-q' : 'tk-ph';
    out.push({ t: m[0], c, o: m.index });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ t: text.slice(last), c: '', o: last });
  return out;
}

/* ---------- 一段：显示 ---------- */

}
const RE_SIZE = /^((?:大|极)?特写|近景|中近景|中景|全景|远景|大远景|空镜)[：:]\s*/;   // △ 后面的景别提示

/* 红批：删掉的朱笔划去，添上的朱笔楷书；新加的一段整段是朱笔 */
const redEls = (was, now, cut) => {   // cut：把留下来的字再切一遍（提示词里的 @图片N、@视频N 切成能点的）

  if (was === null) return [h('ins', null, keep(now))];
  // 提示词里 @图片N、@视频N、@音频N 当成一个字来比：编号改了就整个划去、整个添上，添上的照样能点

  return C.diffChars(pack(was), pack(now)).map(([op, t]) => (t = back(t), op === '=' ? keep(t) : op === '-' ? h('del', null, t) : h('ins', null, keep(t))));

(function () {

/* ---------- 从 mp4 头里读帧率和帧数；读不出就按每秒 24 帧 ---------- */
const fourcc = (dv, p) => String.fromCharCode(dv.getUint8(p), dv.getUint8(p + 1), dv.getUint8(p + 2), dv.getUint8(p + 3));
function boxAt(dv, p, end) {
  if (p + 8 > end) return null;
  let size = dv.getUint32(p), head = 8;
  if (size === 1) { if (p + 16 > end) return null; size = Number(dv.getBigUint64(p + 8)); head = 16; }
  else if (size === 0) size = end - p;
  if (size < head || p + size > end) return null;
  return { type: fourcc(dv, p + 4), start: p + head, end: p + size };
}
function boxes(dv, box) { const out = []; for (let p = box.start; p < box.end;) { const b = boxAt(dv, p, box.end); if (!b) break; out.push(b); p = b.end; } return out; }
const child = (dv, box, type) => box ? boxes(dv, box).find(b => b.type === type) || null : null;
function snapFps(x) {
  const std = [24000 / 1001, 24, 25, 30000 / 1001, 30, 48, 50, 60000 / 1001, 60];
  const c = std.reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a);
  return Math.abs(c - x) / c < 0.01 ? c : x;
}
async function videoInfo(file) {
  try {
    let p = 0, moov = null;
    while (p + 8 <= file.size) {
      const dv = new DataView(await file.slice(p, p + 16).arrayBuffer());
      let size = dv.getUint32(0), head = 8;
      if (size === 1) { size = Number(dv.getBigUint64(8)); head = 16; } else if (size === 0) size = file.size - p;
      if (size < head) return null;
      if (fourcc(dv, 4) === 'moov') { moov = new DataView(await file.slice(p, p + size).arrayBuffer()); break; }
      p += size;
    }
    if (!moov) return null;
    for (const trak of boxes(moov, boxAt(moov, 0, moov.byteLength)).filter(b => b.type === 'trak')) {
      const mdia = child(moov, trak, 'mdia'), hdlr = child(moov, mdia, 'hdlr'), mdhd = child(moov, mdia, 'mdhd');
      if (!hdlr || !mdhd || fourcc(moov, hdlr.start + 8) !== 'vide') continue;
      const scale = moov.getUint32(mdhd.start + (moov.getUint8(mdhd.start) === 1 ? 20 : 12));
      const stts = child(moov, child(moov, child(moov, mdia, 'minf'), 'stbl'), 'stts');
      if (!stts) return null;
      let frames = 0, ticks = 0;
      for (let i = 0, n = moov.getUint32(stts.start + 4); i < n; i++) {
        const c = moov.getUint32(stts.start + 8 + i * 8);
        frames += c; ticks += c * moov.getUint32(stts.start + 12 + i * 8);
      }
      return frames && ticks && scale ? { frames, fps: snapFps(frames * scale / ticks) } : null;
    }

  return null;

function fmt(t) { const d = Math.max(0, Math.floor(t * 10 + 1e-6)); return `${Math.floor(d / 600)}:${String(Math.floor(d / 10) % 60).padStart(2, '0')}.${d % 10}`; }
const fmtF = f => fmt(f / S.v.fps);
const fpsText = x => String(Math.round(x * 1000) / 1000);
const rangeText = n => n.f2 == null ? fmtF(n.f) : `${fmtF(n.f)}～${fmtF(n.f2)}`;
const frameText = n => n.f2 == null ? `第${n.f + 1}帧` : `第${n.f + 1}～${n.f2 + 1}帧`;
function shotFileName(f) {
  const d = Math.floor(f / S.v.fps * 10 + 1e-6);
  return `${Math.floor(d / 600)}分${String(Math.floor(d / 10) % 60).padStart(2, '0')}.${d % 10}秒_第${f + 1}帧.jpg`;
}
const byFrame = (a, b) => a.f - b.f || (a.f2 == null ? a.f : a.f2) - (b.f2 == null ? b.f : b.f2);

/* ---------- 找样片：总文件夹、项目 列出每个项目的 成片；项目列它的 成片；别的文件夹列它自己，往下多看一层 ---------- */
function videoLabel(name, pj, sub) {
  let s = stem(name);
  if (s.startsWith(pj + '_')) s = s.slice(pj.length + 1);
  if (sub && s.startsWith(sub + '_')) s = s.slice(sub.length + 1);   // 第几段已经写在小标题上
  return s.replace(/_样片\d*p?$/i, '').replace(/_/g, ' ').trim() || stem(name);
}
/* 成片 按段分了文件夹（成片\第1-1段），往下多看一层；截图文件夹、历史记录不看 */
async function videosIn(g, parts, sub) {
  const files = await FS.list(parts), names = new Set(files.map(f => f.name)), out = [];
  for (const f of files) {
    if (f.kind === 'directory') {
      if (!sub && !/^[.$]|^历史记录$/.test(f.name) && !f.name.endsWith(SHOTS_TAIL)) {
        try { out.push(...await videosIn(g, [...parts, f.name], f.name)); } catch (err) { /* 读不了就跳过 */ }
      }
      continue;
    }
    if (!VIDEO_RE.test(f.name)) continue;
    const it = { name: f.name, path: [...parts, f.name], sub, label: videoLabel(f.name, g.name, sub), count: 0, general: false, thumb: '' };
    const md = stem(f.name) + NOTES_TAIL;
    if (names.has(md)) {
      try {
        const r = parseMd(decodeText((await FS.read([...parts, md])).buf), 24);
        it.count = r.notes.length; it.general = !!r.general;
        const n = r.notes.find(x => x.img); if (n) it.thumb = n.img;
      } catch (err) { /* 读不了就不显示 */ }
    }
    out.push(it);
  }
  return out;
}
const hasDir = (list, n) => list.some(e => e.kind === 'directory' && e.name === n);
/* 视频所在的项目：项目/项目名，或者还没挪进 项目 的旧项目（一级文件夹） */
async function groupOf(path) {
  const pj = path[0] === '项目' ? path.slice(0, 2) : path.slice(0, 1), inPj = pj.length && pj.length < path.length;
  let pr = null;
  if (inPj) { try { if (hasDir(await FS.list(pj), '提示词')) pr = [...pj, '提示词']; } catch (e) { /* 没有就算了 */ } }
  const i = path.lastIndexOf('成片');
  return { name: inPj ? pj[pj.length - 1] : Desk.rootName, cp: i >= 0 && i < path.length - 1 ? path.slice(0, i + 1) : path.slice(0, -1), pr };
}
async function scanList(parts) {
  const ents = await FS.list(parts);
  let groups;
  if (hasDir(ents, '成片') && !ents.some(e => e.kind === 'file' && VIDEO_RE.test(e.name))) {
    groups = [{ name: parts.length ? parts[parts.length - 1] : Desk.rootName, cp: [...parts, '成片'], pr: hasDir(ents, '提示词') ? [...parts, '提示词'] : null }];
  } else if (!parts.length || (parts.length === 1 && parts[0] === '项目')) {
    // 总文件夹：项目都在 项目 文件夹里；总文件夹下还没挪进去的旧项目也列出来
    const dirs = list => list.filter(e => e.kind === 'directory' && !/^[.$]/.test(e.name)).sort(byName);
    const places = [];
    for (const e of dirs(ents)) {
      if (parts.length) { places.push([...parts, e.name]); continue; }
      if (e.name !== '项目') { places.push([e.name]); continue; }
      let pjs; try { pjs = await FS.list(['项目']); } catch (err) { continue; }
      for (const p of dirs(pjs)) places.push(['项目', p.name]);
    }
    groups = [];
    for (const at of places) {
      let sub; try { sub = await FS.list(at); } catch (err) { continue; }
      if (hasDir(sub, '成片')) groups.push({ name: at[at.length - 1], cp: [...at, '成片'], pr: hasDir(sub, '提示词') ? [...at, '提示词'] : null });
    }
  } else {
    const g = await groupOf([...parts, '']);
    groups = [{ ...g, cp: parts }];
  }
  for (const g of groups) {
    try { g.videos = await videosIn(g, g.cp, ''); } catch (e) { g.videos = []; }
    g.videos.sort((a, b) => a.sub.localeCompare(b.sub, 'zh', { numeric: true }) || byName(a, b));
  }
  return groups;
}

/* ---------- 对应的视频提示词和它的分镜 ---------- */
const segOf = n => { const m = /第\s*(\d+(?:\s*[-－]\s*\d+)?)\s*段/.exec(n); return m ? m[1].replace(/\s/g, '').replace(/－/g, '-') : ''; };
function promptLabel(n, pj, seg) {
  let s = stem(n);
  if (s.startsWith(pj + '_')) s = s.slice(pj.length + 1);
  s = s.replace(`第${seg}段`, '').replace(/_?视频提示词$/, '');
  return s.replace(/^[_\s]+|[_\s]+$/g, '').replace(/_/g, ' ') || '本段';
}
async function promptsFor(g, seg) {
  const out = [];
  if (!g.pr || !seg) return out;
  const walk = async (parts, depth) => {
    let ents; try { ents = await FS.list(parts); } catch (e) { return; }
    const dseg = segOf(parts[parts.length - 1]);   // 文件名里没写段落的，看所在的 第N段 文件夹
    for (const e of ents) {
      if (e.kind === 'directory') { if (depth > 0 && !/^[.$]|^(历史记录|全局资产)$/.test(e.name)) await walk([...parts, e.name], depth - 1); }
      else if (/视频提示词\.txt$/i.test(e.name) && (segOf(e.name) || dseg) === seg) out.push({ name: e.name, path: [...parts, e.name], label: promptLabel(e.name, g.name, seg) });
    }
  };
  await walk(g.pr, 2);
  return out.sort(byName);
}
/* 按文件名猜：去掉 第N条 和 样片480p、720p，剩下的和提示词一样去掉项目名、段落，比内容（视频提示词.txt 算「本段」） */
function guessPrompt(v) {
  const key = stem(v.name).replace(/_(?:样片\d*p?|\d+p)$/i, '').replace(/_成片$/, '').replace(/_第\d+条/, '');
  const seg = v.seg, lab = promptLabel(key + '_视频提示词.txt', v.g.name, seg);
  return v.prompts.find(p => p.label === lab) || null;
}
async function readShots(p) {
  try {
    const text = decodeText((await FS.read(p.path)).buf);
    const out = [];
    for (const line of text.split(/\r?\n/)) {
      const m = RE_SHOT.exec(line);
      if (m) out.push({ no: m[1].replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), title: m[2].trim() });
    }
    return out;
  } catch (e) { return []; }
}

/* ---------- 批注文件：AI 一读就懂，页面也读得回来 ---------- */
// 路径：知道完整位置就写 E:\ 开头的，否则写相对这份批注所在文件夹的
function shown(v, parts) {
  if (Desk.abs) return [Desk.abs, ...parts].join('\\');
  const base = v.notesAt.slice(0, -1);
  let i = 0;
  while (i < base.length && i < parts.length - 1 && base[i] === parts[i]) i++;
  return '../'.repeat(base.length - i) + parts.slice(i).join('/');
}
const mdEsc = s => s.replace(/^#/gm, '＃');
function mdText(v) {
  const L = [`# 审片批注｜${v.name}`, '', `视频：${shown(v, v.path)}`];
  if (v.prompt) L.push(`提示词：${shown(v, v.prompt.path)}`);
  else if (v.promptKeep) L.push(`提示词：${v.promptKeep}`);
  L.push('', `用户在 ${Desk.PAGE} 里边看这条样片边写的批注。时间是样片里的位置（分:秒.十分之一秒），括号里是第几帧（从 1 数，每秒 ${fpsText(v.fps)} 帧）；「镜头」对应提示词里的「镜头 NN」；截图是写这条批注时停住的那一帧，先看截图再读批注。` +
    (Desk.abs ? '' : '路径都相对这份批注所在的文件夹。'), '');
  if (v.general.trim()) L.push('## 整体', '批注：' + mdEsc(v.general.trim()), '');
  v.notes.forEach((n, i) => {
    L.push(`## ${i + 1}｜${rangeText(n)}`, `时间：${rangeText(n)}（${frameText(n)}）`);
    if (n.cats.length) L.push('分类：' + n.cats.join('、'));
    if (n.shot) L.push('镜头：' + n.shot);
    if (n.img) L.push('截图：' + shown(v, [...v.shotsDir, n.img]));
    if (n.img2) L.push('结束截图：' + shown(v, [...v.shotsDir, n.img2]));
    L.push('批注：' + mdEsc(n.text), '');
  });
  return L.join('\n');
}
function framesOf(s, fps) {
  const m = /第\s*(\d+)\s*(?:帧)?\s*(?:[～~\-–—至到]\s*第?\s*(\d+)\s*)?帧/.exec(s);
  if (m) return [m[1] - 1, m[2] ? m[2] - 1 : null];
  const ts = [...s.matchAll(/(\d+):(\d{1,2}(?:\.\d+)?)/g)].map(x => (+x[1]) * 60 + (+x[2]));
  return ts.length ? [Math.round(ts[0] * fps), ts[1] != null ? Math.round(ts[1] * fps) : null] : null;
}
function parseMd(md, fps) {
  const out = { prompt: '', promptLine: '', general: '', notes: [] }, all = [];
  let cur = null;
  for (const line of String(md).replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const hd = /^##\s*(整体|\d+)\s*(?:[｜|]\s*(.*))?$/.exec(line);
    if (hd) { all.push(cur = { general: hd[1] === '整体', head: (hd[2] || '').trim(), time: '', cats: [], shot: '', img: '', img2: '', text: null }); continue; }
    if (!cur) { const m = /^提示词：\s*(.+)$/.exec(line); if (m) { out.promptLine = m[1].trim(); out.prompt = baseName(m[1]); } continue; }
    if (cur.text !== null) { cur.text += '\n' + line; continue; }   // 批注写在最后，可以有好几行
    let m;
    if ((m = /^批注：(.*)$/.exec(line))) cur.text = m[1];
    else if ((m = /^时间：(.*)$/.exec(line))) cur.time = m[1];
    else if ((m = /^分类：(.*)$/.exec(line))) cur.cats = m[1].split(/[、，,\/／\s]+/).filter(Boolean);
    else if ((m = /^镜头：(.*)$/.exec(line))) cur.shot = m[1].trim();
    else if ((m = /^结束截图：(.*)$/.exec(line))) cur.img2 = baseName(m[1]);
    else if ((m = /^截图：(.*)$/.exec(line))) cur.img = baseName(m[1]);
  }
  for (const x of all) {
    const text = (x.text || '').trim();
    if (!text) continue;
    if (x.general) { out.general = text; continue; }
    const fr = framesOf(x.time || x.head, fps);
    if (!fr) continue;
    out.notes.push({ id: uid(), f: fr[0], f2: fr[1] != null && fr[1] !== fr[0] ? fr[1] : null, cats: x.cats, shot: x.shot, img: x.img, img2: x.img2, text });
  }
  out.notes.sort(byFrame);
  return out;
}
async function readMd(v) {
  try {
    const r = await FS.read(v.notesAt), p = parseMd(decodeText(r.buf), v.fps);
    v.notes = p.notes; v.general = p.general; v.mdMtime = r.mtime;
    return p;
  } catch (e) { v.notes = []; v.general = ''; v.mdMtime = 0; return null; }
}
/* 写进文件；批注全删光就删掉文件。上一次还没写完的，排在后面接着写 */
function saveNow() {
  const v = S.v;
  if (!v) return Promise.resolve();
  clearTimeout(v.saveT); v.saveT = 0;
  v.q = v.q.then(async () => {
    try {
      if (v.notes.length || v.general.trim()) await FS.write(v.notesAt, TE.encode(mdText(v)));
      else if (await FS.stat(v.notesAt)) await FS.remove(v.notesAt);
      const st = await FS.stat(v.notesAt);
      v.mdMtime = st ? st.mtime : 0; v.err = '';
    } catch (e) { v.err = e.message; toast('批注没存上：' + e.message, 'err'); }
    if (S.v === v) { paintStatus(); syncCount(); }
  });
  return v.q;
}
function saveLater() { const v = S.v; clearTimeout(v.saveT); v.saveT = setTimeout(saveNow, 500); }
function syncCount() {
  const v = S.v, n = v.notes.length, gen = !!v.general.trim();
  for (const it of [v.item, ...S.groups.flatMap(g => g.videos).filter(it => pathEq(it.path, v.path))]) { it.count = n; it.general = gen; }
  Desk.T.setNoted(v.path, n || gen);   // 文件夹树上的小红点
}

/* ---------- 截图 ---------- */
function grab() {
  const vd = P.video, c = document.createElement('canvas');
  c.width = vd.videoWidth; c.height = vd.videoHeight;
  c.getContext('2d').drawImage(vd, 0, 0);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('浏览器没给出图片')), 'image/jpeg', 0.92));
}
async function grabEnd() {
  const f = P.f;
  try { const blob = await grab(); return { f, blob, url: URL.createObjectURL(blob), img: '' }; }
  catch (e) { toast('这一帧没截下来：' + e.message, 'err'); return { f, img: '' }; }
}
async function writeShot(v, f, blob) {
  const name = shotFileName(f);
  try {
    await FS.write([...v.shotsDir, name], blob);
    const old = v.thumbs.get(name); if (old) old.then(URL.revokeObjectURL).catch(() => {});
    v.thumbs.set(name, Promise.resolve(URL.createObjectURL(blob)));
    return name;
  } catch (e) { toast('截图没存上：' + e.message, 'err'); return ''; }
}
function shotImg(v, name, cls) {
  const img = h('img', { alt: name, class: cls || null, decoding: 'async' });
  if (!v.thumbs.has(name)) v.thumbs.set(name, FS.file([...v.shotsDir, name]).then(f => URL.createObjectURL(f)));
  v.thumbs.get(name).then(u => { img.src = u; }).catch(() => { v.thumbs.delete(name); img.replaceWith(h('span', null, '图不见了')); });
  return img;
}
/* 批注删了、改了时间，原来的截图没别的批注用，就删掉；文件夹空了也删掉 */
async function dropUnused(v, names) {
  const used = new Set(v.notes.flatMap(n => [n.img, n.img2]).filter(Boolean));
  for (const name of new Set(names.filter(Boolean))) {
    if (used.has(name)) continue;
    try { await FS.remove([...v.shotsDir, name]); } catch (e) { /* 已经没了 */ }
    const u = v.thumbs.get(name); if (u) { u.then(URL.revokeObjectURL).catch(() => {}); v.thumbs.delete(name); }
  }
  if (!used.size) { try { await FS.remove(v.shotsDir); } catch (e) { /* 还有别的文件，或者本来就没有 */ } }
  Desk.T.refresh(v.path.slice(0, -1));
}

/* ---------- 进来、出去：左边菜单点「审片」 ---------- */
async function enter(m, opts) {
  const first = !S.ready;
  S.ready = true;
  if (opts.open) {   // 文件夹就列出来；视频打不开就列出它所在的文件夹，别留一片空白
    const p = opts.open;
    if (!VIDEO_RE.test(p[p.length - 1])) { await showList(p); return; }
    await openAt(p);
    if (!S.v || !pathEq(S.v.path, p)) await showList(p.slice(0, -1));
    return;
  }
  if (first) {   // 头一回进来：接着看上次那条，没有就列出所有项目的样片
    const last = localStorage.getItem('shenpian:last:' + Desk.rootName);
    const parts = last ? last.split('/') : null;
    if (parts && VIDEO_RE.test(parts[parts.length - 1]) && await FS.stat(parts)) {
      await openAt(parts);
      if (!S.v) await showList(parts.slice(0, -1));
      return;
    }
    await showList([]);
    return;
  }
  if (S.v && P) { S.view = 'player'; render(); recheck(); return; }
  await showList(S.dir || []);
}
async function leave() {
  if (!(await leaveForm())) return false;
  if (P) halt();
  if (S.v && S.v.saveT) saveNow();
  return true;
}
function reset() { S.tok++; closeVideo(); Object.assign(S, { ready: false, view: 'list', dir: null, groups: [], loading: false, listAt: 0, released: null }); }
function current() { return S.view === 'player' && S.v ? S.v.path : S.dir; }
/* 树上点了一条视频（路径从总文件夹算起） */
async function openAt(path, frame) {
  const g = await groupOf(path), name = path[path.length - 1];
  const sub = path.slice(g.cp.length, -1).join(' / ');
  const it = (S.groups.flatMap(x => x.videos).find(x => pathEq(x.path, path))) || { name, path, sub, label: videoLabel(name, g.name, sub), count: 0, general: false };
  await openVideo(g, it, frame);
}
/* 树上点了文件夹：列出里面的样片 */
async function showList(parts) {
  if (S.v && S.view === 'player' && !(await leaveForm())) return;
  if (P) halt();
  const tok = ++S.tok;
  S.dir = parts; S.view = 'list'; S.loading = true;
  render();
  let groups = [];
  try { groups = await scanList(parts); }
  catch (e) { toast('读不了这个文件夹：' + e.message, 'err'); }
  if (tok !== S.tok) return;
  S.groups = groups; S.loading = false; S.listAt = Date.now();
  render();
}
/* 树上改了名字：正看着的那条跟着换到新名字，批注里的路径也照新的写一遍 */
function release(path) {
  const v = S.v;
  if (!v || !Desk.under(v.path, path)) return;
  S.released = { path: v.path, f: P ? halt() : 0, player: S.view === 'player' };
  closeVideo();
}
async function moved(from, to) {
  const nu = p => Desk.under(p, from) ? [...to, ...p.slice(from.length)] : p;
  if (S.dir && Desk.under(S.dir, from)) S.dir = nu(S.dir);
  const r = S.released; S.released = null;
  if (r) {
    await openAt(nu(r.path), r.f);
    if (S.v && !pathEq(S.v.path, r.path) && (S.v.notes.length || S.v.general.trim())) saveNow();
    if (!r.player && S.dir) await showList(S.dir);
  } else if (S.view === 'list' && S.dir) await showList(S.dir);
}

/* ---------- 打开一条样片 ---------- */
function closeVideo() {
  if (P) { P.video.pause(); P.video.removeAttribute('src'); P.video.load(); P = null; }
  const v = S.v;
  if (v) { clearTimeout(v.saveT); URL.revokeObjectURL(v.url); for (const u of v.thumbs.values()) u.then(URL.revokeObjectURL).catch(() => {}); }
  dropFormUrls();
  S.v = null; S.form = null; S.sel = null;
}
async function openVideo(g, it, frame) {
  if (S.v && pathEq(S.v.path, it.path)) { if (S.view !== 'player') { S.view = 'player'; render(); } return; }
  if (!(await leaveForm())) return;
  if (S.v && S.v.saveT) saveNow();
  const tok = ++S.tok;
  let file;
  try { file = await FS.file(it.path); }
  catch (e) { toast('打不开这条视频：' + e.message, 'err'); return; }
  const info = await videoInfo(file);
  const dir = it.path.slice(0, -1), base = stem(it.name);
  const v = {
    g, item: it, name: it.name, path: it.path, seg: segOf(it.name) || segOf(it.sub) || segOf(dir.slice(-2).join('/')), fps: info ? info.fps : 24, frames: info ? info.frames : 0,
    notesAt: [...dir, base + NOTES_TAIL], shotsDir: [...dir, base + SHOTS_TAIL],
    notes: [], general: '', mdMtime: 0, prompts: [], prompt: null, promptKeep: '', shots: [],
    thumbs: new Map(), q: Promise.resolve(), saveT: 0, err: '',
  };
  v.prompts = await promptsFor(g, v.seg);
  const md = await readMd(v);
  const named = md && md.prompt ? v.prompts.find(p => p.name === md.prompt) : null;
  if (md && md.prompt && !named) v.promptKeep = md.promptLine;   // 批注里记的提示词已经不在了：照原样留着
  v.prompt = named || (v.promptKeep ? null : guessPrompt(v));
  if (v.prompt) v.shots = await readShots(v.prompt);
  if (tok !== S.tok) return;
  closeVideo();
  v.url = URL.createObjectURL(file);
  S.v = v; S.view = 'player';
  localStorage.setItem('shenpian:last:' + Desk.rootName, it.path.join('/'));
  P = buildPlayer(v);
  if (frame) P.video.addEventListener('loadedmetadata', () => seekTo(frame), { once: true });
  render();
}
async function setPrompt(i) {
  const v = S.v;
  v.prompt = i === '' ? null : v.prompts[+i] || null; v.promptKeep = '';
  v.shots = v.prompt ? await readShots(v.prompt) : [];
  if (S.v !== v) return;
  if (v.notes.length || v.general.trim()) saveNow();
  paintRail();
}

/* ---------- 播放器 ---------- */
const clampF = f => Math.max(0, Math.min(Math.max(1, S.v.frames) - 1, f));
function ctlBtn(name, title, fn) { return h('button', { class: 'ctl', title, onclick: fn }, icon(name)); }
function buildPlayer(v) {
  const video = h('video', { class: 'vid', preload: 'auto', playsinline: true });
  video.muted = S.muted;
  video.defaultPlaybackRate = S.rate; video.playbackRate = S.rate;
  video.src = v.url;
  const p = { video, f: 0, want: null, seeking: false, seekP: null };

  return h('div', { class: 'ni' + (S.sel === n.id ? ' on' : '') + (editing ? ' editing' : ''), title: '点一下跳到这里', onclick: () => jump(n) },
    h('div', { class: 'ni-img' }, n.img ? shotImg(v, n.img) : '没有截图'),
    h('div', { class: 'ni-main' },

          h('button', { class: 'mini', title: '改这条', onclick: e => { e.stopPropagation(); openForm(n); } }, '改'),

      n.cats.length || n.shot ? h('div', { class: 'ni-tags' },
        n.cats.map(c => h('span', { class: 'tag c' + CATS.indexOf(c) }, c)),

      h('div', { class: 'ni-text' }, n.text)));
}

/* ---------- 键盘、窗口 ---------- */
document.addEventListener('keydown', e => {
  if (!Desk.is('review') || isComposing(e) || $('.mask') || $('.ctx')) return;
  const tag = document.activeElement && document.activeElement.tagName;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  if (S.form && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveForm(); return; }
  if (S.form && e.key === 'Escape') { e.preventDefault(); leaveForm(); return; }
  if (typing || !P || S.view !== 'player' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); const d = e.key === 'ArrowLeft' ? -1 : 1; step(e.shiftKey ? d * Math.round(S.v.fps) : d); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.form) { const ta = $('.fta'); if (ta) ta.focus(); } else openForm(); }
});
window.addEventListener('beforeunload', e => {
  const v = S.v;
  if (v && v.saveT) saveNow();
  if (S.form && S.form.changed && S.form.text.trim()) { e.preventDefault(); e.returnValue = ''; }
});
/* 切回来时看一眼（右边窗格里每两秒看一眼）：AI 改了或移走了批注文件，就重新读；列着的文件夹多了新视频，跟着变 */
let CHECKING = false;
async function recheck() {
  if (CHECKING || !Desk.is('review') || $('.mask')) return;
  CHECKING = true;
  try {
    const v = S.v;
    if (v && !S.form && S.view === 'player') {
      await v.q;
      const st = await FS.stat(v.notesAt);
      if (S.v === v && !S.form && (st ? st.mtime : 0) !== v.mdMtime) {
        const md = await readMd(v);
        if (md && md.prompt) { const p = v.prompts.find(x => x.name === md.prompt); if (p && p !== v.prompt) { v.prompt = p; v.shots = await readShots(p); } }
        S.sel = null;
        paintRail(); paintMarks(); syncCount();
        toast(st ? '批注在外面改过，已重新读取' : '批注文件被移走了');
      }
    }
    if (S.view === 'list' && !S.loading && S.dir && Date.now() - S.listAt > 8000) {
      const tok = S.tok, groups = await scanList(S.dir);
      if (tok === S.tok && S.view === 'list') { S.groups = groups; S.listAt = Date.now(); render(); }
    }
  } catch (e) { /* 下次再看 */ }
  finally { CHECKING = false; }
}

Desk.MOD.review = { enter, leave, reset, current, recheck, moved, release, open: p => openAt(p), folder: showList };
window.Shenpian = { S, parseMd, mdText, videoInfo, get P() { return P; } };
})();
</script>
<script>
/* ============================================================
   图片批注：白模图、空镜图、关键帧，在图上框出来写批注；上一张、下一张
   批注存成图片旁边的「图片名_批注.md」；画好框的标注图放在旁边的「图片名_批注截图」文件夹里
   左边文件夹树点一张图就打开；点文件夹，这里把里面的图摆开
   ============================================================ */
(function () {
'use strict';
const Desk = window.Desk;
const { C, FS, h, icon, isComposing, pathEq, byName, stem, toast, confirmDlg, IMG_RE, NOTES_TAIL, SHOTS_TAIL } = Desk;

const KINDS = ['白模', '空镜', '关键帧', '其他'];   // 图的类别：看文件名，名字里没写就看所在的文件夹
const KIND_CLS = { 白模: 'cat-bm', 空镜: 'cat-kj', 关键帧: 'cat-gj', 其他: 'cat-qt' };
const KIND_RE = [['白模', /白模/], ['空镜', /空镜/], ['关键帧', /关键帧|首帧|尾帧/]];
const CATS = ['构图', '人物', '道具', '场景', '光影', '其他'];   // 批注的分类
const MARK = '标注图.jpg';
const MIN_BOX = 0.012;   // 拖得比这还小，就算点了一下

const S = {
  ready: false, view: 'grid',   // grid：一个文件夹里的图；viewer：正在看一张
  dir: null, items: [], subdirs: [], loading: false, listAt: 0, gtok: 0, filter: '全部',
  list: [], i: -1,              // 上一张、下一张就在这一串里走
  v: null, form: null, sel: null, zoom: false, tok: 0, released: null,
};
let V = null;   // 看图的那一块：图、框、底下一排小图

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const TE = new TextEncoder();
const clamp01 = x => Math.max(0, Math.min(1, x));
const pc = x => (Math.round(x * 1000) / 10).toFixed(1) + '%';
const mdEsc = s => s.replace(/^#/gm, '＃');
function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }
function kindOf(path) {
  for (const s of [path[path.length - 1], ...path.slice(-3, -1).reverse()]) for (const [k, re] of KIND_RE) if (re.test(s)) return k;
  return '其他';
}
const placeName = parts => parts && parts.length ? parts[parts.length - 1] : Desk.rootName;
const atTop = parts => !parts.length || (parts.length === 1 && parts[0] === '项目');   // 总文件夹、项目：只列文件夹

/* ---------- 小图：缩成一张小 jpg，按需要才读，同时最多读三张 ---------- */
const THUMBS = new Map(), THUMB_Q = [];
let THUMB_RUN = 0;
function thumbUrl(path) {
  const k = path.join('/');
  if (!THUMBS.has(k)) THUMBS.set(k, new Promise((res, rej) => { THUMB_Q.push({ path, res, rej }); pump(); }));
  return THUMBS.get(k);
}
function pump() {
  while (THUMB_RUN < 3 && THUMB_Q.length) {
    const job = THUMB_Q.shift();
    THUMB_RUN++;
    makeThumb(job.path).then(job.res, e => { THUMBS.delete(job.path.join('/')); job.rej(e); }).finally(() => { THUMB_RUN--; pump(); });
  }
}
async function makeThumb(path) {
  const file = await FS.file(path);
  try {
    const bmp = await createImageBitmap(file, { resizeWidth: 360, resizeQuality: 'medium' });
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0); bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (blob) return URL.createObjectURL(blob);
  } catch (e) { /* 缩不了就用原图 */ }
  return URL.createObjectURL(file);
}
function dropThumb(path) { const k = path.join('/'), p = THUMBS.get(k); if (p) { THUMBS.delete(k); p.then(URL.revokeObjectURL).catch(() => {}); } }
const IO = new IntersectionObserver(ents => { for (const e of ents) if (e.isIntersecting) { IO.unobserve(e.target); e.target.load(); } }, { rootMargin: '400px' });
function thumbEl(path) {
  const img = h('img', { alt: '', decoding: 'async', draggable: 'false' });
  img.load = () => thumbUrl(path).then(u => { img.src = u; }).catch(() => img.remove());
  IO.observe(img);
  return img;
}
/* 整张图：前后几张留着，翻得快 */
const FULL = new Map();
function fullUrl(path) {
  const k = path.join('/');
  let p = FULL.get(k);
  if (p) FULL.delete(k);
  else { p = FS.file(path).then(f => URL.createObjectURL(f)); p.catch(() => FULL.delete(k)); }
  FULL.set(k, p);
  while (FULL.size > 5) { const [k0, p0] = FULL.entries().next().value; FULL.delete(k0); p0.then(URL.revokeObjectURL).catch(() => {}); }
  return p;
}
function dropFull(path) { const k = path.join('/'), p = FULL.get(k); if (p) { FULL.delete(k); p.then(URL.revokeObjectURL).catch(() => {}); } }

/* ---------- 一个文件夹里的图（往下看三层；历史记录、批注截图不看） ---------- */
async function scanImages(parts) {
  const out = [];
  const walk = async (p, sub, depth) => {
    let ents; try { ents = await FS.list(p); } catch (e) { return; }
    const names = new Set(ents.map(e => e.name));
    ents.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'file' ? -1 : 1) || byName(a, b));
    for (const e of ents) {
      if (Desk.hiddenName(e.name)) continue;
      if (e.kind === 'directory') {
        if (depth > 0 && e.name !== '历史记录' && !e.name.endsWith(SHOTS_TAIL)) await walk([...p, e.name], sub ? sub + ' / ' + e.name : e.name, depth - 1);
        continue;
      }
      if (!IMG_RE.test(e.name)) continue;
      const path = [...p, e.name];
      out.push({ path, name: e.name, sub, kind: kindOf(path), noted: names.has(stem(e.name) + NOTES_TAIL) });
    }
  };
  await walk(parts, '', 3);
  return out;
}
const filtered = () => S.filter === '全部' ? S.items : S.items.filter(it => it.kind === S.filter);

/* ---------- 位置：按图的宽高算百分比，从左上角量起 ---------- */
function whereOf(b) {
  if (!b) return '整张';
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, col = cx < 1 / 3 ? 0 : cx < 2 / 3 ? 1 : 2, row = cy < 1 / 3 ? 0 : cy < 2 / 3 ? 1 : 2;
  return [['左上', '正上', '右上'], ['左边', '正中', '右边'], ['左下', '正下', '右下']][row][col] + (b.w || b.h ? ' · 框' : ' · 一个点');
}
function posText(n, v) {
  const b = n.box, px = (x, W) => Math.round(x * W);
  if (!b) return n.rawPos || '整张';
  if (!b.w && !b.h) return `点 左${pc(b.x)} 上${pc(b.y)}（像素 ${px(b.x, v.natW)},${px(b.y, v.natH)}）`;
  return `框 左${pc(b.x)} 上${pc(b.y)} 宽${pc(b.w)} 高${pc(b.h)}（像素 ${px(b.x, v.natW)},${px(b.y, v.natH)} 到 ${px(b.x + b.w, v.natW)},${px(b.y + b.h, v.natH)}）`;
}
const posShort = b => !b ? '整张' : !b.w && !b.h ? `点 ${pc(b.x)}, ${pc(b.y)}` : `${pc(b.x)}, ${pc(b.y)} · ${pc(b.w)}×${pc(b.h)}`;
function parsePos(s) {
  if (!s || /整张/.test(s)) return { box: null };
  const num = re => { const m = re.exec(s); return m ? +m[1] / 100 : null; };
  const x = num(/左\s*([\d.]+)\s*%/), y = num(/上\s*([\d.]+)\s*%/), w = num(/宽\s*([\d.]+)\s*%/), hh = num(/高\s*([\d.]+)\s*%/);
  if (x == null || y == null) return { box: null, raw: s.trim() };   // 读不懂：照原样留着
  return { box: { x: clamp01(x), y: clamp01(y), w: clamp01(w || 0), h: clamp01(hh || 0) } };
}

/* ---------- 批注文件：AI 一读就懂，页面也读得回来 ---------- */
function shown(v, parts) {
  if (Desk.abs) return [Desk.abs, ...parts].join('\\');
  const base = v.notesAt.slice(0, -1);
  let i = 0;
  while (i < base.length && i < parts.length - 1 && base[i] === parts[i]) i++;
  return '../'.repeat(base.length - i) + parts.slice(i).join('/');
}
const marked = v => v.notes.some(n => n.box);
function mdText(v) {
  const L = [`# 图片批注｜${v.name}`, '', `图片：${shown(v, v.path)}`, `类别：${v.kind}`];
  if (v.prompt) L.push(`提示词：${shown(v, v.prompt)}`);
  if (marked(v)) L.push(`标注图：${shown(v, [...v.shotsDir, MARK])}`);
  L.push('', `用户在 ${Desk.PAGE} 里看这张图写的批注。原图 ${v.natW}×${v.natH}；「位置」按图的宽和高算百分比，从左上角量起，括号里是原图上的像素` +
    (marked(v) ? '；标注图上红框旁边的数字就是第几条，先看标注图再读批注。' : '。') + (Desk.abs ? '' : '路径都相对这份批注所在的文件夹。'), '');
  if (v.general.trim()) L.push('## 整体', '批注：' + mdEsc(v.general.trim()), '');
  v.notes.forEach((n, i) => {
    L.push(`## ${i + 1}｜${whereOf(n.box)}`, '位置：' + posText(n, v));
    if (n.cats.length) L.push('分类：' + n.cats.join('、'));
    L.push('批注：' + mdEsc(n.text), '');
  });
  return L.join('\n');
}
function parseMd(md) {
  const out = { general: '', notes: [] }, all = [];
  let cur = null;
  for (const line of String(md).replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const hd = /^##\s*(整体|\d+)\s*(?:[｜|]\s*(.*))?$/.exec(line);
    if (hd) { all.push(cur = { general: hd[1] === '整体', pos: '', cats: [], text: null }); continue; }
    if (!cur) continue;
    if (cur.text !== null) { cur.text += '\n' + line; continue; }   // 批注写在最后，可以有好几行
    let m;
    if ((m = /^批注：(.*)$/.exec(line))) cur.text = m[1];
    else if ((m = /^位置：(.*)$/.exec(line))) cur.pos = m[1];
    else if ((m = /^分类：(.*)$/.exec(line))) cur.cats = m[1].split(/[、，,\/／\s]+/).filter(Boolean);
  }
  for (const x of all) {
    const text = (x.text || '').trim();
    if (!text) continue;
    if (x.general) { out.general = text; continue; }
    const p = parsePos(x.pos);
    out.notes.push({ id: uid(), box: p.box, rawPos: p.raw || '', cats: x.cats, text });
  }
  return out;
}
const markSig = v => JSON.stringify([v.natW, v.natH, ...v.notes.map(n => n.box)]);
async function readMd(v) {
  try {
    const r = await FS.read(v.notesAt), p = parseMd(C.decodeText(r.buf).text);
    v.notes = p.notes; v.general = p.general; v.mdMtime = r.mtime;
  } catch (e) { v.notes = []; v.general = ''; v.mdMtime = 0; }
  v.markSig = await FS.stat([...v.shotsDir, MARK]) ? markSig(v) : '';   // 标注图在，就当它是照现在的框画的
}
/* 标注图：原图上画红框、标号，AI 一看就知道说的是哪里 */
async function markBlob(v) {
  const k = Math.min(1, 2400 / Math.max(v.natW, v.natH)), W = Math.round(v.natW * k), H = Math.round(v.natH * k);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.drawImage(v.img, 0, 0, W, H);
  const L = Math.max(W, H), lw = Math.max(3, Math.round(L / 360)), fs = Math.max(18, Math.round(L / 48));
  g.font = `600 ${fs}px "Microsoft YaHei", "PingFang SC", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const line = (draw, w, color) => { g.lineWidth = w; g.strokeStyle = color; g.beginPath(); draw(); g.stroke(); };
  v.notes.forEach((n, i) => {
    const b = n.box;
    if (!b) return;
    const x = b.x * W, y = b.y * H, w = b.w * W, hh = b.h * H, pt = !b.w && !b.h, r = fs * 0.75;
    const shape = pt ? () => { g.arc(x, y, r, 0, Math.PI * 2); g.moveTo(x - r * 1.6, y); g.lineTo(x - r * 0.5, y); g.moveTo(x + r * 0.5, y); g.lineTo(x + r * 1.6, y); } : () => g.rect(x, y, w, hh);
    line(shape, lw + 3, 'rgba(0, 0, 0, .55)'); line(shape, lw, '#ff3b30');
    const t = String(i + 1), tw = Math.max(fs * 1.2, g.measureText(t).width + fs * 0.6), th = fs * 1.35;
    let lx = pt ? x + r : x - lw / 2, ly = pt ? y - r - th : y - th - lw / 2;
    if (ly < 0) ly = pt ? y + r : y + lw;
    lx = Math.max(0, Math.min(W - tw, lx));
    g.fillStyle = '#d8452f'; g.fillRect(lx, ly, tw, th);
    g.fillStyle = '#fff'; g.fillText(t, lx + tw / 2, ly + th / 2 + 1);
  });
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('标注图没画出来')), 'image/jpeg', 0.9));
}
/* 写进文件；批注全删光就删掉文件。框变了才重画标注图。上一次还没写完的，排在后面接着写 */
function saveNow() {
  const v = S.v;
  if (!v) return Promise.resolve();
  clearTimeout(v.saveT); v.saveT = 0;
  v.q = v.q.then(async () => {
    try {
      if (v.notes.length || v.general.trim()) await FS.write(v.notesAt, TE.encode(mdText(v)));
      else if (await FS.stat(v.notesAt)) await FS.remove(v.notesAt);
      const sig = markSig(v);
      if (sig !== v.markSig) {
        if (marked(v)) await FS.write([...v.shotsDir, MARK], await markBlob(v));
        else {
          try { await FS.remove([...v.shotsDir, MARK]); } catch (e) { /* 本来就没有 */ }
          try { await FS.remove(v.shotsDir); } catch (e) { /* 还有别的文件，或者本来就没有 */ }
        }
        v.markSig = sig;
        Desk.T.refresh(v.dir);
      }
      const st = await FS.stat(v.notesAt);
      v.mdMtime = st ? st.mtime : 0; v.err = '';
    } catch (e) { v.err = e.message; toast('批注没存上：' + e.message, 'err'); }
    if (S.v === v) { paintStatus(); syncNoted(); }
  });
  return v.q;
}
function saveLater() { const v = S.v; clearTimeout(v.saveT); v.saveT = setTimeout(saveNow, 500); }
function syncNoted() {
  const v = S.v, on = !!(v.notes.length || v.general.trim());
  for (const it of S.items) if (pathEq(it.path, v.path)) it.noted = on;
  Desk.T.setNoted(v.path, on);   // 文件夹树上的小红点
  if (V) paintStrip();
}
/* 资产图对应的资产提示词：提示词 下面同样的位置，图名_提示词.txt */
async function promptOf(path) {
  const i = path.lastIndexOf('资产');
  if (i < 0) return null;
  const p = [...path.slice(0, i), '提示词', ...path.slice(i + 1, -1), stem(path[path.length - 1]) + '_提示词.txt'];
  return (await FS.stat(p)) ? p : null;
}

/* ---------- 进来、出去：左边菜单点「图片」 ---------- */
async function enter(m, opts) {
  const first = !S.ready;
  S.ready = true;
  if (opts.open) {   // 文件夹就摆开；图打不开就摆开它所在的文件夹，别留一片空白
    if (!IMG_RE.test(opts.open[opts.open.length - 1])) { await showGrid(opts.open); return; }
    await openAt(opts.open);
    if (!S.v || !pathEq(S.v.path, opts.open)) await showGrid(opts.open.slice(0, -1));
    return;
  }
  if (first) {   // 头一回进来：接着看上次那张；没有就摆开上次的文件夹，再没有就是上次那个项目的 资产
    const rn = Desk.rootName, split = s => s ? s.split('/').filter(Boolean) : null;
    const last = split(localStorage.getItem('antou:img:last:' + rn)), dir = split(localStorage.getItem('antou:img:dir:' + rn));
    if (last && IMG_RE.test(last[last.length - 1]) && await FS.stat(last)) {
      if (dir && Desk.under(last, dir)) { S.dir = dir; S.items = await scanImages(dir); S.subdirs = []; S.listAt = Date.now(); }
      await openAt(last);
      if (!S.v) await showGrid(S.dir || last.slice(0, -1));
      return;
    }
    if (dir && await FS.isDir(dir)) { await showGrid(dir); return; }
    const pj = localStorage.getItem('antou:last:' + rn), a = pj ? ['项目', pj, '资产'] : null;
    await showGrid(a && await FS.isDir(a) ? a : []);
    return;
  }
  if (S.view === 'viewer' && S.v && V) { render(); recheck(); return; }
  await showGrid(S.dir || []);
}
async function leave() {
  if (!(await leaveForm())) return false;
  if (S.v && S.v.saveT) saveNow();
  return true;
}
function reset() {
  S.tok++; S.gtok++;
  closeImage();
  for (const p of THUMBS.values()) p.then(URL.revokeObjectURL).catch(() => {});
  for (const p of FULL.values()) p.then(URL.revokeObjectURL).catch(() => {});
  THUMBS.clear(); FULL.clear(); THUMB_Q.length = 0;
  Object.assign(S, { ready: false, view: 'grid', dir: null, items: [], subdirs: [], loading: false, listAt: 0, filter: '全部', list: [], i: -1, released: null });

  finally { CHECKING = false; }
}

window.Tupian = { S, parseMd, mdText, get V() { return V; } };
})();

/* ---------- 进来、出去 ---------- */

/* 从别的菜单回来：重新看一遍剧本、镜头表、现成的资产，外面改没改 */
async function refresh() {
  const name = F.name;
  if (!name || F.view !== 'board') return;
  try {
    const pj = await Antou.scanProject(name), pool = await loadPool(name);
    if (F.name !== name) return;
    const sig = x => x.order.map(s => { const sl = x.segs.get(s); return s + ':' + [...sl.script, ...sl.shots].map(e => e.name + '@' + e.mtime).join(','); }).join('|');

    F.pj = pj; F.pool = pool;

/* 每两秒看一眼（外壳来叫）：流水线.json 在外面改了就换上；隔几次看一遍剧本、资产清单和提示词 */
async function recheck(force) {
  if (!F.ready || !F.name || (!F.doc && !F.bad) || F.view !== 'board' || !Desk.is('flow') || F.checking) return;
  F.checking = true;
  const name = F.name;
  try {
    const busy = () => dirty() || !!F.saving || typing() || !!POP || !!document.querySelector('.mask:not(.out)');
    if (!busy()) {
      const st = F.exists || await hasFile(name, ['定稿的剧本', FILE]) ? await FS.stat(at([name, '定稿的剧本', FILE])) : null;
      if (F.name !== name) return;
      if ((st ? st.mtime : 0) !== F.mtime && !busy()) {
        const sc = scrollTop();
        if (await load(name, true)) { rerender(sc); toast('流水线在外面改过了，已经换上'); }
        return;

    if (force === true || ++F.ticks % 3 === 0) {
      const changed = await loadSides();
      if (F.name !== name || F.view !== 'board' || !Desk.is('flow')) return;
      if (changed.has('*')) repaintRefs();

      if (changed.size) paintSteps();

  finally { F.checking = false; }
}

  if (!parts.length) return false;

/* ---------- 剧本：AI 照这一场扩写。你写的是剧本段落，AI 写成剧本，再照每个段落设计镜头，出镜头表 ---------- */

  const fin = timeOf(s.剧本定稿);   // 记到秒，文件时间到毫秒：比的时候让一秒
  if (fin && fin + 999 >= d.script.mtime && fin >= timeOf(s.定稿)) return { d, st: 'final' };   // 镜头表等剧本定稿以后再出，定稿不看它

  else body.append(h('span', { class: 'fn-note' + (again ? ' warn' : '') }, again ? '定稿以后又改过。看完没问题，再定一次。' : '点开看，不合适的写批注交给 AI 改。没问题了就定稿，定稿后才能出资产图。'), fin('剧本定稿', 'ink'));
  return nextRow('剧本', body);
}

/* ---------- 资产：这一场出场的人物、道具、场景图各对着哪张图；还没有图的让 AI 出 ---------- */
/* 认资产和提示词那边是一个路子：图放在 资产/全局资产/类别/名字.png；哪个人物、道具对哪张图，记在 流水线.json 的表里（那一行的「资产」） */
function assetsOf(s) {

    const todo = K.multi ? ai.filter(x => aiKey(x) === K.key && x.名称 === n && !x.at) : [];   // 道具：AI 清单里对着这一行、图还没出好的，一个状态一格
    for (const a of todo) out.push({ 类别: K.key, 名称: n, sub: a.文件 ? stateOf(n, a.文件) : '', at: '', 状态: a.状态 || '还没出', 说明: a.说明, own: true });

/* ---------- 提示词：你写、AI 批改，或者 AI 先写一版你批注 ---------- */
const PROMPT_BTN = false;   // 「写提示词」的入口：2026-11-12 他说流水线页面暂时不要这个按钮。要恢复，改成 true。已经写了的稿照样列出来
function promptsRow(s) {
  const seg = s.段, list = promptsOf(seg), body = h('div', { class: 'fn-body' });
  for (const e of list) {

    body.append(h('button', { class: 'fl-pchip', type: 'button', title: draft ? '你写、AI 批改：接着写' : '到「提示词」里看这一份、写批注',
      onclick: () => draft ? openWrite(p) : Desk.setMode('prompt', { open: at(p) }) }, icon(draft ? 'pen' : 'doc'), e.label));
  }

}
/* 你来写的那一份：只有分区名和每一镜的标题，本段事件、每一镜你写；素材、基础设定、本段、保持一致交给 AI 铺底 */
function skeleton(shots, a, b) {
  const out = ['本段事件：', '', '素材', '', '基础设定', '', '本段', '', '分镜', ''];

}

  const fname = () => a === 1 && b === n ? '视频提示词.txt' : (a === b ? '镜头' + a : '镜头' + a + '-' + b) + '_视频提示词.txt';
  const picks = h('div', { class: 'fl-pick' }), prev = h('div', { class: 'fname-prev' }), err = h('div', { class: 'fld-err' });
  const who = Desk.chips([['me', '我来写，AI 铺底、批改'], ['ai', 'AI 先写一版，我批注']], 'me');
  const paint = () => {
    picks.replaceChildren(...shots.map((t, i) => h('button', { type: 'button', class: 'fl-pk' + (i + 1 >= a && i + 1 <= b ? ' on' : ''),
      onclick: () => { const k = i + 1; if (first == null) { a = b = first = k; } else { a = Math.min(first, k); b = Math.max(first, k); first = null; } paint(); } },
      h('b', null, i + 1), t || '没写')));
    prev.textContent = [...dir.slice(1), fname()].join(' / ');
    err.textContent = used.has(fname()) ? '这一份已经有了，回去点它接着写' : '';
  };
  paint();
  const r = await dialog(close => dlgShell('写提示词 · 第' + seg + '场', (fine ? '下面是 AI 照段落设计的镜头表。' : '这一场还没扩写，镜头还没设计，下面先把你的每个段落当一镜；先让 AI 扩写再写更好。') + '一条视频最多十五秒，镜头多就分几条写。默认写全部；只写其中几镜，就点开头那一镜，再点结尾那一镜。',
    [h('div', { class: 'fld' }, h('span', null, '写哪几镜'), picks), h('div', { class: 'fld' }, h('span', null, '谁来写'), who), field('存到', prev), err],
    [h('button', { class: 'btn ghost', onclick: () => close(null) }, '取消'), h('button', { class: 'btn ink', 'data-focus': '', onclick: () => { if (!used.has(fname())) close({ a, b, name: fname(), who: who.get() }); } }, '开始')]));
  if (!r) return;

  await flush();
  if (r.who === 'ai') {   // AI 先写一版：文件由它建，写好了这一行自己多出一份，点开去批注
    await sendAI('写提示词 ' + flowRef() + '｜' + segName(seg) + '｜' + r.name, '交给 AI 了。写好这里自动出现，点它去批注');
    return;
  }
  try {
    if (await hasFile(F.name, p.slice(1))) throw new Error('「' + r.name + '」已经有了');
    await FS.write(at(p), C.encodeText(skeleton(shots, r.a, r.b)));
    if (!(await hasFile(F.name, side.slice(1)))) await FS.write(at(side), C.encodeText(JSON.stringify({ 说明: SIDE_NOTE,
      流水线: '这一份是从「流水线」开的稿：全片的梗概、人物、场景、道具（各自引用了哪张图），和这一场（' + segName(seg) + '）出场的人物道具、主要表达什么、剧本段落，都写在 定稿的剧本/流水线.json 里；扩写过的还有 定稿的剧本/' + segName(seg) + ' 里的剧本、镜头表（照段落设计的镜头）和镜头对应（哪几镜对着哪个段落）。铺底、给关键词、批注都照它们。',
      关键词: {} }, null, 2) + '\n'));
  } catch (e) { toast('没建成：' + e.message, 'err'); return; }
  await loadSides();

  await sendAI('铺底 ' + flowRef() + '｜' + segName(seg) + '｜' + r.name, '跟 AI 说了：素材、基础设定、本段、关键词它来铺，铺好这里自动出现');
  openWrite(p);

/* ---------- 写提示词：把写稿那一页嵌进来（它自己读写文件、自己找 AI） ---------- */

}

}

  const box = h('div', { class: 'fl-wbox' }, h('p', { class: 'fl-wait' }, '正在打开写稿…'));
  mountWrite(box, p);
  return [h('header', { class: 'top' },
    h('div', { class: 'crumb' },
      h('button', { class: 'ptitle', title: '回流水线', onclick: closeWrite }, '‹ 流水线'),
      h('span', { class: 'crumb-seg' }, [F.name, p[2], label, '写提示词'].filter(Boolean).join(' · '))),
    h('div', { class: 'top-right' },
      h('button', { class: 'btn sm ghost', title: '换到「提示词」里看这一份排好的样子、历史版本', onclick: () => Desk.setMode('prompt', { open: at(p) }) }, '到提示词里看'))), box];
}
async function mountWrite(box, p) {
  try {
    if (!LINK.on) throw new Error('写稿要经本机服务打开：在 Claude 里说「打开项目管理」。');
    let html = C.decodeText((await FS.read(WRITE_PAGE)).buf).text;
    if (!/<head[^>]*>/i.test(html)) throw new Error('写稿页不对');
    html = html.replace(/<head[^>]*>/i, m => m + '<base href="' + location.origin + '/">');   // 嵌进来以后，它读写文件还是找这个本机服务
    if (F.write !== p || F.view !== 'write') return;
    if (F.url) URL.revokeObjectURL(F.url);
    F.url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    F.frame = h('iframe', { class: 'fl-frame', title: '写稿', src: F.url + '#open=' + p.map(encodeURIComponent).join('/') });
    box.replaceChildren(F.frame);
  } catch (e) {
    box.replaceChildren(h('div', { class: 'fl-bad' }, h('b', null, '写稿页没打开。'), h('p', null, e.message), h('button', { class: 'btn', onclick: closeWrite }, '回流水线')));
  }
}

window.addEventListener('beforeunload', () => { if (dirty()) save(); });
Desk.MOD.flow = { enter, leave, reset, current, recheck, moved, open: p => openAt(p, true), folder: p => openAt(p, false) };
window.Liushui = { F, load, save, render, openWrite };
})();
</script><!-- 流水线 -->

/* 五样都登记好了：打开总文件夹 */
window.Desk.boot();
</script>
