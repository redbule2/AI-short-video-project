<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案头 · 短视频项目</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='9' fill='%23a83a2c'/%3E%3Crect x='9' y='9' width='46' height='46' rx='5' fill='none' stroke='%23f6e2d6' stroke-opacity='.5' stroke-width='1.5'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23fbf1e6' font-family='KaiTi,STKaiti,serif'%3E%E6%A1%88%3C/text%3E%3C/svg%3E">
<script>
/* 直接双击这个文件打开的（file://）：下面的样式、脚本按本机服务的路径写（/通用工具/…），这样打开会去盘符根下找、找不到，整页空白。
   所以先在这里转：服务开着就经服务重开这一页（它再转去流水线，#open= 照带）；没开就说怎么开。 */
if (location.protocol === 'file:') {
  const SERVICE = 'http://localhost:8766';
  fetch(SERVICE + '/项目管理.html', { mode: 'no-cors', cache: 'no-store' }).then(() => location.replace(SERVICE + '/项目管理.html' + location.hash), () => {
    const m = /^(.+)\/通用工具\/[^/]+$/.exec(decodeURIComponent(location.pathname).replace(/^\/(?=[A-Za-z]:)/, ''));
    const cmd = 'node "' + (m ? m[1] + '/' : '') + '.agents/skills/annotate-live/server.js" open';
    const el = (tag, css, text) => Object.assign(document.createElement(tag), { textContent: text || '' }, { style: css });
    const show = () => {
      const box = el('div', 'max-width: 560px; margin: 80px auto; font: 15px/1.8 "Microsoft YaHei", sans-serif; color: #2a2622');
      const code = el('code', 'display: block; margin: 10px 0; padding: 9px 11px; word-break: break-all; user-select: all; background: #fffdf9; border: 1px solid #e5dccd; border-radius: 6px', cmd);
      const link = Object.assign(el('a', 'color: #a83a2c', '开好了，点这里进流水线'), { href: SERVICE + '/项目管理.html' + location.hash });
      box.append(el('div', 'font-size: 20px; font-weight: 600', '流水线'), el('p', '', '项目管理就是流水线，要先开本机服务。在 Claude 里说「打开项目管理」，或者在命令行运行下面这句（要先装 Node.js）。'), code, link);
      document.body.replaceChildren(box);
      document.body.removeAttribute('class');
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  });
}
</script>
<link rel="stylesheet" href="/通用工具/公用/样式.css">
<style>
/* ============================================================
   案头 · 样式　纸、墨、朱、黛、赭
   颜色、按钮、印章、欢迎页、顶栏、对话框这些各页共用的在 公用/样式.css，这里只放这一页自己的
   ============================================================ */

/* ---------- 文字按钮 ---------- */
.linkbtn {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
  padding: 5px 10px; border: 0; border-radius: 5px; background: none; cursor: pointer;
  font-size: 13px; color: var(--ink-2); text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.linkbtn:hover { background: rgba(255, 253, 249, .55); color: var(--ink); }
.linkbtn.on { color: var(--zhu); }
.files-ul .linkbtn, .cards .linkbtn { padding: 0; color: var(--dai); text-decoration: underline; text-decoration-color: var(--dai-line); text-underline-offset: 3px; }
.files-ul .linkbtn:hover, .cards .linkbtn:hover { background: none; }

/* ---------- 主区 ---------- */
#main { min-width: 0; min-height: 0; height: 100vh; display: flex; flex-direction: column; }

/* ---------- 工作区 ---------- */
.stage { flex: 1; min-height: 0; display: flex; }
.canvas { flex: 1; min-width: 0; overflow: auto; padding: 34px 40px 140px; }

/* ---------- 纸面 ---------- */
.sheet {
  position: relative; max-width: 780px; margin: 0 auto;
  padding: 58px 76px 40px; border-radius: 3px;
  background: var(--sheet); border: 1px solid rgba(214, 202, 182, .7); box-shadow: var(--shadow);
  animation: rise .28s ease both;
}
.sheet::after { content: ''; position: absolute; inset: 11px; border: 1px solid var(--tc-line); border-radius: 2px; pointer-events: none; opacity: .55; }
.sheet.k-script { --tc: var(--zhu); --tc-soft: var(--zhu-soft); --tc-line: var(--zhu-line); }
.sheet.k-shots { --tc: var(--dai); --tc-soft: var(--dai-soft); --tc-line: var(--dai-line); }
.sheet.k-prompt { --tc: var(--zhe); --tc-soft: var(--zhe-soft); --tc-line: var(--zhe-line); }
.sheet.mini { max-width: none; padding: 30px 26px 22px; box-shadow: none; font-size: 13px; animation: none; }
.sheet.mini::after { inset: 6px; }
.sheet.empty-sheet { text-align: center; padding: 70px 60px 60px; }
.stamp {
  position: absolute; top: 30px; right: 34px; writing-mode: vertical-rl;
  padding: 7px 4px; border: 1.5px solid var(--zhu); border-radius: 3px; color: var(--zhu);
  font: 13px/1 var(--kai); letter-spacing: .25em; opacity: .7; transform: rotate(6deg);
}
.doc-title { text-align: center; margin-bottom: 36px; }
.doc-kicker { font: 13px var(--kai); color: var(--tc); letter-spacing: .4em; margin-right: -.4em; margin-bottom: 12px; }
.doc-seg { font: 600 30px/1.3 var(--serif); letter-spacing: .12em; margin-right: -.12em; }
.doc-name { margin-top: 8px; font: 17px/1.5 var(--serif); color: var(--ink-2); letter-spacing: .1em; }
.ornament { width: 180px; height: 9px; margin: 18px auto 0; display: flex; align-items: center; }
.ornament::before, .ornament::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--line-2)); }
.ornament::after { background: linear-gradient(to left, transparent, var(--line-2)); }
.ornament span { width: 6px; height: 6px; margin: 0 10px; border: 1px solid var(--tc); transform: rotate(45deg); opacity: .75; }
.sheet-foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--ink-4); letter-spacing: .05em; word-break: break-all; }
.empty-say { margin: 34px 0 24px; font: 17px var(--kai); color: var(--ink-2); letter-spacing: .12em; }
.empty-acts { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }

/* ---------- 横幅、文件条 ---------- */
.banner {
  max-width: 780px; margin: 0 auto 14px; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 7px; font-size: 13px; color: var(--ink-2);
  background: #fbf2e1; border: 1px solid #ecd8b2;
}
.banner span { flex: 1; }
.banner.soft { background: rgba(236, 229, 216, .7); border-color: var(--line); }
.files { max-width: 780px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tabs.kinds { width: max-content; max-width: 100%; margin: 0 auto 16px; }   /* 剧本、镜头表两样之间换 */
.fchip {
  padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px; letter-spacing: .04em;
  border: 1px solid var(--line); background: rgba(255, 253, 249, .65); color: var(--ink-2); transition: all .15s;
}
.fchip:hover { border-color: var(--line-2); color: var(--ink); }
.fchip.on { background: var(--ink); border-color: var(--ink); color: #f7f1e6; }

/* ---------- 分区 ---------- */
.sec { position: relative; margin-top: 32px; }
.sec-head { margin-top: 0; padding: 12px 20px 10px; border-radius: 4px; background: var(--tc-soft); }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font: 15px var(--kai); color: var(--tc); letter-spacing: .3em; }
.sec-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--line-2), transparent); }
.sec-no { width: 23px; height: 23px; flex: none; display: grid; place-items: center; border: 1px solid var(--tc-line); border-radius: 50%; font: 12px/1 var(--serif); letter-spacing: 0; }
.sec-name { white-space: nowrap; }
.sec-empty { margin: 4px 0 8px; font: 13.5px var(--kai); color: var(--ink-4); letter-spacing: .04em; }
.sec-missing {
  margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; border: 1px dashed var(--line-2); border-radius: 7px;
  font: 14px var(--kai); color: var(--ink-3); letter-spacing: .06em;
}

/* ---------- 一行 ---------- */
.blist { display: flex; flex-direction: column; }
.blk { position: relative; margin: 0 -12px; padding: 4px 12px; border-radius: 6px; transition: background .15s, box-shadow .2s; }
.nt { cursor: pointer; }
.nt:hover { background: rgba(120, 98, 70, .045); }
.flash { animation: flash 1.1s ease; }

/* 红批：删掉的朱笔划去，添上的朱笔楷书；改过的段落左边一道朱线 */
del { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--zhu); text-decoration-thickness: 1.5px; }
ins { color: var(--zhu); text-decoration: none; font-family: var(--kai); font-size: 1.04em; }
.blk.red::before { content: ''; position: absolute; left: 2px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--zhu); opacity: .55; }
.gone { position: relative; padding: 4px 0; font: 15.5px/1.85 var(--serif); }
.gone::before { content: ''; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--zhu); opacity: .3; }
.k-prompt .gone { font-size: 14.5px; }

/* 批注：朱笔写在段落下面；整体批注是「总批」 */
.note {
  position: relative; margin: 4px 0; padding: 5px 12px 6px 34px; border-radius: 4px;
  background: rgba(168, 58, 44, .05); color: var(--zhu); text-align: left;
  font: 15px/1.8 var(--kai); letter-spacing: .02em; white-space: pre-wrap; word-break: break-word;
}
.note::before {
  content: '批'; position: absolute; left: 10px; top: 8px; width: 16px; height: 16px; display: grid; place-items: center;
  border-radius: 3px; background: var(--zhu); color: #fff8f2; font: 11px/1 var(--kai);
}
.k-prompt .note { font-size: 14px; }
.gnote { margin: -14px auto 26px; text-align: center; font: 13px var(--kai); color: var(--ink-4); letter-spacing: .2em; cursor: pointer; transition: color .15s; }
.gnote:hover { color: var(--zhu); }
.gnote.has { letter-spacing: 0; }
.gnote.has .note::before { content: '总'; }

.view { display: flex; align-items: baseline; gap: 14px; min-width: 0; font: 15.5px/1.85 var(--serif); }
.k-prompt .view { font-size: 14.5px; }
.val { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.lab { flex: none; font: 14px/1.85 var(--kai); color: var(--tc); letter-spacing: .1em; }
.r-scene .lab, .r-cast .lab, .r-meta .lab { width: 3.1em; text-align-last: justify; letter-spacing: 0; }
.r-meta .lab { width: auto; min-width: 3.1em; }
.val.scene { display: flex; flex-wrap: wrap; align-items: center; }
.sep { display: inline-block; width: 1px; height: .95em; margin: 0 13px; background: var(--line-2); }
.val.cast { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.cast-i { display: inline-flex; align-items: baseline; gap: 6px; padding: 0 11px; border-radius: 999px; background: rgba(255, 253, 249, .9); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.85; }
.cast-i b { font-weight: 600; }
.cast-i span { font: 12.5px var(--sans); color: var(--ink-3); }
/* 剧本正文按剧本的排法：动作整段，不显示 △；台词居中，角色名下面是表演提示，再下面是台词；字幕、音效居中 */
.r-action .view { display: block; }
.r-action .val { display: inline; }
.size { display: inline-block; margin-right: .7em; padding: 0 .55em; border: 1px solid var(--tc-line); border-radius: 3px; font: 12.5px/1.65 var(--kai); color: var(--tc); letter-spacing: .12em; vertical-align: 1px; }
.r-line .view { display: flex; flex-direction: column; align-items: center; gap: 0; max-width: 31em; margin: 8px auto; text-align: center; }
.who { font: 600 14.5px/1.7 var(--serif); letter-spacing: .3em; margin-right: -.3em; }
.how { font: 13px/1.6 var(--kai); color: var(--ink-3); }
.how::before { content: '（'; } .how::after { content: '）'; }
.say { white-space: pre-wrap; word-break: break-word; }
.k-script .r-sub .view, .k-script .r-sfx .view { justify-content: center; gap: 10px; }
.k-script .r-sub .val, .k-script .r-sfx .val { flex: none; }
.pill { flex: none; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 999px; font: 11.5px/1.75 var(--sans); letter-spacing: .12em; color: var(--ink-2); transform: translateY(-1px); }
.r-sub .pill { color: var(--dai); border-color: var(--dai-line); }
.r-sfx .pill { color: var(--zhe); border-color: var(--zhe-line); }
.r-plain .view { color: var(--ink-2); }
.k-script .r-plain .view::before { content: '·'; flex: none; width: 1em; font: 700 15px var(--serif); color: var(--jin); }
.r-note .view { font-family: var(--kai); font-size: 14.5px; color: var(--ink-2); }
.hint { color: var(--ink-4); font-family: var(--kai); font-size: .93em; letter-spacing: .03em; }
.r-blank { padding-top: 0; padding-bottom: 0; }
.r-blank .view { height: 14px; }
/* 提示词里的行 */
.r-pfield .view { display: block; }
.r-pfield .lab { display: inline; margin-right: .2em; font: 13px/1 var(--sans); letter-spacing: .02em; }
.r-pfield .lab::after { content: '：'; }
.r-pfield .val { display: inline; }
.k-prompt .r-sub .view { margin-top: 6px; font: 13.5px var(--kai); color: var(--tc); letter-spacing: .3em; }
.k-prompt .r-sub .view::before { content: ''; width: 14px; height: 1px; background: var(--tc-line); align-self: center; }
/* 镜头表旧格式里的行 */
.k-shots .r-field .lab { font: 13px/2 var(--sans); }
.k-shots .oldbody .view { font-size: 13.5px; color: var(--ink-2); }
/* 改过的一段：照原样整行显示红批；台词、字幕、音效还是居中 */
.blk.red .view { display: block; }
.blk.red .view::before { content: none; }
.r-line.red .view, .k-script .r-sub.red .view, .k-script .r-sfx.red .view { text-align: center; }

/* 高亮 */
.tk-say { color: #8a3324; background: rgba(168, 58, 44, .055); border-radius: 3px; }
.tk-sfx { color: var(--dai); background: var(--dai-soft); border-radius: 3px; }
.tk-ref { color: var(--zhe); font: 600 .9em var(--sans); letter-spacing: .02em; }
.tk-ref.pic { cursor: zoom-in; border-bottom: 1px dashed currentColor; border-radius: 2px; }
.tk-ref.pic:hover { background: var(--zhe-soft); }
.tk-ref.pic.av { cursor: pointer; }
.tk-br { color: var(--ink-3); }
.tk-ph { color: #7a5b2b; background: rgba(179, 146, 86, .14); border-bottom: 1px dashed var(--jin); }
.tk-q { color: var(--dai); }

/* ---------- 镜头表 ---------- */
.oldnote {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  margin-bottom: 24px; padding: 12px 16px; border-radius: 7px;
  background: var(--tc-soft); border: 1px solid var(--tc-line); font-size: 13px; color: var(--ink-2);
}
.oldnote b { color: var(--ink); margin-right: 4px; }
.oldbox { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--line); }
.oldtog { display: inline-flex; align-items: center; gap: 6px; padding: 3px 0; border: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-3); letter-spacing: .04em; }
.oldtog:hover { color: var(--ink); }
.oldtog em { font-style: normal; color: var(--ink-4); }
.oldtog .ic { width: 12px; height: 12px; transition: transform .2s; }
.oldbox.open .oldtog .ic { transform: rotate(90deg); }
.oldbody:empty { display: none; }
.oldbody { padding: 4px 0 2px; }
.sec-shots { margin-top: 4px; }
.shotlist { list-style: none; margin: 0; padding: 0; }
.srow {
  display: grid; grid-template-columns: 4.4em 1.1em minmax(0, 1fr); align-items: center; column-gap: 6px;
  margin: 0 -14px; padding: 9px 14px; border-radius: 7px; border-bottom: 1px dotted var(--line-2);
  transition: background .15s;
}
.sno { font: 15px/1.5 var(--kai); color: var(--tc); letter-spacing: .06em; white-space: nowrap; }
.sbar { color: var(--ink-4); text-align: center; }
.stitle { font: 16px/1.6 var(--serif); letter-spacing: .06em; }
.shotlist:not(.ro) .stitle { font-size: 18px; letter-spacing: .08em; }
.srow .oldbox, .srow > .note { grid-column: 3 / -1; margin: 6px 0 2px; }
.srow .was { grid-column: 3; font: 14px/1.5 var(--serif); letter-spacing: .06em; }
.srow.new .stitle, .srow.chg .stitle { color: var(--zhu); font-family: var(--kai); }
.shotlist > .gone { padding-left: 5.6em; }
.shotlist.ro .srow { margin: 0; padding: 7px 0; }
.mini .sno { font-size: 14px; }
.mini .stitle { font-size: 14.5px; }

/* ---------- 提示词的分镜 ---------- */
.pshots { display: flex; flex-direction: column; gap: 18px; margin-top: 14px; }
.p-shot {
  position: relative; padding: 12px 22px 14px; border: 1px solid var(--line); border-radius: 9px;
  background: linear-gradient(to bottom, rgba(244, 239, 230, .55), rgba(255, 253, 249, 0) 70px);
}
.shot-h { display: flex; align-items: center; gap: 12px; margin: 0 -4px 8px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
.shot-no { flex: none; padding: 1px 10px; border-radius: 4px; background: var(--tc); color: #fff9f1; font: 13.5px/1.6 var(--kai); letter-spacing: .15em; }
.shot-title { flex: 1; min-width: 0; font: 600 16px/1.5 var(--serif); letter-spacing: .05em; }

/* ---------- 右栏 ---------- */
.rail { flex: none; width: 300px; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: rgba(246, 241, 233, .6); transition: width .25s ease; }
.wide-rail .rail { width: 440px; }
.rail-tabs { flex: none; display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.rail-tab {
  flex: 1; margin-bottom: -1px; padding: 8px 0 9px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer;
  font-size: 12.5px; color: var(--ink-3); letter-spacing: .06em; white-space: nowrap; transition: color .15s, border-color .15s;
}
.rail-tab:hover { color: var(--ink); }
.rail-tab.on { color: var(--ink); border-bottom-color: var(--tc); }
.rail-tab.has { color: var(--zhu); }
.rail-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 48px; }
.outline { display: flex; flex-direction: column; gap: 1px; }
.ol-i {
  width: 100%; min-width: 0; display: flex; align-items: baseline; gap: 8px;
  padding: 4px 8px; border: 0; border-radius: 5px; background: none; cursor: pointer; text-align: left;
  font-size: 12.5px; color: var(--ink-2);
}
.ol-i:hover { background: rgba(255, 253, 249, .85); }
.ol-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-s { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); }
.ol-i.ol-sec { margin-top: 10px; font: 14px var(--kai); color: var(--tc); letter-spacing: .08em; }
.ol-i.ol-sec:first-child { margin-top: 0; }
.ol-i.ol-sec .ol-s { margin-left: auto; flex: none; font: 11px var(--sans); color: var(--ink-4); letter-spacing: 0; }
.ol-i.ol-beat, .ol-i.ol-shot { padding-left: 18px; }
.ol-i.ol-beat .ol-l { flex: none; min-width: 2.6em; max-width: 5em; color: var(--ink-3); font-size: 11.5px; }
.ol-i.ol-beat.r-line .ol-l { color: var(--ink); font-weight: 600; }
.ol-i.ol-shot .ol-l { flex: 1; font-family: var(--serif); font-size: 13px; }
.ol-i.over .ol-l, .ol-i.over .ol-s { color: var(--zhu); }
.lint-ok { padding: 44px 10px; text-align: center; font: 14px var(--kai); color: var(--ink-3); letter-spacing: .06em; }
.lint-ok .seal { margin: 0 auto 16px; }
.lint { display: flex; flex-direction: column; gap: 6px; }
.lint-h { margin: 8px 0 2px; padding: 0; border: 0; background: none; text-align: left; font-size: 12px; color: var(--ink-3); letter-spacing: .2em; }
.lint-h:first-child { margin-top: 0; }
.lint-h.tog { cursor: pointer; }
.lint-h.tog::after { content: ' ▾'; }
.lint-more { display: none; flex-direction: column; gap: 6px; }
.lint-more.open { display: flex; }
.lint > p { margin-top: 12px; }
.issue {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); border-radius: 7px; background: var(--sheet);
  font-size: 12.5px; line-height: 1.65; color: var(--ink-2); transition: border-color .15s;
}
.issue:hover { border-color: var(--line-2); color: var(--ink); }
.lv { flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--ink-4); }
.issue.warn .lv { background: var(--zhu); }
.issue.info .lv { background: var(--jin); }
.compare { display: flex; flex-direction: column; gap: 12px; }
.cmp-h { font: 13px var(--kai); color: var(--ink-3); letter-spacing: .3em; }
.cmp-imgbtn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.cmp-imgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cmp-imgs img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }
.history { display: flex; flex-direction: column; gap: 8px; }
.history > p { margin-bottom: 4px; line-height: 1.7; }
.hist-i {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 8px 7px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet);
  font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.hist-empty { padding: 28px 0; text-align: center; font: 14px var(--kai); color: var(--ink-4); }
.nlist { display: flex; flex-direction: column; gap: 8px; }
.nlist > p { line-height: 1.8; }
.nl-i {
  width: 100%; display: flex; flex-direction: column; gap: 3px; padding: 9px 12px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); font-size: 12.5px; color: var(--ink-2); transition: border-color .15s;
}
.nl-i:hover { border-color: var(--zhu-line); }
.nl-w { font: 12px var(--kai); color: var(--ink-3); letter-spacing: .08em; }
.nl-t { color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nl-n { font: 14px/1.7 var(--kai); color: var(--zhu); white-space: pre-wrap; word-break: break-word; }
.nl-i.lost { cursor: default; border-style: dashed; }
.nl-i.lost .btn { align-self: flex-end; }

/* ---------- 目录 ---------- */
.ov { max-width: 1000px; margin: 0 auto; animation: rise .3s ease both; }
.ov-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line-2); }
.ov-kicker { margin-bottom: 10px; font: 13px var(--kai); color: var(--zhu); letter-spacing: .5em; }
.ov-title { font: 600 32px/1.3 var(--serif); letter-spacing: .1em; }
.ov-stats { margin-top: 8px; font-size: 13px; color: var(--ink-3); letter-spacing: .06em; word-spacing: .4em; }
.toc { display: flex; flex-direction: column; }
.toc-row {
  display: grid; grid-template-columns: 7.2em minmax(0, 1fr) auto; align-items: center; gap: 24px;
  margin: 0 -14px; padding: 17px 14px; border-radius: 8px; border-bottom: 1px dotted var(--line-2); cursor: pointer;
  transition: background .15s;
}
.toc-row:hover { background: rgba(255, 253, 249, .75); }
.toc-seg { font: 18px var(--kai); color: var(--zhu); letter-spacing: .06em; white-space: nowrap; }
.toc-desc { min-width: 0; }
.toc-name { display: flex; align-items: baseline; gap: 10px; font: 17px/1.5 var(--serif); letter-spacing: .05em; }
.toc-n { flex: none; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; font: 11px/1.7 var(--sans); color: var(--ink-3); letter-spacing: .04em; }
.toc-desc small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }
.toc-desc small.syn { font: 13.5px/1.7 var(--kai); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.toc-docs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.dchip {
  padding: 2px 11px; border-radius: 999px; border: 1px solid; background: var(--sheet); cursor: pointer;
  font-size: 12px; letter-spacing: .06em; white-space: nowrap; transition: background .15s;
}
.dchip.script { color: var(--zhu); border-color: var(--zhu-line); }
.dchip.shots { color: var(--dai); border-color: var(--dai-line); }
.dchip.prompt { color: var(--zhe); border-color: var(--zhe-line); }
.dchip.script:hover { background: var(--zhu-soft); }
.dchip.shots:hover { background: var(--dai-soft); }
.dchip.prompt:hover { background: var(--zhe-soft); }
.dchip.combined { border-style: dashed; background: transparent; }
.dchip.none { color: var(--ink-4); border-color: var(--line); border-style: dashed; background: transparent; }
.dchip.noted::after { content: ''; display: inline-block; width: 5px; height: 5px; margin-left: 6px; border-radius: 50%; background: var(--zhu); vertical-align: 2px; }
.card.pending { margin-top: 22px; border-color: var(--zhu-line); }
.card.pending h4 { color: var(--zhu); }
.toc-empty { padding: 64px 0 40px; text-align: center; color: var(--ink-3); }
.big { margin-bottom: 10px; font: 22px var(--serif); color: var(--ink-2); letter-spacing: .2em; }
.toc-note { margin-top: 26px; font-size: 12.5px; line-height: 1.8; color: var(--ink-3); letter-spacing: .04em; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; margin-top: 40px; }
.card { padding: 16px 20px 18px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 253, 249, .78); }
.card h4 { margin: 0 0 12px; font: normal 15px var(--kai); color: var(--ink-2); letter-spacing: .3em; }
.card.warn h4 { color: var(--zhu); }
.card .btn { margin-top: 4px; }
.dirs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dir { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 12.5px; background: var(--paper); }
.dir .ic { width: 12px; height: 12px; }
.dir.ok { color: var(--dai); }
.dir.miss { color: var(--zhu); background: var(--zhu-soft); }
.warns { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.75; color: var(--ink-2); }
.warns li { margin: 3px 0; }
.files-ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.files-ul li { margin: 5px 0; }

/* ---------- 代码 ---------- */
code { padding: 1px 6px; border-radius: 4px; background: var(--paper-2); font: 12.5px var(--mono); color: var(--ink); }

/* ---------- 对话框 ---------- */
.fname-prev { padding: 8px 12px; border-radius: 7px; background: var(--paper); font: 12.5px/1.6 var(--sans); color: var(--ink-2); word-break: break-all; }
.mdview { max-height: 62vh; overflow: auto; margin: 0; padding: 14px 18px; border-radius: 7px; background: var(--paper); font: 13px/1.85 var(--sans); white-space: pre-wrap; word-break: break-word; }
.lightbox { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: zoom-out; }
.lightbox img, .lightbox video { max-width: 92vw; max-height: 84vh; border-radius: 6px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); }
.lightbox video { background: #000; cursor: default; outline: none; }
.lightbox audio { width: min(560px, 92vw); cursor: default; }
.lb-cap { font-size: 12.5px; color: #f5eee3; letter-spacing: .04em; text-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
.lb-how { font-size: 11.5px; color: rgba(245, 238, 227, .75); letter-spacing: .04em; }
.pick-lab { margin: 4px 0 8px; font-size: 12.5px; color: var(--ink-3); letter-spacing: .08em; }
.pick-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; max-height: 52vh; overflow: auto; margin-bottom: 12px; }
.pick-img { display: flex; flex-direction: column; gap: 5px; padding: 0; border: 0; background: none; cursor: zoom-in; font: 12px/1.4 var(--sans); color: var(--ink-2); text-align: left; word-break: break-all; }
.pick-img img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); background: var(--paper); }
.pick-img:hover img { border-color: var(--line-2); }
.pick-files { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow: auto; margin-bottom: 12px; }
.pick-file { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font: 12.5px/1.5 var(--sans); color: var(--ink-2); text-align: left; word-break: break-all; }
.pick-file:hover { border-color: var(--ink-4); color: var(--ink); }

/* ---------- 窄屏 ---------- */
@media (max-width: 1240px) {
  .rail { width: 264px; }
  .wide-rail .rail { width: 360px; }
  .sheet { padding: 50px 52px 36px; }
  .canvas { padding: 28px 28px 120px; }
  /* 右边窗格这类窄地方：顶栏收紧，再挤就换行，按钮不被切掉 */
  .top { gap: 12px; padding: 6px 16px 6px 20px; flex-wrap: wrap; height: auto; min-height: 60px; }
  .tab { padding: 5px 11px 5px 10px; letter-spacing: .08em; }
}
@media (max-width: 980px) {
  #main.m-pm .rail { display: none; }
}
.toc-desc small.syn.only { margin-top: 0; font: 15px/1.75 var(--kai); color: var(--ink); }

/* ---------- 批改窗 ---------- */
.pen-mask {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 3vh 3vw;
  background: rgba(42, 36, 30, .36); backdrop-filter: blur(3px); animation: fade .2s ease both;
}
.pen {
  position: relative; width: min(1040px, 100%); max-height: 94vh; overflow: auto;
  display: flex; flex-direction: column; padding: 32px 56px 22px;
  background: var(--sheet); border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(214, 202, 182, .8), 0 40px 90px -30px rgba(40, 28, 16, .55);
  animation: rise .24s ease both;
}
.pen.k-script { --tc: var(--zhu); --tc-soft: var(--zhu-soft); --tc-line: var(--zhu-line); }
.pen.k-shots { --tc: var(--dai); --tc-soft: var(--dai-soft); --tc-line: var(--dai-line); }
.pen.k-prompt { --tc: var(--zhe); --tc-soft: var(--zhe-soft); --tc-line: var(--zhe-line); }
.pen-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.pen-where { font: 14.5px var(--kai); color: var(--tc); letter-spacing: .12em; }
.pen-at { font: 12px var(--sans); color: var(--ink-4); font-variant-numeric: tabular-nums; letter-spacing: .1em; }
.pen-lab { display: flex; align-items: center; gap: 12px; margin: 8px 0 10px; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .5em; }
.pen-lab::after { content: ''; flex: 1; order: 1; height: 1px; background: linear-gradient(to right, var(--line-2), transparent); }
.pen-lab .btn { order: 2; margin: -4px 0; }
.pen-red {
  min-height: 2em; max-height: 30vh; overflow: auto; margin-bottom: 14px; padding: 2px 2px 2px 18px;
  border-left: 2px solid var(--zhu-line); font: 17px/2 var(--serif); color: var(--ink-2); white-space: pre-wrap; word-break: break-word;
}
.pen-ta {
  display: block; width: 100%; min-height: 24vh; max-height: 46vh; padding: 16px 20px; resize: none; overflow: auto;
  border: 1px solid var(--line); border-radius: 6px; outline: 0; background: #fffefa;
  font: 19px/1.9 var(--kai); color: var(--zhu); white-space: pre-wrap; transition: border-color .15s, box-shadow .15s;
}
.pen-ta::placeholder { color: var(--ink-4); font-size: 16px; }
.pen-ta:focus { border-color: var(--zhu-line); box-shadow: 0 0 0 4px var(--zhu-soft); }
.pen-cap { margin-top: 8px; font-size: 12px; color: var(--ink-4); letter-spacing: .04em; }
.pen-f { display: flex; align-items: center; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.pen-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.pen-acts .btn.ink { padding: 8px 26px; }
.btn[hidden] { display: none; }
.btn.clean { color: var(--zhu); }
.red-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--zhu); }

/* ============================================================
   审片、图片共用：暗色放映区、右栏的批注卡片
   ============================================================ */
/* ---------- 顶栏 ---------- */
#main.m-av .top { flex: none; height: 60px; display: flex; align-items: center; gap: 20px; padding: 0 22px 0 30px; border-bottom: 1px solid var(--line); background: rgba(250, 246, 239, .6); }
#main.m-av .crumb { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
#main.m-av .ptitle { font: 600 18px/1.3 var(--serif); letter-spacing: .08em; white-space: nowrap; }
#main.m-av .crumb-seg { min-width: 0; font: 15px var(--kai); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main.m-av .crumb-seg::before { content: '／'; margin-right: 10px; color: var(--ink-4); }
#main.m-av .top-right { flex: none; display: flex; align-items: center; gap: 10px; }
#main.m-av .status { display: flex; align-items: center; gap: 7px; margin-right: 6px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
#main.m-av .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
#main.m-av .status.noted { color: var(--zhu); }
#main.m-av .status.noted .dot { background: var(--zhu); }
#main.m-av .status.err { color: var(--zhu); font-weight: 600; }

/* ---------- 放映区 ---------- */
#main.m-av .stage { flex: 1; min-height: 0; display: flex; }
#main.m-av .deck { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--night); color: var(--night-ink); }
#main.m-av .screen { flex: 1; min-height: 0; position: relative; padding: 16px 22px 8px; }
#main.m-av .vid { display: block; width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
#main.m-av .bar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 22px 2px; }
#main.m-av .ctl { width: 36px; height: 32px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--night-ink); cursor: pointer; transition: background .15s; }
#main.m-av .ctl:hover { background: rgba(255, 255, 255, .09); }
#main.m-av .ctl .ic { width: 17px; height: 17px; }
#main.m-av .clock { display: flex; align-items: baseline; gap: 12px; margin: 0 14px 0 8px; white-space: nowrap; }
#main.m-av .tc { font: 15px var(--mono); font-variant-numeric: tabular-nums; color: #f6efe2; letter-spacing: .02em; }
#main.m-av .fr { font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--night-ink-2); }
#main.m-av .rates { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(255, 255, 255, .06); }
#main.m-av .rate { padding: 3px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--night-ink-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
#main.m-av .rate:hover { color: var(--night-ink); }
#main.m-av .rate.on { background: var(--night-ink); color: var(--night); }
#main.m-av .addbtn { margin-left: auto; }
#main.m-av .track { flex: none; position: relative; height: 34px; margin: 4px 22px 0; cursor: pointer; touch-action: none; }
#main.m-av .groove { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .15); overflow: hidden; }
#main.m-av .fill { height: 100%; width: 0; background: var(--jin); }
#main.m-av .ph { position: absolute; top: 11px; width: 2px; height: 18px; margin-left: -1px; border-radius: 1px; background: #fff; pointer-events: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
#main.m-av .marks { position: absolute; inset: 0; pointer-events: none; }
#main.m-av .mk { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; padding: 0; border: 2px solid var(--night); border-radius: 50%; background: #d4614f; cursor: pointer; pointer-events: auto; }
#main.m-av .mk.range { margin-left: 0; height: 9px; top: 4px; border-radius: 5px; border-width: 1px; min-width: 6px; background: rgba(212, 97, 79, .75); }
#main.m-av .mk:hover, #main.m-av .mk.on { background: #ff8a72; box-shadow: 0 0 0 2px rgba(255, 138, 114, .35); }
#main.m-av .mk.editing { background: var(--jin); }
#main.m-av .keys { flex: none; padding: 4px 22px 12px; font-size: 11.5px; color: #6f665c; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main.m-av .blank { flex: 1; display: grid; place-items: center; font: 17px var(--kai); color: var(--ink-3); letter-spacing: .12em; }

/* ---------- 右栏：批注 ---------- */
#main.m-av .rail { flex: none; width: 384px; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: rgba(246, 241, 233, .85); }
#main.m-av .rail-h { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
#main.m-av .prow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); letter-spacing: .06em; white-space: nowrap; }
#main.m-av .sel { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; font-size: 13px; color: var(--ink); cursor: pointer; }
#main.m-av .sel:focus { border-color: var(--ink-3); }
#main.m-av .gen {
  display: block; width: 100%; min-height: 34px; max-height: 30vh; padding: 6px 10px; resize: none; overflow: auto;
  border: 1px dashed var(--line-2); border-radius: 6px; outline: 0; background: rgba(255, 253, 249, .6);
  font: 14.5px/1.75 var(--kai); color: var(--zhu);
}
#main.m-av .gen::placeholder { color: var(--ink-4); }
#main.m-av .gen:focus { border-style: solid; border-color: var(--zhu-line); background: #fffefa; }
#main.m-av .rail-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 60px; }
#main.m-av .list-h { margin: 4px 2px 8px; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .3em; }
#main.m-av .list-empty { margin: 6px 2px; font: 14px/1.9 var(--kai); color: var(--ink-3); }

/* 写批注的卡片 */
#main.m-av .form { margin-bottom: 18px; padding: 14px 16px 12px; border: 1px solid var(--zhu-line); border-radius: 9px; background: var(--sheet); box-shadow: var(--shadow); animation: rise .2s ease both; }
#main.m-av .form-h { margin-bottom: 10px; font: 15px var(--kai); color: var(--zhu); letter-spacing: .2em; }
#main.m-av .frow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin: 7px 0; }
#main.m-av .flab { width: 2.4em; flex: none; font: 13px var(--kai); color: var(--ink-3); letter-spacing: .1em; }
#main.m-av .fthumb { width: 64px; height: 36px; flex: none; border-radius: 3px; object-fit: cover; background: var(--paper-2); border: 1px solid var(--line); }
#main.m-av .ftime { font: 14px var(--mono); font-variant-numeric: tabular-nums; }
#main.m-av .fnone { font: 13px var(--kai); color: var(--ink-4); }
#main.m-av .fgo { margin-left: auto; }
#main.m-av .chips { display: flex; flex-wrap: wrap; gap: 5px; }
#main.m-av .chip { padding: 2px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; font-size: 12.5px; color: var(--ink-2); transition: all .15s; }
#main.m-av .chip:hover { border-color: var(--ink-4); color: var(--ink); }
#main.m-av .chip.on { background: var(--ink); border-color: var(--ink); color: #f7f1e6; }
#main.m-av .inp { flex: 1; min-width: 0; padding: 5px 9px; border: 1px solid var(--line-2); border-radius: 6px; outline: 0; background: #fff; font-size: 13px; }
#main.m-av .inp:focus { border-color: var(--ink-3); }
#main.m-av .inp::placeholder { color: var(--ink-4); }
#main.m-av .fta {
  display: block; width: 100%; min-height: 96px; max-height: 40vh; margin-top: 10px; padding: 10px 12px; resize: none; overflow: auto;
  border: 1px solid var(--line); border-radius: 6px; outline: 0; background: #fffefa;
  font: 16px/1.8 var(--kai); color: var(--zhu);
}
#main.m-av .fta::placeholder { color: var(--ink-4); font-size: 14.5px; }
#main.m-av .fta:focus { border-color: var(--zhu-line); box-shadow: 0 0 0 3px var(--zhu-soft); }
#main.m-av .form-f { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
#main.m-av .form-f .sp { flex: 1; }
#main.m-av .form-f em { font-style: normal; font-size: 11px; color: var(--ink-4); }

/* 一条批注 */
#main.m-av .ni {
  display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; margin-bottom: 8px; padding: 8px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
#main.m-av .ni:hover { border-color: var(--line-2); }
#main.m-av .ni.on { border-color: var(--zhu-line); box-shadow: 0 0 0 2px var(--zhu-soft); }
#main.m-av .ni.editing { opacity: .45; }
#main.m-av .ni-img { width: 112px; height: 63px; border-radius: 4px; overflow: hidden; background: var(--paper-2); display: grid; place-items: center; font: 11px var(--kai); color: var(--ink-4); }
#main.m-av .ni-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
#main.m-av .ni-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
#main.m-av .ni-h { display: flex; align-items: center; gap: 7px; }

<body>
<main id="main"></main>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="/通用工具/公用/核心.js"></script>
<script src="/通用工具/公用/底座.js"></script>
<script src="/通用工具/公用/界面.js"></script>
<script src="/通用工具/公用/审片.js"></script>
<script src="/通用工具/公用/交给AI.js"></script>
<script src="/通用工具/公用/找旧版.js"></script>
<script>
/* ============================================================
   案头 · 外壳：流水线借这一页看文件、写批注（网址带 ?embed=1，整页嵌在流水线的页面里）
   剧本、提示词、审片、图片四样看法都在这一页，看哪一份由网址里的 #open= 定；几样共用的小工具也在这里：window.Desk
   老页面（左边菜单、文件夹树、选总文件夹）2026-11-13 彻底下掉了：不是嵌着打开的（老网址、直接双击这个文件），一律转去流水线
   ============================================================ */
(function () {
'use strict';
const C = window.Core;
const PAGE = decodeURIComponent(location.pathname.split('/').pop() || '') || '项目管理.html';
const EMBED = new URLSearchParams(location.search).has('embed');   // 嵌在流水线的页面里
const FLOW_HOME = '通用工具/流水线/总览.html';   // 流水线首页

/* ---------- DOM 小工具、提示、对话框：用 公用/界面.js（window.UI）和 底座.js（window.Base）的，这页不另抄 ---------- */
const { h, add, icon, toast, dialog, dlgShell, confirmDlg, choiceDlg, chips, field, inputDlg, copyText } = window.UI;
const { debounce, isComposing } = window.Base;
const pathEq = (a, b) => !!a && !!b && a.length === b.length && a.every((x, i) => x === b[i]);
const under = (p, dir) => !!p && !!dir && p.length >= dir.length && dir.every((x, i) => p[i] === x);   // p 是 dir 本身或在它里面
const stem = n => n.replace(/\.[^.]+$/, '');
const byName = (a, b) => a.name.localeCompare(b.name, 'zh', { numeric: true });

/* ---------- 文件 ---------- */
const VIDEO_RE = /\.(mp4|m4v|mov|webm)$/i;
const IMG_RE = /\.(png|jpe?g|webp|gif|avif)$/i;
const TEXT_RE = /\.(md|txt|json|csv|log)$/i;
const NOTES_TAIL = '_批注.md', SHOTS_TAIL = '_批注截图';
const RE_VIDEO_PROMPT = window.Core.RE_VP;   // 视频提示词的名字：照镜头号起名的 1-5.txt（2026-11-16）；老稿 视频提示词.txt、视频提示词_02.txt……（公用/核心.js 那一份）
const STD_DIRS = ['定稿的剧本', '提示词', '资产', '成片', '历史记录'];
const hiddenName = n => /^[.$]|^~\$|^(node_modules|__pycache__|System Volume Information|desktop\.ini|Thumbs\.db)$/i.test(n) || /\.antou-tmp$/.test(n);
/* 总文件夹 项目 里的项目，路径从项目名写起（剧本、提示词那边这么认）；还没挪进 项目 的旧项目照原样 */
const toPm = path => path[0] === '项目' && path.length > 1 ? path.slice(1) : path;
/* 这个文件在哪一样里打开 */
function opensIn(path) {
  const name = path[path.length - 1] || '';
  if (name.endsWith(NOTES_TAIL)) return 'text';
  if (VIDEO_RE.test(name)) return 'review';
  if (IMG_RE.test(name)) return 'image';
  const p = toPm(path);
  if (p[1] === '定稿的剧本' && /\.docx$/i.test(name) && !name.startsWith('~$')) return 'script';
  if (p[1] === '提示词' && RE_VIDEO_PROMPT.test(name) && p.slice(2, -1).some(d => C.segFromName(d))) return 'prompt';
  if (TEXT_RE.test(name)) return 'text';
  return '';
}

/* ---------- 文件系统：用 公用/底座.js 的（路径从总文件夹算起，一律经本机服务读写），这页不另抄 ---------- */
const { LINK, FS, CH } = window.Base;

/* ============================================================
   四样看法、本机服务、启动
   ============================================================ */
const MODES = ['review', 'script', 'prompt', 'image'];
const D = { view: 'boot', root: null, rootName: '', abs: '', mode: '' };
const MOD = {};   // 各样看法登记在这里：enter、leave、recheck、reset
const isPm = m => m === 'script' || m === 'prompt';
const is = k => k === 'pm' ? isPm(D.mode) : D.mode === k;
const modOf = m => MOD[isPm(m) ? 'pm' : m];
const fullPath = path => D.abs ? [D.abs, ...path].join('\\') : [D.rootName, ...path].join('/');

/* ---------- 本机服务：在 Claude 里说「打开项目管理」时开的那个 ---------- */
const SERVICE = 'http://localhost:8766';
const serviceUp = () => fetch(SERVICE + '/' + FLOW_HOME, { mode: 'no-cors', cache: 'no-store' }).then(() => true, () => false);
/* 开本机服务的那句命令：页面在 总文件夹\通用工具 里，服务在 总文件夹\.agents\skills\annotate-live */
function serviceCmd() {   // 双击打开（file://）的走不到这里，页头那段先转走了
  const top = (D.abs || '').replace(/\\/g, '/');
  return 'node "' + (top ? top + '/' : '') + '.agents/skills/annotate-live/server.js" open';
}
/* 去流水线的网址：#open=项目名 去那个项目；#open=项目名/某个文件 去那个项目的首页，把这一份盖上来看 */
function flowTarget() {
  const m = /^#open=(.+)$/.exec(location.hash);
  let parts = [];
  if (m) { try { parts = decodeURIComponent(m[1]).split('/').filter(Boolean); } catch (e) { parts = []; } }
  if (parts[0] === '项目') parts.shift();
  const [p, ...rest] = parts;
  return FLOW_HOME + (p ? '?p=' + encodeURIComponent(p) : '') + (rest.length ? '#open=' + rest.map(encodeURIComponent).join('/') : '');
}
/* 开不了流水线时摆这个：说清怎么开本机服务。old：开着的是旧版服务，发不了流水线那几页 */
function renderService(old) {
  D.view = 'service';
  const cmd = serviceCmd(), err = h('div', { class: 'fld-err' });
  const main = document.getElementById('main');
  main.className = ''; main.removeAttribute('style');
  main.replaceChildren(h('div', { class: 'welcome' }, h('div', { class: 'w-inner' },
    h('div', { class: 'seal w-seal' }, '案'), h('div', { class: 'w-title sm' }, '流水线'),
    h('p', { class: 'w-note' }, old ? '本机服务是旧版，开不了流水线。先关掉旧服务（任务管理器里结束 Node.js），再运行下面这句重开，然后点「刷新」。'
      : '项目管理就是流水线，要先开本机服务。在 Claude 里说「打开项目管理」，或者在命令行运行下面这句（要先装 Node.js），开好以后点「再试一次」。'),
    h('code', { style: 'display: block; max-width: 520px; padding: 9px 11px; line-height: 1.6; word-break: break-all; user-select: all; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px' }, cmd),
    err,
    h('div', { style: 'display: flex; gap: 8px' },
      h('button', { class: 'btn ghost', onclick: () => copyText(cmd, '命令复制好了') }, '复制命令'),
      h('button', { class: 'btn ink', onclick: async () => {
        if (old || EMBED) { location.reload(); return; }   // 嵌在流水线里的：重新读这一份
        err.textContent = '';
        if (await serviceUp()) location.replace(SERVICE + '/' + flowTarget()); else err.textContent = '还是连不上本机服务（' + SERVICE + '）';
      } }, old ? '刷新' : '再试一次')))));
}

/* ---------- 启动：嵌在流水线里的，经本机服务直接读总文件夹；别的打开方式一律转去流水线 ---------- */
async function boot() {
  const link = await LINK.up();
  if (EMBED) return link ? useLink(link) : renderService(false);
  if (link) {
    if ((link.v || 0) >= 4) { location.replace('/' + flowTarget()); return; }   // 第 4 版起服务能发流水线那几页
    D.abs = link.abs || '';
    return renderService(true);
  }
  if (await serviceUp()) { location.replace(SERVICE + '/' + flowTarget()); return; }   // 经服务打开却没认上连接的：服务开着就过去（双击打开的在页头就转走了）
  renderService(false);
}
async function useLink(link) {   // LINK.on、LINK.v：LINK.up() 已经记下了
  await start({ kind: 'directory', name: link.root }, link.root, link.abs || '');
  setInterval(tick, 2000);   // 隔一会儿看一眼 AI 改了没有
}
async function start(root, name, abs) {
  for (const m of Object.values(MOD)) if (m.reset) m.reset();
  D.root = root; D.rootName = name; D.abs = abs; D.view = 'main'; D.mode = '';
  const route = await takeHash();
  await setMode(route ? route.mode : 'prompt', route ? { open: route.path } : null);
}

/* ---------- 换一样看法 ---------- */
let SWITCHING = null;
async function leaveMode(next) {
  const cur = D.mode && modOf(D.mode);
  return !cur || !cur.leave || (await cur.leave(next)) !== false;
}
function setMode(m, opts) {
  const run = async () => {
    if (!MODES.includes(m) || !modOf(m)) m = 'prompt';   // 认不出的、没装上的，都回提示词
    if (D.view !== 'main' || (D.mode === m && !opts)) return;
    const prev = D.mode;
    if (prev && prev !== m && !(await leaveMode(m))) return;
    D.mode = m;
    const main = document.getElementById('main');
    if (prev !== m) { main.removeAttribute('style'); main.replaceChildren(); }
    main.className = 'm-' + m + (isPm(m) ? ' m-pm' : ' m-av');
    await modOf(m).enter(m, opts || {});
  };
  SWITCHING = (SWITCHING || Promise.resolve()).then(run, run);   // 连着来，一样一样来
  return SWITCHING;
}
/* 剧本、提示词那边自己换了一处：外壳的样式跟着换 */
function follow(m) {
  if (D.mode === m || !isPm(m) || !isPm(D.mode)) return;
  D.mode = m;
  document.getElementById('main').className = 'm-' + m + ' m-pm';
}

/* ---------- 地址里带 #open=…：流水线点名要看的那一份 ---------- */
async function takeHash() {
  const m = /^#open=(.+)$/.exec(location.hash);
  if (!m) return null;
  history.replaceState(null, '', location.pathname + location.search);   // 收掉，下回同一个地址还能再打开
  let parts;
  try { parts = decodeURIComponent(m[1]).split('/').filter(Boolean); } catch (e) { return null; }
  if (!parts.length) return null;
  // 写成 项目名/… 的（服务打印的就是这样）补上 项目

/* 任务书里的清单：一份里可能有几组（每个节点一组），编号重复就是下一组 */
function refGroups(text) {

    if (!m) continue;
    if (!cur || cur.has(+m[1])) groups.push(cur = new Map());
    cur.set(+m[1], { name: m[2].trim(), file: m[3].trim() });

/* 清单跟提示词对得上：张数一样、编号连着，提示词点了名的那几张名字也一样 */
function fitsList(g, f, max) {

  for (let i = 1; i <= max; i++) if (!g.has(i)) return false;
  const same = (a, b) => { a = a.replace(/\s/g, ''); b = b.replace(/\s/g, ''); return !a || !b || a.includes(b) || b.includes(a); };

  for (const [n, ms] of f.shots) { const k = /镜头?\s*([0-9]+)/.exec(g.get(n).name); if (k && !ms.has(+k[1])) return false; }

async function picList(ed, f) {
  const dir = ed.entry.path.slice(0, -1), max = Math.max(0, ...f.used);
  const mention = new RegExp('(^|[\\s/\\\\：:])' + reEsc(ed.entry.name) + '(?![A-Za-z0-9_.])', 'm');   // 任务书里提到这份提示词才算它的清单
  let ents;
  try { ents = await FS.list(dir); } catch (e) { return null; }
  const lists = [];
  for (const e of ents) {
    if (e.kind !== 'file' || !/任务.*\.txt$/i.test(e.name)) continue;
    let t;
    try { t = C.decodeText((await FS.read([...dir, e.name])).buf).text; } catch (err) { continue; }
    if (!mention.test(t)) continue;
    const ok = refGroups(t).filter(g => fitsList(g, f, max));
    for (const map of ok) lists.push({ from: e.name, map });
  }
  if (!lists.length) return null;
  const identity = list => JSON.stringify([...list.map].sort((a, b) => a[0] - b[0]).map(([n, item]) => [n, item.file.replace(/\\/g, '/').toLowerCase()]));
  if (new Set(lists.map(identity)).size > 1) throw new Error('旧任务书的参考图清单冲突：' + [...new Set(lists.map(list => list.from))].join('、'));

/* 清单里写的路径 → 项目里的那张图；扫过以后才放进来的也认 */
async function imgAt(file) {

  if (i < 0 || (i > 0 && parts[i - 1] !== S.pj.name)) return null;
  if (parts.slice(i).some(p => p === '.' || p === '..' || /[:\u0000]/.test(p))) return null;
  const p = [S.pj.name, ...parts.slice(i)], k = p.join('/').toLowerCase();
  let a = S.pj.images.find(x => x.path.join('/').toLowerCase() === k);
  if (!a && await FS.stat(p)) {
    const name = p[p.length - 1], ext = name.split('.').pop().toLowerCase();
    a = { path: p, name, stem: name.replace(/\.[^.]+$/, ''), handle: { getFile: async () => new Blob([(await FS.read(p)).buf], { type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext) }) } };
    S.pj.images.push(a);
  }

}
function picByName(x) {
  const hit = s => S.pj.images.filter(a => a.stem === s || a.stem.split('_')[0] === s);
  let list = hit(x);
  if (!list.length) list = x.split(/[、和与及]/).map(s => s.trim()).filter(Boolean).flatMap(hit);   // 「迫击炮和尾翼炮弹」认 迫击炮 那张
  const glob = list.filter(a => a.path[2] === '全局资产');
  return glob.length ? glob : list;
}
/* 没登记映射的 @视频N、@音频N：把 资产 里这一类的文件找出来，这一段的和别处的分开 */
async function segMedia(seg, type) {
  const all = [];
  await walk([S.pj.name, '资产'], 4, async (p, e) => { if (REF_TYPES[type].test(e.name)) all.push({ path: p, name: e.name, handle: e.handle }); });
  const mine = all.filter(a => (C.segFromName(a.name) || segOfDirs(a.path)) === seg);
  return { mine, rest: all.filter(a => !mine.includes(a)) };
}
async function findPic(ed, n, type = '图片') {
  const seg = ed.entry.seg, prefix = ed.entry.name.replace(/_?视频提示词(_[0-9]+)?(_改[0-9]+)?\.txt$/i, '');
  const single = /^镜头?\s*([0-9]+)(?!\s*[0-9\-－—–~～至到])/.exec(prefix);   // 只管一个镜头的稿（镜1补拍）
  const text = C.decodeText((await FS.read(ed.entry.path)).buf).text;
  if (ed.sourceText != null && normalizedPrompt(ed.sourceText) !== normalizedPrompt(text)) throw new Error('这份提示词已在外面改过，请重新打开后查看参考图');
  const refs = await mappedReferences(ed, text);
  if (refs) {
    const item = refs.get('@' + type + n);
    if (!item) throw new Error('@' + type + n + ' 不在这份提示词的素材映射中');
    // 原处换过新版、挪走了：到历史记录里找登记的那一份（公用/找旧版.js）；哪儿都没有才报错
    const got = await RefFile.find(FS, [S.pj.name], item.assetPath.slice(1).join('/'), item.sha256);
    const name = got.parts[got.parts.length - 1];
    return { img: { path: got.parts, name }, bytes: got.bytes, name: item.name, how: got.old ? RefFile.note(got) + ' · 和登记的一样' : '已校验当前提示词和' + type + '内容 · 资产 / 参考素材映射.json' };
  }

  const says = [...(f.named.get(n) || []), ...[...(f.shots.get(n) || [])].map(m => `镜头${m}的画面`), ...(f.first.has(n) ? ['首帧'] : [])];
  if (single) f.shots = new Map();   // 补拍稿里的「镜头1」是它自己的第一镜，不是这一段的镜头1，不拿来对图
  const list = await picList(ed, f);
  const mine = segImages(seg), named = (...stems) => mine.filter(a => stems.includes(a.stem));
  const cands = new Set();
  if (list) {
    const ent = list.map.get(n), img = ent && await imgAt(ent.file);
    if (img) cands.add(img);

  for (const x of f.named.get(n) || []) picByName(x).forEach(a => cands.add(a));

    named(prefix + '_首帧', '首帧', `镜头${k}_首帧`, `镜${k}_首帧`).forEach(a => cands.add(a));
  }
  const arr = [...cands];
  // 补拍稿多半用它补的那一镜的关键帧：排在前头，只当可能，不直接认
  if (!arr.length && single && (f.first.has(n) || says.some(s => /^镜头[0-9]+的画面$/.test(s)))) arr.push(...named(`镜${single[1]}_关键帧`, `镜头${single[1]}_关键帧`));

}
/* 图换过新版就重读，预览不看旧图 */
const IMG_AT = new Map();
async function freshUrl(a) {
  const k = a.path.join('/'), st = await FS.stat(a.path);

let PIC_BUSY = false;
async function showPic(n, type = '图片') {
  const ed = S.ed;
  if (PIC_BUSY || !ed || ed.kind !== 'prompt') return;
  PIC_BUSY = true;
  const tag = '@' + type + n;
  try {
    const r = await findPic(ed, n, type);
    if (S.ed !== ed) return;
    if (r.img) {
      const url = URL.createObjectURL(new Blob([r.bytes], { type: refMime(r.img.name) }));
      try { await showImage(r.img, url, r.name ? tag + '　' + r.name : tag, r.how, type); }
      finally { URL.revokeObjectURL(url); }
    }

  } catch (e) { toast('看不了 ' + tag + '：' + e.message, 'err'); }

}
/* 视频、音频没对上：照实说，把 资产 里这一类的文件摆出来，点哪个放哪个 */
function pickMedia(tag, r, type) {
  const play = async a => {
    try {
      const url = URL.createObjectURL(new Blob([await a.handle.getFile()], { type: refMime(a.name) }));
      try { await showImage(a, url, tag + ' 的未绑定候选', '候选' + type + '，尚未绑定此编号', type); }
      finally { URL.revokeObjectURL(url); }
    } catch (e) { toast('打不开：' + e.message, 'err'); }
  };
  const list = xs => h('div', { class: 'pick-files' }, xs.map(a => h('button', { class: 'pick-file', type: 'button', onclick: () => play(a) }, rel(a.path))));
  return dialog(close => {
    const el = dlgShell(tag + ' 尚未核验', '当前稿件没有通过校验的素材映射。下面仅列出未绑定候选，不能据此认定编号。', [
      r.mine.length ? [h('div', { class: 'pick-lab' }, '这一段的' + type + '，点开' + (type === '视频' ? '看' : '听')), list(r.mine)] : h('div', { class: 'pick-lab' }, '这一段的 资产 里还没有' + type + '。'),
      r.rest.length ? [h('div', { class: 'pick-lab' }, '别处的' + type), list(r.rest)] : null,
    ], h('button', { class: 'btn ink', 'data-focus': '', onclick: () => close() }, '关闭'));

}
/* 没对上：照实说，把可能的和这一段的图摆出来，点哪张看哪张 */
function pickPic(tag, r) {
  const say = r.says.length ? `提示词里写它是「${r.says.join('」「')}」，` : '提示词里没写它是哪张，';
  const why = '当前稿件没有通过校验的素材映射。下面仅列出未绑定候选，不能据此认定编号。' + (r.from ? '旧任务书候选来自「' + r.from + '」。' : '');
  const rest = r.mine.filter(a => !r.cands.includes(a));
  const grid = list => h('div', { class: 'pick-imgs' }, list.map(a => h('button', { class: 'pick-img', type: 'button', title: rel(a.path),
    onclick: () => freshUrl(a).then(u => showImage(a, u, tag + ' 的未绑定候选', '候选图片，尚未绑定此编号')).catch(e => toast(e.message, 'err')) }, imgEl(a), h('span', null, a.stem))));
  return dialog(close => {
    const el = dlgShell(tag + ' 尚未核验', say + why, [
      r.cands.length ? [h('div', { class: 'pick-lab' }, '未绑定候选'), grid(r.cands)] : null,
      rest.length ? [h('div', { class: 'pick-lab' }, r.cands.length ? '这一段别的图' : '这一段的图，点开看'), grid(rest)] : null,
      !r.cands.length && !rest.length ? h('div', { class: 'pick-lab' }, '这一段的 资产 里还没有图。') : null,
    ], h('button', { class: 'btn ink', 'data-focus': '', onclick: () => close() }, '关闭'));

/* ---------- 进来、出去：流水线点开剧本、提示词 ---------- */
/* 头一回进来才读项目；以后回来接着看上次那一份 */
async function ready() {
  S.rootName = Desk.rootName;
  await loadProjects();
  S.ready = true;
}
function setArea(a) { S.tab = a === 'prompt' ? 'prompt' : S.stab; keepArea(); }
async function enter(m, opts) {
  const a = m === 'prompt' ? 'prompt' : 'script';
  if (!S.ready) await ready();
  if (opts.open) { setArea(a); if (await openAt(opts.open)) return; }
  if (!S.projects.length) { S.view = 'noprojects'; render(); return; }
  if (!S.pj) {
    setArea(a);
    const last = localStorage.getItem('antou:last:' + S.rootName);
    await openProject((S.projects.find(x => x.name === last) || S.projects[0]).name);
    return;
  }
  if (area() !== a || S.view === 'noprojects') { switchArea(a, true); return; }
  render();
  const c = document.getElementById('canvas'); if (c && S.scroll) c.scrollTop = S.scroll;   // 回到走之前看的地方
  recheck();
}
function leave() {
  closeNote();
  const c = document.getElementById('canvas'); S.scroll = c ? c.scrollTop : 0;
  return true;
}
function reset() {
  closeNote();
  Object.assign(S, { ready: false, rootName: '', projects: [], cache: {}, pj: null, view: 'boot', seg: null, ed: null, scroll: 0 });
  for (const u of IMG_URL.values()) u.then(URL.revokeObjectURL).catch(() => {});
  IMG_URL.clear(); IMG_AT.clear(); PJ_AT.clear();
}
/* 流水线点名要看的一份（路径从总文件夹算起）：项目文件夹打开目录，文件打开那一份 */
async function openAt(full) {
  const parts = Desk.toPm(full), pjn = parts[0];
  if (!S.projects.some(p => p.name === pjn)) await loadProjects();
  if (!S.projects.some(p => p.name === pjn)) { toast('「' + full.join(' / ') + '」不在哪个项目里', 'err'); return false; }
  if (parts.length === 1) { await openProject(pjn); return true; }
  if (!S.pj || S.pj.name !== pjn) await openProject(pjn);
  let e = findEntry(parts);
  if (!e) { await rescan(); e = findEntry(parts); }   // 刚写的文件，重新扫一遍才找得到
  if (e) { await loadEntry(e); return true; }
  if (!/\.[^.]+$/.test(parts[parts.length - 1])) { await folderAt(full); return true; }
  const name = parts.slice(1).join(' / ');
  const out = parts[1] === '提示词' && !(RE_VIDEO_PROMPT.test(parts[parts.length - 1]) && segOfDirs(parts));
  toast(out ? '这里只批各段的视频提示词，「' + name + '」不在里面' : '没找到「' + name + '」', 'err');
  render();
  return true;
}
/* 点名的是文件夹：项目文件夹打开目录，第N段 文件夹打开这一段 */
async function folderAt(full) {
  if (!S.ready) return;
  const parts = Desk.toPm(full), pjn = parts[0];
  if (!S.projects.some(p => p.name === pjn)) return;
  const seg = parts.slice(1).map(d => C.segFromName(d)).find(Boolean);
  if (parts.length === 1) { if (S.pj && S.pj.name === pjn && S.view === 'overview') return; await openProject(pjn); return; }
  if (!S.pj || S.pj.name !== pjn) await openProject(pjn);
  if (seg && !(S.view === 'editor' && S.seg === seg)) await openSlot(seg, S.tab);
}
async function loadProjects() {
  const keep = e => e.kind === 'directory' && !/^[.$]|^(node_modules|System Volume Information)$/.test(e.name);
  const top = (await FS.list([])).filter(keep);
  PJ_AT.clear();
  S.hasHome = top.some(e => e.name === PJ_HOME);
  let ents = top;
  if (S.hasHome) {
    ents = (await FS.list([PJ_HOME])).filter(keep);
    for (const e of ents) PJ_AT.set(e.name, [PJ_HOME]);
    // 还没挪进 项目 的旧项目：总文件夹下带 提示词、资产、成片、定稿的剧本 的文件夹
    for (const e of top) {
      if (e.name === PJ_HOME || PJ_AT.has(e.name)) continue;
      let sub; try { sub = await FS.list([e.name]); } catch (err) { continue; }
      if (sub.some(x => x.kind === 'directory' && STD_DIRS.includes(x.name) && x.name !== '历史记录')) { PJ_AT.set(e.name, []); ents.push(e); }
    }
  }
  ents.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  S.projects = ents.map(e => ({ name: e.name, stats: S.projects.find(p => p.name === e.name)?.stats || null }));
}

/* ---------- 导航 ---------- */
async function openProject(name, keepView) {
  try { S.pj = await scanProject(name); }
  catch (e) { toast('读不了这个项目：' + e.message, 'err'); return; }
  S.cache[name] = S.pj;
  const p = S.projects.find(x => x.name === name); if (p) p.stats = statsOf(S.pj);
  localStorage.setItem('antou:last:' + S.rootName, name);
  if (!keepView) { S.view = 'overview'; S.ed = null; S.seg = null; }
  render();
}
async function openOverview() {
  await rescan();
  S.view = 'overview'; S.ed = null; S.seg = null;
  render();
}
/* 现在在哪一处：剧本和镜头表，还是视频提示词 */
const area = () => areaOf(S.tab);
function keepArea() {
  if (S.tab !== 'prompt') S.stab = S.tab;
  try { localStorage.setItem('antou:area:' + S.rootName, area()); } catch (e) { /* 记不下就算了 */ }
  Desk.follow(area());
}
function switchArea(a, force) {   // 在目录就留在目录，正看着某一段就换到那一段的
  if (area() === a && !force) return;
  S.tab = a === 'prompt' ? 'prompt' : S.stab;
  keepArea();
  if (S.view === 'editor' && S.seg) openSlot(S.seg, S.tab); else openOverview();
}
async function openSlot(seg, kind, entry) {
  S.seg = seg; S.tab = kind || S.tab; S.view = 'editor';
  keepArea();
  const slot = S.pj.segs.get(seg);
  const list = slot ? slot[S.tab] : [];
  entry = entry || list.find(e => !e.combined) || list[0] || null;
  S.ed = null;

/* 红批的底稿：第一次打开时的原文，记在浏览器里。AI 改过以后，改动的地方显示红批，直到「清稿」 */
const baseKey = ed => 'antou:base:' + S.rootName + '/' + ed.target.join('/');
function readBase(ed) { try { const r = JSON.parse(localStorage.getItem(baseKey(ed)) ?? movedBase(ed) ?? 'null'); return Array.isArray(r) ? r : null; } catch (e) { return null; } }

    const k = localStorage.key(i), name = k && k.startsWith(pre) ? k.slice(pre.length) : '';

    const v = localStorage.getItem(k);

/* ---------- 批注：存在原文件旁边，AI 照着改 ---------- */
/* 同样的文字出现几次就记第几处：批注靠「原文＋第几处」对回段落 */
function unitList(doc) { const seen = new Map(); return C.units(doc).map(u => { const n = (seen.get(u.t) || 0) + 1; seen.set(u.t, n); return { ...u, n }; }); }
async function readNotes(ed) {
  let nt = { general: '', items: [] };
  ed.notesMtime = 0;
  try { const r = await FS.read(ed.notesAt); nt = C.parseNotes(C.decodeText(r.buf).text); ed.notesMtime = r.mtime; } catch (e) { /* 还没有批注 */ }
  const at = new Map(unitList(ed.doc).map(u => [u.t + '\n' + u.n, u.k]));
  const byKey = new Map(), lost = [];   // lost：原文已经改过，对不上了
  for (const x of nt.items) { const k = at.get(x.text + '\n' + x.n); if (k && !byKey.has(k)) byKey.set(k, x); else lost.push(x); }

}
const noteCount = ed => ed.notes.byKey.size + ed.notes.lost.length + (ed.notes.general ? 1 : 0);
function notesMd(ed) {
  const items = [];
  for (const u of unitList(ed.doc)) { const x = ed.notes.byKey.get(u.k); if (x) items.push({ where: x.where, text: u.t, n: u.n, note: x.note }); }
  const e = ed.entry, what = `第${e.seg}段 ${KN[e.kind]}${e.kind === 'prompt' && !e.main ? ' ' + e.label : ''}`;
  const file = e.combined ? `${at(e.path).join('/')} 里的第${e.seg}段（改完另存成 ${at(ed.target).join('/')}，汇总稿不动）` : at(ed.target).join('/');

/* 写进文件；全删光了就删掉文件。上一次还没写完的，排在后面接着写 */
function saveNotes(ed) {
  ed.q = (ed.q || Promise.resolve()).then(async () => {
    try {
      if (noteCount(ed)) ed.notesMtime = (await FS.write(ed.notesAt, C.encodeText(notesMd(ed)))).mtime;
      else if (await FS.stat(ed.notesAt)) { await FS.remove(ed.notesAt); ed.notesMtime = 0; }

const saveNotesLater = debounce(saveNotes, 400);
/* 本机服务第 5 版起有 AI 任务：开一个，底下守着一条，显示谁在改、用了多久；改完文件一变，页面自己换上红批 */
async function aiJob(body) {
  let j;
  await CH.ready();
  const b = CH.fill({ ...body, 渠道: CH.now() });   // 交给流水线顶栏「AI 用」选的那个，带上它的模型、推理深度（每个 AI 各记各的）
  try { j = await (await LINK.req('POST', '/api/job', C.encodeText(JSON.stringify(b)))).json(); }
  catch (e) { toast('没交上：' + e.message, 'err'); return; }
  const line = h('span', null, ''), btns = h('span', { style: 'pointer-events:auto' }), chip = h('div', { class: 'toast' }, h('i', { class: 's' }), line, btns), t0 = Date.now();
  document.getElementById('toasts').append(chip);
  if (b.渠道 === CH.SELF && window.HandAI) HandAI.wait(j, () => {});   // 给我提示词（流水线顶栏「AI 用」选的）：话备好就弹出来给你复制
  let hs = '';
  for (;;) {
    const sec = Math.round((Date.now() - t0) / 1000);
    line.textContent = (j.状态 === '排队' ? j.渠道名 + ' 排着队' : j.步骤 || j.渠道名 + ' 在改') + '　' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    const hk = j.交给 && (j.状态 === '在做') ? j.交给.方式 + j.交给.等 : '';   // 等你交给 AI 的、Claude 等你按发送的：「交给 AI 的话」「再开一次」
    if (hk !== hs && window.HandAI) { hs = hk; btns.replaceChildren(...HandAI.buttons(j, () => {}).map(b => { b.style.color = 'inherit'; return b; })); }
    if (j.状态 !== '排队' && j.状态 !== '在做') break;
    await new Promise(r => setTimeout(r, 2000));
    try { j = await (await LINK.req('GET', '/api/job/' + j.id)).json(); } catch (e) { break; }
  }
  chip.remove();
  toast(j.状态 === '做完' ? j.结果 : '没改成：' + (j.错误 || j.状态), j.状态 === '做完' ? '' : 'err');
}
async function copyForAI(paths) {
  let text = (paths || [S.ed.notesAt]).map(p => '按批注修改 ' + at(p).join('/')).join('\n');
  if (LINK.on) {   // 右边窗格：直接交到 AI 手上
    if (S.ed) await S.ed.q;   // 批注先写完
    if (LINK.v >= 5) {   // 直接开 AI 任务（用哪个 AI，看流水线顶栏选的那个）：剧本、镜头表的批注，和各段视频提示词的批注
      const list = (paths || [S.ed.notesAt]).map(p => at(p));
      const isVp = p => p.length === 5 && p[0] === '项目' && p[2] === '提示词' && /^第[0-9-]+段$/.test(p[3]) && /_批注\.md$/.test(p[4]) && window.Core.RE_VP.test(p[4].replace(/_批注\.md$/, '.txt'));
      const mine = list.filter(p => (p[0] === '项目' && p[2] === '定稿的剧本') || isVp(p));
      for (const p of mine) aiJob({ 事: isVp(p) ? '按批注改提示词' : '按批注改', 项目: p[1], 批注: p.join('/') });
      if (mine.length === list.length) return;
      text = list.filter(p => !mine.includes(p)).map(p => '按批注修改 ' + p.join('/')).join('\n');
    }
    try {
      const r = await (await LINK.req('POST', '/api/ai', text)).json();
      toast(r.online ? '交给 AI 了，改好这里自动刷新' : '记下了。AI 这会儿没在等这一种批注，去对话里说一声「看右边」');
    } catch (e) { toast('没交上：' + e.message, 'err'); }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('复制好了，贴给 Claude 或 Codex'); }
  catch (e) { toast('复制没成功：' + e.message, 'err'); }
}

function findEntry(path, seg) {
  for (const s of S.pj.segs.values()) for (const k of KINDS) for (const e of s[k]) if (pathEq(e.path, path) && !e.combined && (!seg || e.seg === seg)) return e;
  return S.pj.loose.find(e => pathEq(e.path, path)) || null;
}

function tokenize(text, kind) {

    if (m.index > last) out.push({ t: text.slice(last, m.index), c: '', o: last });
    let c;
    if (kind === 'prompt') c = m[1] ? 'tk-say' : m[2] ? 'tk-sfx' : m[3] ? 'tk-ref' : m[4] ? 'tk-br' : 'tk-ph';

    out.push({ t: m[0], c, o: m.index });

<script>

async function videosIn(g, parts, sub) {

const segOf = n => { const m = /第\s*(\d+(?:\s*[-－]\s*\d+)?)\s*段/.exec(n); return m ? m[1].replace(/\s/g, '').replace(/－/g, '-') : ''; };

/* ---------- 截图 ---------- */
const grabEnd = () => Review.grabEnd(P.video, P.f);

async function enter(m, opts) {

  if (v) { clearTimeout(v.saveT); URL.revokeObjectURL(v.url); for (const u of v.thumbs.values()) u.then(URL.revokeObjectURL).catch(() => {}); }

}
async function openVideo(g, it, frame) {

/* ---------- 播放器 ---------- */
