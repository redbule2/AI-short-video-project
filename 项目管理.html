<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案头 · 短视频项目</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='9' fill='%23a83a2c'/%3E%3Crect x='9' y='9' width='46' height='46' rx='5' fill='none' stroke='%23f6e2d6' stroke-opacity='.5' stroke-width='1.5'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23fbf1e6' font-family='KaiTi,STKaiti,serif'%3E%E6%A1%88%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   案头 · 样式　纸、墨、朱、黛、赭
   ============================================================ */
:root {
  --paper: #f4efe6;
  --paper-2: #ece5d8;
  --paper-3: #e4dbca;
  --sheet: #fffdf9;
  --ink: #2a2622;
  --ink-2: #554d45;
  --ink-3: #887e74;
  --ink-4: #b2a89b;
  --line: #e5dccd;
  --line-2: #d6cab6;
  --zhu: #a83a2c;  --zhu-soft: rgba(168, 58, 44, .065);  --zhu-line: rgba(168, 58, 44, .26);
  --dai: #3e5c5e;  --dai-soft: rgba(62, 92, 94, .075);   --dai-line: rgba(62, 92, 94, .28);
  --zhe: #8d6a3c;  --zhe-soft: rgba(141, 106, 60, .085); --zhe-line: rgba(141, 106, 60, .3);
  --jin: #b39256;
  --tc: var(--zhu); --tc-soft: var(--zhu-soft); --tc-line: var(--zhu-line);
  --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --kai: 'KaiTi', 'STKaiti', 'Kaiti SC', 'BiauKai', 'Noto Serif SC', serif;
  --mono: 'Cascadia Mono', Consolas, 'Noto Sans SC', monospace;
  --shadow: 0 1px 2px rgba(60, 45, 30, .05), 0 10px 32px -14px rgba(60, 45, 30, .2);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  display: grid; grid-template-columns: 236px minmax(0, 1fr);
  color: var(--ink); font: 14px/1.7 var(--sans);
  background-color: var(--paper);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .34  0 0 0 0 .24  0 0 0 .055 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
input, textarea { font: inherit; color: inherit; }
::selection { background: rgba(168, 58, 44, .16); }
:focus-visible { outline: 2px solid rgba(62, 92, 94, .4); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible { outline: none; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: rgba(140, 118, 92, .22); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(140, 118, 92, .38); }
::-webkit-scrollbar-track { background: transparent; }
.ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.faint { color: var(--ink-3); }
.small { font-size: 12.5px; }
p { margin: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  font: 13.5px/1.2 var(--sans); letter-spacing: .08em;
  color: var(--ink); background: var(--sheet); border: 1px solid var(--line-2);
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.btn:hover { background: #fff; border-color: var(--ink-4); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: #f7f1e6; }
.btn.ink:hover { background: #3c3630; border-color: #3c3630; }
.btn.zhu { background: var(--zhu); border-color: var(--zhu); color: #fff8f2; }
.btn.zhu:hover { background: #95301f; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(80, 60, 40, .06); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn.lg { padding: 12px 28px; font-size: 15px; letter-spacing: .14em; }
.btn.save.dirty { background: var(--zhu); border-color: var(--zhu); box-shadow: 0 4px 14px -6px rgba(168, 58, 44, .7); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- 印章 ---------- */
.seal {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  background: var(--zhu); color: #fbf1e6; border-radius: 5px;
  font: 22px/1 var(--kai);
  box-shadow: inset 0 0 0 2px var(--zhu), inset 0 0 0 3px rgba(255, 238, 225, .38);
  transform: rotate(-2.5deg);
}
.seal.sm { width: 32px; height: 32px; font-size: 18px; }
.seal.w-seal { width: 66px; height: 66px; font-size: 38px; border-radius: 8px; box-shadow: inset 0 0 0 3px var(--zhu), inset 0 0 0 4.5px rgba(255, 238, 225, .4); }

/* ---------- 侧栏 ---------- */
#side {
  min-height: 0; display: flex; flex-direction: column;
  padding: 22px 14px 14px; background: rgba(232, 224, 209, .72);
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 13px; padding: 2px 8px 24px; cursor: pointer; user-select: none; }
.brand-name { font: 600 19px/1.2 var(--serif); letter-spacing: .32em; }
.brand-sub { margin-top: 3px; font: 11px/1.2 var(--sans); color: var(--ink-3); letter-spacing: .24em; }
.side-label { padding: 0 10px 8px; font: 12px var(--kai); color: var(--ink-3); letter-spacing: .4em; }
.side-empty { padding: 8px 10px; font: 13.5px var(--kai); color: var(--ink-3); }
.plist { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -4px; padding: 0 4px; }
.pitem { position: relative; padding: 9px 12px 9px 14px; border-radius: 7px; cursor: pointer; transition: background .15s; }
.pitem:hover { background: rgba(255, 253, 249, .5); }
.pitem.on { background: var(--sheet); box-shadow: 0 1px 2px rgba(60, 45, 30, .06), 0 4px 14px -8px rgba(60, 45, 30, .18); }
.pitem.on::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2.5px; border-radius: 2px; background: var(--zhu); }
.pname { font: 14.5px/1.45 var(--serif); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem.on .pname { font-weight: 600; }
.pmeta { font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; min-height: 1.2em; }
.pnew {
  margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 12px; border-radius: 7px; cursor: pointer;
  background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3);
  font-size: 13px; letter-spacing: .12em; transition: color .15s, border-color .15s, background .15s;
}
.pnew:hover { color: var(--ink); border-color: var(--ink-4); background: rgba(255, 253, 249, .4); }
.side-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
.linkbtn {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
  padding: 5px 10px; border: 0; border-radius: 5px; background: none; cursor: pointer;
  font-size: 13px; color: var(--ink-2); text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.linkbtn:hover { background: rgba(255, 253, 249, .55); color: var(--ink); }
.linkbtn.on { color: var(--zhu); }
.files-ul .linkbtn, .cards .linkbtn { padding: 0; color: var(--dai); text-decoration: underline; text-decoration-color: var(--dai-line); text-underline-offset: 3px; }
.files-ul .linkbtn:hover, .cards .linkbtn:hover { background: none; }

/* ---------- 欢迎页 ---------- */
#main { min-width: 0; min-height: 0; height: 100vh; display: flex; flex-direction: column; }
.welcome { flex: 1; display: grid; place-items: center; padding: 40px; }
.w-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: rise .5s ease both; }
.w-seal { margin-bottom: 10px; }
.w-title { font: 600 46px/1.2 var(--serif); letter-spacing: .5em; margin-right: -.5em; }
.w-title.sm { font-size: 26px; letter-spacing: .16em; margin-right: -.16em; }
.w-sub { font: 15px var(--kai); color: var(--ink-3); letter-spacing: .42em; margin-right: -.42em; }
.w-verse {
  writing-mode: vertical-rl; height: 8.2em; margin: 22px 0 18px; white-space: nowrap;
  font: 19px/2.3 var(--kai); color: var(--ink-2); letter-spacing: .5em;
}
.w-verse span { display: block; }
.w-verse span + span { margin-top: 1.4em; color: var(--ink-3); }
.w-note { margin-top: 14px; max-width: 430px; font-size: 12.5px; line-height: 1.95; color: var(--ink-3); }

/* ---------- 顶栏 ---------- */
.top {
  flex: none; height: 60px; display: flex; align-items: center; gap: 20px;
  padding: 0 22px 0 30px; border-bottom: 1px solid var(--line);
  background: rgba(250, 246, 239, .6); backdrop-filter: blur(6px);
}
.crumb { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
.ptitle { padding: 0; border: 0; background: none; cursor: pointer; font: 600 18px/1.3 var(--serif); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle:hover { color: var(--zhu); }
.crumb-seg { font: 14.5px var(--kai); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-seg::before { content: '／'; margin-right: 10px; color: var(--ink-4); }
.tabs { flex: none; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(228, 219, 202, .55); border: 1px solid var(--line); }
.tab {
  padding: 5px 17px 5px 15px; border: 0; border-radius: 999px; background: transparent; cursor: pointer;
  font-size: 13.5px; letter-spacing: .16em; color: var(--ink-2); transition: background .15s, color .15s;
}
.tab::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 8px 1px 0; border-radius: 50%; background: var(--c); opacity: .5; vertical-align: middle; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--sheet); color: var(--c); font-weight: 600; box-shadow: 0 1px 2px rgba(60, 45, 30, .1); }
.tab.on::before { opacity: 1; }
.top-right { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.status { display: flex; align-items: center; gap: 7px; margin-right: 6px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #9db39b; }
.status.dirty { color: var(--ink-2); }
.status.dirty .dot { background: var(--zhu); animation: pulse 1.8s ease-in-out infinite; }

/* ---------- 段落条 ---------- */
.segbar {
  flex: none; display: flex; align-items: stretch; gap: 4px;
  padding: 8px 22px 8px 26px; overflow-x: auto; scrollbar-width: thin;
  border-bottom: 1px solid var(--line); background: rgba(250, 246, 239, .35);
}
.seg {
  flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 5px 14px 6px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer;
  color: var(--ink-2); transition: background .15s, border-color .15s;
}
.seg:hover { background: rgba(255, 253, 249, .6); }
.seg.on { background: var(--sheet); border-color: var(--line); box-shadow: 0 1px 2px rgba(60, 45, 30, .07); color: var(--ink); }
.seg-no { font: 14px/1.3 var(--kai); letter-spacing: .04em; white-space: nowrap; }
.seg.on .seg-no { font-weight: 600; }
.seg-dots { display: flex; align-items: center; gap: 4px; height: 7px; }
.seg-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.seg-dots i.script.has { background: var(--zhu); }
.seg-dots i.shots.has { background: var(--dai); }
.seg-dots i.prompt.has { background: var(--zhe); }
.seg-dots em { font: normal 10.5px/1 var(--sans); color: var(--ink-3); }
.seg-dots .ic { width: 10px; height: 10px; stroke-width: 1.6; color: var(--ink-3); }
.seg.toc .seg-no { letter-spacing: .3em; margin-right: -.3em; }
.seg.seg-new { border: 1px dashed var(--line-2); color: var(--ink-3); margin-left: 6px; }
.seg.seg-new .seg-no { font: 12.5px var(--sans); letter-spacing: .08em; }
.seg.seg-new:hover { color: var(--ink); border-color: var(--ink-4); }
.seg-sep { flex: none; width: 1px; margin: 6px 8px; background: var(--line); }
.seg.asset .seg-no { color: var(--zhe); }

/* ---------- 工作区 ---------- */
.stage { flex: 1; min-height: 0; display: flex; }
.canvas { flex: 1; min-width: 0; overflow: auto; padding: 34px 40px 140px; }

/* ---------- 纸面 ---------- */
.sheet {
  position: relative; max-width: 780px; margin: 0 auto;
  padding: 58px 76px 40px; border-radius: 3px;
  background: var(--sheet); border: 1px solid rgba(214, 202, 182, .7); box-shadow: var(--shadow);
  animation: rise .28s ease both;
}
.sheet::after { content: ''; position: absolute; inset: 11px; border: 1px solid var(--tc-line); border-radius: 2px; pointer-events: none; opacity: .55; }
.sheet.k-script { --tc: var(--zhu); --tc-soft: var(--zhu-soft); --tc-line: var(--zhu-line); }
.sheet.k-shots { --tc: var(--dai); --tc-soft: var(--dai-soft); --tc-line: var(--dai-line); }
.sheet.k-prompt { --tc: var(--zhe); --tc-soft: var(--zhe-soft); --tc-line: var(--zhe-line); }
.sheet.k-asset { padding-top: 50px; }
.sheet.mini { max-width: none; padding: 30px 26px 22px; box-shadow: none; font-size: 13px; animation: none; }
.sheet.mini::after { inset: 6px; }
.sheet.guide-sheet { max-width: none; margin: 0; padding: 40px 46px 30px; animation: none; }
.sheet.empty-sheet { text-align: center; padding: 70px 60px 60px; }
.stamp {
  position: absolute; top: 30px; right: 34px; writing-mode: vertical-rl;
  padding: 7px 4px; border: 1.5px solid var(--zhu); border-radius: 3px; color: var(--zhu);
  font: 13px/1 var(--kai); letter-spacing: .25em; opacity: .7; transform: rotate(6deg);
}
.doc-title { text-align: center; margin-bottom: 36px; }
.doc-kicker { font: 13px var(--kai); color: var(--tc); letter-spacing: .4em; margin-right: -.4em; margin-bottom: 12px; }
.doc-seg { font: 600 30px/1.3 var(--serif); letter-spacing: .12em; margin-right: -.12em; }
.doc-name { margin-top: 8px; font: 17px/1.5 var(--serif); color: var(--ink-2); letter-spacing: .1em; }
.doc-name-in {
  width: min(70%, 380px); padding: 3px 6px; text-align: center; letter-spacing: .1em;
  border: 0; border-bottom: 1px dashed transparent; background: transparent; outline: 0;
  transition: border-color .15s;
}
.doc-name-in:hover { border-bottom-color: var(--line-2); }
.doc-name-in:focus { border-bottom-color: var(--tc); }
.doc-name-in::placeholder { color: var(--ink-4); font-family: var(--kai); letter-spacing: .2em; }
.ornament { width: 180px; height: 9px; margin: 18px auto 0; display: flex; align-items: center; }
.ornament::before, .ornament::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--line-2)); }
.ornament::after { background: linear-gradient(to left, transparent, var(--line-2)); }
.ornament span { width: 6px; height: 6px; margin: 0 10px; border: 1px solid var(--tc); transform: rotate(45deg); opacity: .75; }
.sheet-foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--ink-4); letter-spacing: .05em; word-break: break-all; }
.empty-say { margin: 34px 0 24px; font: 17px var(--kai); color: var(--ink-2); letter-spacing: .12em; }
.empty-acts { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }

/* ---------- 横幅、文件条 ---------- */
.banner {
  max-width: 780px; margin: 0 auto 14px; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 7px; font-size: 13px; color: var(--ink-2);
  background: #fbf2e1; border: 1px solid #ecd8b2;
}
.banner span { flex: 1; }
.banner.soft { background: rgba(236, 229, 216, .7); border-color: var(--line); }
.files { max-width: 780px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.files-cat { margin-right: 6px; font: 15px var(--kai); color: var(--zhe); letter-spacing: .25em; }
.fchip {
  padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px; letter-spacing: .04em;
  border: 1px solid var(--line); background: rgba(255, 253, 249, .65); color: var(--ink-2); transition: all .15s;
}
.fchip:hover { border-color: var(--line-2); color: var(--ink); }
.fchip.on { background: var(--ink); border-color: var(--ink); color: #f7f1e6; }
.fchip.fchip-new { border-style: dashed; background: transparent; color: var(--ink-3); }

/* ---------- 分区 ---------- */
.sec { position: relative; margin-top: 32px; }
.sec-head { margin-top: 0; padding: 12px 20px 10px; border-radius: 4px; background: var(--tc-soft); }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font: 15px var(--kai); color: var(--tc); letter-spacing: .3em; }
.sec-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--line-2), transparent); }
.sec-no { width: 23px; height: 23px; flex: none; display: grid; place-items: center; border: 1px solid var(--tc-line); border-radius: 50%; font: 12px/1 var(--serif); letter-spacing: 0; }
.sec-name { white-space: nowrap; }
.sec-empty { margin: 4px 0 8px; font: 13.5px var(--kai); color: var(--ink-4); letter-spacing: .04em; }
.sec-missing {
  margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; border: 1px dashed var(--line-2); border-radius: 7px;
  font: 14px var(--kai); color: var(--ink-3); letter-spacing: .06em;
}

/* ---------- 一行 ---------- */
.blist { display: flex; flex-direction: column; }
.blk { position: relative; margin: 0 -12px; padding: 4px 12px; border-radius: 6px; cursor: text; transition: background .15s, box-shadow .2s; }
.blk:hover { background: rgba(120, 98, 70, .045); }
.blk.edge:not(.editing) { display: none; }
/* 工具条只在正在改的那一行出现：放在说明那一行的右边，不压字 */
.blk .tools {
  display: none; align-items: center; gap: 1px; padding: 2px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 3px 10px -4px rgba(60, 45, 30, .2);
}
.blk.editing {
  z-index: 4; margin: 6px -14px; padding: 8px 14px 9px; cursor: default;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center;
  background: var(--sheet); box-shadow: 0 0 0 1px var(--tc-line), 0 10px 26px -12px rgba(60, 40, 20, .3);
}
.blk.editing .tools { display: flex; grid-column: 2; grid-row: 1; }
.blk.editing .ta, .blk.editing .ed-tips { grid-column: 1 / -1; }
.flash { animation: flash 1.1s ease; }
.ed-cap { grid-column: 1; grid-row: 1; margin-bottom: 5px; font-size: 11.5px; letter-spacing: .04em; color: var(--tc); min-height: 1.4em; }
.ta {
  display: block; width: 100%; padding: 0; border: 0; outline: 0; resize: none; overflow: hidden;
  background: transparent; font: 15.5px/1.85 var(--serif); color: var(--ink); white-space: pre-wrap;
}
.k-prompt .ta { font-size: 14.5px; }
.ed-tips { margin-top: 5px; font-size: 11px; color: var(--ink-4); letter-spacing: .04em; }
.tb {
  width: 26px; height: 26px; padding: 0; display: grid; place-items: center;
  border: 0; border-radius: 5px; background: transparent; color: var(--ink-3); cursor: pointer;
}
.tb:hover { background: var(--paper); color: var(--ink); }
.tb .ic { width: 14px; height: 14px; }
.tb.role { width: auto; padding: 0 7px; font-size: 12px; letter-spacing: .04em; }
.tb.role.on { color: var(--tc); background: var(--tc-soft); }
.tsep { width: 1px; height: 16px; margin: 0 3px; background: var(--line); }

.view { display: flex; align-items: baseline; gap: 14px; min-width: 0; font: 15.5px/1.85 var(--serif); }
.k-prompt .view { font-size: 14.5px; }
.val { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.lab { flex: none; font: 14px/1.85 var(--kai); color: var(--tc); letter-spacing: .1em; }
.r-scene .lab, .r-cast .lab, .r-meta .lab { width: 3.1em; text-align-last: justify; letter-spacing: 0; }
.r-meta .lab { width: auto; min-width: 3.1em; }
.val.scene { display: flex; flex-wrap: wrap; align-items: center; }
.sep { display: inline-block; width: 1px; height: .95em; margin: 0 13px; background: var(--line-2); }
.val.cast { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.cast-i { display: inline-flex; align-items: baseline; gap: 6px; padding: 0 11px; border-radius: 999px; background: rgba(255, 253, 249, .9); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.85; }
.cast-i b { font-weight: 600; }
.cast-i span { font: 12.5px var(--sans); color: var(--ink-3); }
.mk { flex: none; width: 1em; color: var(--tc); font-size: 13px; }
.r-action .view { gap: 10px; }
.r-line .view { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 18px; }
.who { text-align: right; font-weight: 600; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say-wrap { min-width: 0; }
.how { font: 13px/1.6 var(--kai); color: var(--ink-3); }
.how::before { content: '（'; } .how::after { content: '）'; }
.say { white-space: pre-wrap; word-break: break-word; }
.pill { flex: none; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 999px; font: 11.5px/1.75 var(--sans); letter-spacing: .12em; color: var(--ink-2); transform: translateY(-1px); }
.r-sub .pill { color: var(--dai); border-color: var(--dai-line); }
.r-sfx .pill { color: var(--zhe); border-color: var(--zhe-line); }
.r-plain .view { color: var(--ink-2); }
.k-script .r-plain .view::before { content: '·'; flex: none; width: 1em; font: 700 15px var(--serif); color: var(--jin); }
.r-note .view { font-family: var(--kai); font-size: 14.5px; color: var(--ink-2); }
.hint { color: var(--ink-4); font-family: var(--kai); font-size: .93em; letter-spacing: .03em; }
.r-blank { padding-top: 0; padding-bottom: 0; }
.r-blank .view { height: 14px; align-items: center; }
.blank-mark { font: 10.5px/1 var(--sans); color: var(--ink-4); letter-spacing: .3em; opacity: 0; transition: opacity .15s; }
.r-blank:hover .blank-mark { opacity: 1; }
/* 提示词里的行 */
.r-pfield .view { display: block; }
.r-pfield .lab { display: inline; margin-right: .2em; font: 13px/1 var(--sans); letter-spacing: .02em; }
.r-pfield .lab::after { content: '：'; }
.r-pfield .val { display: inline; }
.k-prompt .r-sub .view { margin-top: 6px; font: 13.5px var(--kai); color: var(--tc); letter-spacing: .3em; }
.k-prompt .r-sub .view::before { content: ''; width: 14px; height: 1px; background: var(--tc-line); align-self: center; }
/* 镜头表旧格式里的行 */
.k-shots .r-field .lab { font: 13px/2 var(--sans); }
.k-shots .oldbody .view { font-size: 13.5px; color: var(--ink-2); }

/* 高亮 */
.tk-say { color: #8a3324; background: rgba(168, 58, 44, .055); border-radius: 3px; }
.tk-sfx { color: var(--dai); background: var(--dai-soft); border-radius: 3px; }
.tk-ref { color: var(--zhe); font: 600 .9em var(--sans); letter-spacing: .02em; }
.tk-br { color: var(--ink-3); }
.tk-ph { color: #7a5b2b; background: rgba(179, 146, 86, .14); border-bottom: 1px dashed var(--jin); }
.tk-q { color: var(--dai); }

/* ---------- 加一行 ---------- */
.addbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; opacity: .7; transition: opacity .2s; }
.sec:hover > .addbar, .p-shot:hover > .addbar, .addbar:focus-within { opacity: 1; }
.add {
  padding: 3px 12px; border-radius: 999px; cursor: pointer;
  background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3);
  font-size: 12.5px; letter-spacing: .05em; transition: all .15s;
}
.add:hover { color: var(--tc); border-color: var(--tc-line); border-style: solid; background: var(--tc-soft); }
.add.strong { color: var(--tc); border-color: var(--tc-line); border-style: solid; }
.menu {
  position: fixed; z-index: 60; min-width: 150px; max-height: 50vh; overflow: auto;
  display: flex; flex-direction: column; padding: 4px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow);
  animation: rise .15s ease both;
}
.menu-i { padding: 7px 14px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; font: 14px var(--serif); }
.menu-i:hover { background: var(--paper); }

/* ---------- 镜头表 ---------- */
.oldnote {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  margin-bottom: 24px; padding: 12px 16px; border-radius: 7px;
  background: var(--tc-soft); border: 1px solid var(--tc-line); font-size: 13px; color: var(--ink-2);
}
.oldnote b { color: var(--ink); margin-right: 4px; }
.oldbox { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--line); }
.oldtog { display: inline-flex; align-items: center; gap: 6px; padding: 3px 0; border: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-3); letter-spacing: .04em; }
.oldtog:hover { color: var(--ink); }
.oldtog em { font-style: normal; color: var(--ink-4); }
.oldtog .ic { width: 12px; height: 12px; transition: transform .2s; }
.oldbox.open .oldtog .ic { transform: rotate(90deg); }
.oldbody:empty { display: none; }
.oldbody { padding: 4px 0 2px; }
.sec-shots { margin-top: 4px; }
.shotlist { list-style: none; margin: 0; padding: 0; }
.srow {
  display: grid; grid-template-columns: 4.4em 1.1em minmax(0, 1fr) auto auto; align-items: center; column-gap: 6px;
  margin: 0 -14px; padding: 9px 14px; border-radius: 7px; border-bottom: 1px dotted var(--line-2);
  transition: background .15s;
}
.srow:hover { background: rgba(120, 98, 70, .04); }
.srow.focus { background: var(--tc-soft); border-bottom-color: transparent; }
.sno { font: 15px/1.5 var(--kai); color: var(--tc); letter-spacing: .06em; white-space: nowrap; }
.sbar { color: var(--ink-4); text-align: center; }
.sin {
  width: 100%; min-width: 0; padding: 2px 0; border: 0; border-bottom: 1px solid transparent; outline: 0; background: transparent;
  font: 18px/1.5 var(--serif); letter-spacing: .08em; transition: border-color .15s;
}
.sin:focus { border-bottom-color: var(--tc-line); }
.sin::placeholder { color: var(--ink-4); font: 15px var(--kai); letter-spacing: .2em; }
.stitle { font: 16px/1.6 var(--serif); letter-spacing: .06em; }
.scount { min-width: 3.8em; text-align: right; font: 11.5px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink-4); opacity: 0; transition: opacity .15s; }
.srow:hover .scount, .srow.focus .scount, .scount.over { opacity: 1; }
.scount.over { color: var(--zhu); font-weight: 600; }
.scount.zero { opacity: 0 !important; }
.stools { display: flex; gap: 1px; opacity: 0; transition: opacity .15s; }
.srow:hover .stools, .srow.focus .stools { opacity: 1; }
.srow .oldbox { grid-column: 3 / -1; margin: 6px 0 2px; }
.shotlist.ro .srow { grid-template-columns: 4.4em 1.1em minmax(0, 1fr); margin: 0; padding: 7px 0; }
.shotlist.ro .srow:hover { background: none; }
.mini .sno, .guide-sheet .sno { font-size: 14px; }
.mini .stitle { font-size: 14.5px; }

/* ---------- 提示词的分镜 ---------- */
.pshots { display: flex; flex-direction: column; gap: 18px; margin-top: 14px; }
.p-shot {
  position: relative; padding: 12px 22px 14px; border: 1px solid var(--line); border-radius: 9px;
  background: linear-gradient(to bottom, rgba(244, 239, 230, .55), rgba(255, 253, 249, 0) 70px);
}
.shot-h { display: flex; align-items: center; gap: 12px; margin: 0 -4px 8px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
.shot-no { flex: none; padding: 1px 10px; border-radius: 4px; background: var(--tc); color: #fff9f1; font: 13.5px/1.6 var(--kai); letter-spacing: .15em; }
.shot-title { flex: 1; min-width: 0; font: 600 16px/1.5 var(--serif); letter-spacing: .05em; }
.shot-title-in { width: 100%; padding: 2px 0; border: 0; border-bottom: 1px dashed transparent; outline: 0; background: transparent; font: inherit; letter-spacing: inherit; }
.shot-title-in:hover { border-bottom-color: var(--line-2); }
.shot-title-in:focus { border-bottom-color: var(--tc); }
.shot-tools { display: flex; gap: 1px; opacity: 0; transition: opacity .15s; }
.p-shot:hover .shot-tools, .shot-h:focus-within .shot-tools { opacity: 1; }

/* ---------- 右栏 ---------- */
.rail { flex: none; width: 300px; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: rgba(246, 241, 233, .6); transition: width .25s ease; }
.wide-rail .rail { width: 440px; }
.rail-tabs { flex: none; display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.rail-tab {
  flex: 1; margin-bottom: -1px; padding: 8px 0 9px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer;
  font-size: 13px; color: var(--ink-3); letter-spacing: .2em; white-space: nowrap; transition: color .15s, border-color .15s;
}
.rail-tab:hover { color: var(--ink); }
.rail-tab.on { color: var(--ink); border-bottom-color: var(--tc); }
.rail-tab.has { color: var(--zhu); }
.rail-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 48px; }
.outline { display: flex; flex-direction: column; gap: 1px; }
.ol-i {
  width: 100%; min-width: 0; display: flex; align-items: baseline; gap: 8px;
  padding: 4px 8px; border: 0; border-radius: 5px; background: none; cursor: pointer; text-align: left;
  font-size: 12.5px; color: var(--ink-2);
}
.ol-i:hover { background: rgba(255, 253, 249, .85); }
.ol-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-s { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); }
.ol-i.ol-sec { margin-top: 10px; font: 14px var(--kai); color: var(--tc); letter-spacing: .08em; }
.ol-i.ol-sec:first-child { margin-top: 0; }
.ol-i.ol-sec .ol-s { margin-left: auto; flex: none; font: 11px var(--sans); color: var(--ink-4); letter-spacing: 0; }
.ol-i.ol-beat, .ol-i.ol-shot { padding-left: 18px; }
.ol-i.ol-beat .ol-l { flex: none; min-width: 2.6em; max-width: 5em; color: var(--ink-3); font-size: 11.5px; }
.ol-i.ol-beat.r-line .ol-l { color: var(--ink); font-weight: 600; }
.ol-i.ol-shot .ol-l { flex: 1; font-family: var(--serif); font-size: 13px; }
.ol-i.over .ol-l, .ol-i.over .ol-s { color: var(--zhu); }
.lint-ok { padding: 44px 10px; text-align: center; font: 14px var(--kai); color: var(--ink-3); letter-spacing: .06em; }
.lint-ok .seal { margin: 0 auto 16px; }
.lint { display: flex; flex-direction: column; gap: 6px; }
.lint-h { margin: 8px 0 2px; padding: 0; border: 0; background: none; text-align: left; font-size: 12px; color: var(--ink-3); letter-spacing: .2em; }
.lint-h:first-child { margin-top: 0; }
.lint-h.tog { cursor: pointer; }
.lint-h.tog::after { content: ' ▾'; }
.lint-more { display: none; flex-direction: column; gap: 6px; }
.lint-more.open { display: flex; }
.lint > p { margin-top: 12px; }
.issue {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); border-radius: 7px; background: var(--sheet);
  font-size: 12.5px; line-height: 1.65; color: var(--ink-2); transition: border-color .15s;
}
.issue:hover { border-color: var(--line-2); color: var(--ink); }
.lv { flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--ink-4); }
.issue.warn .lv { background: var(--zhu); }
.issue.info .lv { background: var(--jin); }
.compare { display: flex; flex-direction: column; gap: 12px; }
.cmp-h { font: 13px var(--kai); color: var(--ink-3); letter-spacing: .3em; }
.cmp-img { display: block; width: 100%; border-radius: 7px; box-shadow: var(--shadow); }
.cmp-imgbtn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.cmp-imgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cmp-imgs img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }
.history { display: flex; flex-direction: column; gap: 8px; }
.history > p { margin-bottom: 4px; line-height: 1.7; }
.hist-i {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 8px 7px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet);
  font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.hist-empty { padding: 28px 0; text-align: center; font: 14px var(--kai); color: var(--ink-4); }

/* ---------- 目录 ---------- */
.ov { max-width: 1000px; margin: 0 auto; animation: rise .3s ease both; }
.ov-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line-2); }
.ov-kicker { margin-bottom: 10px; font: 13px var(--kai); color: var(--zhu); letter-spacing: .5em; }
.ov-title { font: 600 32px/1.3 var(--serif); letter-spacing: .1em; }
.ov-stats { margin-top: 8px; font-size: 13px; color: var(--ink-3); letter-spacing: .06em; word-spacing: .4em; }
.toc { display: flex; flex-direction: column; }
.toc-row {
  display: grid; grid-template-columns: 7.2em minmax(0, 1fr) auto; align-items: center; gap: 24px;
  margin: 0 -14px; padding: 17px 14px; border-radius: 8px; border-bottom: 1px dotted var(--line-2); cursor: pointer;
  transition: background .15s;
}
.toc-row:hover { background: rgba(255, 253, 249, .75); }
.toc-seg { font: 18px var(--kai); color: var(--zhu); letter-spacing: .06em; white-space: nowrap; }
.toc-desc { min-width: 0; }
.toc-name { display: flex; align-items: baseline; gap: 10px; font: 17px/1.5 var(--serif); letter-spacing: .05em; }
.toc-n { flex: none; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; font: 11px/1.7 var(--sans); color: var(--ink-3); letter-spacing: .04em; }
.toc-desc small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }
.toc-desc small.syn { font: 13.5px/1.7 var(--kai); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.toc-docs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.dchip {
  padding: 2px 11px; border-radius: 999px; border: 1px solid; background: var(--sheet); cursor: pointer;
  font-size: 12px; letter-spacing: .06em; white-space: nowrap; transition: background .15s;
}
.dchip.script { color: var(--zhu); border-color: var(--zhu-line); }
.dchip.shots { color: var(--dai); border-color: var(--dai-line); }
.dchip.prompt { color: var(--zhe); border-color: var(--zhe-line); }
.dchip.script:hover { background: var(--zhu-soft); }
.dchip.shots:hover { background: var(--dai-soft); }
.dchip.prompt:hover { background: var(--zhe-soft); }
.dchip.combined { border-style: dashed; background: transparent; }
.dchip.none { color: var(--ink-4); border-color: var(--line); border-style: dashed; background: transparent; }
.toc-empty { padding: 64px 0 40px; text-align: center; color: var(--ink-3); }
.big { margin-bottom: 10px; font: 22px var(--serif); color: var(--ink-2); letter-spacing: .2em; }
.gallery { margin-top: 40px; }
.gal-h { display: flex; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line-2); }
.gal-t { font: 17px var(--kai); color: var(--zhe); letter-spacing: .3em; }
.gal-h .btn { margin-left: auto; }
.gal-cat { display: grid; grid-template-columns: 5.4em minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px dotted var(--line-2); }
.gal-cn { padding-top: 4px; font: 15px var(--kai); color: var(--ink-2); letter-spacing: .2em; }
.gal-cn em { display: block; margin-top: 2px; font: normal 11px var(--sans); color: var(--ink-4); letter-spacing: 0; }
.gal-row { display: flex; flex-wrap: wrap; gap: 14px; }
.acard { width: 98px; padding: 0; border: 0; background: none; cursor: pointer; text-align: center; }
.athumb {
  width: 98px; height: 98px; display: grid; place-items: center; overflow: hidden;
  border-radius: 7px; border: 1px solid var(--line); background: var(--paper-2);
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.athumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.athumb.none span { font: 30px var(--serif); color: var(--ink-4); }
.acard:hover .athumb { transform: translateY(-2px); border-color: var(--line-2); box-shadow: var(--shadow); }
.aname { margin-top: 7px; font-size: 12px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; margin-top: 40px; }
.card { padding: 16px 20px 18px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 253, 249, .78); }
.card h4 { margin: 0 0 12px; font: normal 15px var(--kai); color: var(--ink-2); letter-spacing: .3em; }
.card.warn h4 { color: var(--zhu); }
.card .btn { margin-top: 4px; }
.dirs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dir { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 12.5px; background: var(--paper); }
.dir .ic { width: 12px; height: 12px; }
.dir.ok { color: var(--dai); }
.dir.miss { color: var(--zhu); background: var(--zhu-soft); }
.warns { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.75; color: var(--ink-2); }
.warns li { margin: 3px 0; }
.files-ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.files-ul li { margin: 5px 0; }

/* ---------- 固定格式说明 ---------- */
.guide { max-width: 1100px; margin: 0 auto; animation: rise .3s ease both; }
.g-lead { max-width: 780px; margin: 14px 0 30px; font-size: 14px; line-height: 1.95; color: var(--ink-2); }
code { padding: 1px 6px; border-radius: 4px; background: var(--paper-2); font: 12.5px var(--mono); color: var(--ink); }
.g-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; padding: 30px 0; border-top: 1px solid var(--line-2); }
.g-rules h4 { margin: 4px 0 12px; font: normal 19px var(--kai); color: var(--zhu); letter-spacing: .3em; }
.g-rules ol { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.9; color: var(--ink-2); }
.g-rules li { margin: 4px 0; }
.g-rules li::marker { color: var(--ink-4); font-size: 12px; }
.g-skel { padding: 24px 28px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); box-shadow: var(--shadow); }
.g-seven { margin: 12px 0 0; padding-left: 2.4em; list-style: cjk-ideographic; font: 15.5px/2.15 var(--serif); }
.g-seven li::marker { color: var(--zhe); font-family: var(--kai); }
.g-note { margin-top: 10px; font: 15px var(--kai); color: var(--ink-2); letter-spacing: .06em; }

/* ---------- 对话框 ---------- */
.mask {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
  background: rgba(42, 36, 30, .3); backdrop-filter: blur(2px); animation: fade .18s ease both; transition: opacity .18s;
}
.mask.out { opacity: 0; pointer-events: none; }
.dlg {
  width: min(470px, 100%); max-height: 88vh; overflow: auto; padding: 26px 28px 20px;
  border-radius: 11px; background: var(--sheet);
  box-shadow: 0 0 0 1px rgba(214, 202, 182, .8), 0 30px 70px -24px rgba(40, 28, 16, .5);
  animation: rise .22s ease both;
}
.dlg.wide { width: min(840px, 100%); }
.dlg h3 { margin: 0 0 8px; font: 600 19px/1.4 var(--serif); letter-spacing: .12em; }
.dlg-sub { margin-bottom: 12px; font-size: 13px; line-height: 1.85; color: var(--ink-2); }
.dlg-body { display: flex; flex-direction: column; gap: 15px; margin: 10px 0 4px; }
.acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-size: 12px; color: var(--ink-3); letter-spacing: .24em; }
.fld > em { font-style: normal; font-size: 11.5px; color: var(--ink-4); }
.inp {
  padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 7px; outline: 0; background: #fff;
  font: 15px var(--serif); letter-spacing: .04em; transition: border-color .15s, box-shadow .15s;
}
.inp:focus { border-color: var(--ink-3); box-shadow: 0 0 0 3px rgba(42, 38, 34, .06); }
.inp::placeholder { color: var(--ink-4); font-family: var(--kai); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; cursor: pointer;
  font-size: 13px; color: var(--ink-2); transition: all .15s;
}
.chip:hover { border-color: var(--ink-4); color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #f7f1e6; }
.fld-err { font-size: 12.5px; color: var(--zhu); }
.fld-err:empty { display: none; }

function runXml(text, rs) {
  const rPr = rs ? `<w:rPr><w:rStyle w:val="${rs}"/></w:rPr>` : '';
  let x = '';
  String(text).replace(BAD_XML, '').split('\n').forEach((line, i) => {
    if (i > 0) x += `<w:r>${rPr}<w:br/></w:r>`;
    line.split('\t').forEach((t, j) => {
      if (j > 0) x += `<w:r>${rPr}<w:tab/></w:r>`;
      if (t) x += `<w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
    });
  });
  return x;
}

/* ============================================================
   剧本
   ============================================================ */
const SCRIPT_HEAD = ['场景', '人物', '梗概'];
const SCRIPT_HEAD_SET = new Set(SCRIPT_HEAD);
const NOT_SPEAKER = /(特写|近景|中景|全景|远景|空镜|镜头|画面|转场|闪回|叠化|切至|切到|黑场|字幕|音效|场景|人物|时长|梗概|备注|时间|地点|注|定稿|审稿|草稿|说明|记录|提示)$/;
const NOTE_LABEL = /^(已定稿|定稿|待审稿?|草稿|审稿中|修改中|修改记录|备注|附注|注|说明)$/;
const RE_LINE = /^([^\s：:（(△▲，。；、！？,.;!?「」“”‘’"'…—]{1,12})\s*(?:[（(]([^）)]*)[）)])?\s*[：:]\s*([\s\S]*)$/;

function parseLine(text) {
  const m = RE_LINE.exec(text);
  if (!m || NOT_SPEAKER.test(m[1])) return null;
  return { who: m[1], how: (m[2] || '').trim(), say: m[3] };
}
function scriptRole(text, sec) {
  if (sec === 'head') {
    const f = splitLabel(text);
    if (!f) return 'plain';
    return f.label === '场景' ? 'scene' : f.label === '人物' ? 'cast' : 'meta';
  }
  if (sec === 'body') {
    if (/^[△▲]/.test(text)) return 'action';
    if (/^字幕[：:]/.test(text)) return 'sub';
    if (/^音效[：:]/.test(text)) return 'sfx';
    if (parseLine(text)) return 'line';
    return 'plain';
  }
  return 'note';
}
function parseCast(v) {
  const out = [];
  let depth = 0, cur = '';
  for (const ch of String(v)) {
    if (ch === '（' || ch === '(') depth++;
    else if (ch === '）' || ch === ')') depth = Math.max(0, depth - 1);
    if (ch === '、' && depth === 0) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(s => {
    const m = /^\s*([^（(]+?)\s*(?:[（(]([\s\S]*)[）)])?\s*$/.exec(s);
    return m ? { name: m[1].trim(), desc: (m[2] || '').trim() } : { name: s.trim(), desc: '' };
  }).filter(c => c.name);
}
function newScriptDoc(seg, name) {
  return {
    kind: 'script', seg: seg || '', name: name || '', status: '',
    sections: [
      { key: 'head', head: '', blocks: [] },
      { key: 'body', head: '正文', blocks: [] },
      { key: 'notes', head: '备注', blocks: [] },
    ],
  };
}
function scriptTitle(doc) { return '第' + (doc.seg || '?') + '段' + (doc.name ? '｜' + doc.name : ''); }

function matchScriptHead(t) {
  let m = new RegExp('^第\\s*(' + SEG_NUM + ')\\s*段\\s*(?:[｜|]\\s*(.*))?$').exec(t);
  if (m && !/镜头表/.test(m[2] || '')) return { fixed: true, seg: normSeg(m[1]), name: (m[2] || '').trim() };
  m = /^([0-9０-９]+(?:[-－—–][0-9０-９]+)+)[\s\u3000]+(\S+)[\s\u3000]+(内外|外内|内|外|室内|室外)[\s\u3000]+(.+)$/.exec(t);
  if (m) {
    let place = m[4].trim(), status = '';
    const sm = /[（(]\s*((?:已)?定稿|待审稿?|草稿|审稿中|修改中)\s*[）)]\s*$/.exec(place);
    if (sm) { status = sm[1]; place = place.slice(0, sm.index).trim(); }
    return { fixed: false, seg: normSeg(m[1]), time: m[2], io: m[3], place, status };
  }
  return null;
}
function isScriptBodyLine(t) { return /^[△▲]/.test(t) || /^(字幕|音效)[：:]/.test(t) || !!parseLine(t); }

function buildScript(head, lines, fileSeg) {
  const doc = newScriptDoc((head && head.seg) || fileSeg || '', (head && head.name) || '');
  doc.status = (head && head.status) || '';
  const [H, B, N] = doc.sections.map(s => s.blocks);
  if (head && !head.fixed) H.push(blk(`场景：${head.time}｜${head.io}｜${head.place}`));
  let mode = 'head';
  for (const p of lines) {
    const t = p.text;
    if (!t) continue;
    if (/^正\s*文$/.test(t)) { mode = 'body'; continue; }
    if (/^(备注|修改记录|附注)$/.test(t)) { mode = 'notes'; continue; }
    if (mode === 'head') {
      const f = splitLabel(t);
      if (f && SCRIPT_HEAD_SET.has(f.label)) { H.push(blk(t)); continue; }
      if (f && NOTE_LABEL.test(f.label)) { N.push(blk(t)); continue; }
      if (isScriptBodyLine(t)) { mode = 'body'; B.push(blk(t)); continue; }
      if (f) { H.push(blk(t)); continue; }
      N.push(blk(t));
      continue;
    }
    (mode === 'body' ? B : N).push(blk(t));
  }
  const order = l => { const i = SCRIPT_HEAD.indexOf(labelOf(l.text)); return i < 0 ? 99 : i; };
  doc.sections[0].blocks = H.map((b, i) => [b, i]).sort((a, b) => order(a[0]) - order(b[0]) || a[1] - b[1]).map(x => x[0]);
  return doc;
}

/* 一份剧本 DOCX 可能是单段，也可能是好几段的汇总稿 */
function parseScripts(paras, fileSeg) {
  const P = paras.map(p => ({ text: cleanPara(p.text), style: String(p.style || '').toLowerCase() }));
  const heads = [];
  P.forEach((p, i) => { const h = p.text && matchScriptHead(p.text); if (h) heads.push({ i, h }); });
  if (!heads.length) {
    let start = 0;
    while (start < P.length && !P[start].text) start++;
    // 第一段是标题样式且不像正文时，当作文件标题略过
    const preface = [];
    if (start < P.length && /title|标题/.test(P[start].style) && !isScriptBodyLine(P[start].text) && !splitLabel(P[start].text)) { preface.push(P[start].text); start++; }
    return { preface, segs: [buildScript(null, P.slice(start), fileSeg)] };
  }
  const preface = P.slice(0, heads[0].i).map(p => p.text).filter(Boolean);
  const segs = heads.map((hd, k) => buildScript(hd.h, P.slice(hd.i + 1, k + 1 < heads.length ? heads[k + 1].i : P.length), fileSeg));
  return { preface, segs };
}
function scriptToParas(doc) {
  const out = [{ s: 'Title', r: [[scriptTitle(doc)]] }];
  const [H, B, N] = doc.sections.map(s => s.blocks);
  for (const b of H) {
    const f = splitLabel(b.text);
    out.push({ s: 'ajMeta', r: f ? [[f.label + '：', 'ajLabel'], [f.value]] : [[b.text]] });
  }
  out.push({ s: 'Heading1', r: [['正文']] });
  for (const b of B) {
    const t = b.text, role = scriptRole(t, 'body');
    if (role === 'action') out.push({ s: 'ajAction', r: [['△ ', 'ajMark'], [t.replace(/^[△▲]\s*/, '')]] });
    else if (role === 'line') {
      const L = parseLine(t);
      out.push({ s: 'ajLine', r: [[L.who, 'ajSpeaker'], ...(L.how ? [['（' + L.how + '）', 'ajParen']] : []), ['：' + L.say]] });
    } else if (role === 'sub' || role === 'sfx') {
      const f = splitLabel(t);
      out.push({ s: 'ajCue', r: [[f.label + '：', 'ajLabel'], [f.value]] });
    } else out.push({ s: 'Normal', r: [[t]] });
  }
  if (N.length) {
    out.push({ s: 'Heading1', r: [['备注']] });
    for (const b of N) out.push({ s: 'ajNote', r: [[b.text]] });
  }
  return out;
}
function scriptTemplate(seg, name) {
  const d = newScriptDoc(seg, name);
  d.sections[0].blocks = ['场景：', '人物：', '梗概：'].map(blk);
  d.sections[1].blocks = ['△ '].map(blk);
  return d;
}

/* ============================================================
   镜头表：标题下面一镜一行「镜头N｜概述」，概述不超过十个字
   旧格式里的其他内容原样留着（pre / 每镜的 blocks / post），不丢
   ============================================================ */
const SHOT_MAX = 10;
const countChars = s => [...String(s || '').replace(/\s/g, '')].length;
const RE_SHOT_HEAD = /^镜头\s*([0-9０-９]+[A-Za-z]?)\s*(?:[｜|：:]\s*|\s+|$)(.*)$/;
const RE_OLD_SECTION = /^[一二三四五六七八九十]+\s*[、.．]\s*\S/;

function newShotDoc(seg, name) { return { kind: 'shots', seg: seg || '', name: name || '', pre: [], shots: [], post: [] }; }
function shotTitle(doc) { return '第' + (doc.seg || '?') + '段｜镜头表' + (doc.name ? '｜' + doc.name : ''); }
function matchShotTitle(t) {
  let m = new RegExp('^第\\s*(' + SEG_NUM + ')\\s*段\\s*[｜|]\\s*镜头表\\s*(?:[｜|]\\s*(.*))?$').exec(t);
  if (m) return { seg: normSeg(m[1]), name: (m[2] || '').trim() };
  m = new RegExp('^第\\s*(' + SEG_NUM + ')\\s*段\\s*(?:[｜|]|\\s)\\s*(.*)$').exec(t);
  if (m && /镜头表|分镜/.test(m[2])) {
    const rest = m[2].trim();
    const pm = /[（(]([^）)]+)[）)]\s*$/.exec(rest);
    const name = pm ? pm[1].trim() : rest.replace(/\d*\s*镜?\s*(镜头表|分镜表?)/, '').replace(/^[｜|\s]+|[｜|\s]+$/g, '').trim();
    return { seg: normSeg(m[1]), name };
  }
  if (/镜头表/.test(t) && t.length < 40 && !splitLabel(t)) return { seg: null, name: t.replace(/镜头表/, '').replace(/^[｜|\s]+|[｜|\s]+$/g, '').trim() };
  return null;
}
function parseShotList(paras, fileSeg) {
  const P = paras.map(p => cleanPara(p.text));
  const doc = newShotDoc(fileSeg || '', '');
  let i = 0;
  while (i < P.length && !P[i]) i++;
  if (i < P.length) {
    const t = matchShotTitle(P[i]);
    if (t) { if (t.seg) doc.seg = t.seg; doc.name = t.name; i++; }
  }
  let shot = null, after = false;
  for (; i < P.length; i++) {
    const t = P[i];
    if (!t) continue;
    const m = !after && RE_SHOT_HEAD.exec(t);
    if (m) { shot = { id: uid(), title: m[2].trim(), blocks: [] }; doc.shots.push(shot); continue; }
    if (shot && RE_OLD_SECTION.test(t)) after = true;
    (after ? doc.post : shot ? shot.blocks : doc.pre).push(blk(t));
  }
  return doc;
}
function fieldPara(text, style) {
  const f = splitLabel(text);
  return f ? { s: style, r: [[f.label + '：', 'ajLabel'], [f.value]] } : { s: style, r: [[text]] };
}
const oldPara = t => RE_OLD_SECTION.test(t) && t.length <= 20 ? { s: 'Heading1', r: [[t]] } : fieldPara(t, 'ajField');
function shotsToParas(doc) {
  const out = [{ s: 'Title', r: [[shotTitle(doc)]] }];
  doc.pre.forEach(b => out.push(oldPara(b.text)));
  doc.shots.forEach((sh, k) => {
    out.push({ s: 'ajShot', r: [['镜头' + (k + 1), 'ajLabel'], ['｜' + sh.title.trim()]] });
    sh.blocks.forEach(b => out.push(fieldPara(b.text, 'ajNote')));
  });
  doc.post.forEach(b => out.push(oldPara(b.text)));
  return out;
}
function newShot(title) { return { id: uid(), title: title || '', blocks: [] }; }
function shotsTemplate(seg, name) { const d = newShotDoc(seg, name); d.shots = [newShot('')]; return d; }
/* 旧格式留下来的行数 */
function shotOldCount(doc) { return doc.pre.length + doc.post.length + doc.shots.reduce((a, s) => a + s.blocks.length, 0); }
function shotsOverLimit(doc) { return doc.shots.map((sh, k) => ({ sh, k, n: countChars(sh.title) })).filter(x => x.n > SHOT_MAX); }

const PROMPT_RULES = ['运镜', '构图', '轴线'];

/* ---------- 文件系统 ---------- */
const FS = {
  root: null,
  async dir(parts, create) { let d = this.root; for (const p of parts) d = await d.getDirectoryHandle(p, { create: !!create }); return d; },
  async fh(parts, create) { const d = await this.dir(parts.slice(0, -1), create); return d.getFileHandle(parts[parts.length - 1], { create: !!create }); },
  async read(parts) { const f = await (await this.fh(parts)).getFile(); return { buf: new Uint8Array(await f.arrayBuffer()), mtime: f.lastModified, size: f.size }; },
  async stat(parts) { try { const f = await (await this.fh(parts)).getFile(); return { mtime: f.lastModified, size: f.size }; } catch (e) { return null; } },
  async write(parts, data) {
    const w = await (await this.fh(parts, true)).createWritable();
    await w.write(data); await w.close();
    return this.stat(parts);
  },
  async list(parts) { const d = await this.dir(parts); const out = []; for await (const [name, hd] of d.entries()) out.push({ name, kind: hd.kind, handle: hd }); return out; },
};

/* ---------- 路径 ---------- */
function canonical(kind, seg) {

}
/* 改版前的原文件放进 历史记录 下面同样的路径：原名__日期-时间.后缀 */
function archiveOf(p) {

}

/* ---------- 扫描项目 ---------- */
async function walk(parts, depth, fn) {
  let ents;
  try { ents = await FS.list(parts); } catch (e) { return; }
  ents.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  for (const e of ents) {
    if (e.name.startsWith('.') || e.name.startsWith('~$')) continue;
    const p = [...parts, e.name];
    if (e.kind === 'directory') { if (depth > 0) await walk(p, depth - 1, fn); }
    else await fn(p, e);
  }
}
function headVal(doc, label) {
  const b = doc.sections[0].blocks.find(x => C.labelOf(x.text) === label);
  return b ? C.splitLabel(b.text).value.trim() : '';
}
const sceneOf = doc => headVal(doc, '场景').split('｜').map(s => s.trim()).filter(Boolean).join(' · ');
function promptLabel(fname, pjName, seg) {
  let s = fname.replace(/\.txt$/i, '');
  if (s.startsWith(pjName + '_')) s = s.slice(pjName.length + 1);
  s = s.replace(new RegExp('第\\s*' + seg.replace(/-/g, '\\s*[-－—–]\\s*') + '\\s*段'), '');
  s = s.replace(/_?视频提示词$/, '').replace(/_?提示词$/, '');
  return s.replace(/^[_\s]+|[_\s]+$/g, '').replace(/_/g, ' ') || '本段';
}
function assetInfo(p, fname, pjName) {
  const dirs = p.slice(2, -1);
  const key = fname.replace(/\.txt$/i, '').replace(/_?(资产)?提示词$/, '');
  const s = key.startsWith(pjName + '_') ? key.slice(pjName.length + 1) : key;
  const toks = s.split('_').filter(Boolean);
  const cat = dirs[0] && dirs[0] !== '视频' ? dirs[0] : toks.length > 1 ? toks[0] : '其他';
  const label = (toks[0] === cat ? toks.slice(1) : toks).join(' ') || s;
  return { cat, label, key };
}
async function scanProject(name) {

    if (e.kind === 'directory' && STD_DIRS.includes(e.name)) pj.dirs[e.name] = true;
    else if (!e.name.startsWith('.') && !/^(AGENTS|CLAUDE)\.md$/i.test(e.name)) pj.extra.push({ name: e.name, kind: e.kind });
  }
  const slot = seg => { if (!pj.segs.has(seg)) pj.segs.set(seg, { seg, script: [], shots: [], prompt: [] }); return pj.segs.get(seg); };
  const docx = async (p, e) => {
    if (/\.md$/i.test(e.name)) { pj.docsMd.push({ path: p, name: e.name }); return; }
    if (!/\.docx$/i.test(e.name)) return;
    const f = await e.handle.getFile();
    const base = { path: p, name: e.name, size: f.size, mtime: f.lastModified };
    if (!f.size) { pj.notes.push(`「${rel(p)}」是空文件（0 字节）`); return; }
    let paras;
    try { paras = await C.readDocx(await f.arrayBuffer()); } catch (err) { pj.notes.push(`「${rel(p)}」打不开：${err.message}`); return; }
    const fseg = C.segFromName(e.name);
    const isShots = /镜头表|分镜表/.test(e.name) || (!/剧本/.test(e.name) && paras.some(x => /^镜头\s*[0-9]+\s*[｜|]/.test(C.cleanPara(x.text))));
    if (isShots) {
      const doc = C.parseShotList(paras, fseg);
      const ent = { ...base, kind: 'shots', seg: doc.seg || fseg, title: doc.name, doc };
      ent.seg ? slot(ent.seg).shots.push(ent) : pj.loose.push(ent);
    } else {
      const r = C.parseScripts(paras, fseg);
      const combined = r.segs.length > 1 || C.isRangeName(e.name);
      for (const doc of r.segs) {
        const ent = { ...base, kind: 'script', seg: doc.seg || fseg, combined, title: doc.name, scene: sceneOf(doc), synopsis: headVal(doc, '梗概'), doc };

  });

    s.script.sort((a, b) => (a.combined - b.combined) || a.name.localeCompare(b.name, 'zh'));
    s.shots.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
    s.prompt.sort((a, b) => (b.main - a.main) || a.name.localeCompare(b.name, 'zh'));
  }
  const co = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
  pj.aprompts.sort((a, b) => co(a.cat) - co(b.cat) || a.cat.localeCompare(b.cat, 'zh') || a.label.localeCompare(b.label, 'zh'));
  pj.order = [...pj.segs.keys()].sort(C.segCompare);

}

async function parseEntry(entry, buf) {
  let doc, enc = 'utf-8';
  if (entry.kind === 'prompt') {
    const d = C.decodeText(buf); enc = d.encoding;
    doc = C.parsePrompt(d.text); doc.bom = C.hasBom(buf);
  } else {
    const paras = await C.readDocx(buf);
    if (entry.kind === 'shots') doc = C.parseShotList(paras, entry.seg);
    else { const r = C.parseScripts(paras, entry.seg); doc = entry.combined ? (r.segs.find(d => d.seg === entry.seg) || r.segs[0]) : r.segs[0]; }
  }

}
async function loadEntry(entry, opts = {}) {

    const { buf, mtime } = await FS.read(entry.path);
    const { doc, enc } = await parseEntry(entry, buf);
    const target = entry.combined ? canonical(entry.kind, entry.seg) : entry.path;
    S.ed = { entry, doc, kind: entry.kind, dirty: false, mtime, enc, undo: [], redo: [], target, notice: null, savedAt: opts.savedAt || null };

    if (entry.combined) S.ed.notice = `这一段来自汇总稿「${entry.name}」。保存时另存成分段文件「${rel(target)}」，汇总稿不动。`;
    S.ed.recovery = readRecovery();
    S.tab = entry.kind; S.seg = entry.seg; S.view = 'editor';

async function guardDirty() {

    title: '还没保存', body: `「${rel(S.ed.target)}」有改动没保存。`,
    buttons: [{ label: '取消', value: 'cancel', cls: 'ghost' }, { label: '不保存', value: 'drop' }, { label: '保存', value: 'save', cls: 'ink', focus: true }],
  });

/* ---------- 编辑状态 ---------- */
function markDirty() {

}
function snapshot() { return JSON.stringify(S.ed.doc); }
function pushSnap(snap) {
  const ed = S.ed; if (!ed) return;
  ed.undo.push(snap);
  if (ed.undo.length > 200) ed.undo.shift();
  ed.redo.length = 0;
}
function pushUndo() { if (S.ed) pushSnap(snapshot()); }
function undo() {
  commitEditing();
  const ed = S.ed; if (!ed || !ed.undo.length) return;
  ed.redo.push(snapshot()); ed.doc = JSON.parse(ed.undo.pop());
  markDirty(); rerender(); toast('撤销了一步');
}
function redo() {
  commitEditing();

}
const recKey = () => 'antou:rec:' + S.rootName + '/' + S.ed.target.join('/');
const saveRecoveryLater = debounce(() => {

  try { localStorage.setItem(recKey(), JSON.stringify({ t: Date.now(), doc: S.ed.doc })); } catch (e) { /* 存满了就不存 */ }
}, 700);

function clearRecovery() { try { if (S.ed) localStorage.removeItem(recKey()); } catch (e) { /* 无所谓 */ } }

/* 输入框（段名、镜头概述）：边打字边写进文档，离开时记一步撤销 */
function bindInput(inp, apply, after) {
  const update = () => { apply(inp.value); markDirty(); after && after(); scheduleRail(); };
  inp.addEventListener('focus', () => { commitEditing(); INPUT_EDIT = { snap: snapshot(), inp, apply }; });
  inp.addEventListener('input', e => { if (!e.isComposing) update(); });
  inp.addEventListener('compositionend', update);
  inp.addEventListener('blur', () => { if (INPUT_EDIT && INPUT_EDIT.inp === inp) flushInputEdit(); });
}
function flushInputEdit() {
  const x = INPUT_EDIT; INPUT_EDIT = null;
  if (!x || !S.ed) return;
  const v = x.inp.value.trim();
  if (v !== x.inp.value) x.inp.value = v;
  x.apply(v);
  if (x.snap !== snapshot()) pushSnap(x.snap);
}

/* ---------- 保存 ---------- */
async function docBytes(doc) {
  const pj = S.pj.name;
  if (doc.kind === 'prompt') return C.encodeText(C.serializePrompt(doc));
  if (doc.kind === 'script') return C.writeDocx(C.scriptToParas(doc), { title: C.scriptTitle(doc), header: `${pj} · 第${doc.seg}段 · 剧本` });
  return C.writeDocx(C.shotsToParas(doc), { title: C.shotTitle(doc), header: `${pj} · 第${doc.seg}段 · 镜头表` });
}
async function archiveFile(p, newBytes) {
  const { buf } = await FS.read(p);
  if (newBytes && sameBytes(buf, newBytes)) return null;
  const a = archiveOf(p);
  const dst = [...a.dir, `${a.base}__${stamp()}${a.ext}`];
  await FS.write(dst, buf);
  return dst;
}
let saving = false;
async function save() {
  commitEditing();
  const ed = S.ed;
  if (!ed || saving) return false;
  if (!ed.dirty && !ed.entry.combined) { toast('没有改动'); return true; }
  if (ed.kind === 'shots') {
    const bad = C.shotsOverLimit(ed.doc);
    if (bad.length) {
      await dialog(close => dlgShell('镜头概述超过十个字', `镜头${bad.map(x => x.k + 1).join('、')} 的概述超过十个字。固定格式不允许超过十个字，改短了再保存。`, null,
        [h('button', { class: 'btn ink', 'data-focus': '', onclick: () => close() }, '去改')]));
      focusShot(bad[0].sh.id);
      return false;
    }
  }
  const target = ed.target;
  saving = true; paintStatus('正在保存…');
  try {
    const cur = await FS.stat(target);
    if (cur && pathEq(target, ed.entry.path) && cur.mtime !== ed.mtime) {
      const ok = await confirmDlg({ title: '文件在外面被改过', body: `「${rel(target)}」在你打开以后被改过（${fmtTime(cur.mtime)}），可能是 Codex 或别的程序改的。继续保存会换掉那一版；换掉之前，它会先移进 历史记录。`, ok: '仍然保存', danger: true });
      if (!ok) return false;
    }
    const bytes = await docBytes(ed.doc);
    const moved = cur ? await archiveFile(target, bytes) : null;
    await FS.write(target, bytes);
    clearRecovery();
    ed.dirty = false;
    toast(moved ? `已保存。原文件移进了 ${rel(moved.slice(0, -1))}` : `已保存：${rel(target)}`);
    const seg = ed.entry.seg;
    await rescan();
    const ent = findEntry(target, seg);
    if (ent) await loadEntry(ent, { keepScroll: true, savedAt: Date.now() });
    else render(true);
    return true;
  } catch (e) {
    toast('保存失败：' + e.message, 'err');
    return false;
  } finally { saving = false; paintStatus(); }
}
function findEntry(path, seg) {
  for (const s of S.pj.segs.values()) for (const k of KINDS) for (const e of s[k]) if (pathEq(e.path, path) && !e.combined && (!seg || e.seg === seg)) return e;
  return S.pj.aprompts.find(e => pathEq(e.path, path)) || S.pj.loose.find(e => pathEq(e.path, path)) || null;
}
async function copyPrompt() {
  commitEditing();
  if (!S.ed || S.ed.kind !== 'prompt') return;
  const text = C.serializePrompt(S.ed.doc).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  try { await navigator.clipboard.writeText(text); toast('全文已复制'); }
  catch (e) { toast('复制没成功：' + e.message, 'err'); }
}

/* ---------- 加一行 ---------- */

    const btn = h('button', { class: 'add' + (it.cls ? ' ' + it.cls : ''), type: 'button', title: it.title || null }, it.label);
    btn.addEventListener('mousedown', e => e.preventDefault());

}
function popMenu(anchor, items) {

  const r = anchor.getBoundingClientRect();
  const m = h('div', { class: 'menu', style: `left:${r.left}px; top:${r.bottom + 6}px` });
  for (const it of items) {
    const x = h('button', { class: 'menu-i', type: 'button' }, it.label);
    x.addEventListener('mousedown', e => e.preventDefault());

  }
  document.body.append(m);
  const off = e => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('mousedown', off, true); } };

}
/* 固定标签：缺哪个补哪个，插在固定的位置 */
function labelAdds(arr, labels, list, extra) {
  const have = new Set(arr.map(b => C.labelOf(b.text)));
  const items = labels.filter(l => !have.has(l)).map(l => ({
    label: '＋ ' + l, title: HINT[l] || null,
    run: () => {
      const idx = labels.indexOf(l);
      let at = 0;
      arr.forEach((b, i) => { const k = labels.indexOf(C.labelOf(b.text)); if (k >= 0 && k < idx) at = i + 1; });
      list.insert(at, l + '：');

  }));

}

/* ---------- 提示词 ---------- */
const promptSecLabels = key => key === 'basic' ? C.PROMPT_BASIC : key === 'rules' ? C.PROMPT_RULES : null;

    const el = h('section', { class: 'sec', 'data-sec': 'pre' }, asset ? null : sectionHead('', '正　文'),
      empty ? h('p', { class: 'sec-empty' }, '还空着，点「＋ 一行」开始写，一行一句。')
        : asset ? null : h('p', { class: 'sec-empty' }, '没有认出七个分区，按自由格式一行一行改。延长、编辑类的提示词本来就是这样。'));
    const l = blockList(doc.pre, { kind: 'prompt', sec: 'pre', ro });
    el.append(l.el);
    if (!ro) el.append(addBar([{ label: '＋ 一行', run: () => l.insert(l.appendAt(), '') }]));
    sheet.append(el);

  }
  if (doc.pre.some(b => b.text.trim())) {
    const el = h('section', { class: 'sec', 'data-sec': 'pre' }, sectionHead('', '分区之前'));
    el.append(blockList(doc.pre, { kind: 'prompt', sec: 'pre', ro }).el);

  }
  const present = new Set(doc.sections.map(s => s.key));
  const order = C.PROMPT_SECTIONS.map(s => s.key);

    ro ? null : h('button', { class: 'btn sm', onclick: () => addPromptSection(doc, def.key) }, '补上'));

  doc.sections.forEach(sec => {
    const ci = order.indexOf(sec.key);
    if (!ro) C.PROMPT_SECTIONS.forEach((def, k) => { if (k < ci && !present.has(def.key) && !done.has(def.key)) { done.add(def.key); sheet.append(placeholder(def)); } });
    sheet.append(promptSection(sec, doc, ro));

    S.rail = k; const st = document.querySelector('.stage'); st && st.classList.toggle('wide-rail', k === 'compare'); paintRail();
  } }, label))));

}

  if (!n && loc.shot) n = document.querySelector(`.sheet [data-shot="${loc.shot}"]`);
  if (!n && loc.sec) n = document.querySelector(`.sheet [data-sec="${loc.sec}"]`);

function assetDir(cat) {
  const same = S.pj.aprompts.filter(e => e.cat === cat);
  if (!same.length) return ['提示词'];
  const cnt = new Map();
  for (const e of same) {
    let d = e.path.slice(1, -1);
    if (d.length > 2 && d[d.length - 1] === e.label.split(' ')[0]) d = d.slice(0, -1);
    const k = d.join('/'); cnt.set(k, (cnt.get(k) || 0) + 1);
  }
  return [...cnt.entries()].sort((a, b) => b[1] - a[1])[0][0].split('/');
}

      '右栏「历史」能看到并载入这些旧版本。',
      '汇总稿里的某一段，保存时另存成分段文件，汇总稿不动。']))));
  return h('div', { class: 'stage' }, wrap);
}

/* ---------- 全局键盘、窗口 ---------- */
document.addEventListener('keydown', e => {
  if (isComposing(e)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); if (S.ed && !document.querySelector('.mask:not(.out)')) save(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing || document.querySelector('.mask:not(.out)')) return;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.pj && S.view === 'editor' && S.seg) {
    e.preventDefault();
    const i = S.pj.order.indexOf(S.seg), j = i + (e.key === 'ArrowLeft' ? -1 : 1);
    if (S.pj.order[j]) openSlot(S.pj.order[j], S.tab);
  }
});
window.addEventListener('beforeunload', e => { commitEditing(); if (S.ed && S.ed.dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('focus', async () => {
  const ed = S.ed;
  if (!ed || !FS.root || saving || document.querySelector('.mask:not(.out)')) return;
  const st = await FS.stat(ed.entry.path);
  if (!st || st.mtime === ed.mtime || S.ed !== ed) return;
  if (!ed.dirty) { await loadEntry(ed.entry, { keepScroll: true }); toast('文件在外面更新过，已重新读取'); }
  else if (!ed.extWarned) { ed.extWarned = true; ed.notice = '这份文件在外面被改过（' + fmtTime(st.mtime) + '）。你保存时会再问一次。'; rerender(); }
});

window.Antou = { S, FS, boot, useRoot, save, render, commitEditing, openProject, openOverview, openGuide, openSlot, openAsset, undo, redo };
boot();
})();
</script>
